(this time)"],"a":1,"vi":"Must: thiếu là release fail. Should: quan trọng nhưng có cách lách. Could: có thì tốt. Won't: thoả thuận bỏ khỏi release này.","en":"Must: release fails without it. Should: important, workaround exists. Could: nice to have. Won't: agreed to leave out this release.","src":"04#35"},{"id":"w4-17","w":4,"q":"In MoSCoW, \"Won't have (this time)\" means:","o":["The requirement is rejected forever","Agreed to leave out of this release","Nice to have if time allows","The release fails without it"],"a":1,"vi":"Won't (this time): thoả thuận không làm trong release này, không phải bỏ vĩnh viễn.","en":"Won't (this time): agreed to leave out of this release, not rejected forever.","src":"04#35"},{"id":"w4-18","w":4,"q":"Which gathering method has the limitation that it may interfere with the client's business?","o":["Interviewing","Observing","Questionnaires","Document analysis"],"a":1,"vi":"Observing: tốn thời gian của dev team và có thể làm phiền hoạt động của khách. Interview tốn thời gian khách.","en":"Observing costs the development team's time and may interfere with the client's business. Interviews cost the client's time.","src":"04#37"},{"id":"w4-19","w":4,"q":"Which gathering technique reaches many users quickly and is good for quantitative data?","o":["Workshops (JAD)","Questionnaires and surveys","Prototyping","Observation"],"a":1,"vi":"Questionnaires/surveys: tiếp cận nhiều người nhanh, hợp dữ liệu định lượng.","en":"Questionnaires and surveys reach many users quickly and suit quantitative data.","src":"04#38"},{"id":"w4-20","w":4,"q":"A software requirements document should state:","o":["HOW the system should do it","WHAT the system should do rather than HOW","Only the database design","Only the test cases"],"a":1,"vi":"SRS nêu WHAT, không phải HOW.","en":"The SRS states WHAT the system should do rather than HOW.","src":"04#42"},{"id":"w4-21","w":4,"q":"IEEE 830 (1998) has been replaced by:","o":["ISO 9001","ISO/IEC/IEEE 29148:2018","IEEE 1012","ISO/IEC 25010"],"a":1,"vi":"IEEE 830 → ISO/IEC/IEEE 29148:2018.","en":"IEEE 830 was replaced by ISO/IEC/IEEE 29148:2018.","src":"04#43"},{"id":"w4-22","w":4,"q":"In the INVEST criteria for user stories, \"E\" stands for:","o":["Efficient","Estimable","Explicit","Extensible"],"a":1,"vi":"INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable.","en":"INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable.","src":"04#46"},{"id":"w4-23","w":4,"q":"Acceptance criteria in the lecture are written in which format, and what do they become?","o":["As a/I want/so that; they become epics","Given/When/Then; they become acceptance test cases","MoSCoW; they become priorities","Include/Extend; they become use cases"],"a":1,"vi":"Acceptance criteria viết dạng Given/When/Then và trở thành acceptance test cases.","en":"Acceptance criteria use Given/When/Then and become acceptance test cases.","src":"04#46"},{"id":"w4-24","w":4,"q":"\"Can the requirements be implemented given available budget and technology?\" is which requirements check?","o":["Validity","Verifiability","Consistency","Realism"],"a":3,"vi":"Realism: có làm được với ngân sách và công nghệ hiện có không.","en":"Realism: can they be implemented with the available budget and technology.","src":"04#51"},{"id":"w4-25","w":4,"q":"\"Are there any requirements conflicts?\" is which requirements check?","o":["Completeness","Consistency","Validity","Realism"],"a":1,"vi":"Consistency: có mâu thuẫn giữa các requirement không.","en":"Consistency: are there any requirement conflicts.","src":"04#51"},{"id":"w4-26","w":4,"q":"\"Does the system provide the functions which best support the customer's needs?\" is which check?","o":["Validity","Verifiability","Completeness","Realism"],"a":0,"vi":"Validity: chức năng có hỗ trợ tốt nhất nhu cầu khách không.","en":"Validity: does the system provide the functions that best support the customer's needs.","src":"04#51"},{"id":"w4-27","w":4,"q":"Which requirements validation technique is the most common approach?","o":["Prototyping","Test-case generation","Requirements reviews","Formal proof"],"a":2,"vi":"Requirements reviews: phân tích thủ công có hệ thống, phổ biến nhất.","en":"Requirements reviews (systematic manual analysis) are the most common approach.","src":"04#52"},{"id":"w4-28","w":4,"q":"Developing tests for requirements to check their testability is called:","o":["Requirements reviews","Prototyping","Test-case generation","Traceability"],"a":2,"vi":"Test-case generation: viết test cho requirement để kiểm tra tính testable.","en":"Test-case generation: developing tests for requirements to check testability.","src":"04#52"},{"id":"w4-29","w":4,"q":"What are the main steps of requirements change management?","o":["Change request → Change analysis and costing → Change implementation","Change implementation → Change request → Review","Analysis → Design → Code","Plan → Do → Check → Act"],"a":0,"vi":"Change request → change analysis & costing → change implementation.","en":"Change request → change analysis and costing → change implementation.","src":"04#57"},{"id":"w4-30","w":4,"q":"A requirements traceability matrix is used for:","o":["Estimating effort","Impact analysis when requirements change and checking test coverage","Ranking stakeholders","Choosing a programming language"],"a":1,"vi":"Traceability: liên kết requirement ↔ nguồn, design, test → impact analysis và kiểm tra test coverage.","en":"Traceability links requirements to sources, design and tests: used for impact analysis and test coverage.","src":"04#58"},{"id":"w4-31","w":4,"q":"In RUP, the two main types of requirements documents are:","o":["Vision document and use-case specifications","User stories and burndown chart","SRS and Gantt chart","Product Backlog and Sprint Backlog"],"a":0,"vi":"RUP: Vision document + use-case specs. Agile (Scrum, XP): Vision + user stories.","en":"RUP: Vision document and use-case specifications. Agile: vision and user stories.","src":"04#45"},{"id":"w4-32","w":4,"q":"What is a key risk of AI-assisted requirements engineering mentioned in the lecture?","o":["AI cannot read documents","AI does not know your stakeholders and can invent plausible requirements","AI always refuses to write user stories","AI makes reviews unnecessary"],"a":1,"vi":"AI không biết stakeholder của bạn, có thể bịa requirement nghe hợp lý → luôn validate với user thật.","en":"AI does not know your stakeholders and can invent plausible requirements; always validate with real users.","src":"04#47"},{"id":"w4-33","w":4,"q":"Which abbreviation is expanded INCORRECTLY?","o":["NFR = Non-functional requirement","MoSCoW = Must / Should / Could / Won't have (this time)","SRS = System Requirements Standard","INVEST = Independent, Negotiable, Valuable, Estimable, Small, Testable"],"a":2,"vi":"SRS = Software Requirements Specification. Các cách viết còn lại đều đúng.","en":"SRS = Software Requirements Specification. The other expansions are correct.","src":"04#12, 04#35, 04#42, 04#46, 04#58, 00","ng":1},{"id":"w4-34","w":4,"q":"\"Mean time to failure\" (MTTF) is a measure for which non-functional property?","o":["Robustness","Speed","Portability","Reliability"],"a":3,"vi":"Reliability đo bằng MTTF, xác suất không sẵn sàng, tần suất lỗi, availability. Bẫy: Robustness đo bằng thời gian khởi động lại sau lỗi.","en":"Reliability: MTTF, probability of unavailability, rate of failure, availability. Trap: robustness is measured by time to restart after failure.","src":"04#20","ng":1},{"id":"w5-01","w":5,"q":"UML was created by unifying the work of:","o":["Schwaber, Sutherland and Beck","Booch, Rumbaugh and Jacobson","Ohno, Anderson and Deming","Boehm, Brooks and Royce"],"a":1,"vi":"Grady Booch, James Rumbaugh, Ivar Jacobson (Rational Software).","en":"Grady Booch, James Rumbaugh and Ivar Jacobson of Rational Software.","src":"05#7"},{"id":"w5-02","w":5,"q":"UML was adopted as a standard by the Object Management Group (OMG) in:","o":["1990","1997","2001","2007"],"a":1,"vi":"OMG chuẩn hoá UML năm 1997.","en":"OMG adopted UML as a standard in 1997.","src":"05#7"},{"id":"w5-03","w":5,"q":"A use case diagram belongs to which UML group?","o":["Structural (static) diagrams","Behavioral (dynamic) diagrams","Deployment diagrams","Package diagrams"],"a":1,"vi":"Use case diagram thuộc nhóm behavioral (dynamic), cùng sequence, communication, state machine, activity.","en":"Use case diagrams are behavioral (dynamic), with sequence, communication, state machine and activity diagrams.","src":"05#8"},{"id":"w5-04","w":5,"q":"Which of the following is a structural UML diagram?","o":["Sequence diagram","Activity diagram","Component diagram","Use case diagram"],"a":2,"vi":"Structural: class, package, object, component, deployment.","en":"Structural: class, package, object, component, deployment.","src":"05#8"},{"id":"w5-05","w":5,"q":"Which statement about actors is correct?","o":["One physical user can play only one actor","An actor represents a role; one physical user can play multiple roles","Actors must be people","Actors are internal classes of the system"],"a":1,"vi":"Actor là một role; một người thật có thể đóng nhiều role; nhiều người cùng role là một actor; actor có thể là process hoặc hệ thống.","en":"An actor is a role; one user can play several roles; many users with the same role are one actor; actors can be processes or things.","src":"05#14"},{"id":"w5-06","w":5,"q":"A use case specifies:","o":["HOW the system does something internally","WHAT the system does, but not HOW","The database schema","The class hierarchy"],"a":1,"vi":"Use case nêu WHAT, không HOW; che giấu cấu trúc bên trong.","en":"A use case specifies WHAT the system does, not HOW; it hides internal structure.","src":"05#16"},{"id":"w5-07","w":5,"q":"A use case description has:","o":["Only one flow","One main (basic) flow and alternative flows","Only exceptional flows","No flows, only actors"],"a":1,"vi":"Một basic flow + alternative flows (alternative, exceptional paths).","en":"One main (basic) flow plus alternative flows (alternative and exceptional paths).","src":"05#17"},{"id":"w5-08","w":5,"q":"A scenario is:","o":["A set of use cases","An instance of a use case: a specific sequence of events","An actor generalization","A UML structural diagram"],"a":1,"vi":"Scenario là một instance cụ thể của use case (giống object so với class).","en":"A scenario is a specific sequence of events, an instance of a use case (like object vs class).","src":"05#20"},{"id":"w5-09","w":5,"q":"Which statement about the INCLUDE relationship is correct?","o":["The included use case may stand alone","The base use case is not aware of the included use case","The base use case is aware of its included use case, and the included use case does not stand alone","Include is between an actor and a use case"],"a":2,"vi":"Include: base BIẾT use case được include; use case được include không đứng một mình.","en":"Include: the base is aware of the included use case; the included use case does not stand alone.","src":"05#22"},{"id":"w5-10","w":5,"q":"Which statement about the EXTEND relationship is correct?","o":["The base use case is aware of the extending use case","The extending use case may stand alone and the base is not aware of it","The extending use case cannot stand alone","Extend is between two actors"],"a":1,"vi":"Extend: base KHÔNG biết use case mở rộng; use case mở rộng có thể đứng một mình.","en":"Extend: the base is not aware of the extending use case; the extending use case may stand alone.","src":"05#22"},{"id":"w5-11","w":5,"q":"In the online shopping example, the <<extend>> arrow is drawn:","o":["From Checkout order to Verify shipping address","From Verify shipping address to Checkout order","From Customer to Verify shipping address","From Payment to Checkout order"],"a":1,"vi":"Mũi tên extend đi từ use case mở rộng (Verify shipping address) về base (Checkout order).","en":"The extend arrow goes from the extending use case (Verify shipping address) to the base (Checkout order).","src":"05#23"},{"id":"w5-12","w":5,"q":"In the online shopping example, what is the relationship from \"Checkout order\" to \"Payment\"?","o":["<<extend>>","<<include>>","Generalization","Association"],"a":1,"vi":"Checkout order <<include>> Payment: thanh toán là phần bắt buộc của checkout.","en":"Checkout order <<include>> Payment: payment is an explicit part of checkout.","src":"05#23"},{"id":"w5-13","w":5,"q":"In the Firefox example, \"Read web page loud\" relates to \"Load and Display web page\" by:","o":["<<include>>","<<extend>>","Generalization","Association"],"a":1,"vi":"Read web page loud <<extend>> Load and Display web page (tuỳ chọn, base không biết).","en":"Read web page loud <<extend>> Load and Display web page (optional; the base is not aware).","src":"05#23"},{"id":"w5-14","w":5,"q":"According to the notes on use case diagrams, a well-defined use case should:","o":["Put all variations into the base use case","Include common behavior from included use cases and distribute variations into extending use cases","Avoid include and extend","Contain every actor of the system"],"a":1,"vi":"Hành vi chung → include; biến thể → extend.","en":"Common behavior goes into included use cases; variations into extending use cases.","src":"05#24"},{"id":"w5-15","w":5,"q":"Which statement correctly contrasts UI and UX?","o":["UI covers the user's overall experience; UX is the look and feel","UI refers to the interactivity, look and feel of a screen; UX covers the user's overall experience with the product","UI and UX are identical","UX is only about colors"],"a":1,"vi":"UI: tương tác, look & feel của màn hình. UX: toàn bộ trải nghiệm với sản phẩm.","en":"UI: interactivity, look and feel of a screen. UX: the user's overall experience with the product.","src":"05#29"},{"id":"w5-16","w":5,"q":"According to the lecture, short-term memory can hold about how many chunks at a time?","o":["About 4 ± 1 (Miller's classic estimate: 7 ± 2)","Exactly 12","About 20","Unlimited"],"a":0,"vi":"Khoảng 4 ± 1 chunk; ước lượng kinh điển của Miller là 7 ± 2.","en":"About 4 ± 1 chunks; Miller's classic estimate is 7 ± 2.","src":"05#30"},{"id":"w5-17","w":5,"q":"\"Comparable operations should be activated in the same way\" is which UI design principle?","o":["User familiarity","Consistency","Minimal surprise","User diversity"],"a":1,"vi":"Consistency: các thao tác tương tự được kích hoạt giống nhau.","en":"Consistency: comparable operations are activated in the same way.","src":"05#32"},{"id":"w5-18","w":5,"q":"\"Users should never be surprised by the behavior of a system\" is which principle?","o":["Recoverability","Minimal surprise","User guidance","Consistency"],"a":1,"vi":"Minimal surprise.","en":"Minimal surprise.","src":"05#32"},{"id":"w5-19","w":5,"q":"\"The interface should include mechanisms to allow users to recover from errors\" is which principle?","o":["Recoverability","User guidance","User familiarity","User diversity"],"a":0,"vi":"Recoverability: có cơ chế để người dùng khôi phục sau lỗi.","en":"Recoverability: mechanisms to let users recover from errors.","src":"05#33"},{"id":"w5-20","w":5,"q":"\"The interface should use terms and concepts drawn from the experience of the people who will make most use of the system\" is:","o":["Consistency","User familiarity","Minimal surprise","User guidance"],"a":1,"vi":"User familiarity: dùng thuật ngữ quen thuộc với người dùng.","en":"User familiarity: use terms and concepts familiar to the main users.","src":"05#32"},{"id":"w5-21","w":5,"q":"\"Provide meaningful feedback when errors occur and context-sensitive help\" is which principle?","o":["User guidance","Recoverability","User diversity","Consistency"],"a":0,"vi":"User guidance: feedback có ý nghĩa khi lỗi và trợ giúp theo ngữ cảnh.","en":"User guidance: meaningful feedback on errors and context-sensitive help.","src":"05#33"},{"id":"w5-22","w":5,"q":"In WCAG 2.2, a contrast ratio of at least 4.5:1 for text belongs to which POUR principle?","o":["Perceivable","Operable","Understandable","Robust"],"a":0,"vi":"Perceivable: alt text, phụ đề, tương phản ≥ 4.5:1.","en":"Perceivable: text alternatives, captions, contrast ratio ≥ 4.5:1 for text.","src":"05#34"},{"id":"w5-23","w":5,"q":"\"Everything works with a keyboard; targets large enough to tap\" belongs to which POUR principle?","o":["Perceivable","Operable","Understandable","Robust"],"a":1,"vi":"Operable: dùng được bằng bàn phím, vùng bấm đủ lớn.","en":"Operable: everything works with a keyboard; targets large enough to tap.","src":"05#34"},{"id":"w5-24","w":5,"q":"Which accessibility rule is stated in the lecture?","o":["Use color alone to signal errors","Never use color alone to convey meaning","Avoid keyboard navigation","Design desktop-only"],"a":1,"vi":"Không bao giờ dùng mỗi màu sắc để truyền ý nghĩa.","en":"Never use color alone to convey meaning.","src":"05#34"},{"id":"w5-25","w":5,"q":"Which interaction style requires users to learn syntax and options?","o":["Direct manipulation","Menu selection","Form fill-in","Command language"],"a":3,"vi":"Command language: phải học cú pháp và tuỳ chọn.","en":"Command language: users must learn syntax and options.","src":"05#40"},{"id":"w5-26","w":5,"q":"Which interaction style is used when data entry is required?","o":["Form fill-in","Direct manipulation","Natural language","Menu selection"],"a":0,"vi":"Form fill-in: dùng khi cần nhập dữ liệu.","en":"Form fill-in is used when data entry is required.","src":"05#39"},{"id":"w5-27","w":5,"q":"Which interaction style lets users directly make changes and see results?","o":["Command language","Direct manipulation","Form fill-in","Menu selection"],"a":1,"vi":"Direct manipulation: thay đổi trực tiếp và thấy kết quả.","en":"Direct manipulation: users directly make changes and see results.","src":"05#37"},{"id":"w5-28","w":5,"q":"Digital presentation of information is best for:","o":["Showing relative values","Precise values using little screen space","Revealing trends in large data","Decoration"],"a":1,"vi":"Digital: giá trị chính xác, ít chỗ. Analogue: thể hiện giá trị tương đối.","en":"Digital: precise values, little screen space. Analogue: relative values.","src":"05#42"},{"id":"w5-29","w":5,"q":"What is the order of the UI design process in the lecture?","o":["System prototyping → User analysis → Interface evaluation","User analysis → System prototyping → Interface evaluation","Interface evaluation → User analysis → System prototyping","User analysis → Interface evaluation → System prototyping"],"a":1,"vi":"User analysis → System prototyping → Interface evaluation.","en":"User analysis → System prototyping → Interface evaluation.","src":"05#45"},{"id":"w5-30","w":5,"q":"Which user analysis technique observes the user at work?","o":["Task analysis","Interviewing","Ethnography","Questionnaires"],"a":2,"vi":"Ethnography: quan sát người dùng khi làm việc.","en":"Ethnography observes the user at work.","src":"05#46"},{"id":"w5-31","w":5,"q":"System prototyping is described as a two-stage process of:","o":["Coding then testing","Paper prototypes then automated prototypes","Wireframes then deployment","Interview then survey"],"a":1,"vi":"Hai giai đoạn: paper prototypes → automated prototypes.","en":"Two stages: paper prototypes, then automated prototypes.","src":"05#47"},{"id":"w5-32","w":5,"q":"According to the lecture, error messages should be:","o":["Short, technical and red","Polite, concise, consistent and constructive","Funny and surprising","Shown only in logs"],"a":1,"vi":"Thông báo lỗi: polite, concise, consistent, constructive; dựa trên nền tảng và kinh nghiệm người dùng.","en":"Messages should be polite, concise, consistent and constructive, based on users' background and experience.","src":"05#54"},{"id":"w5-33","w":5,"q":"Which is NOT one of the usability attributes used in interface evaluation?","o":["Learnability","Speed of operation","Profitability","Adaptability"],"a":2,"vi":"Usability attributes: learnability, speed of operation, robustness, recoverability, adaptability.","en":"Usability attributes: learnability, speed of operation, robustness, recoverability, adaptability.","src":"05#49"},{"id":"w5-34","w":5,"q":"Which is listed as a common mistake in using color in interface design?","o":["Limiting the number of colors","Using color to communicate meaning","Using color change to show status change","Using color consistently"],"a":1,"vi":"Sai lầm thường gặp: dùng màu để truyền ý nghĩa và lạm dụng màu.","en":"Common mistakes: using color to communicate meaning and over-using color.","src":"05#52"},{"id":"w5-35","w":5,"q":"Which principle of data validation does the lecture state?","o":["Trust user input to save time","Do not trust the users; check all user input data","Validate only on the server once a day","Skip business constraints"],"a":1,"vi":"Không tin người dùng, kiểm tra mọi dữ liệu nhập; ràng buộc natural/business; early hoặc late checking.","en":"Do not trust the users; check all input; natural and business constraints; early or late checking.","src":"05#57"},{"id":"w5-36","w":5,"q":"Which abbreviation is expanded INCORRECTLY?","o":["UML = Universal Modeling Language","OMG = Object Management Group","BPMN = Business Process Model and Notation","UX = User experience"],"a":0,"vi":"UML = Unified Modeling Language, không phải \"Universal\". Các cách viết còn lại đều đúng.","en":"UML = Unified Modeling Language, not \"Universal\". The other expansions are correct.","src":"05#6, 05#7, 05#29","ng":1},{"id":"w5-37","w":5,"q":"In WCAG 2.2, the \"R\" in POUR stands for:","o":["Responsive","Robust","Readable","Reliable"],"a":1,"vi":"POUR = Perceivable, Operable, Understandable, Robust. Robust: HTML ngữ nghĩa, chạy được với screen reader. Bẫy: slide cũng nói thiết kế responsive, nhưng đó không phải chữ R.","en":"POUR = Perceivable, Operable, Understandable, Robust. Robust: semantic HTML, works with screen readers. Trap: the slide also says design responsive, but that is not the R.","src":"05#34","ng":1},{"id":"w6-01","w":6,"q":"In the software development process on the slide, architectural design belongs to which step?","o":["Requirement definition","Analysis & Design","Integration & System testing","Operation & Maintenance"],"a":1,"vi":"Thiết kế nằm ở bước Analysis & Design, sau Requirement definition.","en":"Design sits in the Analysis & Design step.","src":"06#3"},{"id":"w6-02","w":6,"q":"Software design is best defined as:","o":["Writing and testing the source code","Conceptualizing how a system will work before it is implemented or modified","Collecting requirements from stakeholders","Deploying the system to users"],"a":1,"vi":"Software design: hình dung hệ thống hoạt động thế nào trước khi cài đặt hoặc sửa.","en":"Conceptualizing how the system will work before implementing or modifying it.","src":"06#4"},{"id":"w6-03","w":6,"q":"On the slide, architectural design is the level of software design that covers:","o":["The code inside each class","The overall structure of the system","Data structures and algorithms","The test cases for each module"],"a":1,"vi":"Architectural design: cấu trúc tổng thể. High-level: sub-system và module. Detailed: cấu trúc dữ liệu và thuật toán.","en":"Architectural design: overall structure. High-level: sub-systems and modules. Detailed: data structures and algorithms.","src":"06#4"},{"id":"w6-04","w":6,"q":"Which is NOT part of architectural design?","o":["Decomposing the system into components","Identifying major components and their communications","Making design decisions and their rationale","Choosing the sorting algorithm inside one function"],"a":3,"vi":"Thuật toán bên trong một hàm thuộc detailed design.","en":"Algorithms inside a function belong to detailed design.","src":"06#7"},{"id":"w6-05","w":6,"q":"\"The set of structures needed to reason about the system, comprising software elements, relations among them, and properties of both\" is the definition by:","o":["Shaw et al., 1995","Bass, Clements & Kazman, 2021","Sommerville, 2015","Simon Brown, C4"],"a":1,"vi":"Định nghĩa này của Bass, Clements & Kazman (Software Architecture in Practice, 4th ed., 2021). Shaw et al. nói về components và interactions.","en":"That is Bass, Clements & Kazman (2021); Shaw et al. speak of components and interactions.","src":"06#8"},{"id":"w6-06","w":6,"q":"Who created the C4 model?","o":["Grady Booch","Simon Brown","Mary Shaw","Ivar Jacobson"],"a":1,"vi":"C4 model của Simon Brown, bốn mức phóng to như bản đồ.","en":"The C4 model is by Simon Brown.","src":"06#12"},{"id":"w6-07","w":6,"q":"For the course project (PA3), which C4 diagrams should you draw at least?","o":["Code and Components","Context and Container","Only the Code diagram","All four, with full UML for each"],"a":1,"vi":"Đồ án: ít nhất System Context và Container diagram (PA3).","en":"At least the Context and Container diagrams (PA3).","src":"06#12"},{"id":"w6-08","w":6,"q":"Which tools are listed for diagrams-as-code in C4?","o":["Structurizr, PlantUML, Mermaid","Photoshop, Figma, Canva","Jira, Trello, Notion","Excel, Word, PowerPoint"],"a":0,"vi":"Diagrams-as-code: Structurizr, PlantUML, Mermaid.","en":"Structurizr, PlantUML, Mermaid.","src":"06#12"},{"id":"w6-09","w":6,"q":"A module (component), unlike a sub-system:","o":["Is a system in its own right","Operates independently of other sub-systems","Provides services to other components but is not normally a separate system","Must run on its own server"],"a":2,"vi":"Module cung cấp dịch vụ cho component khác nhưng thường không được xem là hệ thống riêng.","en":"A module serves other components but is not normally a separate system.","src":"06#13"},{"id":"w6-10","w":6,"q":"\"Analysis of whether the system can meet its non-functional requirements\" is which advantage of architecture?","o":["Stakeholder communication","System analysis","Large-scale reuse","Incremental delivery"],"a":1,"vi":"System analysis: kiểm tra NFR và khả năng mở rộng sau này.","en":"System analysis covers NFRs and future extensions.","src":"06#15"},{"id":"w6-11","w":6,"q":"To improve availability, the architecture should:","o":["Use large-grain components","Include redundant components and fault-tolerance mechanisms","Put critical assets in inner layers","Localize safety features in few sub-systems"],"a":1,"vi":"Availability: thêm component dự phòng và cơ chế chịu lỗi.","en":"Availability: redundant components and fault tolerance.","src":"06#16"},{"id":"w6-12","w":6,"q":"Which architectural choice supports maintainability?","o":["Large-grain components","Fine-grain, replaceable components","Minimizing all communication","Redundant data everywhere"],"a":1,"vi":"Maintainability: component nhỏ, dễ thay. Large-grain là cho performance.","en":"Maintainability: fine-grain, replaceable components. Large-grain is for performance.","src":"06#16"},{"id":"w6-13","w":6,"q":"Introducing redundant data improves availability but makes which attribute harder?","o":["Performance","Security","Usability","Maintainability"],"a":1,"vi":"Conflict: dữ liệu dư thừa giúp availability nhưng làm security khó hơn.","en":"Redundant data helps availability but makes security harder.","src":"06#17"},{"id":"w6-14","w":6,"q":"Localizing safety-related features usually leads to:","o":["Less communication and better performance","More communication and degraded performance","Better security with no cost","Fewer components overall"],"a":1,"vi":"Gom tính năng safety thường cần giao tiếp nhiều hơn, nên performance giảm.","en":"It usually means more communication, so performance degrades.","src":"06#17"},{"id":"w6-15","w":6,"q":"\"The system should achieve 99.99% uptime\" is an architecturally significant requirement about:","o":["Performance","Scalability","Security","Availability"],"a":3,"vi":"Uptime 99,99% là availability. 1.000 giao dịch/giây là performance; 1 triệu người dùng là scalability; ISO 27001 là security.","en":"Uptime is availability; 1,000 TPS is performance; 1M users is scalability; ISO 27001 is security.","src":"06#19"},{"id":"w6-16","w":6,"q":"Data residency laws affecting a cloud architecture are an example of an ASR:","o":["Influencing technology choices","Defining constraints on the design","Shaping trade-offs between quality attributes","Removing non-functional requirements"],"a":1,"vi":"Ví dụ trên slide: luật nơi lưu dữ liệu là ràng buộc (constraint) cho thiết kế.","en":"The slide gives data residency laws as a design constraint.","src":"06#18"},{"id":"w6-17","w":6,"q":"Which is a high-priority functional requirement example that shapes the architecture?","o":["The system must comply with ISO/IEC 27001:2022","A real-time video processing application requires a low-latency streaming pipeline","The system should achieve 99.99% uptime","The system must handle 1,000 transactions per second"],"a":1,"vi":"Ví dụ FR ưu tiên cao: xử lý video thời gian thực cần pipeline streaming độ trễ thấp. Ba ý còn lại là NFR.","en":"Real-time video needing a low-latency pipeline is the FR example; the others are NFRs.","src":"06#19"},{"id":"w6-18","w":6,"q":"Which is NOT one of the questions for architectural design?","o":["How will the system be distributed?","What control strategy should be used?","How should the architecture be documented?","How many testers should the team hire?"],"a":3,"vi":"7 câu hỏi về kiến trúc không gồm việc tuyển tester.","en":"Hiring testers is not among the seven questions.","src":"06#22"},{"id":"w6-19","w":6,"q":"Which is listed as an example of a design decision?","o":["Daily backup","Hire two more developers","Write the user manual in English","Hold a sprint review every two weeks"],"a":0,"vi":"Ví dụ quyết định thiết kế: React, React Native, MySQL, MVC phía server, Java back end, daily backup.","en":"Examples: React, React Native, MySQL, MVC, Java back end, daily backup.","src":"06#23"},{"id":"w6-20","w":6,"q":"In the three-tier example decision, which were listed as alternatives?","o":["MVC, service-oriented architecture, n-tier","Waterfall, Scrum, Kanban","MySQL, PostgreSQL, MongoDB","React, Angular, Vue"],"a":0,"vi":"Alternatives: MVC, service-oriented architecture, n-tier.","en":"Alternatives: MVC, SOA, n-tier.","src":"06#24"},{"id":"w6-21","w":6,"q":"Where is an ADR kept?","o":["In the repository, e.g. docs/adr/","Only in the project manager's email","In the bug tracker","On a printed wall chart"],"a":0,"vi":"ADR là tài liệu ngắn lưu ngay trong repository (docs/adr/), được review như code.","en":"ADRs live in the repository (docs/adr/) and are reviewed like code.","src":"06#25"},{"id":"w6-22","w":6,"q":"Which ADR section records \"benefits, drawbacks, follow-up work\"?","o":["Context","Decision","Consequences","Status"],"a":2,"vi":"Consequences: lợi ích, hạn chế, việc tiếp theo. Context: vấn đề và ràng buộc.","en":"Consequences hold benefits, drawbacks and follow-up work.","src":"06#25"},{"id":"w6-23","w":6,"q":"MVC, n-tier and service-oriented are examples of:","o":["Design patterns","Architectural styles","Process models","UML diagrams"],"a":1,"vi":"Ví dụ architectural style trên slide: MVC, n-tier, service-oriented.","en":"The slide lists them as architectural styles.","src":"06#28"},{"id":"w6-24","w":6,"q":"The repository style is often used when:","o":["Sharing large amounts of data","A fast response to hardware events is essential","Every node must act as a server","Data must pass through a series of transformations"],"a":0,"vi":"Repository hay dùng khi chia sẻ lượng dữ liệu lớn.","en":"Repository is used when sharing large amounts of data.","src":"06#33"},{"id":"w6-25","w":6,"q":"Which is an ADVANTAGE of the client-server style?","o":["A shared data model across sub-systems","A central register of names and services","It is easy to add new servers or upgrade existing ones","No data interchange is needed"],"a":2,"vi":"Client-server dễ thêm hoặc nâng cấp server. Không có data model chung và không có registry trung tâm là nhược điểm.","en":"Easy to add or upgrade servers; no shared model and no central register are drawbacks.","src":"06#38"},{"id":"w6-26","w":6,"q":"Which are given as examples of peer-to-peer systems?","o":["BitTorrent and blockchain networks","Web browsers and web servers","Kafka and RabbitMQ","MySQL and PostgreSQL"],"a":0,"vi":"Ví dụ P2P: BitTorrent, mạng blockchain, một số hệ thống giao tiếp thời gian thực.","en":"BitTorrent, blockchain networks, some real-time communication systems.","src":"06#39"},{"id":"w6-27","w":6,"q":"Which is an advantage of the layered style?","o":["Separation of concerns","Very fast communication through all layers","Flexible communication between any layers","No interfaces are needed"],"a":0,"vi":"Layered: separation of concerns, reuse, giảm ảnh hưởng khi đổi UI.","en":"Separation of concerns, reuse, less impact of UI changes.","src":"06#42"},{"id":"w6-28","w":6,"q":"MVC was originally introduced for:","o":["UI applications","Database servers","Batch processing","Embedded real-time systems"],"a":0,"vi":"MVC ban đầu cho ứng dụng có giao diện, nay phổ biến cho web app.","en":"Originally for UI apps, now popular for web apps.","src":"06#43"},{"id":"w6-29","w":6,"q":"In MVC, the View is responsible for:","o":["Data and logic processing","Presentation","Accepting commands","Storing data in the DB"],"a":1,"vi":"View: trình bày. Model: dữ liệu và logic. Controller: nhận lệnh.","en":"View: presentation.","src":"06#43"},{"id":"w6-30","w":6,"q":"In pipes and filters, data travels between filters via:","o":["A shared repository","Pipes","Interrupt vectors","An event broker"],"a":1,"vi":"Filter xử lý độc lập, dữ liệu đi qua filter bằng pipe.","en":"Data travels through filters via pipes.","src":"06#47"},{"id":"w6-31","w":6,"q":"In the interrupt-driven style, each interrupt type is associated with:","o":["A memory location and a hardware switch","A database table","A web server","A user story"],"a":0,"vi":"Mỗi loại interrupt gắn với một vị trí bộ nhớ và một công tắc phần cứng, có handler riêng.","en":"Each type has a memory location, a hardware switch and its own handler.","src":"06#50"},{"id":"w6-32","w":6,"q":"Autonomy, resilience, scalability and flexibility are traits of:","o":["Service-oriented architecture","Microservice architecture","Repository style","Layered style"],"a":1,"vi":"Bộ này là của microservices. SOA: modularity, interoperability, reusability, loose coupling.","en":"These are microservice traits; SOA's are modularity, interoperability, reusability, loose coupling.","src":"06#53"},{"id":"w6-33","w":6,"q":"Which is NOT a drawback of microservices listed in the lecture?","o":["Distributed-system complexity","Data consistency across services","Operational overhead","Services cannot be scaled independently"],"a":3,"vi":"Microservices mở rộng độc lập được; nhược điểm là phức tạp phân tán, nhất quán dữ liệu, chi phí vận hành, cần DevOps.","en":"Independent scaling is a benefit; drawbacks are complexity, consistency, overhead, DevOps maturity.","src":"06#55"},{"id":"w6-34","w":6,"q":"In event-driven architecture, \"TicketBooked\" is consumed by payment, email and analytics. What sits between the producer and consumers?","o":["An event broker such as Kafka or RabbitMQ","A shared relational table","A load balancer only","An interrupt vector"],"a":0,"vi":"Producer → event broker (Kafka, RabbitMQ) → một hoặc nhiều consumer.","en":"Producer → event broker (Kafka, RabbitMQ) → consumers.","src":"06#56"},{"id":"w6-35","w":6,"q":"Which is an advantage of event-driven architecture?","o":["Easy to add new consumers","Strong immediate consistency","Easy end-to-end debugging","No need to version event schemas"],"a":0,"vi":"Ưu điểm: loose coupling, dễ thêm consumer, bất đồng bộ. Nhược: khó debug, eventual consistency.","en":"Loose coupling, easy to add consumers, asynchronous.","src":"06#56"},{"id":"w7-01","w":7,"q":"Which is NOT one of the main elements of a class diagram on the slide?","o":["Classes","Interfaces","Relationships","Lifelines"],"a":3,"vi":"Class diagram: classes, interfaces, relationships, common mechanisms. Lifeline thuộc sequence diagram.","en":"Lifelines belong to sequence diagrams.","src":"07#3"},{"id":"w7-02","w":7,"q":"A class defines:","o":["One single object at runtime","The set of objects that share the same attributes, operations, relationships and semantics","Only the data stored in a table","A step in a use case"],"a":1,"vi":"Class: tập các object có chung attribute, operation, relationship và ngữ nghĩa.","en":"The set of objects sharing attributes, operations, relationships and semantics.","src":"07#4"},{"id":"w7-03","w":7,"q":"A class name must be:","o":["Written in capital letters","Unique within its group","The same as the table name","Followed by a colon"],"a":1,"vi":"Tên class phải duy nhất trong nhóm của nó.","en":"Unique within its group.","src":"07#4"},{"id":"w7-04","w":7,"q":"An operation is:","o":["A service that can be requested from objects of the class","Data that characterizes the class","A relationship between two classes","A stored row in a table"],"a":0,"vi":"Operation: dịch vụ có thể yêu cầu từ các object của class. Attribute: dữ liệu mô tả class.","en":"An operation is a requestable service; an attribute is characterizing data.","src":"07#6"},{"id":"w7-05","w":7,"q":"In \"-cases: int\", the minus sign means the attribute is:","o":["public","protected","private","abstract"],"a":2,"vi":"- là private, + là public, # là protected.","en":"- private, + public, # protected.","src":"07#6"},{"id":"w7-06","w":7,"q":"Which relationship is described as the least restrictive?","o":["Composition","Aggregation","Generalization","Dependency"],"a":3,"vi":"Dependency lỏng nhất trong các quan hệ.","en":"Dependency is less restrictive than the others.","src":"07#10"},{"id":"w7-07","w":7,"q":"Which notation shows generalization?","o":["A dashed line with an open arrow","A solid line with a hollow triangle pointing at the superclass","A filled diamond at the owner","A plain solid line"],"a":1,"vi":"Generalization: mũi tên tam giác rỗng chỉ vào superclass.","en":"A hollow triangle pointing at the superclass.","src":"07#9"},{"id":"w7-08","w":7,"q":"An association can have:","o":["A name and roles at both ends","Only a stereotype","A primary key","An activation bar"],"a":0,"vi":"Association có thể có tên và role ở hai đầu.","en":"A name and roles at both ends.","src":"07#12"},{"id":"w7-09","w":7,"q":"Multiplicity refers to:","o":["How many attributes a class has","How many objects may be connected across an instance of an association","How many subclasses a class has","How many times a message is sent"],"a":1,"vi":"Multiplicity: số object có thể nối qua một association.","en":"How many objects may be connected across an association.","src":"07#13"},{"id":"w7-10","w":7,"q":"A Faculty uses Lecturers but does not own them. Which relationship and symbol?","o":["Composition, filled diamond","Aggregation, hollow diamond","Generalization, hollow triangle","Dependency, dashed arrow"],"a":1,"vi":"Aggregation: dùng nhưng không sở hữu, thoi rỗng. Composition mới là thoi đặc.","en":"Aggregation: using without owning, hollow diamond.","src":"07#14"},{"id":"w7-11","w":7,"q":"In the Online Shop class diagram, \"line item\" is an example of:","o":["A role name","A class name","An operation","A multiplicity"],"a":0,"vi":"line item là role name ở đầu OrderDetail.","en":"\"line item\" is a role name.","src":"07#15"},{"id":"w7-12","w":7,"q":"In the Online Shop diagram, the arrow from OrderDetail to Item shows:","o":["Navigability","Generalization","Composition","Dependency"],"a":0,"vi":"Mũi tên trên association thể hiện navigability.","en":"The arrow on the association shows navigability.","src":"07#15"},{"id":"w7-13","w":7,"q":"A system object, as opposed to a domain object:","o":["Is a real-world entity","Has stored business data","Is created to support processing and calculations","Takes a role in the business process"],"a":2,"vi":"System object được tạo ra để hỗ trợ xử lý và tính toán.","en":"System objects support processing and calculations.","src":"07#17"},{"id":"w7-14","w":7,"q":"Screens, forms and API endpoints are which kind of BCE object?","o":["Entity","Control","Boundary","Domain"],"a":2,"vi":"Boundary: giao diện giữa actor và hệ thống: màn hình, form, API endpoint.","en":"Boundary objects: screens, forms, API endpoints.","src":"07#18"},{"id":"w7-15","w":7,"q":"Which BCE objects are domain objects?","o":["Boundary","Control","Entity","Boundary and control"],"a":2,"vi":"Boundary và control là system object; entity là domain object.","en":"Entities are domain objects; boundary and control are system objects.","src":"07#18"},{"id":"w7-16","w":7,"q":"BCE maps to a layered architecture as:","o":["presentation → business → data","data → presentation → business","client → server → peer","filter → pipe → filter"],"a":0,"vi":"BCE khớp với presentation → business → data.","en":"It maps to presentation → business → data.","src":"07#18"},{"id":"w7-17","w":7,"q":"When identifying domain classes, which should be removed?","o":["Classes that store data","Classes that play a role in the business process","Attributes disguised as classes","Entities from the conceptual ERD"],"a":2,"vi":"Bỏ class trùng, từ mơ hồ, và attribute đội lốt class.","en":"Remove duplicates, vague words and attributes disguised as classes.","src":"07#19"},{"id":"w7-18","w":7,"q":"In the Shipping System example, Vessel, Region and Captain are classified as:","o":["Domain objects","System objects","Boundary objects","Control objects"],"a":0,"vi":"Các entity trong domain model (Vessel, VesselType, Region, Crew, Captain) là domain object.","en":"They are domain objects from the domain model.","src":"07#20"},{"id":"w7-19","w":7,"q":"In a sequence diagram, what does an activation bar show?","o":["When an object is executing","The multiplicity of a link","A database index","The return value type"],"a":0,"vi":"Activation bar: khoảng thời gian object đang thực thi.","en":"When an object is executing.","src":"07#22"},{"id":"w7-20","w":7,"q":"Which combined fragment means a simple \"if\" with no else?","o":["alt","opt","par","loop"],"a":1,"vi":"opt = if; alt = if/else.","en":"opt = if; alt = if/else.","src":"07#22"},{"id":"w7-21","w":7,"q":"How many sequence diagrams should you draw?","o":["Exactly one for the whole system","One per important scenario","One per class","One per database table"],"a":1,"vi":"Mỗi scenario quan trọng một sơ đồ.","en":"One diagram per important scenario.","src":"07#22"},{"id":"w7-22","w":7,"q":"In \"Register for a course\", which object answers hasFreeSeat()?","o":[":RegistrationUI",":RegistrationController",":Course",":Enrollment"],"a":2,"vi":"Controller hỏi Course hasFreeSeat(); còn chỗ thì tạo Enrollment.","en":"The controller asks Course hasFreeSeat(); if a seat is free it creates an Enrollment.","src":"07#23"},{"id":"w7-23","w":7,"q":"Encapsulation (the black-box rule) means:","o":["Hide data, expose operations","Share data through global variables","Make every attribute public","Copy behaviour into every subclass"],"a":0,"vi":"Encapsulation: giấu dữ liệu, chỉ lộ operation.","en":"Hide data, expose operations.","src":"07#25"},{"id":"w7-24","w":7,"q":"Shared data and behaviour between classes should be modelled with:","o":["Inheritance (generalization)","Composition","A junction table","A boundary object"],"a":0,"vi":"Dữ liệu và hành vi dùng chung → inheritance.","en":"Shared data and behaviour → inheritance.","src":"07#25"},{"id":"w7-25","w":7,"q":"Which objects need a state machine diagram?","o":["Objects with a status field, such as order, booking or account","Every boundary object","Only abstract classes","Objects without attributes"],"a":0,"vi":"Object có trường trạng thái (order, booking, account) thì vẽ state machine.","en":"Objects with a status field.","src":"07#26"},{"id":"w7-26","w":7,"q":"In the Order state machine, a Paid order can be cancelled:","o":["At any time, even after delivery","Before shipping, with a refund","Only by the delivery service","Never"],"a":1,"vi":"Paid —cancel [before shipping] / refund→ Cancelled.","en":"Paid → Cancelled on cancel [before shipping] / refund.","src":"07#26"},{"id":"w7-27","w":7,"q":"How does a state machine refine the class diagram?","o":["Each event becomes an operation of the class","Each state becomes a new class","Each guard becomes a table","It removes all operations"],"a":0,"vi":"Mỗi event → một operation: pay(), ship(), deliver(), cancel().","en":"Each event becomes an operation: pay(), ship(), deliver(), cancel().","src":"07#26"},{"id":"w7-28","w":7,"q":"Coupling measures:","o":["How closely responsibilities inside one module belong together","How strongly one module depends on others","How many lines of code a module has","How fast a module runs"],"a":1,"vi":"Coupling: mức phụ thuộc giữa các module. Cohesion: độ gắn bó bên trong một module.","en":"Coupling is dependence between modules; cohesion is togetherness inside one.","src":"07#28"},{"id":"w7-29","w":7,"q":"What does DRY stand for?","o":["Don't Repeat Yourself","Design Reuse Yearly","Data Ready Yet","Do Refactor Yourself"],"a":0,"vi":"DRY = Don't Repeat Yourself.","en":"DRY = Don't Repeat Yourself.","src":"07#28","ng":1},{"id":"w7-30","w":7,"q":"\"Adding a new type means editing a big switch\" is a symptom of violating:","o":["Single Responsibility","Open/Closed","Interface Segregation","Liskov Substitution"],"a":1,"vi":"O: mở để mở rộng, đóng để sửa đổi.","en":"Open/Closed: open for extension, closed for modification.","src":"07#29"},{"id":"w7-31","w":7,"q":"A subclass that throws \"not supported\" violates:","o":["Dependency Inversion","Single Responsibility","Liskov Substitution","Open/Closed"],"a":2,"vi":"L: subtype phải thay được cho base type.","en":"Liskov: subtypes must be able to replace their base type.","src":"07#29"},{"id":"w7-32","w":7,"q":"Classes forced to implement empty methods suggest a violation of:","o":["Interface Segregation","Open/Closed","Dependency Inversion","Single Responsibility"],"a":0,"vi":"I: nhiều interface nhỏ tốt hơn một interface lớn.","en":"Interface Segregation: many small interfaces over one large one.","src":"07#29"},{"id":"w7-33","w":7,"q":"Observer, Strategy and State belong to which group of GoF patterns?","o":["Creational","Structural","Behavioral","Architectural"],"a":2,"vi":"Behavioral: Chain of Responsibility, Command, Iterator, Mediator, Observer, State, Strategy, Template Method…","en":"They are behavioral patterns.","src":"07#31"},{"id":"w7-34","w":7,"q":"Builder and Prototype belong to which group?","o":["Creational","Structural","Behavioral","Data design"],"a":0,"vi":"Creational: Factory Method, Abstract Factory, Builder, Prototype, Singleton.","en":"Creational patterns.","src":"07#31"},{"id":"w7-35","w":7,"q":"Create the right payment method object (card, e-wallet, bank transfer). Which pattern?","o":["Observer","Facade","Factory Method","Adapter"],"a":2,"vi":"Tạo đúng loại object → Factory Method.","en":"Creating the right object → Factory Method.","src":"07#32"},{"id":"w7-36","w":7,"q":"A simple entry point to a complex subsystem is provided by:","o":["Facade","Singleton","Strategy","Observer"],"a":0,"vi":"Facade: một lối vào đơn giản cho subsystem phức tạp.","en":"Facade.","src":"07#32"},{"id":"w7-37","w":7,"q":"According to the lecture, design patterns are:","o":["A goal: use as many as possible","A vocabulary, applied only when the problem appears","Only for databases","Required in every class"],"a":1,"vi":"Pattern là từ vựng, không phải mục tiêu: chỉ dùng khi bài toán xuất hiện.","en":"Patterns are a vocabulary, not a goal.","src":"07#32"},{"id":"w7-38","w":7,"q":"In the Strategy example, which element holds a PricingStrategy and calls calculate()?","o":["StudentPricing","Booking","PricingStrategy itself","The database"],"a":1,"vi":"Booking giữ một PricingStrategy và gọi calculate(); các class Pricing cài interface.","en":"Booking holds a PricingStrategy and calls calculate().","src":"07#33"},{"id":"w7-39","w":7,"q":"NoSQL storage (document, key-value, graph) is suggested for:","o":["Flexible schemas or massive scale","Very small single-user files only","Replacing all primary keys","Storing UML diagrams"],"a":0,"vi":"NoSQL cho schema linh hoạt hoặc quy mô cực lớn.","en":"Flexible schemas or massive scale.","src":"07#35"},{"id":"w7-40","w":7,"q":"How is an n – n association between Student and Course mapped?","o":["A foreign key in Student","A foreign key in Course","A junction table enrollment(student_id, course_id)","One table holding both classes"],"a":2,"vi":"n–n: junction table có hai foreign key.","en":"n–n: a junction table with two foreign keys.","src":"07#37"},{"id":"w7-41","w":7,"q":"Where do attributes of a link (association class), such as grade and date, go?","o":["Extra columns in the junction table","A new database","The Student table only","An index"],"a":0,"vi":"Attribute của liên kết → cột thêm trong junction table: enrollment.grade, enrollment.date.","en":"Extra columns in the junction table.","src":"07#37"},{"id":"w7-42","w":7,"q":"Which is NOT an option for mapping generalization to tables?","o":["One table per hierarchy","One table per class","One table per concrete class","One table per attribute"],"a":3,"vi":"Generalization: một bảng cho cả cây, mỗi class một bảng, hoặc mỗi class cụ thể một bảng.","en":"Per hierarchy, per class, or per concrete class.","src":"07#37"},{"id":"w7-43","w":7,"q":"For a database, a data specification describes:","o":["The table fields","The file format","The UI layout","The test cases"],"a":0,"vi":"Database: mô tả các trường của bảng. File system: mô tả định dạng file.","en":"Database: table fields. File system: file format.","src":"07#38"},{"id":"w7-44","w":7,"q":"Which belongs to the relational database design checklist?","o":["Manage schema changes with migration scripts in Git","Store passwords in plain text for recovery","Avoid primary keys to save space","Use plural, mixed-case table names"],"a":0,"vi":"Checklist: PK/FK, 3NF, kiểu dữ liệu và ràng buộc, index, đặt tên nhất quán, hash mật khẩu, migration trong Git.","en":"PK/FK, 3NF, types and constraints, indexes, naming, hashed passwords, migrations in Git.","src":"07#40"}],"cards":[{"w":1,"f":"Software = ?","vi":"Chương trình + tài liệu đi kèm (requirements, design models, user manuals). Generic: bán cho nhiều khách. Custom: một khách, theo spec.","en":"Programs + associated documentation. Generic: sold to many customers. Custom: one customer, to their spec.","src":"01#3"},{"w":1,"f":"4 attributes of good software","vi":"Maintainability (evolve) · Dependability/Reliability (trustworthy) · Efficiency (không lãng phí tài nguyên) · Acceptability (understandable, usable, compatible).","en":"Maintainability · Dependability/Reliability · Efficiency · Acceptability.","src":"01#7"},{"w":1,"f":"Software costs","vi":"~60% development / 40% testing. Hệ thống sống lâu: maintenance gấp nhiều lần development. Custom: evolution > development.","en":"~60% development / 40% testing. Long-lived systems: maintenance several times development.","src":"01#9, 01#15"},{"w":1,"f":"CHAOS 2020","vi":"35% successful · 46% challenged · 19% failed.","en":"35% successful · 46% challenged · 19% failed.","src":"01#11"},{"w":1,"f":"SE vs CS vs System Engineering","vi":"CS: lý thuyết, nền tảng. SE: thực tiễn phát triển và bàn giao phần mềm. System Eng.: HW + SW + process, bao trùm SE.","en":"CS: theory. SE: practicalities of delivering software. System eng.: hardware + software + process.","src":"01#13, 01#14"},{"w":1,"f":"SE goals","vi":"Cost effective (within budget) · On time · High quality · Satisfying customer's needs.","en":"Cost effective · On time · High quality · Satisfying customer's needs.","src":"01#12"},{"w":1,"f":"4 process activities","vi":"Specification (làm gì + ràng buộc) · Development · Validation (đúng ý khách?) · Evolution.","en":"Specification · Development · Validation · Evolution.","src":"01#23"},{"w":1,"f":"3 process model perspectives","vi":"Workflow: trình tự · Data-flow: luồng thông tin · Role/action: ai làm gì.","en":"Workflow · Data-flow · Role/action (who does what).","src":"01#24"},{"w":1,"f":"CI / CD / DevOps","vi":"CI: tích hợp code tự động, thường xuyên. CD: tự động build, test, sẵn sàng release. DevOps: văn hoá + practices + tools rút ngắn SDLC.","en":"CI: frequent automatic integration. CD: auto build/test, release-ready. DevOps: culture + practices + tools to shorten the SDLC.","src":"01#21"},{"w":1,"f":"ACM/IEEE Code of Ethics (8)","vi":"Public · Client & Employer · Product · Judgment · Management · Profession · Colleagues · Self (lifelong learning).","en":"Public · Client & Employer · Product · Judgment · Management · Profession · Colleagues · Self.","src":"01#34-36"},{"w":1,"f":"4 professional responsibility issues","vi":"Confidentiality · Competence · Intellectual property rights · Computer misuse. Đạo đức hơn cả tuân thủ pháp luật.","en":"Confidentiality · Competence · IP rights · Computer misuse. Ethics is more than upholding the law.","src":"01#30-32"},{"w":2,"f":"Plan-driven vs Agile","vi":"Plan-driven: plan trước, đo theo plan, document-based, heavy. Agile: plan incremental, đổi theo requirement, tacit knowledge, light.","en":"Plan-driven: planned, measured against plan, document-based, heavy. Agile: incremental planning, tacit knowledge, light.","src":"02#6"},{"w":2,"f":"Which models are plan-driven / agile?","vi":"Plan-driven: Waterfall, Incremental, Spiral, RUP. Agile: XP, Scrum, Kanban.","en":"Plan-driven: Waterfall, Incremental, Spiral, RUP. Agile: XP, Scrum, Kanban.","src":"02#7"},{"w":2,"f":"CMMI 5 levels","vi":"1 Initial (reactive) → 2 Managed (mức project) → 3 Defined (chuẩn toàn tổ chức) → 4 Quantitatively Managed (data-driven) → 5 Optimizing. V3.0 (2023), ISACA.","en":"Initial → Managed (project) → Defined (organization) → Quantitatively Managed → Optimizing. V3.0 (2023), ISACA.","src":"02#10, 02#11"},{"w":2,"f":"Waterfall stages","vi":"Requirements definition → Analysis & Design → Implementation & Unit Testing → Integration & System Testing → Operation & Maintenance. Code khi req đã baseline; quay lại được.","en":"Requirements → Analysis & Design → Implementation & Unit Test → Integration & System Test → Operation & Maintenance.","src":"02#14, 02#15"},{"w":2,"f":"Incremental: pros & cons","vi":"✓ chức năng có sớm, increment đầu như prototype, ưu tiên cao được test nhiều, giảm rủi ro. ✗ process không visible, cấu trúc xuống cấp.","en":"+ early functionality, lower risk. − process not visible, structure degrades.","src":"02#23, 02#24"},{"w":2,"f":"Spiral model","vi":"Plan → Risk Analysis (prototyping) → Engineering → Evaluate. Mỗi vòng = 1 phase. ✓ quản lý rủi ro, dự án lớn. ✗ phức tạp, đắt.","en":"Plan → Risk Analysis → Engineering → Evaluate; each loop = a phase. + risk focus. − complex, expensive.","src":"02#25-29"},{"w":2,"f":"RUP phases","vi":"Inception (business case) → Elaboration (domain + kiến trúc) → Construction (design, code, test) → Transition (deploy). Mỗi iteration = 1 chu kỳ waterfall.","en":"Inception → Elaboration → Construction → Transition. Each iteration is a waterfall cycle.","src":"02#33, 02#34"},{"w":2,"f":"4 Agile values","vi":"Individuals & interactions > processes & tools · Working software > documentation · Customer collaboration > contract negotiation · Responding to change > following a plan.","en":"Individuals & interactions · Working software · Customer collaboration · Responding to change.","src":"02#37"},{"w":2,"f":"XP: 12 practices","vi":"Planning Game · Small Releases · Metaphor · Simple Design · Acceptance Testing · Refactoring · Pair Programming · Collective Ownership · Continuous Integration · 40-hour Week · On-site Customer · Coding Standards.","en":"Planning Game, Small Releases, Metaphor, Simple Design, Acceptance Testing, Refactoring, Pair Programming, Collective Ownership, CI, 40-hour Week, On-site Customer, Coding Standards.","src":"02#46"},{"w":2,"f":"Scrum artifacts ↔ commitments","vi":"Product Backlog ↔ Product Goal · Sprint Backlog ↔ Sprint Goal · Increment ↔ Definition of Done.","en":"Product Backlog ↔ Product Goal · Sprint Backlog ↔ Sprint Goal · Increment ↔ Definition of Done.","src":"02#54"},{"w":2,"f":"Scrum Team (Guide 2020)","vi":"≤ 10 người, 3 trách nhiệm: PO (value, Product Goal, order backlog) · SM (coach, gỡ impediments) · Developers (Sprint Backlog, Increment, DoD). KHÔNG có manager/team lead.","en":"≤ 10 people; PO, Scrum Master, Developers. No manager or team lead.","src":"02#59"},{"w":2,"f":"Scrum events","vi":"Sprint (≤ 1 tháng, chứa mọi event) · Sprint Planning · Daily Scrum 15' · Sprint Review (với stakeholders) · Retrospective (cách team làm). Release planning và burndown KHÔNG bắt buộc.","en":"Sprint ≤ 1 month · Planning · Daily 15' · Review · Retrospective. Release planning and burndown are not required.","src":"02#54, 02#60"},{"w":2,"f":"Kanban","vi":"Taiichi Ohno (Toyota) → David J. Anderson (~2004). Practices: visualize flow, limit WIP, cumulative flow diagram. Không có iteration.","en":"Ohno (Toyota) → Anderson (~2004). Visualize, limit WIP, CFD. No iterations.","src":"02#62-71"},{"w":3,"f":"Project factors & types","vi":"Scope · Time · Budget. Production → product · Investment → benefit · Research → knowledge.","en":"Scope · Time · Budget. Production → product; Investment → benefit; Research → knowledge.","src":"03#4"},{"w":3,"f":"PM vs Engineering Manager vs Team Lead","vi":"PM: scope, schedule, cost, risk, stakeholders. EM: chất lượng kỹ thuật, năng lực team, kiến trúc. TL: điều phối kỹ thuật hằng ngày, giao task.","en":"PM: scope/schedule/cost/risk. EM: technical quality, team capability. TL: daily technical coordination.","src":"03#9"},{"w":3,"f":"4 management activities","vi":"Initiation (feasibility, proposal) → Planning (scope, WBS, estimate, schedule) → Executing (weekly plan, tasks) → Tracking & Control (progress report, issue log, change request).","en":"Initiation → Planning → Executing → Tracking & Control.","src":"03#10"},{"w":3,"f":"WBS","vi":"Chia scope thành work item nhỏ: phase → deliverable → task. Mỗi item phải assign, estimate, track được.","en":"Breaks scope into items that can be assigned, estimated and tracked.","src":"03#17"},{"w":3,"f":"Estimation formulas","vi":"$\\text{Effort} = a \\times \\text{KLOC}^{b}$ · $\\text{Duration} = c \\times \\text{Effort}^{d}$ · $\\text{Cost} = \\text{Effort} \\times$ giá/man-month. LOC phụ thuộc ngôn ngữ; FP độc lập ngôn ngữ.","en":"$\\text{Effort} = a \\times \\text{KLOC}^{b}$ · $\\text{Duration} = c \\times \\text{Effort}^{d}$ · $\\text{Cost} = \\text{Effort} \\times \\text{rate}$. FP is language-independent.","src":"03#21, 03#22"},{"w":3,"f":"Effort ≠ Duration","vi":"24 person-hours, 1 SV × 3h/ngày = 8 ngày; 2 SV ≈ 4 ngày, nhưng thêm người không giảm thời gian tuyến tính.","en":"24 person-hours at 3 h/day = 8 days; more people does not scale linearly.","src":"03#23"},{"w":3,"f":"Agile estimation","vi":"Story points = effort + complexity + uncertainty (Planning Poker, Fibonacci). $\\text{Số sprint} \\approx \\dfrac{\\text{points còn lại}}{\\text{velocity}}$ (120/20 = 6). Không so velocity giữa team.","en":"$\\text{Sprints} \\approx \\dfrac{\\text{remaining points}}{\\text{velocity}}$ (120/20 = 6). Don't compare teams by velocity.","src":"03#24"},{"w":3,"f":"Milestone vs Deliverable","vi":"Milestone: điểm kết thúc một giai đoạn. Deliverable: kết quả giao cho khách/user (Build, alpha, beta, GA).","en":"Milestone: end-point of a period. Deliverable: result delivered to customers.","src":"03#27"},{"w":3,"f":"Critical path","vi":"Chuỗi task phụ thuộc DÀI NHẤT = thời gian tối thiểu. $\\text{Slack} = \\text{LS} - \\text{ES}$; task găng slack = 0. Ví dụ slide: 14 ngày, cả 2 đường đều găng.","en":"LONGEST chain = minimum duration; critical tasks have zero slack. Slide example: 14 days.","src":"03#30, 03#31"},{"w":3,"f":"Risk process & RE","vi":"Identify → Analyze → Plan → Monitor. $\\text{RE} = \\text{Probability} \\times \\text{Loss}$, thang 10/25/50/75/90. Likely × Catastrophic = 75 × 90 = 6,750.","en":"Identify → Analyze → Plan → Monitor. $\\text{RE} = P \\times L$; Likely × Catastrophic = 6,750.","src":"03#35, 03#38-41"},{"w":3,"f":"5 risk types","vi":"Technology · People · Organizational · Requirements · Estimation.","en":"Technology · People · Organizational · Requirements · Estimation.","src":"03#36"},{"w":3,"f":"Risk planning strategies","vi":"Avoidance · Minimization · Contingency plans (dùng khi rủi ro xảy ra) · Risk transfer · Buying information.","en":"Avoidance · Minimization · Contingency · Transfer · Buying information.","src":"03#42"},{"w":4,"f":"Requirement = ?","vi":"Services hệ thống cung cấp + constraints. Chức năng kép: cơ sở cho bid/contract (high level) và cho dev team (detailed).","en":"Services + constraints. Basis for a bid/contract (high level) and for developers (detailed).","src":"04#4"},{"w":4,"f":"3 viewpoints (ATM)","vi":"Interactor: khách hàng + account database. Indirect: quản lý, nhân viên bảo mật. Domain: chuẩn giao tiếp liên ngân hàng.","en":"Interactor: customers + account database. Indirect: management, security. Domain: inter-bank standards.","src":"04#7"},{"w":4,"f":"User vs System requirements","vi":"User: ngôn ngữ tự nhiên, góc nhìn user, high-level. System: tài liệu có cấu trúc, chi tiết, định nghĩa cái cần implement.","en":"User: natural language, high-level. System: structured, detailed, what to implement.","src":"04#9"},{"w":4,"f":"F / NF / Domain","vi":"F: hệ thống phản ứng thế nào. NF: ràng buộc (Product / Organizational / External). Domain: từ lĩnh vực ứng dụng (Z39.50, bản quyền).","en":"F: behavior. NF: constraints (Product / Organizational / External). Domain: from the application domain.","src":"04#12, 04#16, 04#23"},{"w":4,"f":"Verifiable NFR","vi":"Có thước đo kiểm tra khách quan. Ví dụ: dùng được mọi chức năng sau 2 giờ đào tạo; ≤ 2 lỗi/ngày.","en":"Uses an objective measure, e.g. two hours of training, ≤ 2 errors/day.","src":"04#19"},{"w":4,"f":"MoSCoW","vi":"Must: thiếu là release fail · Should: quan trọng, có cách lách · Could: có thì tốt · Won't (this time): thoả thuận bỏ khỏi release này.","en":"Must · Should (workaround exists) · Could · Won't (this time).","src":"04#35"},{"w":4,"f":"Interview vs Observe","vi":"Interview: direct/indirect, open/closed; tốn thời gian khách, khó kiểm soát. Observe: thấy quy trình thật; tốn thời gian dev, có thể làm phiền khách.","en":"Interview costs client time. Observation costs team time and may interfere with the client's business.","src":"04#36, 04#37"},{"w":4,"f":"SRS & standard","vi":"SRS nêu WHAT, không HOW. IEEE 830 (1998) → ISO/IEC/IEEE 29148:2018.","en":"SRS states WHAT not HOW. IEEE 830 → ISO/IEC/IEEE 29148:2018.","src":"04#42, 04#43"},{"w":4,"f":"INVEST + Given/When/Then","vi":"Independent, Negotiable, Valuable, Estimable, Small, Testable. Acceptance criteria dạng Given/When/Then → acceptance test cases.","en":"INVEST; acceptance criteria as Given/When/Then become acceptance tests.","src":"04#46"},{"w":4,"f":"Requirements checking (5)","vi":"Validity · Verifiability · Consistency · Completeness · Realism.","en":"Validity · Verifiability · Consistency · Completeness · Realism.","src":"04#51"},{"w":4,"f":"Validation techniques","vi":"Reviews (phổ biến nhất) · Prototyping · Test-case generation.","en":"Reviews (most common) · Prototyping · Test-case generation.","src":"04#52"},{"w":4,"f":"Change management & traceability","vi":"Change request → analysis & costing → implementation. Traceability matrix: req ↔ use case ↔ design ↔ test → impact analysis, test coverage.","en":"Request → analysis & costing → implementation. Traceability for impact analysis and coverage.","src":"04#57, 04#58"},{"w":5,"f":"UML","vi":"Booch, Rumbaugh, Jacobson (Rational). OMG chuẩn hoá năm 1997.","en":"Booch, Rumbaugh, Jacobson; adopted by OMG in 1997.","src":"05#7"},{"w":5,"f":"Structural vs Behavioral diagrams","vi":"Structural: class, package, object, component, deployment. Behavioral: use case, sequence, communication, state machine, activity.","en":"Structural: class, package, object, component, deployment. Behavioral: use case, sequence, communication, state, activity.","src":"05#8"},{"w":5,"f":"Actor","vi":"Một role tương tác với hệ thống (người, process, thứ khác). 1 người nhiều role; nhiều người cùng role = 1 actor; actor có generalization.","en":"A role; one user can play many roles; same role = one actor; actors can generalize.","src":"05#14"},{"w":5,"f":"Use case & scenario","vi":"Use case: chuỗi hành động tạo giá trị cho actor; WHAT không HOW; 1 basic flow + alternative/exceptional flows. Scenario = 1 instance của use case.","en":"Use case: WHAT not HOW; basic + alternative flows. Scenario = an instance.","src":"05#15-20"},{"w":5,"f":"Include vs Extend","vi":"Include: base BIẾT, included không đứng một mình (Checkout → Payment). Extend: base KHÔNG biết, extending đứng một mình được; mũi tên từ extending → base (Verify shipping address → Checkout).","en":"Include: base aware, included can't stand alone. Extend: base unaware, extending may stand alone; arrow extending → base.","src":"05#22, 05#23"},{"w":5,"f":"UI vs UX · memory","vi":"UI: look & feel của màn hình. UX: toàn bộ trải nghiệm. Trí nhớ ngắn hạn ~4 ± 1 (Miller 7 ± 2).","en":"UI: look & feel. UX: overall experience. Short-term memory ~4 ± 1 (Miller 7 ± 2).","src":"05#29, 05#30"},{"w":5,"f":"6 UI design principles","vi":"User familiarity · Consistency · Minimal surprise · Recoverability · User guidance · User diversity.","en":"Familiarity · Consistency · Minimal surprise · Recoverability · Guidance · Diversity.","src":"05#31-33"},{"w":5,"f":"WCAG POUR","vi":"Perceivable (alt text, tương phản ≥ 4.5:1) · Operable (bàn phím) · Understandable (nhãn rõ) · Robust (semantic HTML). Không dùng mỗi màu sắc.","en":"Perceivable (≥ 4.5:1) · Operable (keyboard) · Understandable · Robust. Never color alone.","src":"05#34"},{"w":5,"f":"5 interaction styles","vi":"Direct manipulation · Menu selection · Form fill-in (nhập liệu) · Command language (học cú pháp) · Natural language.","en":"Direct manipulation · Menu · Form fill-in · Command language · Natural language.","src":"05#36-41"},{"w":5,"f":"UI design process","vi":"User analysis (task analysis, interview, ethnography) → System prototyping (paper → automated) → Interface evaluation (learnability, speed, robustness, recoverability, adaptability).","en":"User analysis → Prototyping (paper → automated) → Evaluation.","src":"05#45-49"},{"w":5,"f":"Error messages & validation","vi":"Thông báo lỗi: polite, concise, consistent, constructive. Data validation: không tin người dùng; natural/business constraints; early/late checking.","en":"Polite, concise, consistent, constructive. Don't trust users; early/late checking.","src":"05#54, 05#57"},{"w":6,"f":"Design levels","vi":"Architectural (cấu trúc tổng thể) → High-level (sub-system, module) → Detailed (cấu trúc dữ liệu, thuật toán). Architectural design là quá trình; software architecture là tài liệu kết quả.","en":"Architectural (overall structure) → High-level (sub-systems, modules) → Detailed (data structures, algorithms). Design = process; architecture = output document.","src":"06#4, 06#6"},{"w":6,"f":"C4 model","vi":"Simon Brown. System Context → Containers → Components → Code. Đồ án: ít nhất Context + Container (PA3).","en":"Simon Brown. System Context → Containers → Components → Code. Project: at least Context + Container (PA3).","src":"06#12"},{"w":6,"f":"Quality attributes & conflicts","vi":"Performance: component lớn · Security: layered, tài sản ở lớp trong · Safety: gom vào ít sub-system · Availability: dự phòng · Maintainability: component nhỏ. Component lớn ↑ performance ↓ maintainability.","en":"Performance: large-grain · Security: layered, assets inside · Safety: few sub-systems · Availability: redundancy · Maintainability: fine-grain. Large-grain ↑ performance ↓ maintainability.","src":"06#16-17"},{"w":6,"f":"ADR","vi":"Architecture Decision Record trong docs/adr/: Title · Status (proposed / accepted / superseded) · Context · Decision · Consequences.","en":"Architecture Decision Record in docs/adr/: Title · Status (proposed / accepted / superseded) · Context · Decision · Consequences.","src":"06#25"},{"w":6,"f":"Repository vs Client-Server","vi":"Repository: một kho trung tâm, chia sẻ dữ liệu lớn, nhưng phải chung một data model, khó phân tán. Client-server: dễ phân tán, dễ thêm server, nhưng không có data model chung, không có registry.","en":"Repository: one central store, shares large data, but one data model and hard to distribute. Client-server: easy distribution and new servers, but no shared model or central register.","src":"06#35, 06#38"},{"w":6,"f":"Layered & MVC","vi":"Layered: đổi interface chỉ ảnh hưởng lớp kề bên; separation of concerns nhưng chậm. MVC: Model = dữ liệu + logic, View = trình bày, Controller = nhận lệnh.","en":"Layered: an interface change only affects the adjacent layer; separation of concerns but slower. MVC: Model = data + logic, View = presentation, Controller = commands.","src":"06#40-43"},{"w":6,"f":"Pipes & Filters · Interrupt-driven","vi":"Pipes & filters: filter xử lý độc lập, dữ liệu qua pipe; cần định dạng chung, khó event-based. Interrupt-driven: real-time, mỗi interrupt một handler; nhanh nhưng khó lập trình và validate.","en":"Pipes & filters: independent filters, data via pipes; common format, hard for events. Interrupt-driven: real-time, one handler per type; fast but hard to program and validate.","src":"06#47-51"},{"w":6,"f":"SOA · Microservices · Event-driven","vi":"SOA: modularity, interoperability, reusability, loose coupling. Microservices: autonomy, resilience, scalability, flexibility; nhóm nhỏ nên bắt đầu bằng modular monolith. Event-driven: producer → broker (Kafka, RabbitMQ) → consumers; eventual consistency.","en":"SOA: modularity, interoperability, reusability, loose coupling. Microservices: autonomy, resilience, scalability, flexibility; small teams start with a modular monolith. Event-driven: producer → broker → consumers; eventual consistency.","src":"06#52-56"},{"w":7,"f":"Class notation","vi":"Ba ngăn: tên · attributes · operations. Kiểu sau dấu \":\". Visibility: + public, - private, # protected. Interface: hình tròn hoặc <<interface>>.","en":"Three compartments: name · attributes · operations. Type after \":\". Visibility: + public, - private, # protected. Interface: circle or <<interface>>.","src":"07#4-7"},{"w":7,"f":"Class relationships","vi":"Dependency: dùng tạm, nét đứt, lỏng nhất. Generalization: tam giác rỗng chỉ vào superclass. Association: đường liền, có tên và role. Multiplicity: 1, 0..1, 0..*, 1..*.","en":"Dependency: uses, dashed, least restrictive. Generalization: hollow triangle to the superclass. Association: solid line with name and roles. Multiplicity: 1, 0..1, 0..*, 1..*.","src":"07#9-13"},{"w":7,"f":"Composition vs Aggregation","vi":"Composition: mạnh, sở hữu và quyết định vòng đời, thoi đặc (University ◆— Faculty). Aggregation: yếu, dùng không sở hữu, thoi rỗng (Faculty ◇— Lecturer).","en":"Composition: strong, owns the lifetime, filled diamond (University ◆— Faculty). Aggregation: weak, uses without owning, hollow diamond (Faculty ◇— Lecturer).","src":"07#14"},{"w":7,"f":"BCE","vi":"Boundary: màn hình, form, API. Control: điều phối một use case. Entity: dữ liệu nghiệp vụ lâu dài. Boundary + control = system object; entity = domain object. Actor chỉ nói với boundary.","en":"Boundary: screens, forms, APIs. Control: coordinates one use case. Entity: long-lived business data. Boundary + control = system objects; entity = domain object. Actors talk only to boundaries.","src":"07#17-18"},{"w":7,"f":"Sequence diagram","vi":"Lifeline, message (sync, async, return), activation bar, fragment (alt = if/else, opt = if, loop, par). Một sơ đồ cho mỗi scenario quan trọng; mỗi message → một operation.","en":"Lifelines, messages (sync, async, return), activation bars, fragments (alt = if/else, opt = if, loop, par). One per important scenario; every message → an operation.","src":"07#21-22"},{"w":7,"f":"SOLID","vi":"S: một lý do để đổi · O: mở để mở rộng, đóng để sửa · L: subtype thay được base · I: nhiều interface nhỏ · D: phụ thuộc abstraction. Low coupling + high cohesion.","en":"S: one reason to change · O: open to extend, closed to modify · L: subtypes replace the base · I: many small interfaces · D: depend on abstractions. Low coupling + high cohesion.","src":"07#28-29"},{"w":7,"f":"Design patterns","vi":"Creational: tạo object. Structural: ghép class. Behavioral: tương tác. Giá theo loại khách → Strategy; tạo đúng loại thanh toán → Factory Method; báo nhiều kênh → Observer; API khác interface → Adapter; lối vào đơn giản → Facade.","en":"Creational: creation. Structural: composition. Behavioral: interaction. Pricing rules → Strategy; payment object → Factory Method; notify channels → Observer; foreign API → Adapter; simple entry → Facade.","src":"07#31-33"},{"w":7,"f":"Class → table mapping","vi":"Entity class → bảng, identity → PK. 1–n → FK phía n. n–n → junction table. Composition → FK NOT NULL + ON DELETE CASCADE. Chuẩn hoá 3NF, hash mật khẩu, migration trong Git.","en":"Entity class → table, identity → PK. 1–n → FK on the n side. n–n → junction table. Composition → FK NOT NULL + ON DELETE CASCADE. 3NF, hashed passwords, migrations in Git.","src":"07#36-40"}],"maps":{"1":{"vi":{"t":"Bài 1 · SE Introduction","c":[{"t":"Software","c":[{"t":"= **programs + documentation**","c":[]},{"t":"Loại sản phẩm","c":[{"t":"**Generic**: bán cho nhiều khách","c":[]},{"t":"**Custom**: một khách, theo spec của họ","c":[]}]},{"t":"3 cách tạo: **viết mới · cấu hình generic · reuse**","c":[]},{"t":"Vai trò: kinh tế mọi nước phát triển phụ thuộc phần mềm","c":[]}]},{"t":"Software tốt (4 thuộc tính)","c":[{"t":"**Maintainability** **: undo, xác nhận","c":[]},{"t":"**User guidance**: feedback, help","c":[]},{"t":"**User diversity**","c":[]}]},{"t":"Accessibility (WCAG 2.2)","c":[{"t":"**POUR**","c":[{"t":"Perceivable: alt text, tương phản **≥ 4.5:1**","c":[]},{"t":"**Operable: bàn phím**, vùng bấm lớn","c":[]},{"t":"Understandable: nhãn rõ","c":[]},{"t":"Robust: semantic HTML, screen reader","c":[]}]},{"t":"**Không dùng mỗi màu sắc**","c":[]},{"t":"Mobile-first · Lighthouse, axe","c":[]}]},{"t":"Tương tác & trình bày","c":[{"t":"5 interaction styles","c":[{"t":"**Direct manipulation**: thấy kết quả ngay","c":[]},{"t":"**Menu selection**","c":[]},{"t":"**Form fill-in**: nhập dữ liệu","c":[]},{"t":"**Command language**: phải học cú pháp","c":[]},{"t":"**Natural language**","c":[]}]},{"t":"**Digital**: chính xác · **Analogue**: tương đối","c":[]},{"t":"Data visualization: xu hướng, quan hệ","c":[]}]},{"t":"UI process & guidelines","c":[{"t":"**User analysis → Prototyping → Evaluation**","c":[{"t":"Analysis: task analysis, interview, **ethnography**","c":[]},{"t":"Prototype: **paper → automated** (Figma)","c":[]},{"t":"Screen list (từ use cases) → diagram → design → spec","c":[]},{"t":"Evaluate: learnability, speed, robustness, recoverability, adaptability","c":[]}]},{"t":"Error message: **polite · concise · consistent · constructive**","c":[]},{"t":"**Do not trust users**: natural/business constraints · early/late checking","c":[]}]}]},"en":{"t":"Lecture 5 · Use Case & UI/UX","c":[{"t":"Modeling & UML","c":[{"t":"Model = **simplification from one perspective**","c":[]},{"t":"Languages: **UML · C4 · BPMN · SysML**","c":[]},{"t":"UML: **Booch, Rumbaugh, Jacobson** · **OMG 1997**","c":[]},{"t":"**Structural**: class, package, object, component, deployment","c":[]},{"t":"**Behavioral**: **use case**, sequence, communication, state, activity","c":[]}]},{"t":"Use case diagram","c":[{"t":"**Actors · Use cases · Relationships**","c":[]},{"t":"Widely used to communicate **FRs**","c":[]},{"t":"**Actor = role**","c":[{"t":"1 person, many roles · many people, 1 role","c":[]},{"t":"Actors can have generalization","c":[]}]},{"t":"Use case: a result **of value to the actor**","c":[]},{"t":"**WHAT not HOW**, hides internals","c":[]},{"t":"Spec: ID, actors, **pre/postconditions**, main + alternative + exception flows","c":[]},{"t":"**Scenario = instance** of a use case","c":[]}]},{"t":"Relationships","c":[{"t":"**Association**: actor ↔ use case","c":[]},{"t":"**Generalization**: general ↔ specific use case","c":[]},{"t":"**Include**","c":[{"t":"Base **is aware**, calls it explicitly","c":[]},{"t":"Included **does not stand alone**","c":[]},{"t":"Checkout order → Payment","c":[]}]},{"t":"**Extend**","c":[{"t":"Base **is not aware**","c":[]},{"t":"Extending **may stand alone**","c":[]},{"t":"Arrow **extending → base**","c":[]}]},{"t":"Common → include · Variation → extend","c":[]}]},{"t":"UI basics","c":[{"t":"Interface: **UI** (people) · **API** (systems)","c":[]},{"t":"Users judge a system by its **interface**","c":[]},{"t":"**UI**: look & feel · **UX**: the whole experience","c":[]},{"t":"Short-term memory **4 ± 1** (Miller 7 ± 2)","c":[]}]},{"t":"6 UI principles","c":[{"t":"**User familiarity**: familiar terms","c":[]},{"t":"**Consistency**: same operations, same way","c":[]},{"t":"**Minimal surprise**","c":[]},{"t":"**Recoverability**: undo, confirmation","c":[]},{"t":"**User guidance**: feedback, help","c":[]},{"t":"**User diversity**","c":[]}]},{"t":"Accessibility (WCAG 2.2)","c":[{"t":"**POUR**","c":[{"t":"Perceivable: alt text, contrast **≥ 4.5:1**","c":[]},{"t":"**Operable: keyboard**, large tap targets","c":[]},{"t":"Understandable: clear labels","c":[]},{"t":"Robust: semantic HTML, screen readers","c":[]}]},{"t":"**Never color alone**","c":[]},{"t":"Mobile-first · Lighthouse, axe","c":[]}]},{"t":"Interaction & presentation","c":[{"t":"5 interaction styles","c":[{"t":"**Direct manipulation**: see results immediately","c":[]},{"t":"**Menu selection**","c":[]},{"t":"  **rationale** · alternatives · implications","c":[]},{"t":"**7 câu hỏi**: generic arch · phân tán · style · module · control · đánh giá · tài liệu","c":[]},{"t":"**ADR** trong docs/adr/","c":[{"t":"Title · **Status** · Context · Decision · Consequences","c":[]},{"t":"proposed · accepted · **superseded**","c":[]}]}]},{"t":"Style: chia sẻ & phân tán","c":[{"t":"Style = **high-level**, cả hệ thống · Pattern = **micro**","c":[]},{"t":"Mô tả: **Problem · Context · Solution**","c":[]},{"t":"**Repository**: kho dữ liệu **trung tâm**","c":[{"t":"✔ chia sẻ dữ liệu lớn · quản lý tập trung","c":[]},{"t":"✘ **một data model chung** · khó phân tán","c":[]}]},{"t":"**Client-Server**: server + client + **mạng**","c":[{"t":"✔ dễ phân tán · dễ thêm server","c":[]},{"t":"✘ **không có data model chung** · không có registry","c":[]}]},{"t":"**P2P**: node vừa client vừa server","c":[{"t":"✘ khó bảo mật, khó nhất quán","c":[]}]}]},{"t":"Style: cấu trúc & luồng","c":[{"t":"**Layered**: đổi interface → chỉ **lớp kề bên**","c":[{"t":"✘ cứng nhắc · **chậm** qua nhiều lớp","c":[]}]},{"t":"**MVC**: Model (dữ liệu, logic) · View (trình bày) · Controller (nhận lệnh)","c":[]},{"t":"**Pipes & Filters**: filter xử lý độc lập, dữ liệu qua **pipe**","c":[{"t":"✘ cần **định dạng chung** · khó **event-based**","c":[]}]},{"t":"**Interrupt-driven**: **real-time**, mỗi interrupt một **handler**","c":[{"t":"✘ khó lập trình, **khó validate**","c":[]}]}]},{"t":"Service & event","c":[{"t":"**SOA**: modularity · interoperability · reusability · **loose coupling**","c":[]},{"t":"**Microservices**: autonomy · resilience · scalability · flexibility","c":[{"t":"✘ phân tán phức tạp · nhất quán dữ liệu · cần **DevOps**","c":[]},{"t":"Nhóm nhỏ → **modular monolith** trước","c":[]}]},{"t":"**Event-driven**: producer → **broker** (Kafka, RabbitMQ) → consumers","c":[{"t":"✘ khó debug · **eventual consistency**","c":[]}]}]}]},"en":{"t":"Lecture 6 · Architectural Design","c":[{"t":"Design & architecture","c":[{"t":"3 lev

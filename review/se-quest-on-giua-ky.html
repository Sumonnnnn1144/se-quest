    else if (tab === 'mindmap') renderMindmap(pane, DATA.maps[view.w][S.lang]);
    else if (tab === 'quiz') renderQuizHub(pane, view.w);
    else renderCards(pane, cards);
  }

  function renderQuizHub(pane, w) {
    const tot = byW(w).length, left = unseen(w).length, done = tot - left, k = batchN(left), bugs = worldBugs(w).length;
    pane.innerHTML = `
      <div class="qhub">
        <div class="qstat">
          <span class="hud-label" style="color:var(--gold)">${esc(t('round', S.round[w] || 1))}</span>
          <p style="margin:0;font-weight:800;font-size:18px">${esc(t('leftOf', left, tot))}</p>
          <div class="cover" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${done}" aria-label="${esc(t('doneOf', done, tot))}"><i style="width:${(done / tot * 100).toFixed(1)}%"></i></div>
          <p class="note">${esc(t('doneOf', done, tot))}</p>
        </div>
        ${left ? '' : `<p style="margin:0;font-weight:800;color:var(--good)">✔ ${esc(t('bankDone'))}</p>`}
        <div class="modes">
          ${left
            ? `<button class="mode primary" id="qnext"><h3>${esc(k === left ? t('lastBatch', k) : t('nextBatch', k))}</h3><small>${esc(t('nextBatchDesc'))}</small></button>
               ${left > k ? `<button class="mode" id="qall"><h3>${esc(t('allLeft', left))}</h3><small>${esc(t('allLeftDesc'))}</small></button>` : ''}`
            : `<button class="mode primary" id="qround"><h3>${esc(t('newRound'))}</h3><small>${esc(t('newRoundDesc'))}</small></button>`}
          ${bugs ? `<button class="mode" id="qbugs"><h3>${esc(t('worldBugs', bugs))}</h3><small>${esc(t('worldBugsDesc'))}</small></button>` : ''}
        </div>
        <p class="note">${esc(t('hubNote'))}</p>
      </div>`;
    const on = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
    on('#qnext', () => startWorldRun(w));
    on('#qall', () => startWorldRun(w, true));
    on('#qround', () => { newRound(w); render(); });
    on('#qbugs', () => startReview(w));
  }

  // ---------- learn ----------
  function renderLearn(pane, w) {
    const secs = DATA.lessons[w], open = openLevel(w);
    const i = Math.min(view.sec ?? (open < secs.length ? open : 0), Math.min(open, secs.length - 1)), s = secs[i];
    const done = secs.filter(x => S.read[x.id]).length, passed = !!S.read[s.id];
    const qs = DATA.checks[s.id], need = checkNeed(qs.length), best = S.chk[s.id];
    pane.innerHTML = `
      <div class="learn">
        <div class="lvls" aria-label="Levels">${secs.map((x, k) => k > open
          ? `<button class="lv lock" disabled title="${esc(t('lockedTip'))}">🔒 ${x.id}</button>`
          : `<button class="lv${S.read[x.id] ? ' ok' : ''}" data-sec="${k}" aria-current="${k === i}" title="${esc(x.t[S.lang])}">${S.read[x.id] ? '✔ ' : ''}${x.id}</button>`).join('')}</div>
        <p class="note">${esc(t('readOf', done, secs.length))}</p>
        <div><span class="hud-label" style="color:var(--gold)">LEVEL ${s.id}</span><h3 class="lt">${esc(s.t[S.lang])}</h3></div>
        ${s.cards.map(c => {
          const ctx = gctx();
          const fig = c.fig ? `<figure class="fig">${DATA.figures[c.fig][S.lang]}<figcaption>${esc(t('figCap', c.src))}</figcaption></figure>` : '';
          return `<article class="lc${c.real ? ' real' : ''}">
            ${c.real ? `<span class="tag gold">${esc(t('real'))}</span>` : ''}
            ${fig}<div class="prose">${blocks(c[S.lang], ctx)}</div>${c.svg ? `<div class="svgfig">${SVG[c.svg]()}</div>` : ''}
            <span class="src">${esc(c.real ? t('relates') : t('src'))}: ${esc(c.src)}</span>
          </article>`; }).join('')}
        <div class="chk${passed ? ' ok' : ''}">
          <div>
            <span class="hud-label" style="color:${passed ? 'var(--good)' : 'var(--gold)'}">${passed ? '✔ ' + esc(t('passedTag')) : '⚡ ' + esc(t('chkTag'))}</span>
            <p style="margin:4px 0 0">${esc(t('chkRule', need, qs.length))}${best != null ? ' · ' + esc(t('chkBest', best, qs.length)) : ''}</p>
          </div>
          <button class="pbtn${passed ? ' ghost' : ''}" id="lcheck">${esc(passed ? t('chkRetry') : t('chkBtn', qs.length))}</button>
        </div>
        <div class="lnav">
          <button class="pbtn ghost" id="lprev" ${i === 0 ? 'disabled' : ''}>◀ ${esc(t('prevLv'))}</button>
          ${i < secs.length - 1
            ? `<button class="pbtn${passed ? '' : ' ghost'}" id="lnext" ${passed ? '' : 'disabled title="' + esc(t('lockedTip')) + '"'}>${passed ? '' : '🔒 '}${esc(t('nextLv'))} ▶</button>`
            : `<button class="pbtn${passed ? '' : ' ghost'}" id="lquiz">${esc(t('toWorldQuiz'))}</button>`}
        </div>
      </div>`;
    const goSec = k => { view.sec = k; render(); $('#pane').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); };
    pane.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => goSec(+b.dataset.sec));
    $('#lprev').onclick = () => goSec(i - 1);
    const nx = $('#lnext'); if (nx && passed) nx.onclick = () => goSec(i + 1);
    const lq = $('#lquiz'); if (lq) lq.onclick = () => go({ name: 'world', w, tab: 'quiz' });
    $('#lcheck').onclick = () => startCheck(w, i);
  }

  // ---------- mindmap ----------
  let mmLib = null;
  const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const markmapLib = () => mmLib || (mmLib = loadScript('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js')
    .then(() => loadScript('https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js'))
    .then(() => window.markmap).catch(e => { mmLib = null; throw e; }));
  const mmMode = () => S.mmView || (matchMedia('(min-width: 761px)').matches ? 'graph' : 'list');

  function renderMindmap(pane, tree) {
    const mode = mmMode();
    pane.innerHTML = `
      <div class="mmbar">
        <div class="seg" role="group" aria-label="${esc(t('mindmap'))}">
          <button class="pbtn" data-mm="graph" aria-pressed="${mode === 'graph'}">${esc(t('graph'))}</button>
          <button class="pbtn" data-mm="list" aria-pressed="${mode === 'list'}">${esc(t('list'))}</button>
        </div>
        <span id="mmtools"></span>
      </div>
      <div id="mmbody"></div>`;
    pane.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => { S.mmView = b.dataset.mm; save(); renderMindmap(pane, tree); });
    (mode === 'graph' ? renderGraph : renderTree)($('#mmbody'), $('#mmtools'), tree);
  }

  async function renderGraph(body, tools, tree) {
    tools.innerHTML = `<button class="pbtn ghost" id="mmfit">${esc(t('fit'))}</button>`;
    body.innerHTML = `<div class="mmg"><svg id="mmsvg" aria-label="${esc(tree.t)}"></svg><p class="note" id="mmmsg">${esc(t('mmLoading'))}</p></div><p class="note">${esc(t('mmHint'))}</p>`;
    let lib;
    try { lib = await markmapLib(); } catch (e) { $('#mmmsg').textContent = t('mmFail'); return; }
    const svg = $('#mmsvg'); if (!svg) return;
    $('#mmmsg').remove();
    const palette = ['--gold', '--good', '--rare', '--legend', '--bad', '--edge'].map(css);
    const toMM = n => ({ content: md(n.t), children: n.c.map(toMM) });
    const mm = lib.Markmap.create(svg, {
      duration: reduce ? 0 : 400, initialExpandLevel: 3, maxWidth: 280, paddingX: 10, spacingVertical: 8, autoFit: false,
      color: n => palette[(+String(n.state?.path || '').split('.')[1] || 0) % palette.length],
    }, toMM(tree));
    $('#mmfit').onclick = () => mm.fit();
  }

  function renderTree(body, tools, tree) {
    const ctx = gctx();
    const node = (n, depth) => n.c.length
      ? `<li><details open><summary>${md(n.t, ctx)}</summary><ul>${n.c.map(k => node(k, depth + 1)).join('')}</ul></details></li>`
      : `<li class="leaf"><span tabindex="-1">${md(n.t, ctx)}</span></li>`;
    tools.innerHTML = `
        <button class="pbtn" id="mmtest" aria-pressed="false">${esc(t('selfTest'))}</button>
        <button class="pbtn ghost" id="mmfold">${esc(t('collapse'))}</button>`;
    body.innerHTML = `
      <p class="note" id="mmhint" hidden style="margin:0 0 12px">${esc(t('tapReveal'))}</p>
      <div class="mm" id="mm"><p class="root">${md(tree.t)}</p><ul>${tree.c.map(k => node(k, 1)).join('')}</ul></div>`;
    const mm = $('#mm'), tb = $('#mmtest'), fb = $('#mmfold');
    tb.onclick = () => {
      const on = !mm.classList.contains('test');
      mm.classList.toggle('test', on); tb.setAttribute('aria-pressed', String(on));
      tb.textContent = on ? t('showAll') : t('selfTest'); $('#mmhint').hidden = !on;
      mm.querySelectorAll('.leaf > span').forEach(s => { s.classList.remove('show'); s.tabIndex = on ? 0 : -1; s.setAttribute('role', on ? 'button' : 'presentation'); });
    };
    mm.addEventListener('click', e => { const s = e.target.closest('.leaf > span'); if (s && mm.classList.contains('test')) s.classList.toggle('show'); });
    mm.addEventListener('keydown', e => { const s = e.target.closest('.leaf > span'); if (s && (e.key === 'Enter' || e.key === ' ') && mm.classList.contains('test')) { e.preventDefault(); s.classList.toggle('show'); } });
    let open = true;
    fb.onclick = () => { open = !open; mm.querySelectorAll('ul details').forEach(d => d.open = open); fb.textContent = open ? t('collapse') : t('expand'); };
  }

  function renderCards(pane, cards) {
    const st = fcState[view.w] || (fcState[view.w] = { order: cards.map((_, i) => i), i: 0 });
    const c = cards[st.order[st.i]];
    pane.innerHTML = `
      <div class="fc">
        <span class="hud-label">${st.i + 1} / ${cards.length}</span>
        <button class="flip" id="flip" aria-label="${esc(t('flip'))}">
          <span class="in">
            <span class="face front"><span class="hud-label" style="color:var(--gold)">WORLD ${view.w}</span><p>${md(c.f)}</p><span class="src">${esc(t('flip'))} ↻</span></span>
            <span class="face back"><p>${md(S.lang === 'en' ? c.en : c.vi)}</p><span class="src">${esc(t('src'))}: ${esc(c.src)}</span></span>
          </span>
        </button>
        <div class="fcnav">
          <button class="pbtn ghost" id="fprev" ${st.i === 0 ? 'disabled' : ''}>◀ ${esc(t('prev'))}</button>
          <button class="pbtn" id="fflip">${esc(t('flip'))}</button>
          <button class="pbtn ghost" id="fnext" ${st.i === cards.length - 1 ? 'disabled' : ''}>${esc(t('next'))} ▶</button>
          <button class="pbtn ghost" id="fshuf">${esc(t('shuf'))}</button>
        </div>
      </div>`;
    const flip = () => $('#flip').classList.toggle('on');
    $('#flip').onclick = flip; $('#fflip').onclick = flip;
    $('#fprev').onclick = () => { st.i--; renderCards(pane, cards); };
    $('#fnext').onclick = () => { st.i++; renderCards(pane, cards); };
    $('#fshuf').onclick = () => { st.order = shuffle(st.order); st.i = 0; renderCards(pane, cards); };
  }

  // ---------- quiz runs ----------
  const mkRun = (kind, qs, extra = {}) => ({ kind, items: qs.map(q => ({ q, order: shuffle([0, 1, 2, 3]), pick: null })), i: 0, locked: false, ...extra });
  function startWorldRun(w, all) {
    const pool = unseen(w);
    if (!pool.length) return go({ name: 'world', w, tab: 'quiz' });
    run = mkRun('world', shuffle(pool).slice(0, all ? pool.length : batchN(pool.length)), { w });
    go({ name: 'run' });
  }
  function newRound(w) { S.seen[w] = []; S.round[w] = (S.round[w] || 1) + 1; save(); }
  function startReview(w) {
    const pool = (w ? worldBugs(w) : S.wrong).map(id => QBYID[id]).filter(Boolean);
    run = mkRun('review', shuffle(pool).slice(0, RUN_N), w ? { w } : {}); go({ name: 'run' });
  }
  function startCheck(w, sec) {
    const lv = DATA.lessons[w][sec].id;
    run = mkRun('check', shuffle(DATA.checks[lv]), { w, lv, sec }); go({ name: 'run' });
  }
  const backFromRun = () => run.kind === 'check' ? go({ name: 'world', w: run.w, tab: 'learn', sec: run.sec })
    : run.w ? go({ name: 'world', w: run.w, tab: 'quiz' }) : go({ name: 'map' });
  function startExam() {
    const qs = shuffle(Object.entries(EXAM_N).flatMap(([w, n]) => shuffle(byW(+w)).slice(0, n)));
    run = mkRun('exam', qs, { deadline: Date.now() + EXAM_MIN * 60e3 });
    go({ name: 'run' });
    timerId = setInterval(tick, 1000);
  }
  function tick() {
    if (!run || run.kind !== 'exam' || view.name !== 'run') return clearInterval(timerId);
    const ms = run.deadline - Date.now(), el = $('#timer');
    if (ms <= 0) { clearInterval(timerId); toast(t('timeUp')); return finishRun(); }
    if (el) { const m = Math.floor(ms / 6e4), s = Math.floor(ms / 1e3) % 60; el.textContent = `${m}:${String(s).padStart(2, '0')}`; el.classList.toggle('low', ms < 5 * 6e4); }
  }

  function renderRun() {
    const it = run.items[run.i], q = it.q, n = run.items.length, exam = run.kind === 'exam';
    const title = run.kind === 'check' ? `Level ${run.lv} · ${t('chk')}` : run.kind === 'world' ? `W${run.w} · ${t('quiz')}` : run.kind === 'exam' ? t('exam') : (run.w ? `W${run.w} · ` : '') + t('review');
    const answered = it.pick !== null && !exam, ctx = exam ? null : gctx();
    app.innerHTML = `
      <div style="display:grid;gap:16px">
      <div class="crumb"><button class="pbtn ghost" id="quit">◀ ${esc(run.kind === 'check' ? t('backLesson') : run.w ? t('backWorld') : t('toMap'))}</button><span class="hud-label muted">${esc(title)}</span></div>
      <div class="box">
        <div class="qhead">
          <span class="hud-label" style="color:var(--gold)">${esc(t('qn', run.i + 1, n))} · ${esc(q.src.slice(0, 2))}</span>
          ${exam ? '<span class="timer" id="timer">--:--</span>' : ''}
        </div>
        <div class="hp" aria-hidden="true" style="margin-bottom:16px">${run.items.map((x, k) => {
          const cls = k === run.i ? 'cur' : x.pick === null ? '' : exam ? 'ans' : (x.pick === x.q.a ? 'ok' : 'no');
          return `<i class="${cls}"></i>`; }).join('')}</div>
        <p class="q" lang="en">${md(q.q, q.ng ? null : ctx)}</p>
        <div class="opts">${it.order.map((oi, k) => {
          let cls = '', mark = '';
          if (answered) {
            if (oi === q.a) { cls = 'right'; mark = `<span class="mark">✔ ${t('right')}</span>`; }
            else if (oi === it.pick) { cls = 'wrong'; mark = `<span class="mark">✘ ${t('wrongM')}</span>`; }
          } else if (exam && oi === it.pick) cls = 'pick';
          return `<button class="opt ${cls}" data-oi="${oi}" lang="en" ${answered ? 'disabled' : ''}><span class="l">${'ABCD'[k]}</span>${md(q.o[oi])}${mark}</button>`; }).join('')}
        </div>
        ${answered ? `<div class="explain">${md(S.lang === 'en' ? q.en : q.vi, ctx)}<br><span class="src">${esc(t('src'))}: ${esc(q.src)}</span></div>` : ''}
        <div class="qfoot">
          <span class="src">${exam && it.pick === null ? esc(t('pickFirst')) : ''}</span>
          ${answered || exam ? `<button class="pbtn" id="nextq" ${exam && it.pick === null ? 'disabled' : ''}>${esc(run.i === n - 1 ? (exam ? t('submit') : t('finish')) : t('nextQ'))}<span class="kbd" aria-hidden="true">Enter</span></button>` : ''}
        </div>
      </div>
      </div>`;
    $('#quit').onclick = () => { clearInterval(timerId); backFromRun(); };
    app.querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => answer(+b.dataset.oi));
    const nx = $('#nextq'); if (nx) nx.onclick = () => { if (run.i === n - 1) finishRun(); else { run.i++; renderRun(); } };
    if (exam) tick();
    const focusEl = answered ? $('#nextq') : null; if (focusEl) focusEl.focus({ preventScroll: true });
  }

  function answer(oi) {
    const it = run.items[run.i], q = it.q;
    if (run.kind === 'exam') { it.pick = oi; return renderRun(); }
    it.pick = oi;
    if (run.kind === 'world') { const s = S.seen[run.w] || (S.seen[run.w] = []); if (!s.includes(q.id)) { s.push(q.id); save(); } }
    const ok = oi === q.a;
    if (ok) {
      addXP(run.kind === 'world' ? 10 : 5);
      if (run.kind === 'review' && S.wrong.includes(q.id)) { S.wrong = S.wrong.filter(id => id !== q.id); save(); toast(`${t('squashed')} ${t('bugsLeft', S.wrong.length)}`); }
    } else if (!S.wrong.includes(q.id)) { S.wrong.push(q.id); save(); }
    renderRun();
  }

  // Enter goes to the next question even after focus has left the button (tapped a term, clicked the page).
  // A control reached with Tab keeps its own Enter; held Enter does not skip questions.
  // (:focus-visible can't tell: Chrome turns it on by the time Enter's keydown arrives.)
  let tabNav = false;
  document.addEventListener('pointerdown', () => { tabNav = false; }, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Tab') { tabNav = true; return; }
    if (e.key !== 'Enter' || e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const nx = $('#nextq');
    if (!nx || nx.disabled) return;
    const el = e.target.closest && e.target.closest('button, a, input, textarea, select, [tabindex]');
    if (el === nx || (el && tabNav)) return;
    e.preventDefault(); hideGl(); nx.click();
  });

  function finishRun() {
    clearInterval(timerId);
    const items = run.items, n = items.length;
    if (run.kind === 'exam') items.forEach(it => {
      if (it.pick === it.q.a) S.xp += 10;
      else if (!S.wrong.includes(it.q.id)) S.wrong.push(it.q.id);
    });
    const correct = items.filter(it => it.pick === it.q.a).length, pct = Math.round(correct / n * 100);
    const pass = run.kind === 'check' ? correct >= checkNeed(n) : correct / n >= PASS;
    let reward = null, first = false;
    if (run.kind === 'check') {
      S.chk[run.lv] = Math.max(S.chk[run.lv] || 0, correct);
      if (pass && !S.read[run.lv]) { S.read[run.lv] = true; S.xp += 15; first = true; }
    }
    const short = run.kind === 'world' && n < MIN_RUN;
    if (run.kind === 'world') {
      S.best[run.w] = Math.max(S.best[run.w] || 0, pct);
      if (pass && !short) { S.passes[run.w] = (S.passes[run.w] || 0) + 1; if (!S.cards.includes('w' + run.w)) { S.cards.push('w' + run.w); S.xp += 50; reward = { c: WORLDS[run.w - 1].card, r: 'RARE', title: t('levelClear'), xp: 50 }; } }
    }
    if (run.kind === 'exam' && pass) { S.xp += 150; reward = { c: BOSS.card, r: 'LEGENDARY', title: t('examClear'), xp: 150, first: !S.cards.includes('boss') }; if (!S.cards.includes('boss')) S.cards.push('boss'); }
    save(); renderHud();
    view = { name: 'result', res: { kind: run.kind, w: run.w, lv: run.lv, sec: run.sec, correct, n, pct, pass, short, first } };
    render(); window.scrollTo({ top: 0 });
    if (first) toast(t('lvClear', run.lv) + ' ' + t('xp', 15));
    if (reward) showReward(reward);
  }

  function renderResult() {
    const r = view.res, items = run.items, wrongs = items.filter(it => it.pick !== it.q.a);
    const chk = r.kind === 'check', last = chk && r.sec === DATA.lessons[r.w].length - 1;
    const msg = chk ? (r.pass ? (r.first ? t('chkPass') : t('chkPassAgain')) : t('chkFail', checkNeed(r.n), r.n))
      : r.short ? t('tooShort') : r.pass ? (r.kind === 'exam' ? t('examPass') : t('passMsg')) : t('failMsg');
    const left = r.kind === 'world' ? unseen(r.w).length : 0;
    const againLabel = r.kind !== 'world' ? t('retry') : left ? (batchN(left) === left ? t('lastBatch', left) : t('nextBatch', batchN(left))) : t('newRound');
    app.innerHTML = `
      <div class="result">
      <div class="box" style="display:grid;gap:10px">
        <span class="hud-label" style="color:var(--gold)">${esc(t('result'))} · ${chk ? 'LEVEL ' + r.lv : r.kind === 'world' ? 'W' + r.w : r.kind === 'exam' ? 'EXAM' : 'BUG HUNT'}</span>
        ${chk && r.pass ? `<p class="clear-t lvclear">${esc(t('lvClear', r.lv))}</p>` : ''}
        <p class="score">${r.pct}%</p>
        <p style="margin:0;font-weight:800">${r.correct}/${r.n} · ${esc(msg)}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
          ${chk ? (r.pass
            ? `<button class="pbtn" id="cnext">${esc(last ? t('toWorldQuiz') : t('nextLv') + ' ▶')}</button><button class="pbtn ghost" id="cread">${esc(t('backLesson'))}</button>`
            : `<button class="pbtn" id="cread">${esc(t('readAgain'))}</button><button class="pbtn ghost" id="again">${esc(t('chkRetry'))}</button>`)
          : `<button class="pbtn" id="again">${esc(againLabel)}</button>`}
          ${r.w && !chk ? `<button class="pbtn ghost" id="toworld">${esc(t('backWorld'))}</button>` : ''}
          <button class="pbtn ghost" id="tomap">${esc(t('toMap'))}</button>
        </div>
      </div>
      <h2>${esc(t('wrongList'))}</h2>
      <div class="wrongs">${wrongs.length ? wrongs.map(it => `
        <div class="box">
          <p lang="en" style="font-weight:700">${md(it.q.q, gctx())}</p>
          ${it.pick !== null ? `<p lang="en">✘ ${md(it.q.o[it.pick])}</p>` : ''}
          <p lang="en" style="color:var(--good);font-weight:700">✔ ${esc(t('ans'))}: ${md(it.q.o[it.q.a])}</p>
          <p style="color:var(--panel-muted)">${md(S.lang === 'en' ? it.q.en : it.q.vi, gctx())} <span class="src">· ${esc(it.q.src)}</span></p>
        </div>`).join('') : `<p class="muted">${esc(t('noWrong'))}</p>`}
      </div>
      </div>`;
    const cn = $('#cnext'); if (cn) cn.onclick = () => last ? go({ name: 'world', w: r.w, tab: 'quiz' }) : go({ name: 'world', w: r.w, tab: 'learn', sec: r.sec + 1 });
    const cr = $('#cread'); if (cr) cr.onclick = () => go({ name: 'world', w: r.w, tab: 'learn', sec: r.sec });
    const ag = $('#again'); if (ag) ag.onclick = () => {
      if (chk) return startCheck(r.w, r.sec);
      if (r.kind === 'world') { if (!left) newRound(r.w); return startWorldRun(r.w); }
      if (r.kind === 'exam') return startExam();
      const pool = r.w ? worldBugs(r.w) : S.wrong;
      pool.length ? startReview(r.w) : (r.w ? go({ name: 'world', w: r.w, tab: 'quiz' }) : go({ name: 'map' }));
    };
    const tw = $('#toworld'); if (tw) tw.onclick = () => go({ name: 'world', w: r.w, tab: 'quiz' });
    $('#tomap').onclick = () => go({ name: 'map' });
  }

  // ---------- reward ----------
  function showReward(rw) {
    const ov = document.createElement('div');
    ov.className = 'ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', rw.title);
    ov.innerHTML = `<canvas aria-hidden="true"></canvas>
      <div class="stage">
        <p class="clear-t">${esc(rw.title)}</p>
        <div class="card3d" id="rcard"><div class="card-in">
          <div class="cface cback"><span>?</span></div>
          <div class="cface cfront">
            <div class="rar"><span>ENGINEER CARD</span><b class="${rw.r === 'LEGENDARY' ? 'leg' : ''}">◆ ${rw.r}</b></div>
            <div class="emblem">${rw.c.em}</div>
            <div><h4>${esc(rw.c.t)}</h4><p>${esc(rw.c[S.lang])}</p></div>
          </div>
        </div></div>
        <p class="gain">${esc(t('xp', rw.xp))} · ${esc(t('newCard'))}</p>
        <button class="pbtn" id="rclose">${esc(t('cont'))}</button>
      </div>`;
    document.body.appendChild(ov);
    const close = () => { cancelAnimationFrame(raf); ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    ov.querySelector('#rclose').onclick = close;
    ov.querySelector('#rclose').focus();
    const card = ov.querySelector('#rcard');
    let raf;
    if (reduce) { card.classList.add('flipped'); return; }
    setTimeout(() => card.classList.add('flipped'), 400);
    const cv = ov.querySelector('canvas'), cx = cv.getContext('2d');
    const w = cv.width = 180, h = cv.height = Math.round(180 * innerHeight / Math.max(1, innerWidth));
    const cols = [css('--gold'), css('--good'), css('--bad'), css('--rare')];
    const ps = Array.from({ length: 90 }, () => ({ x: w / 2, y: h * .3, vx: (Math.random() - .5) * 3.4, vy: -Math.random() * 3.2 - 1, c: cols[Math.random() * 4 | 0] }));
    let fr = 0;
    (function loop() {
      cx.clearRect(0, 0, w, h);
      ps.forEach(p => { p.vy += .07; p.x += p.vx; p.y += p.vy; cx.fillStyle = p.c; cx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); });
      if (++fr < 200) raf = requestAnimationFrame(loop); else cx.clearRect(0, 0, w, h);
    })();
  }

  renderHud();
  render();
})();
</script>

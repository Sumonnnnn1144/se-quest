pe","prototypes","Prototyping","prototyping"],"vi":"bản mẫu","d":{"vi":"Mô hình chạy được hoặc mock-up để lấy phản hồi và kiểm tra requirement.","en":"An executable model or mock-up used to get feedback and check requirements."},"src":"02#23, 04#52"},{"t":"Spiral","cs":1,"vi":"mô hình xoắn ốc","d":{"vi":"Plan-driven: mỗi vòng xoắn là một phase; nhấn mạnh quản lý rủi ro.","en":"Plan-driven: each loop is a phase; emphasizes risk management."},"src":"02#27"},{"t":"Risk Analysis","vi":"phân tích rủi ro","d":{"vi":"Góc phần tư Spiral có Risk Reduction và Prototyping; cũng là bước 2 của risk management.","en":"Spiral quadrant with Risk Reduction and Prototyping; also step 2 of risk management."},"src":"02#25, 03#38"},{"t":"RUP","a":["Rational Unified Process"],"vi":"quy trình hợp nhất Rational","d":{"vi":"Plan-driven, 4 phase Inception → Elaboration → Construction → Transition; mỗi iteration là một chu kỳ waterfall.","en":"Plan-driven, phases Inception → Elaboration → Construction → Transition; each iteration is a waterfall cycle."},"src":"02#32-34"},{"t":"Inception","cs":1,"vi":"khởi đầu","d":{"vi":"Phase 1 RUP: xây business case.","en":"RUP phase 1: establish the business case."},"src":"02#33"},{"t":"Elaboration","cs":1,"vi":"chi tiết hoá","d":{"vi":"Phase 2 RUP: hiểu problem domain và kiến trúc hệ thống.","en":"RUP phase 2: understand the problem domain and architecture."},"src":"02#33"},{"t":"Construction","cs":1,"vi":"xây dựng","d":{"vi":"Phase 3 RUP: thiết kế, lập trình, kiểm thử.","en":"RUP phase 3: design, programming and testing."},"src":"02#33"},{"t":"Transition","cs":1,"vi":"chuyển giao","d":{"vi":"Phase 4 RUP: triển khai vào môi trường vận hành.","en":"RUP phase 4: deploy into the operating environment."},"src":"02#33"},{"t":"Business case","a":["business case"],"vi":"lý do kinh doanh","d":{"vi":"Lập luận vì sao dự án đáng làm; được xây ở Inception.","en":"The argument for why the project is worth doing; built in Inception."},"src":"02#33"},{"t":"Entry and exit criteria","a":["entry and exit criteria"],"vi":"tiêu chí vào/ra","d":{"vi":"Điều kiện để bắt đầu và kết thúc một iteration.","en":"Conditions to start and finish an iteration."},"src":"02#34"},{"t":"Agile Manifesto","vi":"Tuyên ngôn Agile","d":{"vi":"4 giá trị nền tảng + 12 nguyên tắc.","en":"4 foundational values + 12 principles."},"src":"02#36"},{"t":"Extreme Programming","a":["XP"],"cs":1,"vi":"lập trình cực hạn","d":{"vi":"Agile: đẩy các thực hành tốt lên mức cực đoan; 12 practice.","en":"Agile: push known good practices to extremes; 12 practices."},"src":"02#43, 02#46"},{"t":"Pair Programming","a":["pair programming"],"vi":"lập trình cặp","d":{"vi":"Hai người cùng code trên một máy; practice của XP.","en":"Two people coding together at one machine; an XP practice."},"src":"02#46"},{"t":"Refactoring","vi":"tái cấu trúc code","d":{"vi":"Cải thiện cấu trúc code mà không đổi hành vi; practice của XP.","en":"Improving code structure without changing behavior; an XP practice."},"src":"02#46"},{"t":"On-site Customer","vi":"khách hàng tại chỗ","d":{"vi":"Khách tham gia toàn thời gian cùng team; practice của XP.","en":"A full-time customer with the team; an XP practice."},"src":"02#45-46"},{"t":"Scrum","cs":1,"vi":"Scrum","d":{"vi":"Agile do Schwaber và Sutherland tạo; định nghĩa bởi Scrum Guide (11/2020).","en":"Agile method by Schwaber and Sutherland, defined by the Scrum Guide (Nov 2020)."},"src":"02#53-54"},{"t":"Scrum Guide","vi":"hướng dẫn Scrum","d":{"vi":"Tài liệu chuẩn định nghĩa Scrum, bản mới nhất 11/2020.","en":"The official definition of Scrum, latest November 2020."},"src":"02#54"},{"t":"Sprint","a":["Sprints","sprint","sprints"],"vi":"vòng lặp phát triển","d":{"vi":"Event độ dài cố định ≤ 1 tháng (thường 2 tuần), chứa mọi event khác.","en":"Fixed-length event of one month or less (commonly 2 weeks) containing all other events."},"src":"02#54"},{"t":"Daily Scrum","vi":"họp nhanh hằng ngày","d":{"vi":"15 phút để Developers kiểm tra tiến độ hướng tới Sprint Goal.","en":"15 minutes for the Developers to inspect progress toward the Sprint Goal."},"src":"02#54"},{"t":"Sprint Planning","vi":"họp lập kế hoạch Sprint","d":{"vi":"Trả lời Why / What / How, tạo Sprint Goal và Sprint Backlog.","en":"Answers why, what and how; produces the Sprint Goal and Sprint Backlog."},"src":"02#60"},{"t":"Sprint Review","vi":"họp đánh giá sản phẩm","d":{"vi":"Kiểm tra Increment cùng stakeholder, điều chỉnh Product Backlog.","en":"Inspect the Increment with stakeholders; adapt the Product Backlog."},"src":"02#60"},{"t":"Sprint Retrospective","vi":"họp nhìn lại cách làm","d":{"vi":"Team nhìn lại cách làm việc và lên kế hoạch cải tiến.","en":"The team inspects how it worked and plans improvements."},"src":"02#60"},{"t":"Product Backlog","vi":"danh sách việc của sản phẩm","d":{"vi":"Toàn bộ requirement của sản phẩm, đã ước lượng và ưu tiên; commitment là Product Goal.","en":"All product requirements, estimated and prioritized; commitment: Product Goal."},"src":"02#54, 02#57"},{"t":"Sprint Backlog","vi":"danh sách việc của Sprint","d":{"vi":"Các item được chọn cho một Sprint; commitment là Sprint Goal.","en":"Items allocated to one Sprint; commitment: Sprint Goal."},"src":"02#54, 02#57"},{"t":"Product Goal","vi":"mục tiêu sản phẩm","d":{"vi":"Commitment của Product Backlog, do Product Owner định nghĩa.","en":"The commitment of the Product Backlog, defined by the Product Owner."},"src":"02#54, 02#59"},{"t":"Sprint Goal","vi":"mục tiêu Sprint","d":{"vi":"Commitment của Sprint Backlog.","en":"The commitment of the Sprint Backlog."},"src":"02#54"},{"t":"Definition of Done","vi":"định nghĩa hoàn thành","d":{"vi":"Commitment của Increment: tiêu chí để coi một việc là xong.","en":"The commitment of the Increment: criteria for work to count as done."},"src":"02#54"},{"t":"Product Owner","vi":"chủ sản phẩm","d":{"vi":"Tối đa giá trị sản phẩm, định nghĩa Product Goal, sắp thứ tự Product Backlog.","en":"Maximizes product value, defines the Product Goal, orders the Product Backlog."},"src":"02#59"},{"t":"Scrum Master","vi":"người dẫn dắt Scrum","d":{"vi":"Thiết lập Scrum, coach team và tổ chức, gỡ trở ngại.","en":"Establishes Scrum, coaches the team and organization, removes impediments."},"src":"02#59"},{"t":"Developers","cs":1,"vi":"nhóm phát triển","d":{"vi":"Accountability trong Scrum: tạo Sprint Backlog và Increment dùng được mỗi Sprint.","en":"Scrum accountability: create the Sprint Backlog and a usable Increment every Sprint."},"src":"02#59"},{"t":"Accountability","a":["accountabilities","accountability"],"vi":"trách nhiệm (vai trò)","d":{"vi":"Scrum Guide 2020 dùng từ này cho 3 vai: Product Owner, Scrum Master, Developers.","en":"Scrum Guide 2020's term for its three roles: Product Owner, Scrum Master, Developers."},"src":"02#59"},{"t":"Self-managing","a":["self-managing"],"vi":"tự quản lý","d":{"vi":"Scrum Team không có manager hay team lead.","en":"A Scrum Team has no manager or team lead."},"src":"02#59"},{"t":"Impediment","a":["impediments","Impediments"],"vi":"trở ngại","d":{"vi":"Thứ cản team làm việc; Scrum Master gỡ bỏ.","en":"Anything blocking the team; the Scrum Master removes them."},"src":"02#59"},{"t":"Burndown chart","a":["burndown chart","Burndown"],"vi":"biểu đồ việc còn lại","d":{"vi":"Thực hành phổ biến, KHÔNG bắt buộc theo Scrum Guide.","en":"A common practice, NOT required by the Scrum Guide."},"src":"02#54"},{"t":"Release planning","a":["release planning"],"vi":"lập kế hoạch phát hành","d":{"vi":"Thực hành phổ biến nhưng KHÔNG phải Scrum event.","en":"A common practice but NOT a Scrum event."},"src":"02#60"},{"t":"User story","a":["user story","user stories","User stories"],"vi":"câu chuyện người dùng","d":{"vi":"Mô tả tính năng từ góc nhìn người dùng: As a [user], I want [goal], so that [benefit].","en":"A feature from the user's perspective: As a [user], I want [goal], so that [benefit]."},"src":"02#58"},{"t":"Stakeholder","a":["stakeholder","stakeholders","Stakeholders"],"vi":"bên liên quan","d":{"vi":"Bất kỳ người hoặc tổ chức nào bị hệ thống ảnh hưởng.","en":"Any person or organization affected by the system."},"src":"04#5"},{"t":"Kanban","cs":1,"vi":"Kanban (thẻ công việc)","d":{"vi":"Agile, không có iteration: trực quan hoá dòng chảy, giới hạn WIP. Ohno (Toyota) → Anderson (~2004).","en":"Agile, no iterations: visualize flow, limit WIP. Ohno (Toyota) → Anderson (~2004)."},"src":"02#62-63"},{"t":"Kanban board","vi":"bảng Kanban","d":{"vi":"Bảng trực quan hoá work item theo cột, thẻ đi từ trái sang phải.","en":"A board visualizing work items in columns; cards move left to right."},"src":"02#64-65"},{"t":"Work in progress","a":["WIP"],"cs":1,"vi":"việc đang làm dở","d":{"vi":"Số việc đang làm cùng lúc; Kanban giới hạn nó để làm xong việc cũ trước.","en":"Items being worked on at once; Kanban limits it so current work is finished first."},"src":"02#69"},{"t":"Cumulative flow diagram","a":["cumulative flow diagram","CFD"],"vi":"biểu đồ dòng tích luỹ","d":{"vi":"Biểu đồ Kanban cho thấy số việc To Do / In Progress / Done theo thời gian.","en":"Kanban chart of To Do / In Progress / Done over time."},"src":"02#70"},{"t":"Cycle time","a":["cycle time"],"vi":"thời gian chu trình","d":{"vi":"Thời gian một item đi từ lúc bắt đầu tới lúc xong.","en":"Time an item takes from start to finish."},"src":"02#71"},{"t":"Bottleneck","a":["bottleneck","bottlenecks","Bottlenecks"],"vi":"nút thắt cổ chai","d":{"vi":"Chỗ công việc bị dồn ứ, làm chậm cả dòng chảy.","en":"A point where work piles up and slows the whole flow."},"src":"02#62, 02#71"},{"t":"Scope","cs":1,"vi":"phạm vi","d":{"vi":"Dự án sẽ giao gì và KHÔNG giao gì; một trong 3 yếu tố Scope · Time · Budget.","en":"What the project will and will not deliver; one of Scope · Time · Budget."},"src":"03#4, 03#16"},{"t":"Intangible","a":["intangible"],"vi":"vô hình","d":{"vi":"Phần mềm không thấy được bằng mắt, nên khó đo tiến độ.","en":"Software cannot be seen, so progress is hard to observe."},"src":"03#5"},{"t":"Human factors","a":["human factors"],"vi":"yếu tố con người","d":{"vi":"Dự án phụ thuộc vào con người; trong UI là giới hạn trí nhớ, lỗi, khả năng khác nhau.","en":"Projects depend on people; in UI, limits of memory, errors, different capabilities."},"src":"03#5, 05#30"},{"t":"Project Manager","a":["project manager"],"vi":"quản lý dự án","d":{"vi":"Lo scope, schedule, cost, risks, giao tiếp, stakeholder. KHÔNG phải vai trò trong Scrum Team.","en":"Scope, schedule, cost, risks, communication, stakeholders. NOT a Scrum Team role."},"src":"03#9, 02#59"},{"t":"Engineering Manager","vi":"quản lý kỹ thuật","d":{"vi":"Lo chất lượng kỹ thuật, năng lực team, kiến trúc, quy trình kỹ thuật.","en":"Technical quality, team capability, architecture, engineering process."},"src":"03#9"},{"t":"Team Lead","a":["team lead"],"vi":"trưởng nhóm","d":{"vi":"Điều phối kỹ thuật hằng ngày, giao task, hỗ trợ code/design.","en":"Daily technical coordination, task assignment, code/design support."},"src":"03#9"},{"t":"Initiation","cs":1,"vi":"khởi tạo dự án","d":{"vi":"Vì sao làm, có khả thi không → feasibility report, project proposal.","en":"Why do it, is it feasible → feasibility report, project proposal."},"src":"03#10"},{"t":"Tracking & Control","a":["Tracking and Control"],"vi":"theo dõi và kiểm soát","d":{"vi":"Đang ở đâu, đổi gì → progress report, issue log, change request.","en":"Where are we, what to change → progress report, issue log, change requests."},"src":"03#10"},{"t":"Feasibility report","a":["feasibility report","Feasibility study","feasibility study"],"vi":"báo cáo khả thi","d":{"vi":"Đánh giá dự án có làm được không; output của Initiation.","en":"Assesses whether the project is feasible; an Initiation output."},"src":"03#10, 04#26"},{"t":"Issue log","a":["issue log"],"vi":"nhật ký vấn đề","d":{"vi":"Danh sách vấn đề phát sinh; output của Tracking & Control.","en":"A list of problems that occur; a Tracking & Control output."},"src":"03#10"},{"t":"Change request","a":["change request","change requests","Change requests"],"vi":"yêu cầu thay đổi","d":{"vi":"Đề xuất thay đổi từ khách, người dùng hoặc team; bước 1 của change management.","en":"A proposed change from customers, users or the team; step 1 of change management."},"src":"03#10, 04#57"},{"t":"SDP","a":["Software development plan"],"vi":"kế hoạch phát triển phần mềm","d":{"vi":"Software Development Plan: budget, schedule, staffing, training, risk plan…","en":"Software Development Plan: budget, schedule, staffing, training, risk plan…"},"src":"03#14-15"},{"t":"WBS","a":["Work Breakdown Structure"],"vi":"cấu trúc phân rã công việc","d":{"vi":"Chia scope thành work item nhỏ (phase → deliverable → task); mỗi item phải giao, ước lượng, theo dõi được.","en":"Breaks scope into small work items (phase → deliverable → task); each assignable, estimable, trackable."},"src":"03#17"},{"t":"Deliverable","a":["deliverable","deliverables","Deliverables"],"vi":"sản phẩm bàn giao","d":{"vi":"Kết quả giao cho khách hàng hoặc người dùng.","en":"Results delivered to customers or users."},"src":"03#27"},{"t":"Milestone","a":["milestone","milestones","Milestones"],"vi":"mốc","d":{"vi":"Điểm kết thúc một giai đoạn, thường gắn với một nhóm deliverable.","en":"The end-point of a period, often marked by deliverables."},"src":"03#27"},{"t":"Experience-based","vi":"dựa trên kinh nghiệm","d":{"vi":"Ước lượng theo kinh nghiệm dự án trước của manager.","en":"Estimates from the manager's experience of past projects."},"src":"03#20"},{"t":"Algorithmic cost modeling","vi":"mô hình chi phí bằng công thức","d":{"vi":"Ước lượng bằng công thức theo kích thước sản phẩm và đặc điểm process.","en":"A formula based on product size and process characteristics."},"src":"03#20"},{"t":"LOC","a":["Lines of Code","Line of Code"],"cs":1,"vi":"số dòng code","d":{"vi":"Đếm dòng lệnh chạy được; đơn giản nhưng phụ thuộc ngôn ngữ.","en":"Count of executable lines; simple but language-dependent."},"src":"03#21"},{"t":"KLOC","cs":1,"vi":"nghìn dòng code","d":{"vi":"1 KLOC = 1.000 dòng code; biến trong công thức COCOMO.","en":"1 KLOC = 1,000 lines of code; the COCOMO size variable."},"src":"03#22"},{"t":"Function Points","a":["FP"],"cs":1,"vi":"điểm chức năng","d":{"vi":"Đo chức năng từ góc nhìn người dùng; độc lập ngôn ngữ lập trình.","en":"Functionality from the user's view; language-independent."},"src":"03#21"},{"t":"COCOMO","vi":"mô hình chi phí COCOMO","d":{"vi":"Mô hình ước lượng: $\\text{Effort} = a \\times (\\text{KLOC})^{b}$.","en":"Estimation model: $\\text{Effort} = a \\times (\\text{KLOC})^{b}$."},"src":"03#22"},{"t":"Effort","cs":1,"vi":"công sức (người × thời gian)","d":{"vi":"Tổng công làm việc, đơn vị man-hour/man-day/man-month. Khác duration.","en":"Total work in man-hours/days/months. Not the same as duration."},"src":"03#22-23"},{"t":"Duration","cs":1,"vi":"thời gian lịch","d":{"vi":"Thời gian thực trôi qua để xong việc: $\\text{Duration} = c \\times (\\text{Effort})^{d}$.","en":"Calendar time to finish: $\\text{Duration} = c \\times (\\text{Effort})^{d}$."},"src":"03#22-23"},{"t":"Man-month","a":["man-month","person-month"],"vi":"người-tháng","d":{"vi":"Công của một người trong một tháng.","en":"The work of one person for one month."},"src":"03#22"},{"t":"Person-hours","a":["person-hours"],"vi":"người-giờ","d":{"vi":"Công của một người trong một giờ.","en":"The work of one person for one hour."},"src":"03#23"},{"t":"Story points","a":["story points","Story point","story point"],"vi":"điểm câu chuyện","d":{"vi":"Kích thước tương đối của backlog item = effort + complexity + uncertainty.","en":"Relative size of a backlog item = effort + complexity + uncertainty."},"src":"03#24"},{"t":"Velocity","a":["velocity"],"vi":"tốc độ team","d":{"vi":"Số story point làm xong mỗi sprint; không dùng để so sánh các team.","en":"Story points completed per sprint; never compare teams by it."},"src":"03#24"},{"t":"Planning Poker","vi":"ước lượng bằng bài","d":{"vi":"Cả team cùng ước lượng story point bằng thẻ số Fibonacci.","en":"Whole-team story point estimation with Fibonacci cards."},"src":"03#24"},{"t":"Fibonacci","vi":"dãy Fibonacci","d":{"vi":"1, 2, 3, 5, 8, 13…: thang dùng trong Planning Poker.","en":"1, 2, 3, 5, 8, 13…: the Planning Poker scale."},"src":"03#24"},{"t":"Brooks' law","vi":"định luật Brooks","d":{"vi":"Thêm người vào dự án đang trễ làm nó trễ hơn (giao tiếp, đào tạo).","en":"Adding people to a late project makes it later (communication, training)."},"src":"03#26"},{"t":"Contingency","a":["contingency"],"vi":"dự phòng","d":{"vi":"Thời gian/nguồn lực để sẵn cho việc bất ngờ.","en":"Reserve time or resources for the unexpected."},"src":"03#26"},{"t":"Critical path","a":["critical path","Critical Path","critical paths"],"vi":"đường găng","d":{"vi":"Chuỗi task phụ thuộc DÀI NHẤT; quyết định thời gian tối thiểu; task trên đó có slack = 0.","en":"The LONGEST chain of dependent tasks; sets minimum duration; its tasks have zero slack."},"src":"03#31"},{"t":"CPM","a":["Critical Path Method"],"cs":1,"vi":"phương pháp đường găng","d":{"vi":"Critical Path Method: tìm đường găng để lập lịch.","en":"Critical Path Method: find the critical path to schedule."},"src":"03#31"},{"t":"Slack","a":["slack","Float","float"],"vi":"thời gian dự trữ","d":{"vi":"$\\text{Slack} = \\text{latest start} - \\text{earliest start}$. Task găng có slack = 0.","en":"$\\text{Slack} = \\text{latest start} - \\text{earliest start}$. Critical tasks have zero slack."},"src":"03#31"},{"t":"Gantt chart","a":["Gantt"],"vi":"biểu đồ Gantt","d":{"vi":"Biểu đồ thanh ngang thể hiện task theo thời gian.","en":"Horizontal bar chart of tasks over time."},"src":"03#28, 03#31"},{"t":"Staff allocation","vi":"phân bổ nhân sự","d":{"vi":"Biểu đồ ai làm task nào, khi nào.","en":"Chart of who works on which task and when."},"src":"03#29"},{"t":"Risk exposure","a":["RE"],"cs":1,"vi":"mức phơi nhiễm rủi ro","d":{"vi":"$\\text{RE} = \\text{Probability} \\times \\text{Loss}$; RE cao hơn thì ưu tiên cao hơn.","en":"$\\text{RE} = \\text{Probability} \\times \\text{Loss}$; higher RE, higher priority."},"src":"03#38, 03#41"},{"t":"Risk identification","vi":"nhận diện rủi ro","d":{"vi":"Bước 1; 5 loại: Technology, People, Organizational, Requirements, Estimation.","en":"Step 1; five types: Technology, People, Organizational, Requirements, Estimation."},"src":"03#35-36"},{"t":"Risk planning","vi":"lập kế hoạch rủi ro","d":{"vi":"Bước 3: chiến lược avoidance, minimization, contingency, transfer, buying information.","en":"Step 3: avoidance, minimization, contingency, transfer, buying information."},"src":"03#42"},{"t":"Risk monitoring","vi":"giám sát rủi ro","d":{"vi":"Bước 4: đánh giá lại định kỳ, giữ top-10 risks, báo cáo hằng tuần.","en":"Step 4: reassess regularly, keep top-10 risks, report weekly."},"src":"03#45"},{"t":"Contingency plans","a":["contingency plans","Contingency plan"],"vi":"kế hoạch ứng phó","d":{"vi":"Kế hoạch được làm theo KHI rủi ro xảy ra.","en":"Plans followed IF the risk arises."},"src":"03#42"},{"t":"Avoidance","cs":1,"vi":"né tránh","d":{"vi":"Chiến lược giảm khả năng rủi ro xảy ra (theo Sommerville).","en":"Strategy that reduces the chance the risk occurs (Sommerville)."},"src":"03#42"},{"t":"Minimization","cs":1,"vi":"giảm thiểu","d":{"vi":"Chiến lược giảm tác động nếu rủi ro xảy ra (theo Sommerville).","en":"Strategy that reduces the impact if the risk occurs (Sommerville)."},"src":"03#42"},{"t":"Risk transfer","vi":"chuyển giao rủi ro","d":{"vi":"Chuyển rủi ro sang bên khác.","en":"Shifting the risk to another party."},"src":"03#42"},{"t":"Staff turnover","vi":"nhân sự nghỉ việc","d":{"vi":"Nhân sự có kinh nghiệm rời dự án trước khi xong; ảnh hưởng Project.","en":"Experienced staff leave before the project ends; affects the Project."},"src":"03#34"},{"t":"Viewpoint","a":["viewpoint","viewpoints","Viewpoints"],"vi":"góc nhìn","d":{"vi":"Cách tổ chức requirement theo góc nhìn stakeholder: Interactor, Indirect, Domain.","en":"Structuring requirements by stakeholder perspective: Interactor, Indirect, Domain."},"src":"04#7"},{"t":"Interactor","cs":1,"vi":"tương tác trực tiếp","d":{"vi":"Viewpoint của người/hệ thống tương tác trực tiếp. ATM: khách hàng, account database.","en":"People or systems interacting directly. ATM: customers, account database."},"src":"04#7"},{"t":"Indirect viewpoint","cs":1,"vi":"gián tiếp","d":{"vi":"Viewpoint của người không dùng hệ thống nhưng ảnh hưởng requirement. ATM: quản lý, bảo mật.","en":"Stakeholders who don't use the system but influence requirements. ATM: management, security."},"src":"04#7","a":["Indirect viewpoints","indirect viewpoint","indirect viewpoints"]},{"t":"User requirements","a":["User requirement","user requirements","user requirement"],"vi":"yêu cầu người dùng","d":{"vi":"Mức cao, ngôn ngữ tự nhiên, góc nhìn người dùng.","en":"High-level, natural language, user's point of view."},"src":"04#9"},{"t":"System requirements","a":["System requirement","system requirements","system requirement"],"vi":"yêu cầu hệ thống","d":{"vi":"Tài liệu có cấu trúc, chi tiết chức năng và ràng buộc; góc nhìn kỹ thuật.","en":"Structured, detailed functions and constraints; technical point of view."},"src":"04#9"},{"t":"Functional requirements","a":["Functional requirement","functional requirements","functional requirement","FRs","FR"],"vi":"yêu cầu chức năng","d":{"vi":"Hệ thống phản ứng thế nào với input, hành xử thế nào: hệ thống LÀM GÌ.","en":"How the system reacts to inputs and behaves: what it DOES."},"src":"04#12-13"},{"t":"Non-functional requirements","a":["Non-functional requirement","non-functional requirements","non-functional requirement","NFRs","NFR"],"vi":"yêu cầu phi chức năng","d":{"vi":"Ràng buộc lên dịch vụ: thời gian, quy trình, chuẩn. 3 nhóm: Product, Organizational, External.","en":"Constraints on services: timing, process, standards. Groups: Product, Organizational, External."},"src":"04#12, 04#16"},{"t":"Domain requirements","a":["Domain requirement","domain requirements","domain requirement"],"vi":"yêu cầu nghiệp vụ lĩnh vực","d":{"vi":"Đến từ lĩnh vực ứng dụng (ví dụ chuẩn Z39.50, bản quyền); vấn đề: understandability, implicitness.","en":"From the application domain (e.g. Z39.50, copyright); problems: understandability, implicitness."},"src":"04#22-24"},{"t":"Verifiable","a":["verifiable"],"vi":"kiểm chứng được","d":{"vi":"Dùng thước đo kiểm tra khách quan, ví dụ 2 giờ đào tạo, ≤ 2 lỗi/ngày.","en":"Uses a measure that can be objectively tested, e.g. 2 hours training, ≤ 2 errors/day."},"src":"04#19"},{"t":"Mean time to failure","a":["MTTF"],"cs":1,"vi":"thời gian trung bình tới khi hỏng","d":{"vi":"Thước đo reliability.","en":"A reliability measure."},"src":"04#20"},{"t":"Availability","a":["availability"],"vi":"tính sẵn sàng","d":{"vi":"Tỷ lệ thời gian hệ thống hoạt động được; thước đo reliability.","en":"Share of time the system is usable; a reliability measure."},"src":"04#20"},{"t":"Understandability","vi":"khó hiểu (thuật ngữ lĩnh vực)","d":{"vi":"Domain requirement viết bằng ngôn ngữ lĩnh vực, kỹ sư khó hiểu.","en":"Domain requirements use domain language that engineers find hard."},"src":"04#24"},{"t":"Implicitness","vi":"tính ngầm định","d":{"vi":"Chuyên gia hiểu quá rõ nên không viết domain requirement ra.","en":"Experts know the domain so well they leave requirements unstated."},"src":"04#24"},{"t":"Elicitation","a":["elicitation"],"vi":"khai thác yêu cầu","d":{"vi":"Tên khác của requirements gathering (cũng gọi là discovery).","en":"Another name for requirements gathering (also discovery)."},"src":"04#32"},{"t":"MoSCoW","vi":"phân loại ưu tiên MoSCoW","d":{"vi":"Must / Should / Could / Won't (this time).","en":"Must / Should / Could / Won't (this time)."},"src":"04#35"},{"t":"Workaround","a":["workaround"],"vi":"cách làm tạm","d":{"vi":"Cách khác để đạt mục đích khi thiếu tính năng; dấu hiệu của Should have.","en":"Another way to get the job done; the mark of a Should have."},"src":"04#35"},{"t":"Kano model","vi":"mô hình Kano","d":{"vi":"Kỹ thuật ưu tiên requirement khác ngoài MoSCoW.","en":"Another prioritization technique besides MoSCoW."},"src":"04#35"},{"t":"Interviewing","a":["Interview","interview","interviews"],"vi":"phỏng vấn","d":{"vi":"Khám phá requirement trực tiếp; câu hỏi open/closed; tốn thời gian của khách.","en":"Discover requirements directly; open/closed questions; costs the client's time."},"src":"04#36"},{"t":"Observing","a":["Observation","observation"],"vi":"quan sát","d":{"vi":"Khám phá gián tiếp qua quy trình thật; tốn thời gian dev, có thể làm phiền khách.","en":"Discover indirectly via the real process; costs dev time, may interfere with the client."},"src":"04#37"},{"t":"JAD","a":["Workshops"],"cs":1,"vi":"họp thiết kế chung","d":{"vi":"Joint Application Development: stakeholder và developer làm việc chung có điều phối.","en":"Joint Application Development: facilitated sessions with stakeholders and developers."},"src":"04#38"},{"t":"Questionnaires","a":["questionnaires","surveys","Surveys"],"vi":"phiếu khảo sát","d":{"vi":"Tiếp cận nhiều người nhanh, hợp dữ liệu định lượng.","en":"Reach many users quickly; good for quantitative data."},"src":"04#38"},{"t":"SRS","a":["Software Requirements Specification"],"cs":1,"vi":"đặc tả yêu cầu phần mềm","d":{"vi":"Tuyên bố chính thức điều developer phải làm; nói WHAT, không nói HOW.","en":"The official statement of what developers must build; WHAT, not HOW."},"src":"04#42"},{"t":"IEEE 830","vi":"chuẩn IEEE 830","d":{"vi":"Chuẩn SRS năm 1998, nay thay bằng ISO/IEC/IEEE 29148:2018.","en":"The 1998 SRS standard, now replaced by ISO/IEC/IEEE 29148:2018."},"src":"04#43"},{"t":"Vision document","vi":"tài liệu tầm nhìn","d":{"vi":"Tài liệu mục tiêu sản phẩm; RUP dùng cùng use-case specs, Agile dùng cùng user stories.","en":"Product objectives doc; RUP pairs it with use-case specs, Agile with user stories."},"src":"04#45"},{"t":"INVEST","vi":"tiêu chí user story tốt","d":{"vi":"Independent, Negotiable, Valuable, Estimable, Small, Testable.","en":"Independent, Negotiable, Valuable, Estimable, Small, Testable."},"src":"04#46"},{"t":"Acceptance criteria","a":["acceptance criteria"],"vi":"tiêu chí chấp nhận","d":{"vi":"Viết dạng Given / When / Then; trở thành acceptance test case.","en":"Written as Given / When / Then; become acceptance test cases."},"src":"04#46"},{"t":"Requirements reviews","a":["Requirements review","requirements reviews","Reviews"],"vi":"review yêu cầu","d":{"vi":"Phân tích thủ công có hệ thống; kỹ thuật validation phổ biến nhất.","en":"Systematic manual analysis; the most common validation technique."},"src":"04#52","cs":1},{"t":"Test-case generation","vi":"sinh test case","d":{"vi":"Viết test cho requirement để kiểm tra tính test được.","en":"Developing tests for requirements to check testability."},"src":"04#52"},{"t":"Realism","vi":"tính khả thi","d":{"vi":"Requirement có làm được với ngân sách và công nghệ hiện có không.","en":"Can it be implemented with available budget and technology?"},"src":"04#51"},{"t":"Verifiability","vi":"tính kiểm tra được","d":{"vi":"Requirement có kiểm tra được không.","en":"Can the requirements be checked?"},"src":"04#51"},{"t":"Traceability matrix","a":["traceability matrix","Traceability","traceability"],"vi":"ma trận truy vết","d":{"vi":"Nối requirement với nguồn, use case, design, test; dùng cho impact analysis và test coverage.","en":"Links requirements to sources, use cases, design, tests; for impact analysis and test coverage."},"src":"04#58"},{"t":"Impact analysis","a":["impact analysis"],"vi":"phân tích tác động","d":{"vi":"Đánh giá một thay đổi ảnh hưởng tới phần nào.","en":"Assessing what a change affects."},"src":"04#58"},{"t":"Test coverage","a":["test coverage"],"vi":"độ phủ kiểm thử","d":{"vi":"Requirement nào đã có test.","en":"Which requirements have tests."},"src":"04#58"},{"t":"UML","a":["Unified Modeling Language"],"cs":1,"vi":"ngôn ngữ mô hình hoá thống nhất","d":{"vi":"Booch, Rumbaugh, Jacobson tạo; OMG chuẩn hoá năm 1997.","en":"By Booch, Rumbaugh, Jacobson; adopted by OMG in 1997."},"src":"05#7"},{"t":"OMG","a":["Object Management Group"],"cs":1,"vi":"tổ chức OMG","d":{"vi":"Object Management Group: chuẩn hoá UML năm 1997, nay phát triển UML.","en":"Object Management Group: adopted UML in 1997 and now develops it."},"src":"05#7"},{"t":"BPMN","cs":1,"vi":"ký hiệu quy trình nghiệp vụ","d":{"vi":"Business Process Model and Notation, một modeling language.","en":"Business Process Model and Notation, a modeling language."},"src":"05#6"},{"t":"SysML","cs":1,"vi":"ngôn ngữ mô hình hệ thống","d":{"vi":"Systems Modeling Language.","en":"Systems Modeling Language."},"src":"05#6"},{"t":"C4 Model","vi":"mô hình C4","d":{"vi":"Mô tả kiến trúc theo 4 mức phóng to (Simon Brown): System Context → Containers → Components → Code.","en":"Documents architecture at four zoom levels (Simon Brown): System Context → Containers → Components → Code."},"src":"05#6, 06#12","a":["C4"]},{"t":"Structural","a":["structural"],"vi":"cấu trúc (tĩnh)","d":{"vi":"Nhóm sơ đồ UML tĩnh: class, package, object, component, deployment.","en":"Static UML diagrams: class, package, object, component, deployment."},"src":"05#8"},{"t":"Behavioral","a":["behavioral"],"vi":"hành vi (động)","d":{"vi":"Nhóm sơ đồ UML động: use case, sequence, communication, state machine, activity.","en":"Dynamic UML diagrams: use case, sequence, communication, state machine, activity."},"src":"05#8"},{"t":"Use case diagram","a":["use case diagram","use case diagrams","Use case diagrams"],"vi":"sơ đồ use case","d":{"vi":"Sơ đồ behavioral gồm actor, use case, relationship; dùng truyền đạt functional requirement.","en":"Behavioral diagram of actors, use cases, relationships; communicates functional requirements."},"src":"05#12-13"},{"t":"Use case","a":["use case","use cases","Use cases","use-case"],"vi":"ca sử dụng","d":{"vi":"Chuỗi hành động actor thực hiện tạo kết quả có giá trị cho actor; nói WHAT, không HOW.","en":"Sequences of actions by an actor producing a result of value to the actor; WHAT, not HOW."},"src":"05#15-16"},{"t":"Actor","a":["actor","actors","Actors"],"vi":"tác nhân","d":{"vi":"Vai trò bên ngoài tương tác với hệ thống; một người có thể đóng nhiều vai.","en":"An external role interacting with the system; one person can play many roles."},"src":"05#14"},{"t":"Association","cs":1,"vi":"liên kết","d":{"vi":"Quan hệ nối actor với use case (use case diagram), hoặc nối các object của hai class (class diagram).","en":"A link between an actor and a use case (use case diagram), or between objects of two classes (class diagram)."},"src":"05#21, 07#12"},{"t":"Generalization","a":["generalization"],"vi":"tổng quát hoá","d":{"vi":"Quan hệ giữa cái tổng quát và cái cụ thể hơn: actor, use case, hoặc superclass và subclass. Vẽ bằng mũi tên tam giác rỗng.","en":"A relationship between a general and a more specific element: actors, use cases, or a superclass and subclass. Drawn with a hollow triangle."},"src":"05#14, 05#21, 07#11"},{"t":"Include","a":["«include»","<<include>>"],"cs":1,"vi":"bao gồm","d":{"vi":"Base BIẾT và gọi tường minh; use case được include không đứng một mình. Mũi tên base → included.","en":"Base IS AWARE and calls it explicitly; included use case doesn't stand alone. Arrow base → included."},"src":"05#22"},{"t":"Extend","a":["«extend»","<<extend>>"],"cs":1,"vi":"mở rộng","d":{"vi":"Base KHÔNG biết; extending có thể đứng một mình. Mũi tên extending → base.","en":"Base is NOT aware; extending may stand alone. Arrow extending → base."},"src":"05#22-23"},{"t":"Base use case","a":["base use case"],"cs":1,"vi":"use case gốc","d":{"vi":"Use case chính được include hoặc extend thêm hành vi.","en":"The main use case that includes or is extended by others."},"src":"05#22"},{"t":"Scenario","a":["scenario","scenarios","Scenarios"],"vi":"kịch bản","d":{"vi":"Một chuỗi sự kiện cụ thể, là instance của use case (như object của class).","en":"A specific sequence of events, an instance of a use case (like an object of a class)."},"src":"05#20"},{"t":"Basic flow","a":["basic flow","Basic path","main flow"],"vi":"luồng chính","d":{"vi":"Luồng sự kiện chính của use case; ngoài ra có alternative và exceptional paths.","en":"The main flow of events; plus alternative and exceptional paths."},"src":"05#17"},{"t":"Alternative flow","a":["alternative flows","Alternative paths","Alternative flows","alternative flow"],"vi":"luồng thay thế","d":{"vi":"Luồng rẽ nhánh khác luồng chính.","en":"A branch that differs from the main flow."},"src":"05#17"},{"t":"Preconditions","a":["Precondition","preconditions","pre-conditions","Pre- and post-conditions","pre/postconditions"],"vi":"điều kiện trước","d":{"vi":"Trạng thái phải đúng trước khi use case bắt đầu.","en":"State that must hold before the use case begins."},"src":"05#18"},{"t":"Postconditions","a":["Postcondition","postconditions"],"vi":"điều kiện sau","d":{"vi":"Trạng thái khi use case kết thúc.","en":"State when the use case is over."},"src":"05#18"},{"t":"User interface","a":["UI"],"cs":1,"vi":"giao diện người dùng","d":{"vi":"Điểm người dùng tương tác với ứng dụng; look and feel của một màn hình.","en":"Where users interact with an app; the look and feel of a screen."},"src":"05#27, 05#29"},{"t":"User experience","a":["UX"],"cs":1,"vi":"trải nghiệm người dùng","d":{"vi":"Toàn bộ trải nghiệm của người dùng với sản phẩm.","en":"The user's overall experience with the product."},"src":"05#29"},{"t":"API","a":["Programming interface"],"cs":1,"vi":"giao diện lập trình","d":{"vi":"Interface để các hệ thống khác tương tác.","en":"The interface other systems use."},"src":"05#26"},{"t":"Short-term memory","a":["short-term memory"],"vi":"trí nhớ ngắn hạn","d":{"vi":"Giữ khoảng 4 ± 1 chunk (Miller: 7 ± 2).","en":"Holds about 4 ± 1 chunks (Miller: 7 ± 2)."},"src":"05#30"},{"t":"Chunks","a":["chunks","chunk"],"vi":"khối thông tin","d":{"vi":"Đơn vị thông tin trí nhớ ngắn hạn giữ được cùng lúc.","en":"Units of information held at once in short-term memory."},"src":"05#30"},{"t":"User familiarity","vi":"quen thuộc với người dùng","d":{"vi":"Dùng thuật ngữ, khái niệm từ kinh nghiệm của người dùng chính.","en":"Use terms and concepts from the main users' experience."},"src":"05#32"},{"t":"Minimal surprise","vi":"ít gây bất ngờ","d":{"vi":"Người dùng không bao giờ bị bất ngờ bởi hành vi hệ thống.","en":"Users are never surprised by system behavior."},"src":"05#32"},{"t":"Recoverability","vi":"khả năng khôi phục","d":{"vi":"Có cơ chế để khôi phục khi lỗi; cũng là thuộc tính usability.","en":"Mechanisms to recover from errors; also a usability attribute."},"src":"05#33, 05#49"},{"t":"User guidance","vi":"hướng dẫn người dùng","d":{"vi":"Phản hồi có ý nghĩa khi lỗi, trợ giúp theo ngữ cảnh.","en":"Meaningful error feedback and context-sensitive help."},"src":"05#33"},{"t":"User diversity","vi":"đa dạng người dùng","d":{"vi":"Cách tương tác phù hợp cho nhiều kiểu người dùng.","en":"Interaction suited to different types of users."},"src":"05#33"},{"t":"WCAG","cs":1,"vi":"hướng dẫn tiếp cận nội dung web","d":{"vi":"Web Content Accessibility Guidelines (bản 2.2), theo POUR.","en":"Web Content Accessibility Guidelines (2.2), built on POUR."},"src":"05#34"},{"t":"POUR","cs":1,"vi":"4 nguyên tắc accessibility","d":{"vi":"Perceivable, Operable, Understandable, Robust.","en":"Perceivable, Operable, Understandable, Robust."},"src":"05#34"},{"t":"Perceivable","cs":1,"vi":"nhận biết được","d":{"vi":"Text thay ảnh, phụ đề, tương phản ≥ 4.5:1.","en":"Text alternatives, captions, contrast ≥ 4.5:1."},"src":"05#34"},{"t":"Operable","cs":1,"vi":"thao tác được","d":{"vi":"Mọi thứ dùng được bằng bàn phím, vùng chạm đủ lớn.","en":"Everything works with a keyboard; large tap targets."},"src":"05#34"},{"t":"Robust","cs":1,"vi":"bền vững, tương thích","d":{"vi":"HTML ngữ nghĩa, chạy được với screen reader.","en":"Semantic HTML, works with screen readers."},"src":"05#34"},{"t":"Accessibility","a":["accessibility"],"vi":"khả năng tiếp cận","d":{"vi":"Thiết kế cho mọi người, kể cả người khuyết tật.","en":"Design for everyone, including people with impairments."},"src":"05#34"},{"t":"Screen reader","a":["screen readers","screen reader"],"vi":"trình đọc màn hình","d":{"vi":"Phần mềm đọc to nội dung cho người khiếm thị.","en":"Software that reads content aloud for blind users."},"src":"05#34"},{"t":"Mobile-first","a":["mobile-first"],"vi":"ưu tiên di động","d":{"vi":"Thiết kế cho điện thoại trước, rồi mở rộng.","en":"Design for phones first, then scale up."},"src":"05#34"},{"t":"Direct manipulation","vi":"thao tác trực tiếp","d":{"vi":"Người dùng thao tác trực tiếp và thấy kết quả ngay.","en":"Users directly make changes and see results."},"src":"05#37"},{"t":"Menu selection","vi":"chọn từ menu","d":{"vi":"Đọc danh sách và chọn mục phù hợp.","en":"Read a list and select the best item."},"src":"05#38"},{"t":"Form fill-in","vi":"điền biểu mẫu","d":{"vi":"Dùng khi cần nhập dữ liệu.","en":"Used when data entry is required."},"src":"05#39"},{"t":"Command language","vi":"ngôn ngữ lệnh","d":{"vi":"Phải học cú pháp và tuỳ chọn.","en":"Must learn syntax and options."},"src":"05#40"},{"t":"Natural language","a":["natural language"],"vi":"ngôn ngữ tự nhiên","d":{"vi":"Kiểu tương tác phản hồi câu tuỳ ý; cũng là cách đặc tả requirement dễ viết nhưng mơ hồ.","en":"Interaction that responds to arbitrary sentences; also an easy but ambiguous spec method."},"src":"05#41, 04#41"},{"t":"Digital presentation","vi":"trình bày dạng số","d":{"vi":"Giá trị chính xác, tốn ít chỗ.","en":"Precise values, little screen space."},"src":"05#42"},{"t":"Analogue presentation","vi":"trình bày dạng tương tự","d":{"vi":"Cho thấy giá trị tương đối (biểu đồ).","en":"Shows relative values (charts)."},"src":"05#42"},{"t":"Data visualization","vi":"trực quan hoá dữ liệu","d":{"vi":"Hiển thị lượng lớn thông tin, thấy quan hệ và xu hướng.","en":"Shows large amounts of information, revealing relationships and trends."},"src":"05#44"},{"t":"Task analysis","vi":"phân tích tác vụ","d":{"vi":"Mô hình các bước để hoàn thành một task.","en":"Models the steps to complete a task."},"src":"05#46"},{"t":"Ethnography","vi":"dân tộc học (quan sát tại chỗ)","d":{"vi":"Quan sát người dùng lúc làm việc.","en":"Observing users at work."},"src":"05#46"},{"t":"Paper prototypes","a":["paper prototype","paper prototypes"],"vi":"bản mẫu giấy","d":{"vi":"Giai đoạn 1 của prototyping, trước automated prototype.","en":"Stage 1 of prototyping, before automated prototypes."},"src":"05#47"},{"t":"Figma","vi":"công cụ thiết kế Figma","d":{"vi":"Công cụ thiết kế để làm prototype tương tác.","en":"A design tool for interactive prototypes."},"src":"05#47"},{"t":"Usability","a":["usability"],"vi":"tính dễ dùng","d":{"vi":"Thuộc tính: learnability, speed of operation, robustness, recoverability, adaptability.","en":"Attributes: learnability, speed of operation, robustness, recoverability, adaptability."},"src":"05#49"},{"t":"Learnability","vi":"dễ học","d":{"vi":"Thuộc tính usability: người mới học dùng nhanh không.","en":"Usability attribute: how quickly new users learn it."},"src":"05#49"},{"t":"Adaptability","vi":"khả năng thích nghi","d":{"vi":"Thuộc tính usability.","en":"A usability attribute."},"src":"05#49"},{"t":"Heatmaps","a":["heatmaps","heatmap"],"vi":"bản đồ nhiệt","d":{"vi":"Cho thấy người dùng bấm/nhìn vào đâu nhiều nhất.","en":"Show where users click or look most."},"src":"05#50"},{"t":"Data validation","vi":"kiểm tra dữ liệu nhập","d":{"vi":"Đừng tin người dùng: kiểm mọi input; natural/business constraints; early/late checking.","en":"Don't trust users: check all input; natural/business constraints; early/late checking."},"src":"05#57"},{"t":"Early checking","vi":"kiểm tra sớm","d":{"vi":"Kiểm dữ liệu ngay khi nhập.","en":"Check data as it is entered."},"src":"05#57"},{"t":"Late checking","vi":"kiểm tra muộn","d":{"vi":"Kiểm dữ liệu khi gửi/lưu.","en":"Check data on submit/save."},"src":"05#57"},{"t":"Software design","vi":"thiết kế phần mềm","d":{"vi":"Hình dung hệ thống hoạt động thế nào trước khi cài đặt. 3 mức: architectural, high-level, detailed.","en":"Conceptualizing how the system will work before implementation. Three levels: architectural, high-level, detailed."},"src":"06#4"},{"t":"Architectural design","vi":"thiết kế kiến trúc","d":{"vi":"Quá trình xác định các sub-system và cách chúng giao tiếp.","en":"The process of identifying the sub-systems and how they communicate."},"src":"06#6"},{"t":"Software architecture","vi":"kiến trúc phần mềm","d":{"vi":"Tài liệu kết quả của architectural design: các component và tương tác giữa chúng.","en":"The output of architectural design: components and their interactions."},"src":"06#6, 06#8"},{"t":"Sub-system","a":["sub-systems","subsystem"],"vi":"hệ thống con","d":{"vi":"Một hệ thống riêng, hoạt động độc lập với sub-system khác. Ví dụ Google Maps nhúng trong app.","en":"A system in its own right, independent of other sub-systems, e.g. Google Maps in an app."},"src":"06#13"},{"t":"Architecturally significant requirement","a":["Architecturally Significant Requirements","ASR"],"vi":"requirement ảnh hưởng lớn tới kiến trúc","d":{"vi":"Requirement tác động mạnh tới kiến trúc: chủ yếu NFR và vài FR ưu tiên cao.","en":"A requirement with a significant impact on the architecture: mostly NFRs and some high-priority FRs."},"src":"06#18"},{"t":"ADR","a":["Architecture Decision Record","Architecture Decision Records"],"cs":1,"vi":"bản ghi quyết định kiến trúc","d":{"vi":"Tài liệu ngắn ghi một quyết định quan trọng: Title, Status, Context, Decision, Consequences.","en":"A short record of one important decision: Title, Status, Context, Decision, Consequences."},"src":"06#25"},{"t":"Architectural style","a":["architectural styles"],"vi":"kiểu kiến trúc","d":{"vi":"Cách sắp xếp phần tử kiến trúc dùng lại được, giải một bài toán kiến trúc chung. Mô tả bằng Problem, Context, Solution.","en":"A reusable arrangement of architectural elements solving a common problem, described as Problem, Context, Solution."},"src":"06#28-29"},{"t":"Design pattern","a":["design patterns"],"vi":"mẫu thiết kế","d":{"vi":"Giải pháp đã được chứng minh cho một bài toán thiết kế hay gặp, ở mức low-level.","en":"A proven solution to a common design problem, at low-level design."},"src":"06#28, 07#30"},{"t":"Repository style","vi":"kiểu kho dữ liệu trung tâm","d":{"vi":"Sub-system trao đổi dữ liệu qua một kho trung tâm mà ai cũng truy cập được.","en":"Sub-systems exchange data through one central repository that all can access."},"src":"06#33"},{"t":"Client-server","a":["Client-Server style"],"vi":"khách - chủ","d":{"vi":"Server độc lập cung cấp dịch vụ, client gọi dịch vụ qua mạng.","en":"Stand-alone servers provide services that clients call over a network."},"src":"06#36"},{"t":"Peer-to-peer","a":["P2P"],"vi":"ngang hàng","d":{"vi":"Mỗi node vừa là client vừa là server, không có server trung tâm.","en":"Every node is both client and server, with no central server."},"src":"06#39"},{"t":"Layered style","a":["layered architecture"],"vi":"kiến trúc phân lớp","d":{"vi":"Hệ thống chia thành các lớp; đổi interface một lớp chỉ ảnh hưởng lớp kề bên.","en":"The system is split into layers; changing one layer interface affects only the adjacent layer."},"src":"06#40"},{"t":"MVC","a":["Model-View-Controller"],"cs":1,"vi":"Model-View-Controller","d":{"vi":"Model: dữ liệu và logic · View: trình bày · Controller: nhận lệnh, input.","en":"Model: data and logic · View: presentation · Controller: commands and input."},"src":"06#43"},{"t":"Pipes and filters","a":["Pipes and Filters style"],"vi":"ống và bộ lọc","d":{"vi":"Chuỗi filter xử lý dữ liệu độc lập, dữ liệu đi giữa các filter qua pipe.","en":"A chain of independent filters; data moves between them through pipes."},"src":"06#47"},{"t":"Interrupt-driven","vi":"điều khiển bằng ngắt","d":{"vi":"Dùng cho hệ thời gian thực: mỗi loại interrupt có handler riêng. Nhanh nhưng khó lập trình, khó validate.","en":"For real-time systems: one handler per interrupt type. Fast but hard to program and validate."},"src":"06#50"},{"t":"Service-oriented architecture","vi":"kiến trúc hướng dịch vụ","d":{"vi":"Các service được cung cấp qua mạng, phối hợp được với nhau: modularity, interoperability, reusability, loose coupling.","en":"Interoperable services exposed over a network: modularity, interoperability, reusability, loose coupling."},"src":"06#52"},{"t":"Microservice","a":["Microservices","Microservice architecture"],"vi":"vi dịch vụ","d":{"vi":"Ứng dụng chia thành các service nhỏ, phát triển, triển khai và mở rộng độc lập.","en":"An application split into small services developed, deployed and scaled independently."},"src":"06#53"},{"t":"Modular monolith","vi":"monolith chia module","d":{"vi":"Một ứng dụng triển khai một khối nhưng chia module rõ; nên bắt đầu bằng cách này với nhóm nhỏ.","en":"One deployable application with clear modules; the recommended start for small teams."},"src":"06#55"},{"t":"Event-driven architecture","vi":"kiến trúc hướng sự kiện","d":{"vi":"Component giao tiếp bằng cách phát và nhận event qua broker (Kafka, RabbitMQ).","en":"Components communicate by producing and consuming events via a broker (Kafka, RabbitMQ)."},"src":"06#56"},{"t":"Eventual consistency","vi":"nhất quán sau cùng","d":{"vi":"Dữ liệu ở các service không khớp ngay, nhưng sẽ khớp sau một lúc.","en":"Data across services is not consistent at once, but becomes consistent after a while."},"src":"06#56"},{"t":"Class diagram","a":["class diagrams"],"vi":"sơ đồ lớp","d":{"vi":"Sơ đồ UML dùng nhiều nhất: classes, interfaces, relationships.","en":"The most used UML diagram: classes, interfaces, relationships."},"src":"07#3"},{"t":"Visibility","cs":1,"vi":"phạm vi truy cập","d":{"vi":"+ public, - private, # protected.","en":"+ public, - private, # protected."},"src":"07#6"},{"t":"Multiplicity","vi":"bản số","d":{"vi":"Số object có thể nối qua một association, ví dụ 1, 0..1, 0..*, 1..*.","en":"How many objects may be connected across an association, e.g. 1, 0..1, 0..*, 1..*."},"src":"07#13"},{"t":"Composition","cs":1,"vi":"hợp thành","d":{"vi":"Association mạnh: sở hữu và chịu trách nhiệm vòng đời. Thoi đặc.","en":"Strong association: owns the other and its lifetime. Filled diamond."},"src":"07#14"},{"t":"Aggregation","cs":1,"vi":"kết tập","d":{"vi":"Association yếu: dùng nhưng không sở hữu. Thoi rỗng.","en":"Weak association: uses without owning. Hollow diamond."},"src":"07#14"},{"t":"Navigability","vi":"chiều điều hướng","d":{"vi":"Mũi tên trên association cho biết đi từ object này tới object kia được.","en":"The arrow on an association showing which way you can navigate."},"src":"07#15"},{"t":"Domain object","a":["domain objects"],"vi":"object nghiệp vụ","d":{"vi":"Thực thể ngoài đời, có vai trò trong nghiệp vụ và có dữ liệu lưu.","en":"A real-world entity with a business role and stored data."},"src":"07#17"},{"t":"System object","a":["system objects"],"vi":"object hệ thống","d":{"vi":"Thực thể được tạo ra để hỗ trợ xử lý và tính toán.","en":"An entity created to support processing and calculations."},"src":"07#17"},{"t":"BCE","cs":1,"vi":"Boundary – Control – Entity","d":{"vi":"Chia object thành boundary (giao diện), control (điều phối use case), entity (dữ liệu nghiệp vụ).","en":"Splits objects into boundary (interface), control (coordinates a use case), entity (business data)."},"src":"07#18"},{"t":"Sequence diagram","a":["sequence diagrams"],"vi":"sơ đồ tuần tự","d":{"vi":"Cho thấy object tương tác theo thời gian trong một scenario: lifeline, message, activation, fragment.","en":"Shows objects interacting over time in one scenario: lifelines, messages, activations, fragments."},"src":"07#22"},{"t":"Lifeline","a":["lifelines"],"vi":"đường đời","d":{"vi":"Một người tham gia trong sequence diagram: actor, boundary, controller hoặc entity.","en":"A participant in a sequence diagram: actor, boundary, controller or entity."},"src":"07#22"},{"t":"Combined fragment","a":["combined fragments"],"vi":"đoạn kết hợp","d":{"vi":"Khung điều kiện trong sequence diagram: alt (if/else), opt (if), loop, par.","en":"A frame in a sequence diagram: alt (if/else), opt (if), loop, par."},"src":"07#22"},{"t":"State machine diagram","a":["state machine"],"vi":"sơ đồ máy trạng thái","d":{"vi":"Vòng đời của object có trạng thái: state, transition event [guard] / action, trạng thái đầu và cuối.","en":"The life cycle of an object with a status: states, transitions event [guard] / action, initial and final states."},"src":"07#26"},{"t":"Encapsulation","a":["information hiding"],"vi":"đóng gói","d":{"vi":"Luật hộp đen: giấu dữ liệu, chỉ lộ operation.","en":"The black-box rule: hide data, expose operations."},"src":"07#25, 07#28"},{"t":"Polymorphism","vi":"đa hình","d":{"vi":"Cùng một operation nhưng dữ liệu hoặc cách xử lý khác nhau.","en":"The same operation with different data or processing."},"src":"07#25"},{"t":"Coupling","a":["low coupling"],"vi":"độ kết dính giữa module","d":{"vi":"Mức một module phụ thuộc vào module khác. Nên thấp.","en":"How strongly one module depends on others. Aim low."},"src":"07#28"},{"t":"Cohesion","a":["high cohesion"],"vi":"độ gắn kết trong module","d":{"vi":"Mức các trách nhiệm trong một module gắn bó với nhau. Nên cao.","en":"How closely the responsibilities inside one module belong together. Aim high."},"src":"07#28"},{"t":"SOLID","cs":1,"vi":"năm nguyên tắc SOLID","d":{"vi":"Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion.","en":"Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion."},"src":"07#29"},{"t":"Open/Closed","vi":"mở/đóng","d":{"vi":"Mở để mở rộng, đóng để sửa đổi: thêm loại mới bằng class mới.","en":"Open for extension, closed for modification: add a type with a new class."},"src":"07#29"},{"t":"GoF","cs":1,"vi":"Gang of Four","d":{"vi":"Danh mục 23 design pattern chia 3 nhóm: Creational, Structural, Behavioral.","en":"The classic pattern catalog in three groups: Creational, Structural, Behavioral."},"src":"07#31"},{"t":"Strategy","a":["Strategy pattern"],"cs":1,"vi":"mẫu chiến lược","d":{"vi":"Đóng gói từng luật (ví dụ luật giá) thành class riêng cài chung một interface.","en":"Wraps each rule (e.g. a pricing rule) in its own class behind one interface."},"src":"07#32-33"},{"t":"Observer","a":["Observer pattern"],"cs":1,"vi":"mẫu quan sát","d":{"vi":"Báo cho nhiều bên khi một object thay đổi.","en":"Notifies many parties when one object changes."},"src":"07#32"},{"t":"Factory Method","vi":"phương thức nhà máy","d":{"vi":"Tạo đúng loại object mà nơi gọi không cần biết class cụ thể.","en":"Creates the right kind of object without the caller naming the concrete class."},"src":"07#32"},{"t":"Facade","cs":1,"vi":"mặt tiền","d":{"vi":"Một lối vào đơn giản cho một subsystem phức tạp.","en":"A simple entry point to a complex subsystem."},"src":"07#32"},{"t":"Singleton","cs":1,"vi":"đơn thể","d":{"vi":"Chỉ một object dùng chung, ví dụ cấu hình. Dùng cẩn thận vì khó test.","en":"One shared object, e.g. configuration. Use carefully: hurts testability."},"src":"07#32"},{"t":"Junction table","a":["junction tables"],"vi":"bảng trung gian","d":{"vi":"Bảng có hai foreign key để biểu diễn association n – n.","en":"A table with two foreign keys that holds an n – n association."},"src":"07#36-37"},{"t":"Primary key","a":["primary keys"],"vi":"khoá chính","d":{"vi":"Cột định danh mỗi dòng; object identity ánh xạ thành primary key.","en":"The column identifying each row; object identity maps to it."},"src":"07#36, 07#40"},{"t":"Foreign key","a":["foreign keys"],"vi":"khoá ngoại","d":{"vi":"Cột tham chiếu primary key của bảng khác; association 1 – n đặt FK ở phía n.","en":"A column referencing another table's primary key; a 1 – n association puts it on the n side."},"src":"07#36-37"},{"t":"3NF","cs":1,"vi":"dạng chuẩn 3","d":{"vi":"Chuẩn hoá tới 3NF để tránh dư thừa và update anomaly.","en":"Normalize to third normal form to avoid redundancy and update anomalies."},"src":"07#40"},{"t":"Data specification","vi":"đặc tả dữ liệu","d":{"vi":"Mô tả định dạng file hoặc các trường của bảng: field, constraint, description.","en":"Describes a file format or table fields: field, constraint, description."},"src":"07#38-39"}],"math":{"I:\\text{Effort} = a \\times (\\text{KLOC})^{b}":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Effort<\/mtext><mo>=<\/mo><mi>a<\/mi><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mtext>KLOC<\/mtext><msup><mo stretchy=\"false\">)<\/mo><mi>b<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\text{Effort} = a \\times (\\text{KLOC})^{b}<\/annotation><\/semantics><\/math><\/span>","I:\\text{Effort} = c \\times (\\text{Duration})^{d}":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Effort<\/mtext><mo>=<\/mo><mi>c<\/mi><mo>×<\/mo><mo stretchy=\"false\">(<\/mo><mtext>Duration<\/mtext><msup><mo stretchy=\"false\">)<\/mo><mi>d<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\text{Effort} = c \\times (\\text{Duration})^{d}<\/annotation><\/semantics><\/math><\/span>","I:\\text{Effort} = \\text{Cost} \\times \\text{rate}":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Effort<\/mtext><mo>=<\/mo><mtext>Cost<\/mtext><mo>×<\/mo><mtext>rate<\/mtext><\/mrow><annotation encoding=\"application/x-tex\">\\text{Effort} = \\text{Cost} \\times \\text{rate}<\/annotation><\/semantics><\/math><\/span>","I:\\text{Effort} = \\text{KLOC} / \\text{velocity}":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Effort<\/mtext><mo>=<\/mo><mtext>KLOC<\/mtext><mi mathvariant=\"normal\">/<\/mi><mtext>velocity<\/mtext><\/mrow><annotation encoding=\"application/x-tex\">\\text{Effort} = \\text{KLO   const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ---------- text: **bold**, *italic*, $math$ (pre-rendered MathML), glossary terms ----------
  const MATHRE = /(?<!\\)\$\$(.+?)(?<!\\)\$\$|(?<!\\)\$(.+?)(?<!\\)\$/g;
  const GL = DATA.glossary, glCase = {}, glAny = {};
  GL.forEach((g, i) => [g.t, ...(g.a || [])].forEach(s => { const k = esc(s); if (g.cs) glCase[k] = i; else glAny[k.toLowerCase()] = i; }));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const GLRE = new RegExp(`(?<![\\p{L}\\p{N}_-])(${[...Object.keys(glCase), ...Object.keys(glAny)].sort((a, b) => b.length - a.length).map(reEsc).join('|')})(?![\\p{L}\\p{N}_-])`, 'giu');
  // ctx = { seen: Set } marks each glossary term once per block; null disables glossary.
  const gctx = () => ({ seen: new Set() });
  function gloss(h, ctx) {
    return h.replace(GLRE, m => {
      const i = glCase[m] ?? glAny[m.toLowerCase()];
      if (i === undefined || ctx.seen.has(i)) return m;
      ctx.seen.add(i);
      return `<span class="gl" data-g="${i}" tabindex="0" role="button">${m}</span>`;
    });
  }
  function txt(s, ctx) {
    let h = esc(s.replace(/\\\$/g, '$'));
    if (ctx) h = gloss(h, ctx);
    return h.replace(/\*\*(.+?)\*\*/g, '<b class="kw">$1</b>').replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?![*\w])/g, '$1<i>$2</i>');
  }
  function md(s, ctx = null) {
    let out = '', last = 0;
    for (const m of s.matchAll(MATHRE)) {
      out += txt(s.slice(last, m.index), ctx);
      const key = m[1] !== undefined ? 'D:' + m[1] : 'I:' + m[2];
      out += DATA.math[key] || esc(m[0]);
      last = m.index + m[0].length;
    }
    return out + txt(s.slice(last), ctx);
  }
  // Block markdown: paragraphs, "- "/"1. " lists (2-space nesting), "|" tables, "$$…$$" display math.
  const isBlock = l => /^(\||\s*(- |\d+\. )|\$\$)/.test(l);
  function blocks(src, ctx) {
    const L = src.split('\n'); let h = '', i = 0;
    while (i < L.length) {
      const l = L[i];
      if (!l.trim()) { i++; continue; }
      if (/^\$\$.+\$\$$/.test(l.trim())) { h += `<div class="mathd">${md(l.trim(), ctx)}</div>`; i++; continue; }
      if (l.startsWith('|')) { const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]); h += table(rows, ctx); continue; }
      if (/^\s*(- |\d+\. )/.test(l)) { const rows = []; while (i < L.length && /^\s*(- |\d+\. )/.test(L[i])) rows.push(L[i++]); h += list(rows, ctx); continue; }
      const p = []; while (i < L.length && L[i].trim() && (p.length === 0 || !isBlock(L[i]))) p.push(L[i++]);
      h += `<p>${md(p.join(' '), ctx)}</p>`;

  }

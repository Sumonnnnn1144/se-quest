ne: điểm kết thúc một giai đoạn. Deliverable: kết quả giao cho khách.","en":"Milestone: end-point of a period. Deliverable: result delivered to customers.","src":"03#27"},{"id":"c3.5-3","w":3,"lv":"3.5","q":"Slack (float) is calculated as:","o":["$\\text{latest start} - \\text{earliest start}$","$\\text{earliest start} - \\text{latest start}$","$\\text{duration} \\times \\text{effort}$","$\\text{latest finish} + \\text{earliest start}$"],"a":0,"vi":"$\\text{Slack} = \\text{latest start} - \\text{earliest start}$; task găng có slack = 0.","en":"$\\text{Slack} = \\text{latest start} - \\text{earliest start}$; critical tasks have zero slack.","src":"03#31"},{"id":"c3.5-4","w":3,"lv":"3.5","q":"In the slide example (T1 3d → T2 2d / T3 2d → T4 5d → T5 3d → T6 1d), if T3 is delayed by 1 day, the project takes:","o":["15 days","14 days","16 days","13 days"],"a":0,"vi":"T3 nằm trên một đường găng (14 ngày), trễ 1 ngày thì dự án thành 15 ngày.","en":"T3 is on a critical path (14 days); a 1-day delay makes the project 15 days.","src":"03#31"},{"id":"c3.5-5","w":3,"lv":"3.5","q":"Which tool does the lecture suggest to show a schedule?","o":["A Gantt chart","A use case diagram","A traceability matrix","A cumulative flow diagram"],"a":0,"vi":"Thể hiện lịch bằng Gantt chart; quản lý task trên board (GitHub Projects, Jira, Trello).","en":"Show the schedule as a Gantt chart; manage tasks on a board.","src":"03#31"},{"id":"c3.5-6","w":3,"lv":"3.5","q":"CPM stands for:","o":["Critical Path Method","Critical Project Milestone","Cost Planning Method","Critical Priority Matrix"],"a":0,"vi":"CPM = Critical Path Method: tìm chuỗi task dài nhất, các task trên đó có slack = 0.","en":"CPM = Critical Path Method: find the longest chain of tasks; tasks on it have zero slack.","src":"03#31","ng":1}],"3.6":[{"id":"c3.6-1","w":3,"lv":"3.6","q":"Which is listed as an effect of risks on a project?","o":["Schedule or resources","Better team morale","Lower requirements","Fewer stakeholders"],"a":0,"vi":"Rủi ro ảnh hưởng: lịch/tài nguyên, chất lượng/hiệu năng, chi phí…","en":"Risks affect schedule/resources, quality/performance, cost…","src":"03#33"},{"id":"c3.6-2","w":3,"lv":"3.6","q":"In the software risks table, \"Staff turnover\" affects the:","o":["Project","Product","Business","Customer"],"a":0,"vi":"Staff turnover, Management change, Hardware unavailability → Project.","en":"Staff turnover, Management change, Hardware unavailability → Project.","src":"03#34"},{"id":"c3.6-3","w":3,"lv":"3.6","q":"\"Size underestimate\" affects:","o":["Project and product","Business only","Product only","Nothing measurable"],"a":0,"vi":"Requirements change, Specification delays, Size underestimate → Project và Product.","en":"Requirements change, Specification delays, Size underestimate → Project and Product.","src":"03#34"},{"id":"c3.6-4","w":3,"lv":"3.6","q":"\"Customers fail to understand the impact of requirements changes\" is which risk type?","o":["Requirements","People","Estimation","Organizational"],"a":0,"vi":"Requirements risk: thay đổi cần thiết kế lại lớn; khách không hiểu tác động thay đổi.","en":"Requirements risk: changes needing major rework; customers not understanding change impact.","src":"03#37"},{"id":"c3.6-5","w":3,"lv":"3.6","q":"\"The organization is restructured so that different management are responsible for the project\" is which risk type?","o":["Organizational","Technology","People","Requirements"],"a":0,"vi":"Organizational: tái cấu trúc, khó khăn tài chính.","en":"Organizational: restructuring, financial problems.","src":"03#37"},{"id":"c3.6-6","w":3,"lv":"3.6","q":"In risk analysis, loss can be expressed as:","o":["Categorical (negligible … catastrophic) or a number representing cost","Only a percentage from 0 to 100","Only the number of affected users","Only story points"],"a":0,"vi":"Loss: categorical hoặc một con số chi phí. Probability: categorical hoặc 0–100%.","en":"Loss: categorical or a cost number. Probability: categorical or 0–100%.","src":"03#38"},{"id":"c3.6-7","w":3,"lv":"3.6","q":"Using the lecture's scale, what is the RE of a Likely × Serious risk?","o":["5,625","6,750","3,750","2,250"],"a":0,"vi":"$75 \\times 75 = 5{,}625$ (ví dụ: tổ chức tái cấu trúc).","en":"$75 \\times 75 = 5{,}625$ (e.g. organizational restructuring).","src":"03#41"},{"id":"c3.6-8","w":3,"lv":"3.6","q":"Using the lecture's scale, what is the RE of a Seldom × Catastrophic risk?","o":["2,250","900","4,500","6,750"],"a":0,"vi":"$25 \\times 90 = 2{,}250$ (ví dụ: khó khăn tài chính, cắt ngân sách).","en":"$25 \\times 90 = 2{,}250$ (e.g. financial problems cut the budget).","src":"03#41"},{"id":"c3.6-9","w":3,"lv":"3.6","q":"In risk analysis, RE stands for:","o":["Risk exposure","Requirements engineering","Risk estimate","Risk evaluation"],"a":0,"vi":"Ở bài 03, RE = Risk exposure = Probability × Loss. Cẩn thận: ở bài 04, \"RE\" thường chỉ Requirements engineering.","en":"In lecture 03, RE = Risk exposure = Probability × Loss. Careful: in lecture 04 \"RE\" usually means requirements engineering.","src":"03#38","ng":1}],"3.7":[{"id":"c3.7-1","w":3,"lv":"3.7","q":"Which is NOT one of the risk planning strategies listed in the lecture?","o":["Hiding the risk from stakeholders","Avoidance strategies","Minimization strategies","Risk transfer"],"a":0,"vi":"Slide liệt kê: avoidance, minimization, contingency plans, risk transfer, buying information.","en":"The slide lists: avoidance, minimization, contingency plans, risk transfer, buying information.","src":"03#42"},{"id":"c3.7-2","w":3,"lv":"3.7","q":"The lecture's strategy for staff illness is to:","o":["Reorganize the team so there is more overlap of work","Buy a higher-performance database","Use a program generator","Derive traceability information"],"a":0,"vi":"Staff illness: tổ chức lại team để công việc chồng lấn, hiểu việc của nhau.","en":"Staff illness: reorganize the team for overlapping work.","src":"03#43"},{"id":"c3.7-3","w":3,"lv":"3.7","q":"For requirements changes, the lecture suggests:","o":["Derive traceability information and maximize information hiding","Prepare a briefing for senior management","Replace components with bought-in ones","Investigate a faster database"],"a":0,"vi":"Requirements changes: traceability để đánh giá tác động; tối đa information hiding.","en":"Requirements changes: traceability to assess impact; maximize information hiding.","src":"03#43"},{"id":"c3.7-4","w":3,"lv":"3.7","q":"\"Many requirements change requests and customer complaints\" are indicators of which risk type?","o":["Requirements","Technology","Estimation","People"],"a":0,"vi":"Dấu hiệu Requirements: nhiều change request, khách phàn nàn.","en":"Requirements indicators: many change requests, customer complaints.","src":"03#44"},{"id":"c3.7-5","w":3,"lv":"3.7","q":"How should high-priority risks be handled during monitoring?","o":["Reviewed at management progress meetings and reported weekly","Ignored until they occur","Reviewed only at the end of the project","Removed from the risk list"],"a":0,"vi":"Rủi ro ưu tiên cao: bàn ở họp tiến độ của ban quản lý, báo cáo hằng tuần.","en":"High-priority risks: discussed at management progress meetings, reported weekly.","src":"03#45"}],"4.1":[{"id":"c4.1-1","w":4,"lv":"4.1","q":"Requirements serve a dual function. At the detailed level they are the basis for:","o":["The development team","A bid or a contract","The marketing campaign","The hardware purchase"],"a":0,"vi":"Mức cao: cơ sở cho đấu thầu/hợp đồng. Mức chi tiết: cơ sở cho team phát triển.","en":"High level: basis for a bid or contract. Detailed level: basis for the development team.","src":"04#4"},{"id":"c4.1-2","w":4,"lv":"4.1","q":"Which is listed as a stakeholder type?","o":["System owners","Compilers","Test cases","Use cases"],"a":0,"vi":"4 loại: end users, system owners, system managers, external stakeholders.","en":"Types: end users, system owners, system managers, external stakeholders.","src":"04#5"},{"id":"c4.1-3","w":4,"lv":"4.1","q":"In the ATM example, which is listed as a stakeholder?","o":["Banking regulators","The C compiler","The UML standard","The Kanban board"],"a":0,"vi":"Stakeholder ATM gồm khách hàng, ngân hàng khác, quản lý, nhân viên quầy, DBA, bảo mật, marketing, bảo trì, cơ quan quản lý ngân hàng.","en":"ATM stakeholders include customers, other banks, managers, counter staff, DBAs, security, marketing, maintenance, banking regulators.","src":"04#6"},{"id":"c4.1-4","w":4,"lv":"4.1","q":"Stakeholders who do not use the system themselves but influence the requirements form which viewpoint?","o":["Indirect viewpoint","Interactor viewpoint","Domain viewpoint","User viewpoint"],"a":0,"vi":"Interactor: tương tác trực tiếp · Indirect: không dùng nhưng ảnh hưởng · Domain: đặc điểm lĩnh vực.","en":"Interactor: direct · Indirect: don't use but influence · Domain: domain characteristics.","src":"04#7"}],"4.2":[{"id":"c4.2-1","w":4,"lv":"4.2","q":"User requirements are written:","o":["In natural language, from the user's point of view","As a structured technical document","Only as source code","Only as UML diagrams"],"a":0,"vi":"User req: mức cao, ngôn ngữ tự nhiên, góc nhìn người dùng.","en":"User requirements: high level, natural language, user's view.","src":"04#9"},{"id":"c4.2-2","w":4,"lv":"4.2","q":"System requirements are mainly written for:","o":["Designers, implementers and testers","Only end users","Only the marketing team","Only the customer's lawyer"],"a":0,"vi":"System req: góc nhìn kỹ thuật (designer, implementer, tester), định nghĩa cái cần hiện thực.","en":"System requirements: technical view (designer, implementer, tester); what to implement.","src":"04#9"},{"id":"c4.2-3","w":4,"lv":"4.2","q":"\"Passwords must be at least 8 characters, contain at least one number, and be encrypted when stored\" is an example of a:","o":["System requirement","User requirement","Domain viewpoint","Use case scenario"],"a":0,"vi":"Đây là system requirement chi tiết hoá user requirement \"không muốn mật khẩu dễ đoán\".","en":"This system requirement details the user requirement \"password not easily guessed\".","src":"04#10"}],"4.3":[{"id":"c4.3-1","w":4,"lv":"4.3","q":"Requirements that state how the system should react to particular inputs are:","o":["Functional requirements","Non-functional requirements","Domain requirements","Organizational requirements"],"a":0,"vi":"Functional: phản ứng với input, hành xử trong tình huống cụ thể.","en":"Functional: reactions to inputs and behavior in situations.","src":"04#12"},{"id":"c4.3-2","w":4,"lv":"4.3","q":"Which property of good functional requirements is about having no contradictions?","o":["Consistency","Precision","Completeness","Portability"],"a":0,"vi":"Precision: không mơ hồ · Completeness: đủ mọi chức năng · Consistency: không mâu thuẫn.","en":"Precision: unambiguous · Completeness: all facilities · Consistency: no contradictions.","src":"04#15"},{"id":"c4.3-3","w":4,"lv":"4.3","q":"Usability, security and performance belong to which NFR type?","o":["Product requirements","Organizational requirements","External requirements","Domain requirements"],"a":0,"vi":"Product: performance, security, usability, reliability… Organizational: delivery, implementation, standards. External: ethical, privacy, safety.","en":"Product: performance, security, usability… Organizational: delivery, implementation, standards. External: ethical, privacy, safety.","src":"04#16"},{"id":"c4.3-4","w":4,"lv":"4.3","q":"Portability is about:","o":["Being easily transferred to different hardware or software environments","Following laws and regulations","Speed and responsiveness","Recovering from security breaches"],"a":0,"vi":"Portability: dễ chuyển sang môi trường phần cứng/phần mềm khác. Compliance: tuân thủ luật, chuẩn.","en":"Portability: easy transfer to other environments. Compliance: laws and standards.","src":"04#18"},{"id":"c4.3-5","w":4,"lv":"4.3","q":"Which statement about non-functional requirements matches the lecture?","o":["They may be more critical than functional requirements","They are always less important than functional requirements","They cannot be measured","They only concern the user interface"],"a":0,"vi":"NFR có thể quan trọng hơn functional requirement.","en":"NFRs may be more critical than functional requirements.","src":"04#16"},{"id":"c4.3-6","w":4,"lv":"4.3","q":"\"The system should be easy to use by experienced controllers\" is:","o":["A goal, not yet a verifiable requirement","A verifiable requirement","A domain requirement","A functional system requirement"],"a":0,"vi":"Đây là goal. Bản verifiable: dùng được mọi chức năng sau 2 giờ đào tạo, ≤ 2 lỗi/ngày.","en":"This is a goal. Verifiable: all functions after 2 hours training, ≤ 2 errors/day.","src":"04#19"},{"id":"c4.3-7","w":4,"lv":"4.3","q":"Which measure is listed for the property \"Ease of use\"?","o":["Training time","Mean time to failure","Processed transactions/second","Number of target systems"],"a":0,"vi":"Ease of use: training time, số khung help. Reliability: MTTF, availability. Speed: transactions/second.","en":"Ease of use: training time, help frames. Reliability: MTTF, availability. Speed: transactions/second.","src":"04#20"},{"id":"c4.3-8","w":4,"lv":"4.3","q":"\"Because of copyright restrictions, some documents must be deleted immediately on arrival\" is a:","o":["Domain requirement","Functional user requirement","Organizational requirement","Usability requirement"],"a":0,"vi":"Domain requirement đến từ lĩnh vực (ví dụ library: Z39.50, bản quyền).","en":"Domain requirements come from the domain (library: Z39.50, copyright).","src":"04#23"},{"id":"c4.3-9","w":4,"lv":"4.3","q":"In the NFR measures table, the reliability measure MTTF stands for:","o":["Mean time to failure","Maximum time to failure","Mean time to fix","Minimum time to failover"],"a":0,"vi":"MTTF = Mean time to failure (thời gian trung bình tới khi hỏng), một thước đo của Reliability.","en":"MTTF = Mean time to failure, a measure of reliability.","src":"04#20","ng":1}],"4.4":[{"id":"c4.4-1","w":4,"lv":"4.4","q":"In the lecture's RE process, what comes right after the feasibility study?","o":["Requirements gathering","Requirements validation","Requirements specification","Requirements management"],"a":0,"vi":"Feasibility study → Gathering → Specification → Validation; Management xuyên suốt.","en":"Feasibility study → Gathering → Specification → Validation; management throughout.","src":"04#26"},{"id":"c4.4-2","w":4,"lv":"4.4","q":"Which is listed as a problem of requirements gathering?","o":["Stakeholders don't know what they really want","Stakeholders always agree with each other","Requirements never change","Developers know the domain better than users"],"a":0,"vi":"Khó khăn: không biết mình muốn gì, dùng ngôn ngữ riêng, mâu thuẫn, chính trị, requirement thay đổi.","en":"Problems: don't know what they want, own terms, conflicts, politics, changing requirements.","src":"04#33"},{"id":"c4.4-3","w":4,"lv":"4.4","q":"Grouping related requirements into coherent clusters is which gathering activity?","o":["Classification and organization","Requirements discovery","Prioritization and negotiation","Requirements documentation"],"a":0,"vi":"Discovery → Classification & organization → Prioritization & negotiation → Documentation.","en":"Discovery → Classification & organization → Prioritization & negotiation → Documentation.","src":"04#34"},{"id":"c4.4-4","w":4,"lv":"4.4","q":"In MoSCoW, \"the release fails without it\" describes:","o":["Must have","Should have","Could have","Won't have (this time)"],"a":0,"vi":"Must: thiếu thì release thất bại · Should: quan trọng, có workaround · Could: có thì tốt · Won't: để lại lần này.","en":"Must: release fails without it · Should: workaround exists · Could: nice to have · Won't: left out this time.","src":"04#35"},{"id":"c4.4-5","w":4,"lv":"4.4","q":"In the course registration example, \"Suggest courses from the study plan\" is:","o":["Could have","Must have","Should have","Won't have (this time)"],"a":0,"vi":"Ví dụ: Must = đăng ký, chặn trùng lịch · Should = danh sách chờ · Could = gợi ý môn · Won't = mobile app.","en":"Must = register, no conflicts · Should = waiting list · Could = suggest courses · Won't = mobile app.","src":"04#35"},{"id":"c4.4-6","w":4,"lv":"4.4","q":"Which is a limitation of interviewing?","o":["It takes the client's time and schedule","It may interfere with the client's business","It only produces quantitative data","It requires an internship"],"a":0,"vi":"Interview: tốn thời gian của khách, khó kiểm soát, khó lấy chi tiết. Observe: tốn thời gian dev, làm phiền khách.","en":"Interview: costs client time, hard to control and to get details. Observe: costs dev time, interferes.","src":"04#36"},{"id":"c4.4-7","w":4,"lv":"4.4","q":"A question with limited possible answers in an interview is:","o":["A closed question","An open question","An indirect interview","A JAD session"],"a":0,"vi":"Closed: đáp án giới hạn. Open: không giới hạn.","en":"Closed: limited answers. Open: unlimited answers.","src":"04#36"},{"id":"c4.4-8","w":4,"lv":"4.4","q":"Facilitated sessions where stakeholders and developers work together are called:","o":["Workshops (JAD)","Questionnaires","Ethnography","Document analysis"],"a":0,"vi":"JAD workshops: stakeholder và developer làm việc chung có điều phối. Nên kết hợp nhiều kỹ thuật.","en":"JAD workshops: facilitated joint sessions. Combine several techniques.","src":"04#38"},{"id":"c4.4-9","w":4,"lv":"4.4","q":"The capital letters in \"MoSCoW\" stand for:","o":["Must have, Should have, Could have, Won't have (this time)","Must have, Should have, Can have, Will have","Model, Scope, Cost, Workload","Must have, Should have, Could have, Wish to have"],"a":0,"vi":"MoSCoW = Must / Should / Could / Won't have (this time).","en":"MoSCoW = Must / Should / Could / Won't have (this time).","src":"04#35","ng":1}],"4.5":[{"id":"c4.5-1","w":4,"lv":"4.5","q":"Which specification method uses mathematical equations and programming languages?","o":["Formal specification","Natural language","Structured natural language","Modeling language"],"a":0,"vi":"Natural: dễ viết nhưng mơ hồ · Structured: theo mẫu · Formal: toán, ngôn ngữ lập trình · Modeling: sơ đồ + form.","en":"Natural: easy but ambiguous · Structured: a form · Formal: math, programming languages · Modeling: diagram + form.","src":"04#41"},{"id":"c4.5-2","w":4,"lv":"4.5","q":"The requirements document (SRS) is:","o":["The official statement of what is required of the system developers","An informal chat log with users","The project budget","The test report"],"a":0,"vi":"SRS: tuyên bố chính thức; gồm user và system requirement; nói WHAT không HOW.","en":"SRS: the official statement; user and system requirements; WHAT not HOW.","src":"04#42"},{"id":"c4.5-3","w":4,"lv":"4.5","q":"In Agile methods (Scrum, XP), the main requirements documents are:","o":["A vision/objectives document and user stories","Use-case specifications only","IEEE 830 and test plans","Gantt charts"],"a":0,"vi":"RUP: Vision + use-case specs. Agile: Vision/objectives + user stories.","en":"RUP: vision + use-case specs. Agile: vision/objectives + user stories.","src":"04#45"},{"id":"c4.5-4","w":4,"lv":"4.5","q":"In INVEST, \"N\" stands for:","o":["Negotiable","Necessary","Numbered","Non-functional"],"a":0,"vi":"Independent, Negotiable, Valuable, Estimable, Small, Testable.","en":"Independent, Negotiable, Valuable, Estimable, Small, Testable.","src":"04#46"},{"id":"c4.5-5","w":4,"lv":"4.5","q":"In \"Given the course is full, when I click Register, then I see 'Course is full'\", the \"Given\" part states:","o":["The starting situation (precondition)","The user's action","The expected result","The story's priority"],"a":0,"vi":"Given: tình huống ban đầu · When: hành động · Then: kết quả mong đợi.","en":"Given: starting situation · When: action · Then: expected result.","src":"04#46"},{"id":"c4.5-6","w":4,"lv":"4.5","q":"Which is a recommended precaution for AI-assisted requirements engineering?","o":["Do not paste confidential or personal data into public AI tools","Let AI decide the priorities","Skip validation with real users","Use AI output as the final SRS"],"a":0,"vi":"Cẩn thận: AI có thể bịa requirement; luôn xác nhận với người dùng thật; người quyết định ưu tiên; không dán dữ liệu mật.","en":"Careful: AI may invent requirements; validate with users; humans decide priorities; no confidential data.","src":"04#47"},{"id":"c4.5-7","w":4,"lv":"4.5","q":"SRS stands for:","o":["Software Requirements Specification","System Requirements Standard","Software Release Schedule","Stakeholder Requirements Summary"],"a":0,"vi":"SRS = Software Requirements Specification: tuyên bố chính thức về những gì developer phải làm (WHAT, không phải HOW).","en":"SRS = Software Requirements Specification: the official statement of what developers must build (WHAT, not HOW).","src":"04#42, 00","ng":1},{"id":"c4.5-8","w":4,"lv":"4.5","q":"In INVEST, \"T\" stands for:","o":["Testable","Traceable","Timeboxed","Technical"],"a":0,"vi":"Independent, Negotiable, Valuable, Estimable, Small, Testable. Bẫy: Traceable là chủ đề của traceability, không thuộc INVEST.","en":"Independent, Negotiable, Valuable, Estimable, Small, Testable. Trap: traceable belongs to traceability, not INVEST.","src":"04#46","ng":1}],"4.6":[{"id":"c4.6-1","w":4,"lv":"4.6","q":"Why is requirements validation important?","o":["Fixing requirements errors after delivery costs much more than fixing them early","It replaces system testing","It is only needed for agile projects","It removes the need for stakeholders"],"a":0,"vi":"Lỗi requirement gây lỗi design, code, test; sửa sau bàn giao tốn hơn nhiều.","en":"Requirement errors spread into design, code, test; fixing after delivery costs far more.","src":"04#50"},{"id":"c4.6-2","w":4,"lv":"4.6","q":"\"Are all functions required by the customer included?\" is which check?","o":["Completeness","Validity","Realism","Verifiability"],"a":0,"vi":"Validity · Verifiability · Consistency · Completeness (đủ chức năng) · Realism.","en":"Validity · Verifiability · Consistency · Completeness (all functions) · Realism.","src":"04#51"},{"id":"c4.6-3","w":4,"lv":"4.6","q":"Using an executable model of the system to check requirements is:","o":["Prototyping","Requirements reviews","Test-case generation","Traceability"],"a":0,"vi":"Reviews: phân tích thủ công (phổ biến nhất) · Prototyping: mô hình chạy được · Test-case generation: viết test.","en":"Reviews: manual analysis (most common) · Prototyping: executable model · Test-case generation: write tests.","src":"04#52"},{"id":"c4.6-4","w":4,"lv":"4.6","q":"Which statement about requirements reviews is correct?","o":["They may be formal or informal and should involve analysts, designers, developers and testers","Only the customer may attend","They happen once after delivery","They must always be automated"],"a":0,"vi":"Review thường xuyên, có analyst/designer/dev/tester, formal hoặc informal.","en":"Regular reviews with analysts, designers, developers, testers; formal or informal.","src":"04#53"}],"4.7":[{"id":"c4.7-1","w":4,"lv":"4.7","q":"Why are requirements inevitably incomplete and inconsistent?","o":["New requirements emerge, business needs change and understanding improves","Engineers write them carelessly on purpose","Standards forbid complete requirements","Stakeholders never change their minds"],"a":0,"vi":"Requirement luôn thay đổi: nhu cầu mới, kinh doanh đổi, hiểu hệ thống hơn.","en":"Requirements change: new needs, business change, better understanding.","src":"04#55"},{"id":"c4.7-2","w":4,"lv":"4.7","q":"Which is listed as a reason requirements change?","o":["Business and technical environments change during the project","The compiler is updated","The team uses Kanban","The SRS is too short"],"a":0,"vi":"Lý do: nhu cầu kinh doanh, hiểu rõ hơn, ưu tiên đổi, môi trường kinh doanh/kỹ thuật đổi.","en":"Reasons: business needs, better understanding, priorities, environment changes.","src":"04#56"},{"id":"c4.7-3","w":4,"lv":"4.7","q":"Assessing the effects of a change on other requirements happens in:","o":["Change analysis and costing","Change request","Change implementation","Requirements discovery"],"a":0,"vi":"Change request → Change analysis and costing (đánh giá ảnh hưởng, chi phí) → Change implementation.","en":"Change request → analysis and costing (effects, cost) → implementation.","src":"04#57"},{"id":"c4.7-4","w":4,"lv":"4.7","q":"In the traceability matrix example, FR-02 \"Prevent timetable conflicts\" is linked to:","o":["UC-03 Register, ScheduleChecker, TC-13","UC-02 Search, Course index, PT-01","UC-03 Register, RegistrationService, TC-11","UC-01 Login, AuthService, TC-01"],"a":0,"vi":"FR-02 → UC-03 Register → ScheduleChecker → TC-13. Ma trận dùng cho impact analysis và test coverage.","en":"FR-02 → UC-03 Register → ScheduleChecker → TC-13. Used for impact analysis and test coverage.","src":"04#58"},{"id":"c4.7-5","w":4,"lv":"4.7","q":"In the traceability matrix, a row ID such as \"NFR-01\" identifies a:","o":["Non-functional requirement","New feature request","Non-formal requirement","Next-release feature"],"a":0,"vi":"NFR = Non-functional requirement. Ví dụ NFR-01: tìm kiếm ≤ 1 s ở P95, được truy tới test PT-01.","en":"NFR = Non-functional requirement. Example NFR-01: search in ≤ 1 s at P95, traced to test PT-01.","src":"04#12, 04#58","ng":1}],"5.1":[{"id":"c5.1-1","w":5,"lv":"5.1","q":"A model is:","o":["A simplified representation of a thing from a specific perspective","A complete copy of every detail of a system","Only a diagram drawn in UML","The final source code"],"a":0,"vi":"Model: biểu diễn đơn giản hoá từ một góc nhìn, giữ ý quan trọng, bỏ phần còn lại.","en":"Model: a simplified representation from one perspective, keeping what matters.","src":"05#3"},{"id":"c5.1-2","w":5,"lv":"5.1","q":"Which is listed as a benefit of modeling?","o":["Linking requirements and design","Removing the need for requirements","Guaranteeing zero bugs","Replacing testing"],"a":0,"vi":"Mô hình giúp nắm requirement, nối requirement với design, ghi quyết định thiết kế, tổ chức hệ thống lớn.","en":"Models capture requirements, link requirements and design, record decisions, organize large systems.","src":"05#5"},{"id":"c5.1-3","w":5,"lv":"5.1","q":"Which is NOT a modeling language listed in the lecture?","o":["SQL","BPMN","C4 Model","SysML"],"a":0,"vi":"Ví dụ modeling language: UML, C4 Model, BPMN, SysML.","en":"Modeling languages: UML, C4 Model, BPMN, SysML.","src":"05#6"},{"id":"c5.1-4","w":5,"lv":"5.1","q":"Which is a behavioral (dynamic) UML diagram?","o":["Sequence diagram","Class diagram","Deployment diagram","Package diagram"],"a":0,"vi":"Behavioral: use case, sequence, communication, state machine, activity. Structural: class, package, object, component, deployment.","en":"Behavioral: use case, sequence, communication, state machine, activity. Structural: class, package, object, component, deployment.","src":"05#8"},{"id":"c5.1-5","w":5,"lv":"5.1","q":"UML stands for:","o":["Unified Modeling Language","Universal Modeling Language","Unified Model Library","Universal Method Language"],"a":0,"vi":"UML = Unified Modeling Language, được OMG chuẩn hoá năm 1997.","en":"UML = Unified Modeling Language, adopted by OMG as a standard in 1997.","src":"05#7","ng":1},{"id":"c5.1-6","w":5,"lv":"5.1","q":"BPMN, another modeling language listed in the lecture, stands for:","o":["Business Process Model and Notation","Business Process Management Network","Basic Process Modeling Notation","Business Product Model and Navigation"],"a":0,"vi":"BPMN = Business Process Model and Notation. Các modeling language khác: UML, C4 Model, SysML.","en":"BPMN = Business Process Model and Notation. Other modeling languages: UML, C4 Model, SysML.","src":"05#6","ng":1}],"5.2":[{"id":"c5.2-1","w":5,"lv":"5.2","q":"The three main elements of a use case diagram are:","o":["Actors, use cases and relationships","Classes, objects and methods","Tasks, milestones and deliverables","States, events and transitions"],"a":0,"vi":"Use case diagram: Actors · Use cases · Relationships.","en":"Use case diagram: actors, use cases, relationships.","src":"05#12"},{"id":"c5.2-2","w":5,"lv":"5.2","q":"Many users who have the same role with the system are represented by:","o":["One actor","One actor per user","One use case","A generalization only"],"a":0,"vi":"Nhiều người cùng vai → một actor; một người nhiều vai → nhiều actor.","en":"Many users with one role → one actor; one user with many roles → many actors.","src":"05#14"},{"id":"c5.2-3","w":5,"lv":"5.2","q":"A use case produces:","o":["Observable results of value to the actor","Internal database tables","The system's class structure","Only error messages"],"a":0,"vi":"Use case: chuỗi hành động tạo kết quả quan sát được, có giá trị với actor; che giấu cấu trúc bên trong.","en":"A use case: actions producing observable results of value to the actor; hides internals.","src":"05#15-16"}],"5.3":[{"id":"c5.3-1","w":5,"lv":"5.3","q":"Which is NOT one of the path types of a use case flow of events?","o":["Parallel path","Basic path","Alternative path","Exceptional path"],"a":0,"vi":"Luồng sự kiện: basic, alternative, exceptional paths.","en":"Flows: basic, alternative and exceptional paths.","src":"05#17"},{"id":"c5.3-2","w":5,"lv":"5.3","q":"In a use case specification, the system state before the use case can begin is the:","o":["Precondition","Postcondition","Flow of events","Actor"],"a":0,"vi":"Precondition: trạng thái trước khi bắt đầu. Postcondition: trạng thái khi kết thúc.","en":"Precondition: state before it begins. Postcondition: state when it is over.","src":"05#18"},{"id":"c5.3-3","w":5,"lv":"5.3","q":"In the PayVAT example, which actors are involved?","o":["Time and Government","Customer and Bank","Nurse and Patient","Doctor and Employee"],"a":0,"vi":"PayVAT (UC1): actors Time, Government; precondition cuối quý kinh doanh.","en":"PayVAT (UC1): actors Time and Government; precondition end of a business quarter.","src":"05#18"},{"id":"c5.3-4","w":5,"lv":"5.3","q":"A scenario relates to a use case like:","o":["An object relates to a class","A class relates to a package","A test relates to a bug","An actor relates to a role"],"a":0,"vi":"Scenario là instance của use case, như object của class.","en":"A scenario is an instance of a use case, like an object of a class.","src":"05#20"}],"5.4":[{"id":"c5.4-1","w":5,"lv":"5.4","q":"Which relationship connects an actor and a use case?","o":["Association","Include","Extend","Generalization"],"a":0,"vi":"Association: actor ↔ use case. Include, Extend: giữa các use case. Generalization: tổng quát ↔ cụ thể.","en":"Association: actor ↔ use case. Include, extend: between use cases. Generalization: general ↔ specific.","src":"05#21"},{"id":"c5.4-2","w":5,"lv":"5.4","q":"Which use case can stand alone?","o":["The extending use case","The included use case","Neither of them","Both must always be used together"],"a":0,"vi":"Included không đứng một mình; extending có thể đứng một mình.","en":"The included one cannot stand alone; the extending one may.","src":"05#22"},{"id":"c5.4-3","w":5,"lv":"5.4","q":"In the Firefox example, \"Load and Display web page\" relates to \"Show images\" by:","o":["«include»","«extend»","Generalization","Association"],"a":0,"vi":"Load and Display «include» Show images; Read web page loud «extend» Load and Display.","en":"Load and Display «include» Show images; Read web page loud «extend» Load and Display.","src":"05#23"},{"id":"c5.4-4","w":5,"lv":"5.4","q":"A well-defined use case should distribute variations into:","o":["Extending use cases","Included use cases","Actors","Postconditions"],"a":0,"vi":"Hành vi chung → include; biến thể → extend.","en":"Common behavior → include; variations → extend.","src":"05#24"},{"id":"c5.4-5","w":5,"lv":"5.4","q":"Which layout guideline is given for use case diagrams?","o":["Minimize line crosses and group related elements","Use as many actors as possible","Put every use case in one row","Avoid any relationships"],"a":0,"vi":"Bố cục: giảm đường cắt nhau, nhóm phần liên quan; chỉ đưa phần cần thiết.","en":"Layout: minimize line crossings, group related elements; include only what is essential.","src":"05#24"}],"5.5":[{"id":"c5.5-1","w":5,"lv":"5.5","q":"The interface used by other software systems, rather than people, is the:","o":["Programming interface (API)","User interface (UI)","Use case","Screen diagram"],"a":0,"vi":"UI cho con người; API cho hệ thống khác.","en":"UI for people; API for other systems.","src":"05#26"},{"id":"c5.5-2","w":5,"lv":"5.5","q":"According to the lecture, users often judge a system by:","o":["Its interface rather than its functionality","Its source code quality","Its database design","Its licence"],"a":0,"vi":"Người dùng thường đánh giá hệ thống qua giao diện hơn là chức năng.","en":"Users often judge a system by its interface rather than its functionality.","src":"05#28"},{"id":"c5.5-3","w":5,"lv":"5.5","q":"Which human factor says inappropriate alarms and messages can increase stress?","o":["People make mistakes","Limited short-term memory","Different physical capabilities","Different interaction preferences"],"a":0,"vi":"People make mistakes: cảnh báo, thông báo không phù hợp làm tăng căng thẳng.","en":"People make mistakes: inappropriate alarms and messages increase stress.","src":"05#30"},{"id":"c5.5-4","w":5,"lv":"5.5","q":"UI and UX stand for:","o":["User interface / User experience","User integration / User expectation","Usability index / User experience","User interface / Usability examination"],"a":0,"vi":"UI = User interface: tương tác, giao diện và cảm giác của màn hình. UX = User experience: toàn bộ trải nghiệm với sản phẩm.","en":"UI = User interface: the interactivity, look and feel of a screen. UX = User experience: the user's overall experience with the product.","src":"05#29","ng":1}],"5.6":[{"id":"c5.6-1","w":5,"lv":"5.6","q":"\"The interface should provide appropriate interaction facilities for different types of system user\" is:","o":["User diversity","User guidance","User familiarity","Consistency"],"a":0,"vi":"User diversity: cách tương tác phù hợp cho nhiều kiểu người dùng.","en":"User diversity: suitable interaction for different types of users.","src":"05#33"},{"id":"c5.6-2","w":5,"lv":"5.6","q":"An undo button and confirmation before deleting mainly support which principle?","o":["Recoverability","Minimal surprise","User familiarity","User diversity"],"a":0,"vi":"Recoverability: cơ chế khôi phục khi lỗi (undo, xác nhận).","en":"Recoverability: mechanisms to recover from errors (undo, confirmation).","src":"05#33"},{"id":"c5.6-3","w":5,"lv":"5.6","q":"\"Semantic HTML that works with screen readers\" belongs to which POUR principle?","o":["Robust","Perceivable","Operable","Understandable"],"a":0,"vi":"Perceivable: text thay ảnh, tương phản 4.5:1 · Operable: bàn phím · Understandable: nhãn rõ · Robust: HTML ngữ nghĩa, screen reader.","en":"Perceivable: alt text, 4.5:1 · Operable: keyboard · Understandable: clear labels · Robust: semantic HTML, screen readers.","src":"05#34"},{"id":"c5.6-4","w":5,"lv":"5.6","q":"Clear labels, predictable navigation and helpful error messages belong to:","o":["Understandable","Robust","Perceivable","Operable"],"a":0,"vi":"Understandable: nhãn rõ, điều hướng dễ đoán, thông báo lỗi có ích.","en":"Understandable: clear labels, predictable navigation, helpful errors.","src":"05#34"},{"id":"c5.6-5","w":5,"lv":"5.6","q":"WCAG's POUR principles are:","o":["Perceivable, Operable, Understandable, Robust","Perceivable, Operable, Usable, Responsive","Portable, Operable, Understandable, Reliable","Perceivable, Optimized, Understandable, Robust"],"a":0,"vi":"POUR = Perceivable · Operable · Understandable · Robust.","en":"POUR = Perceivable · Operable · Understandable · Robust.","src":"05#34","ng":1}],"5.7":[{"id":"c5.7-1","w":5,"lv":"5.7","q":"Which interaction style lets the user read a list of items and select the most appropriate?","o":["Menu selection","Command language","Direct manipulation","Natural language"],"a":0,"vi":"Menu selection: đọc danh sách và chọn mục phù hợp.","en":"Menu selection: read a list and select the best item.","src":"05#38"},{"id":"c5.7-2","w":5,"lv":"5.7","q":"Which interaction style responds to arbitrary sentences, with or without speech recognition?","o":["Natural language","Form fill-in","Menu selection","Command language"],"a":0,"vi":"Natural language: phản hồi câu tuỳ ý, có hoặc không có nhận dạng giọng nói.","en":"Natural language: responds to arbitrary sentences, with or without speech.","src":"05#41"},{"id":"c5.7-3","w":5,"lv":"5.7","q":"Analogue presentation (e.g. a bar chart) is best for showing:","o":["Relative values","Precise values in little space","Static information only","Error messages"],"a":0,"vi":"Analogue: giá trị tương đối. Digital: giá trị chính xác, ít chỗ.","en":"Analogue: relative values. Digital: precise values, little space.","src":"05#42"},{"id":"c5.7-4","w":5,"lv":"5.7","q":"Information that changes during a session is:","o":["Dynamic information","Static information","Digital information","Analogue information"],"a":0,"vi":"Static: khởi tạo đầu phiên. Dynamic: thay đổi trong phiên.","en":"Static: set at session start. Dynamic: changes during the session.","src":"05#42"}],"5.8":[{"id":"c5.8-1","w":5,"lv":"5.8","q":"Which user analysis technique models the steps involved in completing a task?","o":["Task analysis","Ethnography","Questionnaires","Heatmaps"],"a":0,"vi":"Task analysis: mô hình các bước · Interview/questionnaire: hỏi · Ethnography: quan sát.","en":"Task analysis: models steps · Interviews/questionnaires: ask · Ethnography: observe.","src":"05#46"},{"id":"c5.8-2","w":5,"lv":"5.8","q":"In system prototyping, the screen list is identified based on:","o":["Use cases","The database schema","The Gantt chart","The test report"],"a":0,"vi":"Bước: screen list (dựa trên use case) → screen diagram → screen design → screen specification.","en":"Steps: screen list (from use cases) → screen diagram → screen design → screen specification.","src":"05#48"},{"id":"c5.8-3","w":5,"lv":"5.8","q":"Which IS a usability attribute used in interface evaluation?","o":["Learnability","Profitability","Portability","Scalability"],"a":0,"vi":"Usability: learnability, speed of operation, robustness, recoverability, adaptability.","en":"Usability: learnability, speed of operation, robustness, recoverability, adaptability.","src":"05#49"},{"id":"c5.8-4","w":5,"lv":"5.8","q":"Which is a simple interface evaluation technique listed in the lecture?","o":["Screen/session recording and usage analytics (heatmaps)","Formal mathematical proof","Code review","CMMI appraisal"],"a":0,"vi":"Kỹ thuật đơn giản: phiếu hỏi, ghi màn hình/phiên, usage analytics (heatmap), công cụ thu lỗi.","en":"Simple techniques: questionnaires, screen/session recording, analytics (heatmaps), error logging tools.","src":"05#50"},{"id":"c5.8-5","w":5,"lv":"5.8","q":"Which is a recommended color guideline?","o":["Use color change to show a change in system status","Use color alone to communicate meaning","Use as many colors as possible","Pair any colors freely"],"a":0,"vi":"Nên giới hạn số màu, đổi màu báo đổi trạng thái, mã màu nhất quán; lỗi thường gặp: dùng màu để truyền ý nghĩa.","en":"Limit colors, use color change for status change, code consistently; mistake: color to convey meaning.","src":"05#53"},{"id":"c5.8-6","w":5,"lv":"5.8","q":"What should be the determining factor in error message design?","o":["The background and experience of the users","The developer's preferred wording","The error code number","The length of the stack trace"],"a":0,"vi":"Nền tảng và kinh nghiệm của người dùng quyết định cách viết thông báo; thông báo polite, concise, consistent, constructive.","en":"Users' background and experience drive message design; polite, concise, consistent, constructive.","src":"05#54"},{"id":"c5.8-7","w":5,"lv":"5.8","q":"\"Natural constraints\" and \"business constraints\" are types of:","o":["Validation constraints for user input","UI design principles","Risk strategies","UML relationships"],"a":0,"vi":"Data validation: đừng tin người dùng; ràng buộc natural/business; early/late checking.","en":"Data validation: don't trust users; natural/business constraints; early/late checking.","src":"05#57"}],"6.1":[{"id":"c6.1-1","w":6,"lv":"6.1","q":"Which level of software design deals with data structures and algorithms?","o":["Detailed design","Architectural design","High-level design","Requirements definition"],"a":0,"vi":"Detailed design: cấu trúc dữ liệu và thuật toán. Architectural: cấu trúc tổng thể. High-level: sub-system và module.","en":"Detailed design covers data structures and algorithms; architectural is the overall structure; high-level is sub-systems and modules.","src":"06#4"},{"id":"c6.1-2","w":6,"lv":"6.1","q":"What is the difference between architectural design and software architecture?","o":["Architectural design is the process; software architecture is its output document","Architectural design is the document; software architecture is the process","They are two names for the detailed design of algorithms","Architectural design happens after implementation; architecture before"],"a":0,"vi":"Architectural design là quá trình; software architecture là tài liệu, kết quả của quá trình đó.","en":"Architectural design is the process; software architecture is the description of its result.","src":"06#6"},{"id":"c6.1-3","w":6,"lv":"6.1","q":"Architectural design is described as the stage that links:","o":["Requirements engineering and design","Testing and maintenance","Implementation and deployment","Coding and unit testing"],"a":0,"vi":"Architectural design là giai đoạn sớm, nối requirements engineering với design.","en":"It is an early design stage linking requirements engineering and design processes.","src":"06#7"},{"id":"c6.1-4","w":6,"lv":"6.1","q":"A block diagram of the architecture is mainly useful for:","o":["Communicating with stakeholders and planning the project","Generating source code automatically","Proving that the algorithms are correct","Replacing the requirements document"],"a":0,"vi":"Block diagram (hộp và đường) giúp trao đổi với stakeholder và lập kế hoạch dự án.","en":"Boxes and lines are useful for stakeholder communication and project planning.","src":"06#9"},{"id":"c6.1-5","w":6,"lv":"6.1","q":"What are the four levels of the C4 model, from widest to narrowest?","o":["System Context, Containers, Components, Code","Classes, Components, Containers, Cloud","Code, Components, Containers, Context","Client, Controller, Container, Code"],"a":0,"vi":"C4 phóng to như bản đồ: System Context → Containers → Components → Code.","en":"C4 zooms like a map: System Context → Containers → Components → Code.","src":"06#12"},{"id":"c6.1-6","w":6,"lv":"6.1","q":"In the C4 model, a web app, a mobile app, an API and a database are examples of:","o":["Containers","Components","System contexts","Code-level classes"],"a":0,"vi":"Container là đơn vị chạy hoặc triển khai được: web app, mobile app, API, database.","en":"Containers are deployable or runnable units: web app, mobile app, API, database.","src":"06#12"}],"6.2":[{"id":"c6.2-1","w":6,"lv":"6.2","q":"Which is an example of a sub-system rather than a module?","o":["Google Maps embedded in an app","A UI component on your website","A private helper function","A CSS stylesheet"],"a":0,"vi":"Sub-system là một hệ thống riêng, chạy độc lập, như Google Maps nhúng vào app. Module như một UI component.","en":"A sub-system is a system in its own right, like Google Maps in an app; a UI component is a module.","src":"06#13"},{"id":"c6.2-2","w":6,"lv":"6.2","q":"Which is NOT one of the three advantages of an explicit software architecture listed in the lecture?","o":["Guaranteed bug-free code","Stakeholder communication","System analysis","Large-scale reuse"],"a":0,"vi":"Ba lợi ích: stakeholder communication, system analysis, large-scale reuse.","en":"The three: stakeholder communication, system analysis, large-scale reuse.","src":"06#15"},{"id":"c6.2-3","w":6,"lv":"6.2","q":"To improve security, the architecture should:","o":["Use a layered architecture with critical assets in the inner layers","Use large-grain components and minimize communication","Add redundant components for fault tolerance","Use fine-grain, replaceable components"],"a":0,"vi":"Security: layered, tài sản quan trọng ở lớp trong. Large-grain là cho performance, redundant cho availability, fine-grain cho maintainability.","en":"Security: layered with critical assets inside. Large-grain is for performance, redundancy for availability, fine-grain for maintainability.","src":"06#16"},{"id":"c6.2-4","w":6,"lv":"6.2","q":"Using large-grain components improves performance but reduces:","o":["Maintainability","Availability","Safety","Security"],"a":0,"vi":"Architectural conflict: component lớn giúp performance nhưng giảm maintainability.","en":"Architectural conflict: large-grain components help performance but reduce maintainability.","src":"06#17"},{"id":"c6.2-5","w":6,"lv":"6.2","q":"Architecturally significant requirements are mostly:","o":["Non-functional requirements plus some high-priority functional needs","Only the user interface requirements","Low-priority functional requirements","Requirements that do not affect technology choices"],"a":0,"vi":"Requirement ảnh hưởng lớn tới kiến trúc: chủ yếu là NFR và vài FR ưu tiên cao.","en":"They address non-functional concerns and some high-priority functional needs.","src":"06#18"}],"6.3":[{"id":"c6.3-1","w":6,"lv":"6.3","q":"Which is NOT listed as an element of a design decision?","o":["Budget","Rationale","Alternatives","Implications"],"a":0,"vi":"Một quyết định gồm: issues, decision, assumptions, rationale, alternatives, implications.","en":"Elements: issues, decision, assumptions, rationale, alternatives, implications.","src":"06#21"},{"id":"c6.3-2","w":6,"lv":"6.3","q":"\"How will the system be decomposed into modules?\" is:","o":["One of the questions for architectural design","A step of detailed design only","A question for acceptance testing","Part of the use case specification"],"a":0,"vi":"Đây là một trong 7 câu hỏi khi thiết kế kiến trúc.","en":"It is one of the seven questions for architectural design.","src":"06#22"},{"id":"c6.3-3","w":6,"lv":"6.3","q":"In the example decision \"three-tier architecture with an OO language\", what was the issue?","o":["The system has to be maintainable","The system must handle 1,000 transactions per second","The team had no OO experience","The database had to be MySQL"],"a":0,"vi":"Issue: hệ thống phải dễ bảo trì. Rationale: đổi một tầng không ảnh hưởng tầng khác.","en":"Issue: the system has to be maintainable. Rationale: one tier can change without affecting the others.","src":"06#24"},{"id":"c6.3-4","w":6,"lv":"6.3","q":"Which status value does an ADR template list?","o":["Superseded by ADR-007","Deployed to production","Assigned to the tester","Rejected by the customer"],"a":0,"vi":"Status của ADR: proposed, accepted, superseded by ADR-007.","en":"ADR status: proposed, accepted, superseded by ADR-007.","src":"06#25"},{"id":"c6.3-5","w":6,"lv":"6.3","q":"What does ADR stand for?","o":["Architecture Decision Record","Application Design Requirement","Architecture Design Review","Automated Deployment Release"],"a":0,"vi":"ADR = Architecture Decision Record, lưu trong docs/adr/.","en":"ADR = Architecture Decision Record, kept in docs/adr/.","src":"06#25","ng":1}],"6.4":[{"id":"c6.4-1","w":6,"lv":"6.4","q":"How does an architectural style differ from a design pattern?","o":["A style is high-level and addresses the whole system; a pattern is a micro-architecture","A style is low-level code; a pattern is the overall system structure","A style applies only to databases; a pattern only to UIs","There is no difference"],"a":0,"vi":"Style ở high-level design, cả hệ thống. Design pattern là micro-architecture, không nói về cấu trúc cả hệ thống.","en":"A style is at high-level design; a pattern is a micro-architecture that does not address the complete system.","src":"06#28"},{"id":"c6.4-2","w":6,"lv":"6.4","q":"An architectural style is described in the form of:","o":["Problem, Context, Solution","Issue, Decision, Status","Input, Process, Output","Actor, Use case, Scenario"],"a":0,"vi":"Một style được mô tả bằng Problem, Context, Solution.","en":"A style is described as Problem, Context, Solution.","src":"06#29"},{"id":"c6.4-3","w":6,"lv":"6.4","q":"Which is a disadvantage of the repository style?","o":["Sub-systems must agree on one repository data model","Data distribution is straightforward","No central management of backup","Large amounts of data cannot be shared"],"a":0,"vi":"Repository: phải thống nhất một data model (luôn là thoả hiệp), đổi data model khó, khó phân tán.","en":"Repository: one agreed data model (a compromise), costly data evolution, hard to distribute.","src":"06#35"},{"id":"c6.4-4","w":6,"lv":"6.4","q":"Which is a disadvantage of the client-server style?","o":["There is no shared data model","Adding new servers is difficult","It cannot use networked systems","All data sits in one central repository"],"a":0,"vi":"Client-server: không có data model chung, trao đổi dữ liệu có thể kém hiệu quả, không có registry trung tâm.","en":"Client-server: no shared data model, possibly inefficient interchange, no central register.","src":"06#38"},{"id":"c6.4-5","w":6,"lv":"6.4","q":"In a peer-to-peer style:","o":["Every node can act as both client and server","One central server controls all communication","Clients never talk to each other","Data is always kept consistent automatically"],"a":0,"vi":"P2P: mỗi node vừa client vừa server, không có server trung tâm.","en":"P2P: every node is both client and server, with no central server.","src":"06#39"}],"6.5":[{"id":"c6.5-1","w":6,"lv":"6.5","q":"In a layered style, when a layer's interface changes:","o":["Only the adjacent layer is affected","Every layer must be rewritten","Only the database layer is affected","The user interface stops working"],"a":0,"vi":"Layered hỗ trợ phát triển tăng dần: đổi interface của một lớp chỉ ảnh hưởng lớp kề bên.","en":"Only the adjacent layer is affected, which supports incremental development.","src":"06#40"},{"id":"c6.5-2","w":6,"lv":"6.5","q":"Which is a disadvantage of the layered style?","o":["Performance problems from going through many layers","No separation of concerns","Layers cannot be reused","Changes to the UI affect every layer"],"a":0,"vi":"Layered: giao tiếp cứng nhắc giữa các lớp, chậm vì đi qua nhiều lớp.","en":"Layered: inflexible communication, performance cost of many layers.","src":"06#42"},{"id":"c6.5-3","w":6,"lv":"6.5","q":"In MVC, which component accepts commands and input?","o":["Controller","Model","View","Database"],"a":0,"vi":"Controller nhận lệnh và input, chuyển lệnh đi. Model: dữ liệu và logic. View: trình bày.","en":"Controller accepts and passes on commands; Model holds data and logic; View presents.","src":"06#43"},{"id":"c6.5-4","w":6,"lv":"6.5","q":"Which is a disadvantage of pipes and filters?","o":["It is difficult to support event-based interaction","New transformations are hard to add","Transformations cannot be reused","It cannot run sequentially"],"a":0,"vi":"Pipes & filters: cần định dạng dữ liệu chung và khó hỗ trợ tương tác theo sự kiện.","en":"Pipes and filters need a common data format and struggle with event-based interaction.","src":"06#49"},{"id":"c6.5-5","w":6,"lv":"6.5","q":"The interrupt-driven style is used where:","o":["A fast response to an event is essential, as in real-time systems","Large amounts of data must be shared","Services are exposed over the web","Users enter data into forms"],"a":0,"vi":"Interrupt-driven dùng cho hệ thống thời gian thực; phản hồi nhanh nhưng khó lập trình và khó validate.","en":"It is for real-time systems; fast response but complex to program and hard to validate.","src":"06#50"},{"id":"c6.5-6","w":6,"lv":"6.5","q":"What does MVC stand for?","o":["Model-View-Controller","Module-Version-Component","Main-View-Client","Model-Validation-Container"],"a":0,"vi":"MVC = Model-View-Controller.","en":"MVC = Model-View-Controller.","src":"06#43","ng":1}],"6.6":[{"id":"c6.6-1","w":6,"lv":"6.6","q":"Which set lists the four traits of service-oriented architecture on the slide?","o":["Modularity, interoperability, reusability, loose coupling","Autonomy, resilience, scalability, flexibility","Encapsulation, inheritance, polymorphism, abstraction","Performance, security, safety, availability"],"a":0,"vi":"SOA: modularity, interoperability, reusability, loose coupling. Bộ autonomy… là của microservices.","en":"SOA: modularity, interoperability, reusability, loose coupling. Autonomy… belongs to microservices.","src":"06#52"},{"id":"c6.6-2","w":6,"lv":"6.6","q":"In a microservice architecture, each service can be:","o":["Developed, deployed and scaled independently","Deployed only together with all other services","Changed only by editing a shared database schema","Run only on a single server"],"a":0,"vi":"Microservices: mỗi service phát triển, triển khai và mở rộng độc lập.","en":"Each microservice is developed, deployed and scaled independently.","src":"06#53"},{"id":"c6.6-3","w":6,"lv":"6.6","q":"According to the lecture, what should a small team building a new product start with?","o":["A well-structured modular monolith","Dozens of microservices","A peer-to-peer network","An interrupt-driven design"],"a":0,"vi":"Nhóm nhỏ, sản phẩm mới: bắt đầu bằng modular monolith, chỉ tách service khi có nhu cầu rõ ràng.","en":"Start with a modular monolith; split into services only when there is a clear need.","src":"06#55"},{"id":"c6.6-4","w":6,"lv":"6.6","q":"Which is a disadvantage of event-driven architecture?","o":["End-to-end flows are harder to trace and debug","Adding new consumers is difficult","Components are tightly coupled","Communication must be synchronous"],"a":0,"vi":"Event-driven: khó lần theo và debug, eventual consistency, đổi schema event phải quản lý version.","en":"Event-driven: hard to trace and debug, eventual consistency, careful schema versioning.","src":"06#56"}],"7.1":[{"id":"c7.1-1","w":7,"lv":"7.1","q":"Which UML diagram is described as the most commonly used in practice?","o":["Class diagram","Sequence diagram","Use case diagram","Deployment diagram"],"a":0,"vi":"Class diagram là sơ đồ dùng nhiều nhất trong thực tế.","en":"The class diagram is the most commonly used diagram in practice.","src":"07#3"},{"id":"c7.1-2","w":7,"lv":"7.1","q":"What are the three compartments of a UML class box?","o":["Name, attributes, operations","Name, states, transitions","Actor, use case, relationship","Table, column, key"],"a":0,"vi":"Class: tên, attributes, operations.","en":"A class shows its name, attributes and operations.","src":"07#4"},{"id":"c7.1-3","w":7,"lv":"7.1","q":"In the attribute \"-baseSalary: float\", what does the colon introduce?","o":["The data type","The visibility","The default value","The multiplicity"],"a":0,"vi":"Kiểu dữ liệu được viết sau dấu hai chấm.","en":"The data type is specified after a colon.","src":"07#5"},{"id":"c7.1-4","w":7,"lv":"7.1","q":"In UML, the symbol # in front of an attribute means:","o":["protected","public","private","static"],"a":0,"vi":"+ public, - private, # protected.","en":"+ public, - private, # protected.","src":"07#6"},{"id":"c7.1-5","w":7,"lv":"7.1","q":"Which is a valid notation for an interface?","o":["A class with the stereotype <<interface>>","A filled diamond","A dashed rectangle with no name","A stick figure"],"a":0,"vi":"Interface: một hình tròn kèm tên, hoặc một class có stereotype <<interface>>.","en":"An interface is a named circle or a class with the <<interface>> stereotype.","src":"07#7"}],"7.2":[{"id":"c7.2-1","w":7,"lv":"7.2","q":"Two classes have a dependency relationship when:","o":["One class is used as a parameter in an operation of the other","One class owns the lifetime of the other","One class is a subclass of the other","Both classes are stored in the same table"],"a":0,"vi":"Dependency: một operation gọi operation của class khác, hoặc class kia là tham số. Lỏng nhất trong các quan hệ.","en":"Dependency: one operation calls another class's operation, or one class is a parameter. It is the least restrictive.","src":"07#10"},{"id":"c7.2-2","w":7,"lv":"7.2","q":"Generalization is a relationship between:","o":["A general class and a more specific class","Two objects linked at runtime","A class and its database table","An actor and a use case"],"a":0,"vi":"Generalization: superclass (chung) và subclass (cụ thể).","en":"Generalization relates a superclass and a subclass.","src":"07#11"},{"id":"c7.2-3","w":7,"lv":"7.2","q":"In \"Person — works for — Company\", what are +employee and +employer?","o":["Role names at the two ends of the association","Multiplicities of the association","Names of two subclasses","Operations of Person and Company"],"a":0,"vi":"Association có thể có tên (works for) và role ở hai đầu (+employee, +employer). Multiplicity là 1..* và 0..*.","en":"An association can have a name (works for) and roles at both ends (+employee, +employer); the multiplicities are 1..* and 0..*.","src":"07#12-13"},{"id":"c7.2-4","w":7,"lv":"7.2","q":"A University owns its Faculties and is responsible for their lifetime. This is:","o":["Composition","Aggregation","Dependency","Generalization"],"a":0,"vi":"Composition: association mạnh, sở hữu và chịu trách nhiệm vòng đời (thoi đặc).","en":"Composition: a strong association that owns the lifetime (filled diamond).","src":"07#14"},{"id":"c7.2-5","w":7,"lv":"7.2","q":"Aggregation is described as:","o":["A weak association: a class uses another but does not own it","A strong association that controls the other's lifetime","A dashed dependency arrow","A superclass–subclass relationship"],"a":0,"vi":"Aggregation: association yếu, dùng nhưng không sở hữu (thoi rỗng).","en":"Aggregation: a weak association, using without owning (hollow diamond).","src":"07#14"},{"id":"c7.2-6","w":7,"lv":"7.2","q":"In the Online Shop example, how are Credit, Cash and Check related to Payment?","o":["They are subclasses of the abstract class Payment","They are attributes of Payment","They aggregate Payment","They depend on Order through Payment"],"a":0,"vi":"Payment là abstract class; Credit, Cash, Check là subclass qua generalization.","en":"Payment is abstract; Credit, Cash and Check are its subclasses.","src":"07#15"}],"7.3":[{"id":"c7.3-1","w":7,"lv":"7.3","q":"Which describes a domain object?","o":["A real-world entity that takes a role in the business process and has stored data","An entity created only to support processing and calculations","A screen or form shown to the user","A temporary variable inside an operation"],"a":0,"vi":"Domain object: thực thể ngoài đời, có vai trò trong nghiệp vụ, có dữ liệu lưu. System object: tạo ra để xử lý.","en":"Domain objects are real-world entities with stored data; system objects support processing.","src":"07#17"},{"id":"c7.3-2","w":7,"lv":"7.3","q":"In BCE, which object coordinates the steps of one use case?","o":["Control","Boundary","Entity","Actor"],"a":0,"vi":"Control điều phối các bước của một use case, ví dụ RegistrationController.","en":"The control object coordinates one use case, e.g. RegistrationController.","src":"07#18"},{"id":"c7.3-3","w":7,"lv":"7.3","q":"Which BCE rule of thumb is correct?","o":["Actors talk only to boundaries","Entities call boundaries to show results","Control objects are domain objects","Boundaries hold long-lived business data"],"a":0,"vi":"Actor chỉ nói chuyện với boundary; entity không bao giờ gọi boundary; boundary và control là system object.","en":"Actors talk only to boundaries; entities never call boundaries; boundary and control are system objects.","src":"07#18"},{"id":"c7.3-4","w":7,"lv":"7.3","q":"In step 1, candidate domain classes come from:","o":["Nouns in use case specifications and user stories","Verbs in the test plan","Column names of an existing spreadsheet only","The list of UI screens"],"a":0,"vi":"Ứng viên class là các danh từ trong use case spec và user story.","en":"Candidate classes are the nouns in use case specs and user stories.","src":"07#19"},{"id":"c7.3-5","w":7,"lv":"7.3","q":"What does BCE stand for?","o":["Boundary – Control – Entity","Business – Class – Event","Base – Component – Extension","Behaviour – Container – Element"],"a":0,"vi":"BCE = Boundary – Control – Entity.","en":"BCE = Boundary – Control – Entity.","src":"07#18","ng":1}],"7.4":[{"id":"c7.4-1","w":7,"lv":"7.4","q":"In step 2, when do you create boundary and control objects?","o":["When no domain object can perform a step of the use case","Only after the database is designed","For every noun in the requirements","Never: only entities are allowed"],"a":0,"vi":"Mỗi bước trong kịch bản phải do một object làm; nếu không domain object nào làm được thì tạo boundary/control.","en":"Every step must be performed by some object; create boundary and control objects when no domain object can do it.","src":"07#21"},{"id":"c7.4-2","w":7,"lv":"7.4","q":"In a sequence diagram, which combined fragment expresses if/else?","o":["alt","opt","loop","par"],"a":0,"vi":"alt = if/else, opt = if, loop = lặp, par = song song.","en":"alt = if/else, opt = if, loop, par = parallel.","src":"07#22"},{"id":"c7.4-3","w":7,"lv":"7.4","q":"Every message in a sequence diagram should become:","o":["An operation in the class diagram","A new table in the database","A new use case","An attribute of the actor"],"a":0,"vi":"Mỗi message trở thành một operation trong class diagram.","en":"Every message should become an operation in the class diagram.","src":"07#22"},{"id":"c7.4-4","w":7,"lv":"7.4","q":"In the Login failed scenario, Encryptor and LoginAccount are classified as:","o":["System objects","Domain objects","Actors","Use cases"],"a":0,"vi":"Encryptor (bước 4) và LoginAccount (bước 5) là system object.","en":"Encryptor (step 4) and LoginAccount (step 5) are system objects.","src":"07#24"},{"id":"c7.4-5","w":7,"lv":"7.4","q":"\"Same operation, different data or processing\" calls for:","o":["Polymorphism","Encapsulation","Composition","Normalization"],"a":0,"vi":"Dữ liệu dùng chung → inheritance; cùng operation, xử lý khác → polymorphism; giấu dữ liệu → encapsulation.","en":"Shared data → inheritance; same operation, different processing → polymorphism; hide data → encapsulation.","src":"07#25"},{"id":"c7.4-6","w":7,"lv":"7.4","q":"In a state machine, how is a transition written?","o":["event [guard] / action","action / event [guard]","[state] event : action","guard -> event -> state"],"a":0,"vi":"Transition viết dạng event [guard] / action, ví dụ cancel [before shipping] / refund.","en":"Transitions read event [guard] / action, e.g. cancel [before shipping] / refund.","src":"07#26"}],"7.5":[{"id":"c7.5-1","w":7,"lv":"7.5","q":"Which practice lowers coupling?","o":["Depending on interfaces and passing data explicitly","Sharing global state between modules","Putting every responsibility in one module","Copying code between modules"],"a":0,"vi":"Low coupling: phụ thuộc vào interface, truyền dữ liệu tường minh, tránh trạng thái toàn cục.","en":"Low coupling: depend on interfaces, pass data explicitly, avoid shared global state.","src":"07#28"},{"id":"c7.5-2","w":7,"lv":"7.5","q":"High cohesion means:","o":["One module has one clear responsibility","Modules depend strongly on each other","Every module can do everything","Modules share one global variable"],"a":0,"vi":"Cohesion cao: một module = một trách nhiệm rõ ràng.","en":"High cohesion: one module = one clear responsibility.","src":"07#28"},{"id":"c7.5-3","w":7,"lv":"7.5","q":"A \"God class\" that does everything violates which SOLID principle?","o":["Single Responsibility","Liskov Substitution","Interface Segregation","Dependency Inversion"],"a":0,"vi":"S: một class chỉ có một lý do để thay đổi; vi phạm thì sinh ra God class.","en":"S: a class has one reason to change; violating it gives a God class.","src":"07#29"},{"id":"c7.5-4","w":7,"lv":"7.5","q":"Business logic that creates database objects directly violates:","o":["Dependency Inversion","Open/Closed","Single Responsibility","Liskov Substitution"],"a":0,"vi":"D: phụ thuộc vào abstraction, không vào class cụ thể.","en":"D: depend on abstractions, not concrete classes.","src":"07#29"},{"id":"c7.5-5","w":7,"lv":"7.5","q":"What does YAGNI stand for?","o":["You Aren't Gonna Need It","Yet Another Generic Network Interface","Your Application Gets New Inputs","You Always Get New Ideas"],"a":0,"vi":"YAGNI = You Aren't Gonna Need It. DRY = Don't Repeat Yourself, KISS = Keep It Simple.","en":"YAGNI = You Aren't Gonna Need It; DRY = Don't Repeat Yourself; KISS = Keep It Simple.","src":"07#28","ng":1}],"7.6":[{"id":"c7.6-1","w":7,"lv":"7.6","q":"Which question do creational patterns answer?","o":["How are objects created?","How are classes and objects composed?","How do objects interact and share responsibilities?","How is data stored in tables?"],"a":0,"vi":"Creational: tạo object. Structural: ghép class/object. Behavioral: tương tác, chia trách nhiệm.","en":"Creational: creation. Structural: composition. Behavioral: interaction and responsibilities.","src":"07#31"},{"id":"c7.6-2","w":7,"lv":"7.6","q":"Adapter, Facade and Proxy belong to which group?","o":["Structural","Creational","Behavioral","Architectural"],"a":0,"vi":"Structural: Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy.","en":"Structural: Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy.","src":"07#31"},{"id":"c7.6-3","w":7,"lv":"7.6","q":"Email, SMS and the app must be notified when a booking changes. Which pattern fits?","o":["Observer","Singleton","Adapter","Builder"],"a":0,"vi":"Báo nhiều bên khi một thứ thay đổi → Observer.","en":"Notifying many parties when something changes → Observer.","src":"07#32"},{"id":"c7.6-4","w":7,"lv":"7.6","q":"Why should Singleton be used carefully?","o":["It hurts testability","It cannot hold configuration","It creates many objects","It only works with databases"],"a":0,"vi":"Singleton cho một object cấu hình dùng chung, nhưng làm khó test.","en":"Singleton gives one shared configuration object but hurts testability.","src":"07#32"},{"id":"c7.6-5","w":7,"lv":"7.6","q":"In the Strategy example, what is the benefit of adding a new pricing rule?","o":["A new class is added and Booking is not changed","Booking gets a longer if/else chain","All pricing classes must be rewritten","The database schema must change"],"a":0,"vi":"Luật mới = class mới, không sửa Booking (Open/Closed), mỗi luật unit test riêng được.","en":"A new rule is a new class; Booking stays unchanged (Open/Closed), and each rule is testable alone.","src":"07#33"}],"7.7":[{"id":"c7.7-1","w":7,"lv":"7.7","q":"Which is a disadvantage of storing data in a file system?","o":["It is hard to manage large data","It is complex to set up and administer","It needs a DBMS","It is slow for small data"],"a":0,"vi":"File system: đơn giản, nhanh, nhưng khó quản lý dữ liệu lớn. Database: phức tạp hơn để cài đặt.","en":"Files are simple and fast but hard to manage at scale; databases are more complex to set up.","src":"07#35"},{"id":"c7.7-2","w":7,"lv":"7.7","q":"When mapping classes to tables, object identity becomes:","o":["A primary key","A foreign key","An index","A junction table"],"a":0,"vi":"Entity class → bảng, attribute → cột, object identity → primary key.","en":"Entity class → table, attributes → columns, identity → primary key.","src":"07#36"},{"id":"c7.7-3","w":7,"lv":"7.7","q":"How is a 1 – n association mapped to relational tables?","o":["A foreign key on the \"many\" side","A foreign key on the \"one\" side","A junction table with two foreign keys","One shared table for both classes"],"a":0,"vi":"1–n: FK ở phía n (student.class_id). n–n: junction table.","en":"1–n: FK on the many side (student.class_id). n–n: a junction table.","src":"07#37"},{"id":"c7.7-4","w":7,"lv":"7.7","q":"Which mapping is used for composition?","o":["FK NOT NULL + ON DELETE CASCADE","A junction table with extra columns","One table per class hierarchy","No foreign key at all"],"a":0,"vi":"Composition: FK NOT NULL và ON DELETE CASCADE, vì phần tử con sống theo phần tử cha.","en":"Composition: FK NOT NULL with ON DELETE CASCADE, since the part lives with the whole.","src":"07#37"},{"id":"c7.7-5","w":7,"lv":"7.7","q":"According to the checklist, when should you denormalize?","o":["Only for proven performance needs","Always, to make queries simpler","Before normalizing to 3NF","Whenever a table has more than five columns"],"a":0,"vi":"Chuẩn hoá tới 3NF; chỉ denormalize khi đã chứng minh cần cho hiệu năng.","en":"Normalize to 3NF; denormalize only for proven performance needs.","src":"07#40"},{"id":"c7.7-6","w":7,"lv":"7.7","q":"How should passwords be stored?","o":["As hashes","As plain text in a UNIQUE column","Encoded in the table name","In a separate text file"],"a":0,"vi":"Lưu mật khẩu dạng hash, thu thập ít và bảo vệ dữ liệu cá nhân.","en":"Store passwords as hashes and protect personal data.","src":"07#40"}]},"glossary":[{"t":"Generic software","vi":"phần mềm đại trà","d":{"vi":"Làm ra để bán cho nhiều khách hàng.","en":"Developed to be sold to a range of different customers."},"src":"01#3"},{"t":"Custom software","vi":"phần mềm đặt riêng","d":{"vi":"Làm cho một khách hàng duy nhất, theo specification của họ.","en":"Developed for a single customer according to their specification."},"src":"01#3"},{"t":"Maintainability","vi":"khả năng bảo trì","d":{"vi":"Phần mềm phải tiến hoá được để đáp ứng nhu cầu thay đổi.","en":"Software must evolve to meet changing needs."},"src":"01#7"},{"t":"Dependability","vi":"độ tin cậy","d":{"vi":"Phần mềm phải đáng tin (trustworthy). Đi cặp với Reliability.","en":"Software must be trustworthy. Paired with Reliability."},"src":"01#7"},{"t":"Reliability","vi":"độ tin cậy, ổn định","d":{"vi":"Hoạt động đúng và ổn định trong điều kiện bình thường lẫn bất thường; đo bằng MTTF, availability.","en":"Functions correctly and consistently under normal and abnormal conditions; measured by MTTF, availability."},"src":"01#7, 04#17"},{"t":"Efficiency","vi":"hiệu quả sử dụng tài nguyên","d":{"vi":"Không lãng phí tài nguyên hệ thống.","en":"No wasteful use of system resources."},"src":"01#7"},{"t":"Acceptability","vi":"tính chấp nhận được","d":{"vi":"Được người dùng chấp nhận: dễ hiểu, dễ dùng, tương thích hệ thống khác.","en":"Accepted by its users: understandable, usable, compatible with other systems."},"src":"01#7"},{"t":"Maintenance","vi":"bảo trì","d":{"vi":"Sửa, nâng cấp phần mềm sau khi bàn giao. Với hệ thống sống lâu có thể tốn gấp nhiều lần phát triển.","en":"Changing software after delivery; for long-lived systems it may cost several times development."},"src":"01#9"},{"t":"Evolution","vi":"tiến hoá phần mềm","d":{"vi":"Thay đổi phần mềm theo nhu cầu mới; 1 trong 4 hoạt động của process.","en":"Changing software in response to changing demands; one of the four process activities."},"src":"01#26"},{"t":"CHAOS Report","vi":"báo cáo CHAOS","d":{"vi":"Thống kê kết quả dự án IT. Năm 2020: 35% thành công, 46% challenged, 19% thất bại.","en":"IT project outcome survey. 2020: 35% successful, 46% challenged, 19% failed."},"src":"01#11"},{"t":"Challenged","cs":1,"vi":"gặp khó khăn","d":{"vi":"Nhóm dự án lớn nhất trong CHAOS 2020 (46%).","en":"The largest group in CHAOS 2020 (46%)."},"src":"01#11"},{"t":"Computer science","vi":"khoa học máy tính","d":{"vi":"Quan tâm lý thuyết và nền tảng.","en":"Concerned with theory and fundamentals."},"src":"01#13"},{"t":"System engineering","vi":"kỹ nghệ hệ thống","d":{"vi":"Mọi khía cạnh của hệ thống máy tính: hardware, software, process engineering.","en":"All aspects of computer-based systems: hardware, software and process engineering."},"src":"01#14"},{"t":"Low-code","a":["No-code","low-code","no-code"],"vi":"lập trình ít code / không code","d":{"vi":"Tạo ứng dụng với rất ít code, có AI hỗ trợ (WordPress, Wix, Shopify…).","en":"Create apps with minimal coding, supported by AI (WordPress, Wix, Shopify…)."},"src":"01#20"},{"t":"Continuous Integration","a":["CI"],"cs":1,"vi":"tích hợp liên tục","d":{"vi":"Tích hợp code thay đổi một cách tự động và thường xuyên.","en":"Automatically and frequently integrating code changes."},"src":"01#21"},{"t":"Continuous Delivery","a":["Continuous Deployment","CD"],"cs":1,"vi":"bàn giao / triển khai liên tục","d":{"vi":"Code được tự động build, test và chuẩn bị để release lên production.","en":"Code is automatically built, tested and prepared for release to production."},"src":"01#21"},{"t":"DevOps","vi":"Development + Operations","d":{"vi":"Văn hoá, thực hành, công cụ giúp rút ngắn vòng đời phát triển.","en":"Cultural philosophies, practices and tools that shorten the development lifecycle."},"src":"01#21"},{"t":"Agentic AI","a":["AI agent","AI agents"],"vi":"AI tác tử","d":{"vi":"AI nhận mục tiêu, tự lập kế hoạch, dùng công cụ, quan sát kết quả và lặp lại.","en":"AI that receives a goal, plans steps, uses tools, observes results and iterates."},"src":"01#22"},{"t":"SDLC","vi":"vòng đời phát triển phần mềm","d":{"vi":"Software Development Life Cycle, tên khác của software process.","en":"Software Development Life Cycle, another name for the software process."},"src":"01#25"},{"t":"Software process","vi":"quy trình phần mềm","d":{"vi":"Tập hoạt động nhằm phát triển hoặc tiến hoá phần mềm.","en":"A set of activities whose goal is the development or evolution of software."},"src":"01#26"},{"t":"Process model","a":["process model","process models"],"vi":"mô hình quy trình","d":{"vi":"Biểu diễn đơn giản hoá của process từ một góc nhìn (workflow, data-flow, role/action).","en":"A simplified representation of a process from one perspective (workflow, data-flow, role/action)."},"src":"01#27"},{"t":"Specification","vi":"đặc tả","d":{"vi":"Xác định hệ thống phải làm gì và các ràng buộc.","en":"Defining what the system should do and its constraints."},"src":"01#26"},{"t":"Validation","vi":"kiểm định (đúng nhu cầu)","d":{"vi":"Kiểm tra phần mềm/requirement có đúng điều khách hàng muốn.","en":"Checking the software or requirements are what the customer wants."},"src":"01#26, 04#50"},{"t":"Workflow","a":["workflow","workflows"],"vi":"luồng công việc","d":{"vi":"Góc nhìn trình tự hoạt động; trong RUP là các nhóm hoạt động (discipline).","en":"Perspective of the sequence of activities; in RUP, groups of activities (disciplines)."},"src":"01#27, 02#32"},{"t":"Data-flow","vi":"luồng dữ liệu","d":{"vi":"Góc nhìn luồng thông tin của process.","en":"Perspective of information flow."},"src":"01#27"},{"t":"Role/action","vi":"vai trò/hành động","d":{"vi":"Góc nhìn ai làm gì.","en":"Perspective of who does what."},"src":"01#27"},{"t":"Component-based software engineering","vi":"SE dựa trên thành phần","d":{"vi":"Process model chung, xây hệ thống từ các thành phần có sẵn.","en":"A generic process model that builds systems from existing components."},"src":"01#28"},{"t":"Confidentiality","vi":"bảo mật thông tin","d":{"vi":"Tôn trọng bí mật của chủ lao động và khách hàng.","en":"Respect the confidentiality of employers or clients."},"src":"01#31"},{"t":"Competence","vi":"năng lực","d":{"vi":"Không nói quá năng lực, không nhận việc vượt khả năng.","en":"Do not misrepresent competence or accept work beyond it."},"src":"01#31"},{"t":"Intellectual property","vi":"sở hữu trí tuệ","d":{"vi":"Bằng sáng chế, bản quyền…; phải bảo vệ IP của chủ và khách.","en":"Patents, copyright…; protect the IP of employers and clients."},"src":"01#32"},{"t":"Computer misuse","vi":"lạm dụng máy tính","d":{"vi":"Dùng kỹ năng để xâm phạm máy tính người khác.","en":"Using technical skills to misuse other people's computers."},"src":"01#32"},{"t":"Code of Ethics","vi":"bộ quy tắc đạo đức","d":{"vi":"ACM/IEEE, 8 nguyên tắc: Public, Client & Employer, Product, Judgment, Management, Profession, Colleagues, Self.","en":"ACM/IEEE, 8 principles: Public, Client & Employer, Product, Judgment, Management, Profession, Colleagues, Self."},"src":"01#33-36"},{"t":"Plan-driven","a":["plan-driven"],"vi":"hướng kế hoạch","d":{"vi":"Hoạt động lên kế hoạch trước, tiến độ đo theo kế hoạch; dựa trên tài liệu, process nặng.","en":"Activities planned in advance, progress measured against the plan; document-based, heavy."},"src":"02#6"},{"t":"Agile","cs":1,"vi":"linh hoạt","d":{"vi":"Lập kế hoạch dần dần, thích ứng requirement thay đổi; tri thức ngầm, process nhẹ.","en":"Incremental planning that adapts to changing requirements; tacit knowledge, light process."},"src":"02#6"},{"t":"Tacit knowledge","a":["tacit knowledge"],"vi":"tri thức ngầm","d":{"vi":"Hiểu biết nằm trong đầu thành viên, không viết thành tài liệu.","en":"Knowledge held by people rather than written down."},"src":"02#6"},{"t":"Maturity model","a":["maturity models","maturity model"],"vi":"mô hình trưởng thành","d":{"vi":"Mô hình đánh giá mức độ trưởng thành của process, ví dụ CMMI.","en":"A model rating process maturity, e.g. CMMI."},"src":"02#4"},{"t":"Adaptive process","a":["adaptive process models","Adaptive process models"],"vi":"process thích ứng","d":{"vi":"Process thay đổi theo hoàn cảnh, xu hướng hiện nay.","en":"Processes that adapt to circumstances; the current trend."},"src":"02#4"},{"t":"CMMI","vi":"mô hình trưởng thành năng lực tích hợp","d":{"vi":"Capability Maturity Model Integration: SEI (CMU) tạo, nay ISACA duy trì, V3.0 (2023). 5 level.","en":"Capability Maturity Model Integration: created by SEI (CMU), now ISACA, V3.0 (2023). Five levels."},"src":"02#10-11"},{"t":"SEI","vi":"Viện Kỹ nghệ Phần mềm","d":{"vi":"Software Engineering Institute của CMU, nơi phát triển CMMI.","en":"CMU's Software Engineering Institute, which developed CMMI."},"src":"02#10"},{"t":"Quantitatively Managed","vi":"quản lý định lượng","d":{"vi":"CMMI level 4: data-driven, mục tiêu cải tiến định lượng.","en":"CMMI level 4: data-driven with quantitative improvement objectives."},"src":"02#11"},{"t":"Optimizing","cs":1,"vi":"tối ưu hoá","d":{"vi":"CMMI level 5: tập trung cải tiến liên tục.","en":"CMMI level 5: focused on continuous improvement."},"src":"02#11"},{"t":"Waterfall","vi":"mô hình thác nước","d":{"vi":"Plan-driven: các stage tuần tự, xong stage mới sang stage sau; vẫn có thể quay lại.","en":"Plan-driven: sequential stages, each completed before the next; going back is possible."},"src":"02#14-15"},{"t":"Baselined","a":["baselined","baseline","Baseline"],"vi":"đã chốt làm chuẩn","d":{"vi":"Requirement đã được thống nhất, sẵn sàng để làm cơ sở cho bước sau.","en":"Requirements agreed and ready to be built on."},"src":"02#15"},{"t":"Checklist","a":["checklists","checklist"],"vi":"danh sách kiểm","d":{"vi":"Dùng để kiểm stage đã đạt bộ tiêu chí hoàn thành chưa.","en":"Used to check a stage meets its completion criteria."},"src":"02#15"},{"t":"Iteration","a":["iteration","iterations","Iterations"],"vi":"vòng lặp","d":{"vi":"Một vòng phát triển; công việc có thể làm lại ở vòng sau.","en":"One development cycle; rework can occur in later iterations."},"src":"02#19"},{"t":"Incremental","cs":1,"vi":"tăng dần","d":{"vi":"Plan-driven: giao từng increment, requirement ưu tiên cao làm trước.","en":"Plan-driven: delivered in increments, highest-priority requirements first."},"src":"02#22"},{"t":"Increment","a":["increment","increments"],"vi":"phần tăng thêm","d":{"vi":"Một phần chức năng được giao. Trong Scrum: kết quả dùng được mỗi Sprint, gắn Definition of Done.","en":"A delivered part of the functionality. In Scrum: the usable result each Sprint, tied to the Definition of Done."},"src":"02#22, 02#54"},{"t":"Prototype","a":["prototy

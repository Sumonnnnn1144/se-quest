els: **Architectural** (overall) · **High-level** (sub-systems, modules) · **Detailed** (data, algorithms)","c":[]},{"t":"Architectural design = **process**","c":[]},{"t":"Software architecture = **document** (output)","c":[]},{"t":"Links **RE and design**","c":[]},{"t":"**Block diagram**: boxes + lines","c":[]},{"t":"**C4**: Context → Containers → Components → Code","c":[{"t":"Project: at least **Context + Container** (PA3)","c":[]}]}]},{"t":"Sub-systems & quality","c":[{"t":"**Sub-system**: a system in its own right, **independent** (Google Maps)","c":[]},{"t":"**Module**: serves other components (UI component)","c":[]},{"t":"Benefits: **stakeholder communication · system analysis · large-scale reuse**","c":[]},{"t":"Performance → **large-grain** components","c":[]},{"t":"Security → **layered**, assets in **inner layers**","c":[]},{"t":"Availability → **redundancy**","c":[]},{"t":"Maintainability → **fine-grain, replaceable** components","c":[]},{"t":"**Conflicts**: large ↑ performance ↓ maintainability","c":[]},{"t":"**ASRs**: NFRs + high-priority FRs","c":[]}]},{"t":"Design decisions","c":[{"t":"Issue · decision · assumptions · **rationale** · alternatives · implications","c":[]},{"t":"**7 questions**: generic arch · distribution · style · modules · control · evaluation · documentation","c":[]},{"t":"**ADR** in docs/adr/","c":[{"t":"Title · **Status** · Context · Decision · Consequences","c":[]},{"t":"proposed · accepted · **superseded**","c":[]}]}]},{"t":"Styles: sharing & distribution","c":[{"t":"Style = **high-level**, whole system · Pattern = **micro**","c":[]},{"t":"Described as **Problem · Context · Solution**","c":[]},{"t":"**Repository**: **central** data store","c":[{"t":"✔ share large data · centralized management","c":[]},{"t":"✘ **one shared data model** · hard to distribute","c":[]}]},{"t":"**Client-Server**: servers + clients + **network**","c":[{"t":"✔ easy distribution · easy to add servers","c":[]},{"t":"✘ **no shared data model** · no central register","c":[]}]},{"t":"**P2P**: every node is client and server","c":[{"t":"✘ hard to secure, hard to keep consistent","c":[]}]}]},{"t":"Styles: structure & flow","c":[{"t":"**Layered**: interface change → only the **adjacent layer**","c":[{"t":"✘ inflexible · **slow** through many layers","c":[]}]},{"t":"**MVC**: Model (data, logic) · View (presentation) · Controller (commands)","c":[]},{"t":"**Pipes & Filters**: independent filters, data through **pipes**","c":[{"t":"✘ needs a **common format** · hard for **event-based**","c":[]}]},{"t":"**Interrupt-driven**: **real-time**, one **handler** per interrupt type","c":[{"t":"✘ complex to program, **hard to validate**","c":[]}]}]},{"t":"Services & events","c":[{"t":"**SOA**: modularity · interoperability · reusability · **loose coupling**","c":[]},{"t":"**Microservices**: autonomy · resilience · scalability · flexibility","c":[{"t":"✘ distributed complexity · data consistency · needs **DevOps**","c":[]},{"t":"Small team → **modular monolith** first","c":[]}]},{"t":"**Event-driven**: producer → **broker** (Kafka, RabbitMQ) → consumers","c":[{"t":"✘ hard to debug · **eventual consistency**","c":[]}]}]}]}},"7":{"vi":{"t":"Bài 7 · OO & Data Design","c":[{"t":"Class diagram","c":[{"t":"Sơ đồ **dùng nhiều nhất**","c":[]},{"t":"Class: 3 ngăn **tên · attributes · operations**","c":[]},{"t":"Kiểu dữ liệu sau **dấu hai chấm**","c":[]},{"t":"Visibility: **+ public · - private · # protected**","c":[]},{"t":"Interface: **hình tròn** hoặc **«interface»**","c":[]}]},{"t":"Quan hệ","c":[{"t":"**Dependency**: dùng tạm, nét **đứt**, lỏng nhất","c":[]},{"t":"**Generalization**: superclass ↔ subclass, **tam giác rỗng**","c":[]},{"t":"**Association**: nối object, có tên và role","c":[]},{"t":"**Multiplicity**: 1 · 0..1 · 0..* · 1..*","c":[]},{"t":"**Composition**: **mạnh**, sở hữu vòng đời, **thoi đặc**","c":[]},{"t":"**Aggregation**: **yếu**, dùng không sở hữu, **thoi rỗng**","c":[]}]},{"t":"Từ requirement đến class","c":[{"t":"**Domain object**: thật, có trong nghiệp vụ, **có dữ liệu lưu**","c":[]},{"t":"**System object**: tạo ra để **xử lý, tính toán**","c":[]},{"t":"**BCE**","c":[{"t":"**Boundary**: màn hình, form, API","c":[]},{"t":"**Control**: điều phối **1 use case**","c":[]},{"t":"**Entity**: dữ liệu nghiệp vụ lâu dài","c":[]},{"t":"Actor chỉ gặp **boundary**","c":[]}]},{"t":"Bước 1: **danh từ** trong use case → domain class","c":[]}]},{"t":"Sequence & state","c":[{"t":"Bước 2: mỗi bước kịch bản → **một object làm**","c":[]},{"t":"**Lifeline · message · activation · fragment**","c":[{"t":"**alt** if/else · **opt** if · **loop** · **par**","c":[]}]},{"t":"Mỗi message → **một operation**","c":[]},{"t":"Bước 3a: **encapsulation · inheritance · polymorphism**","c":[]},{"t":"Bước 3b: **state machine** cho object có trạng thái","c":[{"t":"event [guard] / action","c":[]},{"t":"Mỗi event → **một operation**","c":[]}]}]},{"t":"Nguyên tắc thiết kế","c":[{"t":"**Low coupling** · **High cohesion**","c":[]},{"t":"**DRY · KISS · YAGNI**","c":[]},{"t":"**SOLID**","c":[{"t":"**S**: một lý do để đổi","c":[]},{"t":"**O**: mở để mở rộng, đóng để sửa","c":[]},{"t":"**L**: subtype thay được base","c":[]},{"t":"**I**: nhiều interface nhỏ","c":[]},{"t":"**D**: phụ thuộc **abstraction**","c":[]}]}]},{"t":"Design pattern","c":[{"t":"**Creational**: tạo object (Factory, Singleton…)","c":[]},{"t":"**Structural**: ghép class (Adapter, Facade…)","c":[]},{"t":"**Behavioral**: tương tác (Observer, Strategy…)","c":[]},{"t":"Giá theo loại khách → **Strategy**","c":[]},{"t":"Báo nhiều kênh → **Observer**","c":[]},{"t":"API bên thứ ba khác interface → **Adapter**","c":[]}]},{"t":"Thiết kế dữ liệu","c":[{"t":"**File**: đơn giản, nhanh · **DB**: dữ liệu lớn","c":[]},{"t":"Entity class → **bảng**, identity → **PK**","c":[]},{"t":"1–n → **FK phía n** · n–n → **junction table**","c":[]},{"t":"Composition → **NOT NULL + CASCADE**","c":[]},{"t":"**3NF** · index · **hash mật khẩu** · migration trong Git","c":[]}]}]},"en":{"t":"Lecture 7 · OO & Data Design","c":[{"t":"Class diagram","c":[{"t":"The **most used** diagram","c":[]},{"t":"Class: 3 compartments **name · attributes · operations**","c":[]},{"t":"Data type after a **colon**","c":[]},{"t":"Visibility: **+ public · - private · # protected**","c":[]},{"t":"Interface: **circle** or **«interface»**","c":[]}]},{"t":"Relationships","c":[{"t":"**Dependency**: uses, **dashed**, least restrictive","c":[]},{"t":"**Generalization**: superclass ↔ subclass, **hollow triangle**","c":[]},{"t":"**Association**: connects objects, name and roles","c":[]},{"t":"**Multiplicity**: 1 · 0..1 · 0..* · 1..*","c":[]},{"t":"**Composition**: **strong**, owns the lifetime, **filled diamond**","c":[]},{"t":"**Aggregation**: **weak**, uses without owning, **hollow diamond**","c":[]}]},{"t":"From requirements to classes","c":[{"t":"**Domain object**: real, in the business, **has stored data**","c":[]},{"t":"**System object**: created to **process and calculate**","c":[]},{"t":"**BCE**","c":[{"t":"**Boundary**: screens, forms, APIs","c":[]},{"t":"**Control**: coordinates **one use case**","c":[]},{"t":"**Entity**: long-lived business data","c":[]},{"t":"Actors meet only **boundaries**","c":[]}]},{"t":"Step 1: **nouns** in use cases → domain classes","c":[]}]},{"t":"Sequence & state","c":[{"t":"Step 2: every screenplay step → **some object does it**","c":[]},{"t":"**Lifeline · message · activation · fragment**","c":[{"t":"**alt** if/else · **opt** if · **loop** · **par**","c":[]}]},{"t":"Every message → **an operation**","c":[]},{"t":"Step 3a: **encapsulation · inheritance · polymorphism**","c":[]},{"t":"Step 3b: **state machine** for objects with a status","c":[{"t":"event [guard] / action","c":[]},{"t":"Each event → **an operation**","c":[]}]}]},{"t":"Design principles","c":[{"t":"**Low coupling** · **High cohesion**","c":[]},{"t":"**DRY · KISS · YAGNI**","c":[]},{"t":"**SOLID**","c":[{"t":"**S**: one reason to change","c":[]},{"t":"**O**: open to extend, closed to modify","c":[]},{"t":"**L**: subtypes replace the base","c":[]},{"t":"**I**: many small interfaces","c":[]},{"t":"**D**: depend on **abstractions**","c":[]}]}]},{"t":"Design patterns","c":[{"t":"**Creational**: creating objects (Factory, Singleton…)","c":[]},{"t":"**Structural**: composing classes (Adapter, Facade…)","c":[]},{"t":"**Behavioral**: interaction (Observer, Strategy…)","c":[]},{"t":"Price by customer type → **Strategy**","c":[]},{"t":"Notify many channels → **Observer**","c":[]},{"t":"Third-party API, different interface → **Adapter**","c":[]}]},{"t":"Data design","c":[{"t":"**File**: simple, fast · **DB**: large data","c":[]},{"t":"Entity class → **table**, identity → **PK**","c":[]},{"t":"1–n → **FK on the n side** · n–n → **junction table**","c":[]},{"t":"Composition → **NOT NULL + CASCADE**","c":[]},{"t":"**3NF** · indexes · **hash passwords** · migrations in Git","c":[]}]}]}}},"lessons":{"1":[{"id":"1.1","t":{"vi":"Phần mềm là gì & thế nào là phần mềm tốt","en":"What software is & what makes it good"},"cards":[{"src":"01#3","vi":"**Software** (phần mềm) không chỉ là code. Theo slide, software = **computer programs + associated documentation**, tức chương trình cùng tài liệu đi kèm như **requirements**, **design models** và **user manuals**.\n\nCó 2 loại sản phẩm phần mềm:\n- **Generic**: làm ra để **bán cho nhiều khách hàng**. Ví dụ: Microsoft Word, Photoshop.\n- **Custom**: làm cho **một khách hàng duy nhất**, theo **specification** của khách đó. Ví dụ: hệ thống quản lý riêng cho một bệnh viện.","en":"**Software** is more than code. In the lecture, software = **computer programs + associated documentation** such as **requirements**, **design models** and **user manuals**.\n\nSoftware products come in two kinds:\n- **Generic**: built to be **sold to a range of different customers**. Example: Microsoft Word, Photoshop.\n- **Custom**: built for **a single customer** according to **their specification**. Example: a management system made for one hospital."},{"src":"01#4","vi":"Phần mềm có thể được tạo ra theo 3 cách:\n- **Viết chương trình mới** (developing new programs)\n- **Cấu hình** một hệ thống generic có sẵn (configuring generic software systems)\n- **Tái sử dụng** phần mềm có sẵn (reusing existing software)","en":"Software can be created by:\n- **developing new programs**\n- **configuring generic software systems**\n- **reusing existing software**"},{"src":"01#6","vi":"**Vai trò của phần mềm:** nền kinh tế của **mọi quốc gia phát triển** đều phụ thuộc vào phần mềm, và ngày càng nhiều hệ thống được điều khiển bằng phần mềm. Câu hỏi gợi mở trên slide: có thứ gì kết nối Internet mà không cần phần mềm không?","en":"**Role of software:** the economies of **all developed nations** depend on software, and more and more systems are software controlled. The slide asks: is there anything that connects to the Internet without software?"},{"src":"01#7","vi":"**4 thuộc tính của phần mềm tốt** (hay ra đề dạng \"cái nào KHÔNG phải\"):\n\n| Thuộc tính | Ý nghĩa |\n|---|---|\n| **Maintainability** | Phần mềm phải **tiến hoá** được để đáp ứng nhu cầu thay đổi |\n| **Dependability / Reliability** | Phần mềm phải **đáng tin cậy** (trustworthy) |\n| **Efficiency** | Không **lãng phí** tài nguyên hệ thống |\n| **Acceptability** | Được **người dùng chấp nhận**: dễ hiểu, dễ dùng, **tương thích** với hệ thống khác |\n\nBẫy thường gặp: **Scalability**, Portability, Profitability **không** nằm trong 4 thuộc tính này.","en":"**Four attributes of good software** (often asked as \"which is NOT\"):\n\n| Attribute | Meaning |\n|---|---|\n| **Maintainability** | Software must **evolve** to meet changing needs |\n| **Dependability / Reliability** | Software must be **trustworthy** |\n| **Efficiency** | No **wasteful** use of system resources |\n| **Acceptability** | **Accepted by its users**: understandable, usable and **compatible** with other systems |\n\nCommon traps: **Scalability**, Portability and Profitability are **not** among these four."}]},{"id":"1.2","t":{"vi":"Chi phí phần mềm","en":"Software costs"},"cards":[{"src":"01#8","vi":"Biểu đồ **Boehm (1981)**: theo thời gian (1955 → 1985), phần trăm chi phí dành cho **phần mềm** tăng mạnh còn **phần cứng** giảm dần. Phần mềm dần chiếm phần lớn chi phí của hệ thống máy tính.","en":"**Boehm (1981)** chart: over time (1955 → 1985) the share of cost spent on **software** grows while **hardware** shrinks. Software comes to dominate computer system costs.","fig":"boehm"},{"src":"01#9","vi":"- Chi phí phần mềm thường **lớn hơn** chi phí phần cứng. Trên PC, phần mềm thường đắt hơn phần cứng.\n- **Bảo trì tốn hơn phát triển**: với hệ thống sống lâu, chi phí **maintenance** có thể **gấp nhiều lần** chi phí phát triển.\n- Mục tiêu chính của SE: **phát triển phần mềm hiệu quả về chi phí** (cost-effective).","en":"- Software costs often **dominate** computer system costs. On a PC, software often costs more than the hardware.\n- **Maintenance costs more than development**: for long-lived systems, **maintenance** costs may be **several times** development costs.\n- Key objective of SE: **cost-effective software development**."},{"src":"01#15","vi":"**Chi phí của software engineering:**\n- Khoảng **60% là phát triển (development)**, **40% là kiểm thử (testing)**.\n- Với phần mềm **custom**, chi phí **evolution** thường **vượt** chi phí phát triển. Evolution gồm: hiểu code, sửa/nâng cấp/fix lỗi, thêm tính năng, requirement, business rule, môi trường mới.\n- Chi phí phụ thuộc nhiều yếu tố: requirements, độ phức tạp, nhân sự, nền tảng, công cụ…","en":"**Costs of software engineering:**\n- Roughly **60% development**, **40% testing**.\n- For **custom** software, **evolution** costs often **exceed** development costs: understanding code; changing, upgrading, fixing errors; new features, requirements, business rules, environments.\n- Costs vary with requirements, complexity, personnel, platform, tools, etc."}]},{"id":"1.3","t":{"vi":"Software Engineering là gì","en":"What software engineering is"},"cards":[{"src":"01#11","vi":"**CHAOS Report 2020** (tỷ lệ thành công của dự án IT):\n\n| Kết quả | Tỷ lệ |\n|---|---|\n| **Successful** | **35%** |\n| **Challenged** | **46%**, nhóm **lớn nhất** |\n| **Failed** | **19%** |\n\nBiểu đồ có thêm các năm 2004, 2009, 2014. Năm hay hỏi là **2020**.","en":"**CHAOS Report 2020** (IT project outcomes):\n\n| Outcome | Share |\n|---|---|\n| **Successful** | **35%** |\n| **Challenged** | **46%**, the **largest** group |\n| **Failed** | **19%** |\n\nThe chart also shows 2004, 2009 and 2014; the year usually asked is **2020**.","fig":"chaos"},{"src":"01#12","vi":"**Software engineering** là một **ngành kỹ thuật** (engineering discipline) liên quan đến **lý thuyết, phương pháp và công cụ** để phát triển phần mềm chuyên nghiệp.\n\n**4 mục tiêu** của SE:\n- **Cost effective** (trong ngân sách)\n- **On time** (đúng hạn)\n- **High quality** (chất lượng cao)\n- **Satisfying customer's needs** (thoả mãn nhu cầu khách hàng)\n\nBẫy: \"dùng công nghệ mới nhất\" **không** phải mục tiêu.","en":"**Software engineering** is an **engineering discipline** concerned with **theories, methods and tools** for professional software development.\n\n**Four goals:**\n- **Cost effective** (within budget)\n- **On time**\n- **High quality**\n- **Satisfying customer's needs**\n\nTrap: \"using the latest technology\" is **not** a goal."},{"src":"01#13-14","vi":"| So sánh | Quan tâm đến |\n|---|---|\n| **Computer science** | **Lý thuyết và nền tảng** (theory and fundamentals) |\n| **Software engineering** | **Thực tiễn** phát triển và bàn giao phần mềm hữu ích |\n| **System engineering** | **Mọi khía cạnh** của hệ thống dựa trên máy tính: **hardware, software và process engineering** |\n\n- Lý thuyết CS **chưa đủ** để làm ra phần mềm thành công.\n- SE là **một phần** của system engineering, phần lo về phát triển phần mềm.","en":"| Field | Concerned with |\n|---|---|\n| **Computer science** | **Theory and fundamentals** |\n| **Software engineering** | The **practicalities** of developing and delivering useful software |\n| **System engineering** | **All aspects** of computer-based systems: **hardware, software and process engineering** |\n\n- CS theories are still **insufficient** to produce successful software.\n- SE is the **part** of system engineering concerned with developing software."}]},{"id":"1.4","t":{"vi":"Xu hướng lớn trong SE","en":"Biggest trends in SE"},"cards":[{"src":"01#19","vi":"**1. Intelligent Software Engineering** = AI + SE, theo 2 chiều:\n- Dùng **AI cho SE**: áp dụng AI vào phương pháp, thực hành, công cụ SE.\n- Dùng **SE cho AI**: phương pháp, thực hành, công cụ SE để xây hệ thống có AI.","en":"**1. Intelligent Software Engineering** = AI + SE, both ways:\n- **AI for SE**: applying AI to SE methods, practices and tools.\n- **SE for AI**: SE methods, practices and tools for AI-enabled systems."},{"src":"01#20","vi":"**2. Low-code / No-code**: tạo ứng dụng với **rất ít code**, có AI hỗ trợ. Nền tảng ví dụ: WordPress, Wix, Airtable, Salesforce, Shopify, Webflow, Squarespace.","en":"**2. Low-code / No-code**: create apps with **minimal coding**, supported by AI. Platforms: WordPress, Wix, Airtable, Salesforce, Shopify, Webflow, Squarespace."},{"src":"01#21","vi":"**3. CI/CD và DevOps**\n- **CI = Continuous Integration**: **tích hợp code thay đổi một cách tự động và thường xuyên**.\n- **CD = Continuous Delivery/Deployment**: code được **tự động build, test và chuẩn bị** để release lên production.\n- **DevOps = Development + Operations**: **văn hoá, thực hành và công cụ** giúp **rút ngắn vòng đời phát triển** (SDLC).","en":"**3. CI/CD and DevOps**\n- **CI = Continuous Integration**: **automatically and frequently integrating code changes**.\n- **CD = Continuous Delivery/Deployment**: code is **automatically built, tested and prepared** for a release to production.\n- **DevOps = Development + Operations**: **cultural philosophies, practices and tools** that **shorten the software development lifecycle**."},{"src":"01#22-23","vi":"**4. Agentic AI cho SE**: từ **assistant** (gợi ý code, chat) sang **agent**. Agent nhận **mục tiêu**, tự **lập kế hoạch**, dùng **công cụ** (editor, terminal, test, browser), **quan sát kết quả** rồi lặp lại.\n\nKỹ sư thay đổi thế nào:\n- **Gõ ít hơn**, **đặc tả, review, kiểm chứng** nhiều hơn.\n- Requirement rõ, test tốt, kiến trúc sạch càng **quan trọng hơn**.\n- Kỹ sư **vẫn chịu trách nhiệm** về chất lượng, bảo mật và đạo đức.\n\nRủi ro: code **trông đúng nhưng sai**, lỗ hổng bảo mật, vấn đề **licence/IP**, **lộ dữ liệu mật**. Trong môn này, AI **được phép dùng** cho project nhưng phải **khai báo**.","en":"**4. Agentic AI for SE**: from **assistants** (code completion, chat) to **agents**. An agent receives a **goal**, **plans steps**, uses **tools** (editor, terminal, tests, browser), **observes results** and iterates.\n\nWhat changes for engineers:\n- **Less typing**, more **specifying, reviewing and verifying**.\n- Clear requirements, good tests and clean architecture matter **more**, not less.\n- Engineers **remain accountable** for quality, security and ethics.\n\nRisks: **plausible-but-wrong** code, security flaws, **licence/IP** issues, **leaking confidential data**. In this course AI is **allowed** in the project **with disclosure**."}]},{"id":"1.5","t":{"vi":"Software process & process model","en":"Software process & process models"},"cards":[{"src":"01#26","vi":"**Software process** là **tập hợp các hoạt động** nhằm **phát triển hoặc tiến hoá** phần mềm. Còn gọi là software development process hay **SDLC** (software development life cycle).\n\n**4 hoạt động chung** (generic activities):\n1. **Specification**: hệ thống **phải làm gì** và các ràng buộc phát triển.\n2. **Development**: **sản xuất** hệ thống phần mềm.\n3. **Validation**: kiểm tra phần mềm **đúng là thứ khách hàng muốn**.\n4. **Evolution**: **thay đổi** phần mềm theo nhu cầu mới.\n\nBẫy: **Deployment**, Testing, Maintenance **không** phải tên 1 trong 4 hoạt động này.","en":"A **software process** is **a set of activities** whose goal is the **development or evolution** of software (also called the software development process or **SDLC**).\n\n**Four generic activities:**\n1. **Specification**: **what the system should do** and its development constraints.\n2. **Development**: **production** of the software system.\n3. **Validation**: checking the software is **what the customer wants**.\n4. **Evolution**: **changing** the software in response to changing demands.\n\nTrap: **Deployment**, Testing and Maintenance are **not** names of these four."},{"src":"01#27-28","vi":"**Software process model** là **biểu diễn đơn giản hoá** của một process, nhìn từ **một góc nhìn cụ thể**. 3 góc nhìn ví dụ:\n- **Workflow**: **trình tự** các hoạt động.\n- **Data-flow**: **luồng thông tin**.\n- **Role/action**: **ai làm gì**.\n\n**Các process model chung**: **Waterfall**, **Iterative development**, **Component-based software engineering**.","en":"A **software process model** is a **simplified representation** of a process from **a specific perspective**:\n- **Workflow**: **sequence** of activities.\n- **Data-flow**: **information flow**.\n- **Role/action**: **who does what**.\n\n**Generic process models**: **Waterfall**, **Iterative development**, **Component-based software engineering**."}]},{"id":"1.6","t":{"vi":"Đạo đức nghề nghiệp","en":"Professional ethics"},"cards":[{"src":"01#30","vi":"- SE có **trách nhiệm rộng hơn** việc chỉ áp dụng kỹ năng kỹ thuật.\n- Kỹ sư phải hành xử **trung thực** và có **trách nhiệm đạo đức**.\n- **Hành vi đạo đức không chỉ là tuân thủ pháp luật** (more than simply upholding the law).","en":"- SE involves **wider responsibilities** than applying technical skills.\n- Engineers must behave in an **honest** and **ethically responsible** way.\n- **Ethical behavior is more than simply upholding the law.**"},{"src":"01#31-32","vi":"**4 vấn đề trách nhiệm nghề nghiệp:**\n\n| Vấn đề | Nội dung |\n|---|---|\n| **Confidentiality** | Tôn trọng **bí mật** của chủ lao động/khách hàng |\n| **Competence** | Không **nói quá năng lực**; không cố ý **nhận việc vượt khả năng** |\n| **Intellectual property rights** | Hiểu luật về **bằng sáng chế, bản quyền**; bảo vệ IP của chủ/khách |\n| **Computer misuse** | Không dùng kỹ năng để **lạm dụng máy tính** của người khác |","en":"**Four issues of professional responsibility:**\n\n| Issue | Meaning |\n|---|---|\n| **Confidentiality** | Respect the **confidentiality** of employers or clients |\n| **Competence** | Do not **misrepresent** your competence; do not knowingly accept work **beyond** it |\n| **Intellectual property rights** | Know the laws on **patents, copyright**; protect employers' and clients' IP |\n| **Computer misuse** | Do not use technical skills to **misuse other people's computers** |"},{"src":"01#33-36","vi":"**ACM/IEEE Code of Ethics** là kim chỉ nam cho kỹ sư khi ra quyết định. Gồm **8 nguyên tắc**:\n\n| # | Nguyên tắc | Ý chính |\n|---|---|---|\n| 1 | **PUBLIC** | Hành động vì **lợi ích cộng đồng** |\n| 2 | **CLIENT AND EMPLOYER** | Vì lợi ích tốt nhất của khách hàng và chủ, **nhất quán với lợi ích cộng đồng** |\n| 3 | **PRODUCT** | Sản phẩm đạt **chuẩn nghề nghiệp cao nhất** có thể |\n| 4 | **JUDGMENT** | Giữ **chính trực và độc lập** trong phán đoán chuyên môn |\n| 5 | **MANAGEMENT** | Người quản lý **thúc đẩy cách quản lý có đạo đức** |\n| 6 | **PROFESSION** | Nâng cao **uy tín và sự chính trực của nghề** |\n| 7 | **COLLEAGUES** | **Công bằng và hỗ trợ** đồng nghiệp |\n| 8 | **SELF** | **Học tập suốt đời** về nghề |\n\nMẹo nhớ theo vòng tròn từ ngoài vào trong: cộng đồng → khách → sản phẩm → bản thân khi phán đoán → quản lý → nghề → đồng nghiệp → chính mình.","en":"The **ACM/IEEE Code of Ethics** guides SE professionals in their decisions. It has **8 principles**:\n\n| # | Principle | Key idea |\n|---|---|---|\n| 1 | **PUBLIC** | Act consistently with the **public interest** |\n| 2 | **CLIENT AND EMPLOYER** | Best interests of client and employer, **consistent with the public interest** |\n| 3 | **PRODUCT** | Products meet the **highest professional standards** possible |\n| 4 | **JUDGMENT** | **Integrity and independence** in professional judgment |\n| 5 | **MANAGEMENT** | Managers **promote an ethical approach** to management |\n| 6 | **PROFESSION** | Advance the **integrity and reputation of the profession** |\n| 7 | **COLLEAGUES** | Be **fair to and supportive of** colleagues |\n| 8 | **SELF** | **Lifelong learning** about the profession |\n\nMemory aid, from the outside in: public → client → product → your judgment → management → profession → colleagues → yourself."},{"src":"01#31","vi":"Ví dụ: khi đi thực tập, bạn ký **NDA** (thoả thuận bảo mật). Đem code của công ty lên GitHub cá nhân hoặc dán vào một công cụ AI công cộng là vi phạm **Confidentiality** và **Intellectual property**. Đây cũng chính là rủi ro \"lộ dữ liệu mật\" khi dùng AI ở 01#23.","en":"Example: as an intern you sign an **NDA**. Pushing company code to a personal GitHub or pasting it into a public AI tool breaks **Confidentiality** and **Intellectual property**. It is the same \"leaking confidential data\" risk of AI tools from 01#23.","real":true}]}],"2":[{"id":"2.1","t":{"vi":"Process, plan-driven và agile","en":"Processes, plan-driven and agile"},"cards":[{"src":"02#3","vi":"Một bản mô tả **software process** gồm:\n- Các **hoạt động** (activities), ví dụ đặc tả data model, thiết kế UI, và **thứ tự** của chúng.\n- Có thể có thêm: **Products** (kết quả của một hoạt động), **Roles** (trách nhiệm của người tham gia), **Pre- và post-conditions** (điều kiện phải đúng trước/sau hoạt động).","en":"A **software process** description includes:\n- The **activities** (e.g. specifying a data model, designing a UI) and their **ordering**.\n- It may also include **products** (outcomes of an activity), **roles** (responsibilities of the people involved) and **pre- and post-conditions** (statements that must be true)."},{"src":"02#4-5","vi":"**Xu hướng thay đổi** khiến process phải thay đổi:\n\n| Truyền thống | Hiện tại / tương lai |\n|---|---|\n| Hệ thống đứng riêng | **Mọi thứ kết nối** |\n| Requirement ổn định | Requirement **thay đổi nhanh** |\n| Requirement quyết định năng lực | Năng lực quyết định requirement |\n| Kiểm soát được sự tiến hoá | Không kiểm soát được |\n| Đủ thời gian để ổn định | **Phát triển nhanh** |\n| Process hướng lặp lại, **maturity model** | **Adaptive process model** |\n\nKết quả: xuất hiện process, công cụ, phương pháp, thực hành và mô hình mới.","en":"**Trends** that force processes to change:\n\n| Traditional | Current / future |\n|---|---|\n| Stand-alone systems | **Everything connected** |\n| Stable requirements | **Rapid requirements change** |\n| Requirements determine capabilities | Capabilities determine requirements |\n| Control over evolution | No control over evolution |\n| Enough time to keep stable | **Rapid development** |\n| Repeatability-oriented process, **maturity models** | **Adaptive process models** |\n\nResult: new processes, tools, methods, practices and models."},{"src":"02#6","vi":"**Hai hướng phát triển:**\n\n| | **Plan-driven** | **Agile** |\n|---|---|---|\n| Kế hoạch | Mọi hoạt động **được lên kế hoạch trước**, tiến độ **đo theo kế hoạch** | Lập kế hoạch **dần dần** (incremental) |\n| Thay đổi | Khó thay đổi | Dễ đổi process để theo **requirement thay đổi** |\n| Tri thức | **Dựa trên tài liệu** (document-based) | **Tacit knowledge** (tri thức ngầm trong đầu người) |\n| Độ nặng | **Heavy process** | **Light process** |\n\nCả hai đều có **điểm mạnh và điểm yếu**.","en":"**Two development approaches:**\n\n| | **Plan-driven** | **Agile** |\n|---|---|---|\n| Planning | Activities **planned in advance**, progress **measured against the plan** | Planning is **incremental** |\n| Change | Harder to change | Process changes to reflect **changing requirements** |\n| Knowledge | **Document-based** | **Tacit knowledge** |\n| Weight | **Heavy process** | **Light process** |\n\nBoth have **strengths and weaknesses**."},{"src":"02#7","vi":"**Phân loại cần thuộc** (hay hỏi \"model X thuộc nhóm nào\"):\n- **Plan-driven**: **Waterfall**, **Incremental**, **Spiral**, **RUP** (Rational Unified Process).\n- **Agile**: **XP** (Extreme Programming), **Scrum**, **Kanban**.\n\nBẫy: Incremental và Spiral có lặp (iteration) nhưng theo slide vẫn là **plan-driven**.","en":"**Classification to memorize** (\"which group does X belong to\"):\n- **Plan-driven**: **Waterfall**, **Incremental**, **Spiral**, **RUP** (Rational Unified Process).\n- **Agile**: **XP** (Extreme Programming), **Scrum**, **Kanban**.\n\nTrap: Incremental and Spiral iterate, but in the lecture they are still **plan-driven**."},{"src":"02#8","vi":"4 hoạt động của process (nhắc lại bài 1, nay chi tiết hơn):\n- **Specification**: khách hàng và kỹ sư **định nghĩa phần mềm** cần làm và **ràng buộc** vận hành.\n- **Development**: phần mềm được **thiết kế và lập trình**.\n- **Validation**: kiểm tra phần mềm **đúng điều khách cần**.\n- **Evolution**: **sửa đổi** để theo nhu cầu khách hàng và thị trường.","en":"The four process activities (from lecture 1, in more detail):\n- **Specification**: customers and engineers **define the software** and its **operational constraints**.\n- **Development**: software is **designed and programmed**.\n- **Validation**: software is checked to be **what the customer requires**.\n- **Evolution**: software is **modified** for changing customer and market needs."}]},{"id":"2.2","t":{"vi":"Cải tiến process & CMMI","en":"Process improvement & CMMI"},"cards":[{"src":"02#9","vi":"**Software process improvement**: mục tiêu là **liên tục cải tiến** cách phát triển, bàn giao và bảo trì phần mềm.\n- **Đánh giá** process hiện tại, tìm **điểm yếu và nút thắt**.\n- **Chuẩn hoá** thực hành tốt.\n- **Đo** hiệu quả bằng chỉ số chất lượng và năng suất.\n- Áp dụng **mô hình cải tiến** như **CMMI**.\n\nLợi ích: chất lượng cao hơn, **dự đoán tốt hơn**, rủi ro thấp hơn, tổ chức **học hỏi liên tục**.","en":"**Software process improvement**: **continuously improve** how software is developed, delivered and maintained.\n- **Evaluate** current processes; find **weaknesses and bottlenecks**.\n- **Standardize** good practices.\n- **Measure** with quality and productivity metrics.\n- Apply **improvement models** such as **CMMI**.\n\nBenefits: higher quality, **better predictability**, lower risk, continuous organizational learning."},{"src":"02#10","vi":"**CMMI = Capability Maturity Model Integration**\n- Ban đầu do **SEI** (Software Engineering Institute) của **CMU** phát triển.\n- Nay do **CMMI Institute (ISACA)** duy trì. Phiên bản hiện tại: **CMMI V3.0 (2023)**.\n- Là **framework** đánh giá **mức trưởng thành** (maturity) của process phần mềm và hệ thống.\n- Hỗ trợ cả xu hướng mới: mọi thứ kết nối, requirement đổi nhanh, adaptive process, làm **song song** requirement/kiến trúc/phát triển, cộng tác.","en":"**CMMI = Capability Maturity Model Integration**\n- Originally developed by **CMU's Software Engineering Institute (SEI)**.\n- Now maintained by the **CMMI Institute (ISACA)**; current version **CMMI V3.0 (2023)**.\n- A **framework** for software and systems **process maturity**.\n- Supports current trends: everything connected, rapid requirements change, adaptive processes, requirements/architecture/development done **concurrently**, collaboration."},{"src":"02#11","vi":"**5 maturity level của CMMI** (thứ tự rất hay ra đề):\n\n| Level | Tên | Đặc điểm |\n|---|---|---|\n| 1 | **Initial** | **Không dự đoán được, bị động** (reactive). Việc xong nhưng thường **trễ và vượt ngân sách** |\n| 2 | **Managed** | Quản lý **ở mức project**: project được lập kế hoạch, thực hiện, đo lường, kiểm soát |\n| 3 | **Defined** | **Chủ động** (proactive). **Chuẩn toàn tổ chức** hướng dẫn cho mọi project, program, portfolio |\n| 4 | **Quantitatively Managed** | **Đo lường và kiểm soát**: **data-driven**, có mục tiêu cải tiến **định lượng** |\n| 5 | **Optimizing** | **Ổn định và linh hoạt**: tập trung **cải tiến liên tục**, sẵn sàng xoay chuyển theo cơ hội |\n\nMẹo nhớ thứ tự: **I M D Q O**. Level 2 là project, level 3 là toàn tổ chức.","en":"**The five CMMI maturity levels** (order is a favourite question):\n\n| Level | Name | Characteristics |\n|---|---|---|\n| 1 | **Initial** | **Unpredictable and reactive**; work gets done but is often **delayed and over budget** |\n| 2 | **Managed** | Managed **on the project level**: projects planned, performed, measured, controlled |\n| 3 | **Defined** | **Proactive**; **organization-wide standards** guide projects, programs and portfolios |\n| 4 | **Quantitatively Managed** | **Measured and controlled**: **data-driven** with **quantitative** improvement objectives |\n| 5 | **Optimizing** | **Stable and flexible**: focused on **continuous improvement**, able to pivot |\n\nMemory aid: **I M D Q O**. Level 2 = project, level 3 = whole organization.","fig":"cmmi"}]},{"id":"2.3","t":{"vi":"Waterfall","en":"Waterfall"},"cards":[{"src":"02#13","vi":"**Plan-driven methods** là cách phát triển có cấu trúc, **dẫn dắt bởi kế hoạch**. Còn gọi là **disciplined methods** hay **traditional methods**, thường được định nghĩa trong kế hoạch và **dựa vào tài liệu**.","en":"**Plan-driven methods** are structured approaches **guided by plans**. Also called **disciplined** or **traditional** methods; often defined in plans and **relying on documentation**."},{"src":"02#14","vi":"**5 giai đoạn của Waterfall** theo hình slide:\n1. **Requirements definition**\n2. **Analysis and Design**\n3. **Implementation and Unit Testing**\n4. **Integration and System Testing**\n5. **Operation and Maintenance**\n\nMũi tên quay lại cho thấy có thể **trở về giai đoạn trước**.","en":"**Five waterfall stages** in the slide diagram:\n1. **Requirements definition**\n2. **Analysis and Design**\n3. **Implementation and Unit Testing**\n4. **Integration and System Testing**\n5. **Operation and Maintenance**\n\nFeedback arrows show you can **go back to a previous stage**.","fig":"waterfall"},{"src":"02#15","vi":"**Quy tắc của Waterfall:**\n- **Hai stage không làm cùng lúc**: chưa **baseline** requirement thì **chưa bắt đầu** development. Requirement đã baseline là requirement đã chốt, sẵn sàng để dựa vào.\n- Stage phải **xong** mới sang stage sau. Một stage \"xong\" khi đạt bộ **tiêu chí**, kiểm bằng **checklist**.\n- **Có thể quay lại stage trước**. Bẫy hay gặp: \"không thể quay lại\" là **SAI**.","en":"**Waterfall rules:**\n- **Two stages are not performed at the same time**: development does **not start** until requirements are **baselined** (agreed and ready to build on).\n- Each stage must be **completed** before the next; completion means meeting **criteria**, checked with **checklists**.\n- **Going back to a previous stage is possible**. Trap: \"going back is impossible\" is **FALSE**."},{"src":"02#16","vi":"**Đầu ra chuẩn** của từng stage:\n- Requirements documents\n- Software architecture document\n- Source code and test cases\n- Test results\n- User manual document\n- Training document","en":"**Standard outcomes** of the stages:\n- Requirements documents\n- Software architecture document\n- Source code and test cases\n- Test results\n- User manual document\n- Training document"},{"src":"02#17","vi":"**Nhược điểm của Waterfall:**\n- Chia dự án thành các stage **cứng nhắc**, nên **khó đáp ứng requirement thay đổi**.\n- **Chỉ phù hợp khi requirement đã được hiểu rõ** và ít thay đổi trong lúc thiết kế.\n- Nhưng **ít hệ thống kinh doanh** có requirement ổn định.\n- Chủ yếu dùng cho dự án **system engineering lớn**.","en":"**Waterfall problems:**\n- **Inflexible** partitioning into stages makes it **difficult to respond to changing requirements**.\n- **Only appropriate when requirements are well-understood** and changes during design are limited.\n- But **few business systems** have stable requirements.\n- Mostly used for **large systems engineering** projects."},{"src":"02#18","vi":"**Waterfall revised**: từ **mỗi** stage đều có mũi tên quay về stage trước đó. Tên stage 2 ở hình này là **System and Software Design**.","en":"**Waterfall revised**: **every** stage has an arrow back to the earlier ones. Stage 2 here is named **System and Software Design**.","fig":"waterfall-revised"}]},{"id":"2.4","t":{"vi":"Incremental & Spiral","en":"Incremental & Spiral"},"cards":[{"src":"02#19","vi":"**Process iteration**: dự án được chia thành **nhiều vòng lặp** (iterations), phần làm lại có thể diễn ra ở các vòng sau. Iteration áp dụng được cho **mọi** process model chung. Hai cách tiếp cận liên quan: **Incremental** và **Spiral**.","en":"**Process iteration**: the project is divided into **many iterations**; rework can happen in later ones. Iteration can be applied to **any** generic process model. Two related approaches: **Incremental** and **Spiral**."},{"src":"02#20","vi":"**Incremental model**: từ **Requirements** chung, chia thành **Build 1, Build 2, Build 3…** Mỗi build có **Analysis & Design → Implementation → Testing** riêng.","en":"**Incremental model**: from common **Requirements**, the work is split into **Build 1, Build 2, Build 3…**, each with its own **Analysis & Design → Implementation → Testing**.","fig":"incremental"},{"src":"02#22-24","vi":"- Phát triển và bàn giao chia thành các **increment**, mỗi increment giao **một phần chức năng**.\n- Requirement được **ưu tiên**: requirement **ưu tiên cao nhất làm ở increment đầu**.\n\n| Ưu điểm | Nhược điểm |\n|---|---|\n| Có chức năng **sớm hơn** | **Process không hiển thị rõ** (process is not visible): manager cần sản phẩm định kỳ để đo tiến độ |\n| Increment đầu đóng vai **prototype** giúp khai thác requirement | **Cấu trúc hệ thống dễ xuống cấp**: thay đổi liên tục làm hỏng cấu trúc |\n| Requirement ưu tiên cao **được test nhiều nhất** | |\n| **Giảm rủi ro** thất bại toàn dự án | |","en":"- Development and delivery are broken into **increments**, each delivering **part of the functionality**.\n- Requirements are **prioritized**: the **highest-priority requirements come in early increments**.\n\n| Benefits | Problems |\n|---|---|\n| Functionality available **earlier** | **The process is not visible**: managers need regular deliverables to measure progress |\n| Early increments act as a **prototype** to elicit requirements | **System structure tends to degrade** with regular change |\n| Highest-priority requirements get **the most testing** | |\n| **Lower risk** of overall project failure | |"},{"src":"02#25","vi":"**Spiral model**: mỗi vòng xoắn đi qua 4 góc phần tư:\n1. **Plan**: requirements gathering\n2. **Risk Analysis**: **risk reduction, prototyping**\n3. **Engineering**: coding, testing\n4. **Evaluate**: khách hàng đánh giá (slide ghi \"Customer Evolution\"), rồi **Release**\n\nCâu hỏi hay gặp: \"Risk Reduction / Prototyping\" thuộc góc **Risk Analysis**.","en":"**Spiral model**: each loop passes through four quadrants:\n1. **Plan**: requirements gathering\n2. **Risk Analysis**: **risk reduction, prototyping**\n3. **Engineering**: coding, testing\n4. **Evaluate**: \"Customer Evolution\" on the slide, then **Release**\n\nCommon question: \"Risk Reduction / Prototyping\" sits in the **Risk Analysis** quadrant.","fig":"spiral"},{"src":"02#27-29","vi":"- Hoạt động được tổ chức thành **các vòng xoắn** thay vì một trình tự.\n- **Mỗi vòng xoắn là một phase** của process.\n- **Không có phase cố định** như specification hay design.\n- **Rủi ro được đánh giá và xử lý xuyên suốt** quá trình.\n\n| Ưu điểm | Nhược điểm |\n|---|---|\n| **Nhấn mạnh quản lý rủi ro** | **Phức tạp và đắt** |\n| Tốt cho **dự án lớn** | **Phụ thuộc quá nhiều** vào phân tích rủi ro |\n| Requirement **linh hoạt** | **Khó quản lý thời gian** |\n| Người dùng **thấy hệ thống sớm** | |","en":"- Activities are organized into **spirals** instead of a sequence.\n- **Each spiral represents a phase** of the process.\n- **No fixed phases** such as specification or design.\n- **Risks are assessed and resolved throughout** the process.\n\n| Benefits | Problems |\n|---|---|\n| **Emphasis on risk management** | **Complex and expensive** |\n| Good for **large projects** | **Too much dependence** on risk analysis |\n| **Flexible** requirements | **Difficult time management** |\n| Users **see the system early** | |"}]},{"id":"2.5","t":{"vi":"Rational Unified Process (RUP)","en":"Rational Unified Process (RUP)"},"cards":[{"src":"02#30","vi":"Hình RUP có 2 chiều:\n- **Chiều ngang: 4 phase** theo thời gian, mỗi phase chia thành các **iteration** (Initial, Elab #1, #2, Const #1…#N, Tran #1, #2).\n- **Chiều dọc: các workflow (discipline)**: Business Modeling, Requirements, Analysis & Design, Implementation, Test, Deployment, Configuration & Change Mgmt, Project Management, Environment.\n\nĐộ cao \"sóng\" cho thấy mỗi workflow **nặng** ở phase nào. Ví dụ Requirements nặng ở đầu, Deployment nặng ở cuối.","en":"The RUP diagram has two axes:\n- **Horizontal: four phases** over time, each split into **iterations** (Initial, Elab #1, #2, Const #1…#N, Tran #1, #2).\n- **Vertical: workflows (disciplines)**: Business Modeling, Requirements, Analysis & Design, Implementation, Test, Deployment, Configuration & Change Mgmt, Project Management, Environment.\n\nThe height of each \"wave\" shows when a workflow is **heaviest**, e.g. Requirements early, Deployment late.","fig":"rup"},{"src":"02#32-33","vi":"Hoạt động được nhóm thành **workflows**. **4 phase** theo thứ tự **Inception → Elaboration → Construction → Transition**:\n\n| Phase | Mục đích |\n|---|---|\n| **Inception** | Xây dựng **business case** cho hệ thống |\n| **Elaboration** | Hiểu **problem domain** và **kiến trúc hệ thống** |\n| **Construction** | **Thiết kế, lập trình, kiểm thử** hệ thống |\n| **Transition** | **Triển khai** hệ thống vào môi trường vận hành |\n\nMẹo nhớ: **I-E-C-T** = \"**I**dea → **E**xplore → **C**ode → **T**ransfer\".","en":"Activities are grouped into **workflows**. **Four phases** in order **Inception → Elaboration → Construction → Transition**:\n\n| Phase | Purpose |\n|---|---|\n| **Inception** | Establish the **business case** for the system |\n| **Elaboration** | Understand the **problem domain** and the **system architecture** |\n| **Construction** | System **design, programming and testing** |\n| **Transition** | **Deploy** the system in its operating environment |\n\nMemory aid: **I-E-C-T** = \"**I**dea → **E**xplore → **C**ode → **T**ransfer\"."},{"src":"02#34","vi":"**RUP iteration:**\n- Mỗi phase chia thành **một hoặc nhiều iteration**.\n- **Mỗi iteration được xem là một chu kỳ waterfall**.\n- Mỗi iteration có **tiêu chí vào/ra** (entry and exit criteria) hay checkpoint.\n\nSố iteration điển hình: Inception **1–2**, Elaboration **1–3**, Construction **2–3**, Transition **2–3**.","en":"**RUP iteration:**\n- Each phase is divided into **one or more iterations**.\n- **Each iteration is considered a waterfall cycle**.\n- Each iteration has **entry and exit criteria** (check points).\n\nTypical iterations: Inception **1–2**, Elaboration **1–3**, Construction **2–3**, Transition **2–3**."}]},{"id":"2.6","t":{"vi":"Agile Manifesto","en":"Agile Manifesto"},"cards":[{"src":"02#36-37","vi":"**Agile Manifesto** nêu giá trị và nguyên tắc của Agile, gồm **4 giá trị nền tảng** và **12 nguyên tắc**.\n\n**4 giá trị** (vế trái **được coi trọng hơn** vế phải):\n- **Individuals and interactions** over processes and tools\n- **Working software** over comprehensive documentation\n- **Customer collaboration** over contract negotiation\n- **Responding to change** over following a plan\n\nBẫy: đề hay **đảo vế**, ví dụ \"Following a plan over responding to change\" là **sai**.","en":"The **Agile Manifesto** states Agile's values and principles: **4 foundational values** and **12 supporting principles**.\n\n**The four values** (left side valued **more** than right):\n- **Individuals and interactions** over processes and tools\n- **Working software** over comprehensive documentation\n- **Customer collaboration** over contract negotiation\n- **Responding to change** over following a plan\n\nTrap: questions often **swap the sides**, e.g. \"Following a plan over responding to change\" is **wrong**."},{"src":"02#38","vi":"**12 nguyên tắc**, nhóm theo 4 giá trị:\n- Làm hài lòng khách bằng **giao phần mềm sớm và liên tục**.\n- **Đón nhận thay đổi requirement**, kể cả khi đã muộn.\n- **Giao phần mềm chạy được thường xuyên**.\n- Người làm kinh doanh và developer **làm việc cùng nhau hằng ngày**.\n- Xây dự án quanh **những người có động lực**, tin tưởng họ.\n- **Trao đổi trực tiếp** (face-to-face) là hiệu quả nhất.\n- **Phần mềm chạy được là thước đo tiến độ chính**.\n- Giữ **nhịp độ bền vững** (sustainable pace).\n- Chú ý liên tục đến **kỹ thuật tốt và thiết kế tốt**.\n- **Đơn giản**: tối đa hoá lượng việc **không cần làm**.\n- Kiến trúc tốt nhất đến từ **team tự tổ chức**.\n- Team **định kỳ nhìn lại** để làm tốt hơn.","en":"**The 12 principles**, grouped under the four values:\n- Satisfy the customer through **early and continuous delivery**.\n- **Welcome changing requirements**, even late.\n- **Deliver working software frequently**.\n- Business people and developers **work together daily**.\n- Build projects around **motivated individuals** and trust them.\n- **Face-to-face conversation** is the most effective.\n- **Working software is the primary measure of progress**.\n- Maintain a **sustainable pace**.\n- Continuous attention to **technical excellence and good design**.\n- **Simplicity**: maximize the amount of work **not done**.\n- The best architectures emerge from **self-organizing teams**.\n- The team **regularly reflects** and adjusts."}]},{"id":"2.7","t":{"vi":"Extreme Programming (XP)","en":"Extreme Programming (XP)"},"cards":[{"src":"02#43-45","vi":"**Triết lý XP: lấy những thực hành tốt đã biết và đẩy chúng lên mức cực đoan.**\n- Code review tốt, vậy **review code mọi lúc** (pair programming).\n- Testing tốt, vậy **test mọi lúc**.\n- Design tốt, vậy design thành **việc hằng ngày của mọi người**.\n- Simplicity tốt, vậy luôn giữ **thiết kế đơn giản nhất** đủ cho chức năng hiện tại.\n- Kiến trúc quan trọng, vậy **mọi người cùng định nghĩa và tinh chỉnh** kiến trúc liên tục.\n- Integration testing quan trọng, vậy **tích hợp và test nhiều lần mỗi ngày**.\n- Iteration ngắn tốt, vậy làm iteration **cực ngắn**: giây, phút, giờ thay vì tuần, tháng.\n- Khách hàng tham gia tốt, vậy cho khách **tham gia toàn thời gian**.","en":"**XP philosophy: take known good practices and push them to extremes.**\n- Code reviews are good, so **review code all the time**.\n- Testing is good, so **test all the time**.\n- Design is good, so make it **part of everybody's daily business**.\n- Simplicity is good, so always keep **the simplest design** that supports current functionality.\n- Architecture matters, so **everybody defines and refines** it all the time.\n- Integration testing matters, so **integrate and test several times a day**.\n- Short iterations are good, so make them **really, really short**: seconds, minutes, hours.\n- Customer involvement is good, so make customers **full-time participants**."},{"src":"02#46","vi":"**12 practice của XP:**\n\n| | |\n|---|---|\n| The Planning Game | Pair Programming |\n| Small Releases | Collective Ownership |\n| Metaphor | **Continuous Integration** |\n| Simple Design | **40-hour Week** |\n| Acceptance Testing | **On-site Customer** |\n| Refactoring | Coding Standards |\n\nBẫy: **Daily Scrum**, Sprint, Kanban board **không** phải practice của XP.","en":"**The 12 XP practices:**\n\n| | |\n|---|---|\n| The Planning Game | Pair Programming |\n| Small Releases | Collective Ownership |\n| Metaphor | **Continuous Integration** |\n| Simple Design | **40-hour Week** |\n| Acceptance Testing | **On-site Customer** |\n| Refactoring | Coding Standards |\n\nTrap: **Daily Scrum**, Sprint and Kanban board are **not** XP practices."}]},{"id":"2.8","t":{"vi":"Scrum (Scrum Guide 2020)","en":"Scrum (Scrum Guide 2020)"},"cards":[{"src":"02#53-54","vi":"**Scrum** là phương pháp agile dùng **một bộ thực hành và luật đơn giản** để phát triển sản phẩm **theo từng phần**. Tác giả: **Ken Schwaber và Jeff Sutherland**. Định nghĩa bởi **The Scrum Guide**, bản mới nhất **tháng 11/2020**.\n\n- **Sprint**: event có **độ dài cố định, tối đa 1 tháng** (thường 2 tuần), **chứa mọi event khác**.\n- **Daily Scrum**: **15 phút**, để **Developers** kiểm tra tiến độ hướng tới **Sprint Goal**.\n- **Burndown chart**: **thực hành phổ biến nhưng KHÔNG bắt buộc** theo Scrum Guide, dùng để thấy phần việc còn lại.","en":"**Scrum** is an agile method using **a set of simple practices and rules** to develop products **incrementally**, by **Ken Schwaber and Jeff Sutherland**. Defined by **The Scrum Guide**, latest version **November 2020**.\n\n- **Sprint**: a **fixed-length event of one month or less** (commonly 2 weeks) that **contains all other events**.\n- **Daily Scrum**: **15 minutes** for the **Developers** to inspect progress toward the **Sprint Goal**.\n- **Burndown chart**: a **common practice, NOT required** by the Scrum Guide, to visualize remaining work."},{"src":"02#54","vi":"**3 artifact và commitment đi kèm** (cặp đôi rất hay ra đề):\n\n| Artifact | Commitment |\n|---|---|\n| **Product Backlog** | **Product Goal** |\n| **Sprint Backlog** | **Sprint Goal** |\n| **Increment** | **Definition of Done** |","en":"**Three artifacts and their commitments** (a favourite pairing):\n\n| Artifact | Commitment |\n|---|---|\n| **Product Backlog** | **Product Goal** |\n| **Sprint Backlog** | **Sprint Goal** |\n| **Increment** | **Definition of Done** |"},{"src":"02#55","vi":"**Luồng Scrum:** Product Owner sắp xếp **Product Backlog**. Ở **Sprint Planning**, team chọn việc và lập kế hoạch, tạo ra **Sprint Backlog**. Trong **Sprint** (tối đa 1 tháng) có **Daily Scrum** mỗi ngày. Cuối Sprint có **Increment** có thể release, rồi đến **Sprint Review** và **Sprint Retrospective**.","en":"**Scrum flow:** the Product Owner orders the **Product Backlog**; **Sprint Planning** picks work and plans it into the **Sprint Backlog**; during the **Sprint** (max one month) there is a **Daily Scrum** each day; the Sprint ends with a potentially releasable **Increment**, a **Sprint Review** and a **Sprint Retrospective**.","fig":"scrum"},{"src":"02#57-58","vi":"- **Product Backlog**: toàn bộ requirement của sản phẩm; các item được **ước lượng và ưu tiên**.\n- **Sprint Backlog**: các item requirement **được phân cho một sprint**; cũng được ước lượng và ưu tiên.\n\n**User story** mô tả tính năng **từ góc nhìn người dùng**:\n- Mẫu: **As a [user], I want [goal], so that [benefit].**\n- Ví dụ: *As a student, I want to view my grades online, so that I can track my learning progress.*\n- User story tốt: **rõ ràng, nhỏ, test được, có giá trị**.","en":"- **Product Backlog**: overall product requirements; items are **estimated and prioritized**.\n- **Sprint Backlog**: requirement items **allocated for one sprint**; also estimated and prioritized.\n\nA **user story** describes a feature **from the user's perspective**:\n- Format: **As a [user], I want [goal], so that [benefit].**\n- Example: *As a student, I want to view my grades online, so that I can track my learning progress.*\n- Good stories are **clear, small, testable and valuable**."},{"src":"02#59","vi":"**Scrum Team**: **một** team, thường **10 người trở xuống**, có **3 accountability**:\n\n| Accountability | Trách nhiệm |\n|---|---|\n| **Product Owner** | **Tối đa hoá giá trị** sản phẩm; định nghĩa **Product Goal**; **sắp thứ tự Product Backlog** |\n| **Scrum Master** | Thiết lập Scrum; **coach** team và tổ chức; **gỡ bỏ trở ngại** (impediments) |\n| **Developers** | Tạo **Sprint Backlog** và **Increment dùng được** mỗi Sprint; tuân theo **Definition of Done** |\n\n**Không có vai trò \"manager\" hay \"team lead\"** trong Scrum, team **tự quản lý** (self-managing). Bẫy: \"Project Manager\" **không** phải accountability của Scrum.","en":"**Scrum Team**: **one** team, typically **10 or fewer people**, with **three accountabilities**:\n\n| Accountability | Responsibilities |\n|---|---|\n| **Product Owner** | **Maximizes product value**; defines the **Product Goal**; **orders the Product Backlog** |\n| **Scrum Master** | Establishes Scrum; **coaches** the team and organization; **removes impediments** |\n| **Developers** | Create the **Sprint Backlog** and a **usable Increment** every Sprint; follow the **Definition of Done** |\n\n**No \"manager\" or \"team lead\" role** inside Scrum; the team is **self-managing**. Trap: \"Project Manager\" is **not** a Scrum accountability."},{"src":"02#60","vi":"**5 Scrum event:**\n\n| Event | Mục đích |\n|---|---|\n| **The Sprint** | **Chứa mọi event**, tối đa **1 tháng** |\n| **Sprint Planning** | Sprint này **có giá trị gì? Làm được gì? Làm thế nào?** → **Sprint Goal + Sprint Backlog** |\n| **Daily Scrum** | **15 phút**, kiểm tra tiến độ và điều chỉnh kế hoạch |\n| **Sprint Review** | Kiểm tra **Increment** cùng **stakeholder**; điều chỉnh Product Backlog |\n| **Sprint Retrospective** | Nhìn lại **cách team làm việc**; lên kế hoạch cải tiến |\n\nBẫy: **Release planning** là thực hành phổ biến nhưng **KHÔNG phải Scrum event**. Review xem **sản phẩm**, Retrospective xem **cách làm việc**.","en":"**Five Scrum events:**\n\n| Event | Purpose |\n|---|---|\n| **The Sprint** | **Container for all events**, **one month or less** |\n| **Sprint Planning** | **Why is this Sprint valuable? What can be done? How?** → **Sprint Goal + Sprint Backlog** |\n| **Daily Scrum** | **15 minutes**, inspect progress and adapt the plan |\n| **Sprint Review** | Inspect the **Increment** with **stakeholders**; adapt the Product Backlog |\n| **Sprint Retrospective** | Inspect **how the team worked**; plan improvements |\n\nTrap: **Release planning** is a common practice but **NOT a Scrum event**. Review looks at the **product**, Retrospective at **the way of working**."}]},{"id":"2.9","t":{"vi":"Kanban","en":"Kanban"},"cards":[{"src":"02#62-63","vi":"- Do **Taiichi Ohno** giới thiệu tại **Toyota** cho **sản xuất vật liệu**, giúp tăng năng suất bằng cách **tránh nút thắt** (bottleneck).\n- Các thẻ (\"kanban\") dùng để **chuyển work item** giữa các team.\n- **David J. Anderson** áp dụng Kanban vào **phát triển phần mềm khoảng năm 2004**.\n- Kanban là một **phương pháp agile**, cũng được dùng ở nhiều ngành khác.","en":"- Introduced by **Taiichi Ohno** at **Toyota** for **material production**; it raised productivity by **avoiding bottlenecks**.\n- Cards (\"kanban\") pass **work items** between teams.\n- **David J. Anderson** applied Kanban to **software development around 2004**.\n- Kanban is an **agile method**, also applied in other industries."},{"src":"02#64-66","vi":"- **Kanban board**: bảng để **trực quan hoá** work item, ví dụ các cột To Do / Doing / Done.\n- **Kanban card**: mỗi thẻ là **một work item**, di chuyển **từ trái sang phải**.\n- Thẻ **chảy** qua các stage, dòng chảy (flow) nên **đều**. Con số trên cột (ví dụ Todo ②, Ongoing ②) là **giới hạn WIP**.","en":"- **Kanban board**: a board to **visualize** work items, e.g. To Do / Doing / Done columns.\n- **Kanban card**: each card is **one work item**, moved **left to right**.\n- Cards **flow** between stages; flow should be **even**. The number on a column (e.g. Todo ②, Ongoing ②) is its **WIP limit**.","fig":"kanban"},{"src":"02#67","vi":"**4 nguyên tắc của Kanban:**\n1. **Bắt đầu từ cái đang làm** (start with what you are doing now): không đổi process ngay.\n2. **Theo đuổi thay đổi từng bước** (incremental, evolutionary change): mỗi lần đổi một chút.\n3. **Tôn trọng vai trò, trách nhiệm và chức danh hiện tại**: không bắt tổ chức đổi ngay.\n4. **Khuyến khích tinh thần lãnh đạo ở mọi cấp**: từ developer đến senior manager.","en":"**Kanban's four principles:**\n1. **Start with what you are doing now**: no immediate process changes.\n2. **Agree to pursue incremental, evolutionary change**: small changes at a time.\n3. **Respect current roles, responsibilities and job titles**: no immediate org changes.\n4. **Encourage acts of leadership at all levels**: from developers to senior managers."},{"src":"02#68-70","vi":"**3 core practice:**\n- **Visualize the flow of work**: board, thẻ hoặc sticker, màu sắc.\n- **Limit work in progress (WIP)**: số việc đang làm **bị giới hạn**; phải **làm xong việc hiện tại** mới nhận việc mới. Giới hạn khác nhau tuỳ team.\n- **Dùng báo cáo và biểu đồ**: **Cumulative flow diagram** (CFD, hình bên) cho thấy số việc To Do / In Progress / Done theo thời gian.","en":"**Three core practices:**\n- **Visualize the flow of work**: board, cards or stickers, colors.\n- **Limit work in progress (WIP)**: the number of current items is **limited**; **finish current work** before taking new work. Limits vary by team.\n- **Use reports and charts**: the **cumulative flow diagram** (CFD, pictured) shows To Do / In Progress / Done over time.","fig":"cfd"},{"src":"02#71","vi":"**Lợi ích của Kanban:**\n- **Lập kế hoạch đơn giản, linh hoạt**: xong một item thì thêm item mới, **không có iteration như Scrum**.\n- **Rút ngắn cycle time**, tức thời gian một item đi từ lúc bắt đầu tới khi xong.\n- **Ít nút thắt**: nhờ **giới hạn WIP** và **giảm làm nhiều việc cùng lúc**.\n\nSo nhanh: Scrum có Sprint và vai trò cố định; Kanban **không có iteration**, tập trung vào **dòng chảy** và giới hạn WIP.","en":"**Benefits of Kanban:**\n- **Simple, flexible planning**: when an item is done, a new one is added; **no iteration like Scrum**.\n- **Shortened cycle time** (time an item takes from start to finish).\n- **Few bottlenecks**: **limit WIP** and **reduce multi-tasking**.\n\nQuick contrast: Scrum has Sprints and fixed accountabilities; Kanban has **no iterations** and focuses on **flow** and WIP limits."},{"src":"02#59-60","vi":"Trong dự án thật, nhiều công ty dùng **Scrumban**: chạy Sprint 2 tuần nhưng trên board có **giới hạn WIP** kiểu Kanban. Chức danh \"Project Manager\" vẫn tồn tại trong công ty, nhưng **bên trong Scrum Team** thì không có vai trò đó. Đề thi theo **Scrum Guide 2020**, nên hãy trả lời theo slide.","en":"In industry many teams run **Scrumban**: two-week Sprints with Kanban-style **WIP limits** on the board. Companies still have \"Project Manager\" job titles, but **inside a Scrum Team** there is no such role. The exam follows the **Scrum Guide 2020**, so answer from the slides.","real":true}]}],"3":[{"id":"3.1","t":{"vi":"Project là gì & vì sao khó","en":"What a project is & why it is hard"},"cards":[{"src":"03#4","vi":"**Project** là một chuỗi hoạt động/task có **mục tiêu rõ ràng** và **giới hạn về thời gian và ngân sách**. Ba yếu tố của project: **Scope · Time · Budget**.\n\n**Phân loại theo mục tiêu:**\n\n| Loại project | Tạo ra |\n|---|---|\n| **Production** | **Product** (sản phẩm) |\n| **Investment** | **Benefit** (lợi ích) |\n| **Research** | **Knowledge** (tri thức) |","en":"A **project** is a series of activities/tasks with a **well-defined goal** and **limited time and budget**. The three project factors: **Scope · Time · Budget**.\n\n**Types by goal:**\n\n| Project type | Produces |\n|---|---|\n| **Production** | **Product** |\n| **Investment** | **Benefit** |\n| **Research** | **Knowledge** |"},{"src":"03#5-6","vi":"**Vì sao project phần mềm khác biệt và khó quản lý:**\n- Phần mềm **vô hình** (intangible), không thấy tiến độ bằng mắt.\n- Phần mềm **linh hoạt**, process cũng **linh hoạt**.\n- Phụ thuộc vào **yếu tố con người** (human factors).\n\n**Lý do thất bại thường gặp:** requirement **mơ hồ hoặc thay đổi**; **ước lượng thấp** effort và lịch; **giao tiếp kém** giữa stakeholder; **thiếu quản lý rủi ro**; test và kiểm soát chất lượng **không đủ**; thành viên **thiếu kỹ năng**.","en":"**Why software projects are different and hard:**\n- Software is **intangible**: progress cannot be seen.\n- Software is **flexible**, and so are software processes.\n- Projects depend on **human factors**.\n\n**Common reasons for failure:** **unclear or changing** requirements; **underestimated** effort and schedule; **poor communication** among stakeholders; **lack of risk management**; inadequate testing and quality control; team members **lacking skills**."}]},{"id":"3.2","t":{"vi":"Vai trò & các hoạt động quản lý","en":"Roles & management activities"},"cards":[{"src":"03#7-8","vi":"**Software project management** nhằm **tăng khả năng thành công** (về scope, time, budget). Người chịu trách nhiệm: **Program manager, Project manager, Team lead, Test manager**.\n\n**Project manager** dẫn dắt team đạt mục tiêu project, là **một trong những vai trò then chốt** quyết định thành công và kiêm nhiều vai trò quản lý.","en":"**Software project management** aims to **increase the likelihood of project success** (scope, time, budget). Responsible roles: **Program manager, Project manager, Team lead, Test manager**.\n\nThe **project manager** leads the team to the project objectives, is **one of the key roles** for success and plays many management roles."},{"src":"03#9","vi":"| Vai trò | Tập trung vào |\n|---|---|\n| **Project Manager** | **Scope, schedule, cost, risks**, giao tiếp, stakeholder |\n| **Engineering Manager** | **Chất lượng kỹ thuật**, **năng lực team**, kiến trúc, quy trình kỹ thuật |\n| **Team Lead** | **Điều phối kỹ thuật hằng ngày**, **giao task**, hỗ trợ code/design |","en":"| Role | Main focus |\n|---|---|\n| **Project Manager** | **Scope, schedule, cost, risks**, communication, stakeholders |\n| **Engineering Manager** | **Technical quality**, **team capability**, architecture, engineering process |\n| **Team Lead** | **Daily technical coordination**, **task assignment**, code/design support |"},{"src":"03#10","vi":"**4 hoạt động quản lý** (hay hỏi \"output X thuộc hoạt động nào\"):\n\n| Hoạt động | Câu hỏi chính | Output |\n|---|---|---|\n| **Initiation** | Vì sao làm? **Có khả thi không?** | **Feasibility report**, **project proposal** |\n| **Planning** | Làm gì? Ai? Khi nào? Tốn bao nhiêu? | **Scope, WBS, estimates, schedule, staffing plan** |\n| **Executing** | Task có đúng kế hoạch không? | Weekly plan, task đã giao, deliverable trung gian |\n| **Tracking & Control** | Đang ở đâu? Có vấn đề gì? Đổi gì? | **Progress report, issue log, change request**, kế hoạch cập nhật |","en":"**Four management activities** (\"which activity produces output X\"):\n\n| Activity | Main questions | Key outputs |\n|---|---|---|\n| **Initiation** | Why do it? **Is it feasible?** | **Feasibility report**, **project proposal** |\n| **Planning** | What? Who? When? How much effort/cost? | **Scope, WBS, estimates, schedule, staffing plan** |\n| **Executing** | Are tasks performed according to plan? | Weekly plan, assigned tasks, intermediate deliverables |\n| **Tracking & Control** | Where are we? What problems? What should change? | **Progress report, issue log, change requests**, updated plan |"},{"src":"03#11","vi":"**Ví dụ xuyên suốt bài: Cinema Management System**\n- Tính năng: quản lý phim, phòng, lịch chiếu; bán và huỷ vé; quản lý khách và nhân viên; báo cáo doanh thu.\n- Deliverable: requirement document, database design, UI prototype, source code, test report, final demo.","en":"**Running example: Cinema Management System**\n- Features: manage movies, rooms, schedules; sell and cancel tickets; manage customers and staff; revenue reports.\n- Deliverables: requirement document, database design, UI prototype, source code, test report, final demo."}]},{"id":"3.3","t":{"vi":"Planning, scope & WBS","en":"Planning, scope & WBS"},"cards":[{"src":"03#13-15","vi":"**Project planning** xác định mục tiêu, làm gì, ai làm, khi nào và làm thế nào.\n- **Planning là hoạt động liên tục**: bắt đầu sớm, kéo dài tới hết dự án, **kế hoạch được sửa theo thực tế**.\n- Agile lập kế hoạch liên tục ở tầm ngắn hơn: **release, sprint, day**.\n- Có nhiều loại kế hoạch trong **SDP** (Software Development Plan): budget và schedule, staffing, training, **risk management**, testing, deployment, configuration management, quality management, acceptance…\n- Hoạt động chính để lập SDP: ước lượng effort/cost/staff; lên phase, iteration; chọn process; giao vai trò; kế hoạch đào tạo; **xác định và đánh giá rủi ro**.","en":"**Project planning** defines goals: what, who, when (and how).\n- **Planning is a continuous activity**: it starts early, continues until the end, and **plans are revised to reflect reality**.\n- Agile projects plan continuously in smaller horizons: **release, sprint, day**.\n- The **SDP** (Software Development Plan) covers budget and schedule, staffing, training, **risk management**, testing, deployment, configuration management, quality management, acceptance…\n- Main SDP activities: estimate effort/cost/staff; plan phases and iterations; define processes; assign roles; plan training; **identify and assess risks**."},{"src":"03#16","vi":"**Scope definition** xác định dự án **sẽ giao gì và KHÔNG giao gì**:\n- Mục tiêu dự án\n- Deliverable mong đợi\n- Tính năng **được và không được** bao gồm\n- Chia nhỏ thành task bằng **WBS**\n\nVì sao quan trọng: scope rõ giúp **ước lượng, xếp lịch, giao việc và kiểm soát thay đổi**.","en":"**Scope definition** determines what the project **will and will not** deliver:\n- Project objectives\n- Expected deliverables\n- **Included and excluded** features\n- Breaking work into tasks with a **WBS**\n\nWhy it matters: a clear scope helps **estimate, schedule, assign work and control changes**."},{"src":"03#17-18","vi":"**WBS (Work Breakdown Structure)** chia scope thành các **work item nhỏ, quản lý được**: theo **phase → deliverable → task**. WBS giúp ước lượng chính xác hơn, giao việc, theo dõi tiến độ, và là **nền tảng cho lập lịch và nhận diện rủi ro**.\n\n**Quy tắc ngón tay cái:** mỗi work item phải đủ rõ để **được giao (assigned), ước lượng (estimated) và theo dõi (tracked)**.\n\nVí dụ WBS (Cinema):\n- 1 Requirement analysis: 1.1 Identify actors · 1.2 Functional req · 1.3 Non-functional req\n- 2 Design: 2.1 Database · 2.2 UI · 2.3 Architecture\n- 3 Implementation: 3.1 Login · 3.2 Movie management · 3.3 Ticket booking · 3.4 Report\n- 4 Testing: 4.1 Unit · 4.2 Integration · 4.3 User acceptance","en":"A **WBS (Work Breakdown Structure)** breaks the scope into **smaller, manageable work items**, by **phase → deliverable → task**. It improves estimates, supports assignment and tracking, and is the **foundation for scheduling and risk identification**.\n\n**Rule of thumb:** each work item must be clear enough to be **assigned, estimated and tracked**.\n\nExample WBS (Cinema):\n- 1 Requirement analysis: 1.1 Identify actors · 1.2 Functional req · 1.3 Non-functional req\n- 2 Design: 2.1 Database · 2.2 UI · 2.3 Architecture\n- 3 Implementation: 3.1 Login · 3.2 Movie management · 3.3 Ticket booking · 3.4 Report\n- 4 Testing: 4.1 Unit · 4.2 Integration · 4.3 User acceptance"}]},{"id":"3.4","t":{"vi":"Ước lượng","en":"Estimation"},"cards":[{"src":"03#20-21","vi":"**Hai cách ước lượng:**\n- **Experience-based**: dựa trên **kinh nghiệm** của manager với các dự án trước và lĩnh vực.\n- **Algorithmic cost modeling**: dùng **công thức** dựa trên thuộc tính sản phẩm (như **kích thước**) và đặc điểm process (như **kinh nghiệm nhân sự**).\n\n**Đo kích thước phần mềm:**\n- **LOC** (Lines of Code): đếm dòng lệnh chạy được, bỏ comment và dòng trống. **Đơn giản nhưng phụ thuộc ngôn ngữ**.\n- **FP** (Function Points): đo chức năng **từ góc nhìn người dùng**, **độc lập với ngôn ngữ lập trình**.","en":"**Two estimation approaches:**\n- **Experience-based**: the manager's **experience** of past projects and the domain.\n- **Algorithmic cost modeling**: a **formula** based on product attributes (such as **size**) and process characteristics (such as **staff experience**).\n\n**Software size:**\n- **LOC** (Lines of Code): count executable lines, excluding comments/blanks. **Simple but language-dependent**.\n- **FP** (Function Points): functionality **from the user's perspective**, **independent of programming language**."},{"src":"03#22","vi":"**Ba công thức cần thuộc** (đơn vị effort: man-hour, man-day, man-month):\n\n$$\\text{Effort} = a \\times (\\text{KLOC})^{b} \\quad \\text{(COCOMO)}$$\n\n$$\\text{Duration} = c \\times (\\text{Effort})^{d}$$\n\n$$\\text{Cost} = \\text{Effort} \\times \\text{cost per man-month}$$\n\nTrong đó KLOC là nghìn dòng code; $a, b, c, d$ là các hằng số của mô hình. Bẫy: đề đổi chỗ biến, ví dụ $\\text{Effort} = c \\times (\\text{Duration})^{d}$ là **sai**.","en":"**Three formulas to know** (effort units: man-hour, man-day, man-month):\n\n$$\\text{Effort} = a \\times (\\text{KLOC})^{b} \\quad \\text{(COCOMO)}$$\n\n$$\\text{Duration} = c \\times (\\text{Effort})^{d}$$\n\n$$\\text{Cost} = \\text{Effort} \\times \\text{cost per man-month}$$\n\nKLOC = thousands of lines of code; $a, b, c, d$ are model constants. Trap: swapped variables such as $\\text{Effort} = c \\times (\\text{Duration})^{d}$ are **wrong**."},{"src":"03#23","vi":"**Effort khác Duration.** Effort là tổng công sức (person-hours), duration là thời gian lịch.\n\nVí dụ: task *Implement ticket booking* cần **24 person-hours**.\n- 1 sinh viên làm 3 giờ/ngày: $24 \\div (1 \\times 3) = 8$ ngày.\n- 2 sinh viên làm 3 giờ/ngày: $24 \\div (2 \\times 3) \\approx 4$ ngày.\n\nNhưng **thêm người không luôn giảm thời gian theo tỷ lệ tuyến tính**.","en":"**Effort is not duration.** Effort is total work (person-hours); duration is calendar time.\n\nExample: *Implement ticket booking* needs **24 person-hours**.\n- 1 student × 3 h/day: $24 \\div (1 \\times 3) = 8$ days.\n- 2 students × 3 h/day: $24 \\div (2 \\times 3) \\approx 4$ days.\n\nBut **adding people does not always reduce time linearly**."},{"src":"03#24","vi":"**Ước lượng trong Agile:**\n- **Story points**: kích thước **tương đối** của một backlog item = **effort + complexity + uncertainty**. Cả team cùng ước lượng, ví dụ bằng **Planning Poker** với dãy **Fibonacci** (1, 2, 3, 5, 8, 13…).\n- **Velocity**: số story point **làm xong mỗi sprint**, đo từ các sprint trước.\n- **Dự báo:**\n\n$$\\text{Số sprint} \\approx \\frac{\\text{story points còn lại}}{\\text{velocity trung bình}}$$\n\nVí dụ: backlog 120 điểm, velocity 20 điểm/sprint, cần khoảng $120 / 20 = 6$ sprint (12 tuần).\n\nLưu ý: story point chỉ để **so sánh item trong cùng một team**. **Không so sánh các team bằng velocity.**","en":"**Agile estimation:**\n- **Story points**: **relative** size of a backlog item = **effort + complexity + uncertainty**, estimated by the whole team, e.g. **Planning Poker** on a **Fibonacci** scale (1, 2, 3, 5, 8, 13…).\n- **Velocity**: story points **completed per sprint**, measured from past sprints.\n- **Forecast:**\n\n$$\\text{Sprints} \\approx \\frac{\\text{remaining story points}}{\\text{average velocity}}$$\n\nExample: backlog 120 points, velocity 20 points/sprint, about $120 / 20 = 6$ sprints (12 weeks).\n\nNote: story points compare items **within one team**. **Do not compare teams by velocity.**"}]},{"id":"3.5","t":{"vi":"Lập lịch & đường găng (CPM)","en":"Scheduling & critical path (CPM)"},"cards":[{"src":"03#25-26","vi":"**Mục tiêu của scheduling:** giao **đúng người, đúng việc, đúng lúc**. Tổ chức task **song song** để tận dụng nhân lực; **giảm phụ thuộc**, slack và thời gian chờ; **cân bằng** khối lượng việc. Việc này cần trực giác và kinh nghiệm của PM.\n\n**Khó khăn:**\n- Khó ước lượng từng task. **Năng suất không tỷ lệ thuận với số người**; có phụ thuộc và giới hạn tài nguyên.\n- **Thêm người vào dự án đang trễ làm nó trễ hơn** (**Brooks' law**), do **chi phí giao tiếp** và **phải đào tạo thêm**.\n- Luôn có chuyện bất ngờ, vì vậy cần **dự phòng** (contingency) trong kế hoạch.","en":"**Scheduling goal:** **the right people on the right tasks at the right time**. Organize tasks **concurrently** to use the workforce well; **minimize dependencies**, slack and waiting; **balance** workload. It requires PM intuition and experience.\n\n**Challenges:**\n- Each task is hard to estimate; **productivity is not proportional to the number of people**; dependencies and resource constraints.\n- **Adding people to a late project makes it later** (**Brooks' law**): **communication overhead** and **extra training**.\n- The unexpected always happens, so **allow contingency**."},{"src":"03#27","vi":"- Tổ chức task để tạo ra **output hữu hình**.\n- **Milestone**: **điểm kết thúc** của một giai đoạn.\n- **Deliverable**: kết quả **giao cho khách hàng hoặc người dùng**.\n- Mỗi milestone thường gắn với một nhóm deliverable: Build 1, Build 2…; **Alpha, Beta, GA release**.","en":"- Organize tasks to produce **tangible outputs**.\n- **Milestones** are the **end-point of a period**.\n- **Deliverables** are results **delivered to customers or users**.\n- Each milestone is often marked by deliverables: Build 1, Build 2…; **alpha, beta, GA release**."},{"src":"03#28","vi":"**Activity timeline** (Gantt chart, Sommerville 2011): mỗi thanh là một task (T1…T12) theo thời gian, hình thoi ◆ là **milestone** (M1…M8). Slide 29 là **staff allocation**, cho thấy mỗi người (Fred, Jane, Anne…) làm task nào và khi nào.","en":"**Activity timeline** (Gantt chart, Sommerville 2011): each bar is a task (T1…T12) over time; diamonds ◆ are **milestones** (M1…M8). Slide 29 shows **staff allocation**: who (Fred, Jane, Anne…) works on which task and when.","fig":"gantt"},{"src":"03#30-31","vi":"**Critical Path Method (CPM).** Ví dụ trên slide:\n\n| Task | Thời gian | Phụ thuộc |\n|---|---|---|\n| T1 Requirement analysis | 3 ngày | – |\n| T2 Database design | 2 ngày | T1 |\n| T3 UI design | 2 ngày | T1 |\n| T4 Implementation | 5 ngày | T2, T3 |\n| T5 Testing | 3 ngày | T4 |\n| T6 Final demo preparation | 1 ngày | T5 |\n\n- **Critical path = chuỗi task phụ thuộc DÀI NHẤT** từ đầu tới cuối, quyết định **thời gian tối thiểu** của dự án.\n- $\\text{Slack} = \\text{latest start} - \\text{earliest start}$. **Task găng có slack = 0**, trễ task găng thì **trễ cả dự án**.\n- Đường A: T1→T2→T4→T5→T6 = $3+2+5+3+1 = 14$ ngày. Đường B: T1→T3→T4→T5→T6 = **14** ngày.\n- **Cả 2 đường đều găng**, thời gian tối thiểu **14 ngày**; T2 và T3 chạy **song song**.\n\nBài tập hay gặp: T4 trễ 2 ngày thì dự án thành **16 ngày**; T2 trễ 1 ngày thì thành **15 ngày** (vì T2 nằm trên đường găng).\n\nThể hiện lịch bằng **Gantt chart**; quản lý task trên board (GitHub Projects, Jira, Trello).","en":"**Critical Path Method (CPM).** Slide example:\n\n| Task | Duration | Depends on |\n|---|---|---|\n| T1 Requirement analysis | 3 days | – |\n| T2 Database design | 2 days | T1 |\n| T3 UI design | 2 days | T1 |\n| T4 Implementation | 5 days | T2, T3 |\n| T5 Testing | 3 days | T4 |\n| T6 Final demo preparation | 1 day | T5 |\n\n- **Critical path = the LONGEST chain of dependent tasks** from start to finish; it sets the **minimum project duration**.\n- $\\text{Slack} = \\text{latest start} - \\text{earliest start}$. **Critical tasks have zero slack**; delaying one **delays the whole project**.\n- Path A: T1→T2→T4→T5→T6 = $3+2+5+3+1 = 14$ days. Path B: T1→T3→T4→T5→T6 = **14** days.\n- **Both paths are critical**; minimum duration **14 days**; T2 and T3 run **in parallel**.\n\nTypical drills: T4 delayed 2 days gives **16 days**; T2 delayed 1 day gives **15 days** (T2 is on a critical path).\n\nShow the schedule as a **Gantt chart**; manage tasks on a board (GitHub Projects, Jira, Trello).","svg":"cpm"}]},{"id":"3.6","t":{"vi":"Nhận diện & phân tích rủi ro","en":"Risk identification & analysis"},"cards":[{"src":"03#33","vi":"**Risk management**: mục tiêu là **giảm thiểu ảnh hưởng của rủi ro** lên dự án.\n- **Risk** là **xác suất** một tình huống bất lợi xảy ra. Ví dụ: người rời team.\n- Ảnh hưởng tới: **lịch hoặc tài nguyên**, **chất lượng hoặc hiệu năng** phần mềm, **chi phí**…","en":"**Risk management** aims to **minimize the effects of risks** on the project.\n- A **risk** is a **probability that some adverse circumstance will occur**, e.g. people may leave the team.\n- Effects: **schedule or resources**, software **quality or performance**, **cost**, etc."},{"src":"03#34","vi":"**Rủi ro ảnh hưởng tới đâu** (bảng Sommerville):\n\n| Rủi ro | Ảnh hưởng |\n|---|---|\n| Staff turnover, Management change, Hardware unavailability | **Project** |\n| Requirements change, Specification delays, Size underestimate | **Project và Product** |\n| CASE tool under-performance | **Product** |\n| Technology change, **Product competition** | **Business** |","en":"**What each risk affects** (Sommerville table):\n\n| Risk | Affects |\n|---|---|\n| Staff turnover, Management change, Hardware unavailability | **Project** |\n| Requirements change, Specification delays, Size underestimate | **Project and Product** |\n| CASE tool under-performance | **Product** |\n| Technology change, **Product competition** | **Business** |"},{"src":"03#35-37","vi":"**Quy trình quản lý rủi ro: Identification → Analysis → Planning → Monitoring.**\n\n**5 loại rủi ro** khi nhận diện, kèm ví dụ:\n\n| Loại | Ví dụ |\n|---|---|\n| **Technology** | Database **không xử lý đủ số giao dịch/giây**; component tái sử dụng **có lỗi** |\n| **People** | **Không tuyển được** người đủ kỹ năng; **nhân sự chủ chốt ốm** đúng lúc quan trọng; không có khoá đào tạo cần thiết |\n| **Organizational** | Tổ chức **tái cấu trúc**, đổi người quản lý; **khó khăn tài chính** buộc cắt ngân sách |\n| **Requirements** | Thay đổi requirement cần **thiết kế lại lớn**; khách **không hiểu tác động** của thay đổi |\n| **Estimation** | **Ước lượng thấp thời gian** phát triển; **ước lượng thấp kích thước** phần mềm |","en":"**Risk process: Identification → Analysis → Planning → Monitoring.**\n\n**Five risk types** for identification, with examples:\n\n| Type | Examples |\n|---|---|\n| **Technology** | The database **cannot process as many transactions per second** as expected; reused components **contain defects** |\n| **People** | **Cannot recruit** staff with required skills; **key staff are ill** at critical times; required training unavailable |\n| **Organizational** | The organization is **restructured** with different management; **financial problems** force budget cuts |\n| **Requirements** | Changes requiring **major design rework**; customers **fail to understand the impact** of changes |\n| **Estimation** | **Development time underestimated**; **software size underestimated** |"},{"src":"03#38-39","vi":"**Risk analysis:** đánh giá **xác suất** và **mức nghiêm trọng (loss)** của từng rủi ro.\n\n$$\\text{RE (Risk exposure)} = \\text{Probability} \\times \\text{Loss}$$\n\n- Probability có thể là **categorical** (very low … very high) hoặc **numerical** (0%–100%).\n- Loss có thể là categorical (negligible … catastrophic) hoặc một con số chi phí.\n\n**Thang quy đổi trên slide:**\n\n| Probability | Giá trị | Loss | Giá trị |\n|---|---|---|---|\n| Unlikely | 10 | Negligible | 10 |\n| Seldom | 25 | Insignificant | 25 |\n| Occasional | 50 | Moderate | 50 |\n| Likely | 75 | Serious | 75 |\n| Frequently | 90 | Catastrophic | 90 |","en":"**Risk analysis:** assess the **probability** and **seriousness (loss)** of each risk.\n\n$$\\text{RE (Risk exposure)} = \\text{Probability} \\times \\text{Loss}$$\n\n- Probability may be **categorical** (very low … very high) or **numerical** (0%–100%).\n- Loss may be categorical (negligible … catastrophic) or a cost figure.\n\n**Scale used in the lecture:**\n\n| Probability | Value | Loss | Value |\n|---|---|---|---|\n| Unlikely | 10 | Negligible | 10 |\n| Seldom | 25 | Insignificant | 25 |\n| Occasional | 50 | Moderate | 50 |\n| Likely | 75 | Serious | 75 |\n| Frequently | 90 | Catastrophic | 90 |"},{"src":"03#39-40","vi":"**Bảng RE đầy đủ** (mình tự tính từ thang ở 03#39, giá trị = Probability × Loss). Ô viền đậm là các ví dụ hay gặp.","en":"**Full RE table** (computed from the 03#39 scale, value = Probability × Loss). Outlined cells are the examples that come

up most.","fig":"riskmatrix"},{"src":"03#41","vi":"**Ưu tiên rủi ro theo RE** (RE cao hơn thì ưu tiên cao hơn). Bảng trên slide:\n\n| Rủi ro | P | L | RE |\n|---|---|---|---|\n| Không tuyển được nhân sự đủ kỹ năng | Likely | Catastrophic | **6,750** |\n| Tổ chức tái cấu trúc, đổi người quản lý | Likely | Serious | **5,625** |\n| Nhân sự chủ chốt ốm | Occasional | Serious | 3,750 |\n| Component tái sử dụng có lỗi | Occasional | Serious | 3,750 |\n| Requirement đổi cần thiết kế lại lớn | Occasional | Serious | 3,750 |\n| Khó khăn tài chính, cắt ngân sách | Seldom | Catastrophic | 2,250 |\n\nCách tính: Likely × Catastrophic $= 75 \\times 90 = 6{,}750$; Occasional × Serious $= 50 \\times 75 = 3{,}750$.","en":"**Prioritize risks by RE** (higher RE, higher priority). Slide table:\n\n| Risk | P | L | RE |\n|---|---|---|---|\n| Cannot recruit staff with required skills | Likely | Catastrophic | **6,750** |\n| Organization restructured, different management | Likely | Serious | **5,625** |\n| Key staff ill at critical times | Occasional | Serious | 3,750 |\n| Reused components contain defects | Occasional | Serious | 3,750 |\n| Requirement changes need major rework | Occasional | Serious | 3,750 |\n| Financial problems force budget cuts | Seldom | Catastrophic | 2,250 |\n\nWorking: Likely × Catastrophic $= 75 \\times 90 = 6{,}750$; Occasional × Serious $= 50 \\times 75 = 3{,}750$."}]},{"id":"3.7","t":{"vi":"Lập kế hoạch & giám sát rủi ro","en":"Risk planning & monitoring"},"cards":[{"src":"03#42","vi":"**Risk planning:** đưa ra **chiến lược giảm nhẹ** cho từng rủi ro. Slide chỉ liệt kê tên; phần giải thích avoidance/minimization theo giáo trình Sommerville:\n- **Avoidance**: **tránh** để giảm xác suất rủi ro xảy ra.\n- **Minimization**: **giảm tác động** nếu rủi ro xảy ra.\n- **Contingency plans**: **khi rủi ro xảy ra thì làm theo** kế hoạch dự phòng.\n- **Risk transfer**: chuyển rủi ro cho bên khác.\n- **Buying information**: tìm thêm thông tin để giảm bất định.","en":"**Risk planning:** a **mitigation strategy** for each risk. The slide lists only the names; the avoidance/minimization explanations follow the Sommerville textbook:\n- **Avoidance**: reduce the probability that the risk occurs.\n- **Minimization**: reduce the impact if it occurs.\n- **Contingency plans**: **followed if the risk arises**.\n- **Risk transfer**: shift the risk to another party.\n- **Buying information**: get more information to reduce uncertainty."},{"src":"03#43","vi":"**Ví dụ chiến lược** (bảng Sommerville):\n- **Khó khăn tài chính / tái cấu trúc**: viết **briefing** cho lãnh đạo, cho thấy dự án đóng góp quan trọng vào mục tiêu kinh doanh.\n- **Khó tuyển người**: báo khách trước khả năng trễ; cân nhắc **mua component**.\n- **Nhân sự ốm**: tổ chức lại team để **công việc chồng lấn**, mọi người hiểu việc của nhau.\n- **Component lỗi**: thay bằng component **mua ngoài có độ tin cậy đã biết**.\n- **Requirement thay đổi**: lập **traceability** để đánh giá tác động; tối đa **information hiding** trong thiết kế.\n- **Database chậm**: cân nhắc mua database hiệu năng cao hơn.\n- **Ước lượng thấp thời gian**: cân nhắc mua component, dùng **program generator**.","en":"**Example strategies** (Sommerville table):\n- **Financial problems / restructuring**: brief senior management on how the project contributes to business goals.\n- **Recruitment problems**: alert the customer to possible delays; investigate **buying-in components**.\n- **Staff illness**: reorganize the team for **overlapping work** so people understand each other's jobs.\n- **Defective components**: replace with **bought-in components of known reliability**.\n- **Requirements changes**: derive **traceability** to assess impact; maximize **information hiding** in the design.\n- **Database performance**: investigate a higher-performance database.\n- **Underestimated time**: investigate buying components or a **program generator**."},{"src":"03#44-45","vi":"**Risk monitoring:** đánh giá lại từng rủi ro **thường xuyên**, vì có rủi ro giảm, có rủi ro tăng xác suất.\n- Duy trì danh sách **top-10 risks**, **review và cập nhật định kỳ**.\n- Rủi ro ưu tiên cao: thảo luận ở **họp tiến độ của ban quản lý**, **báo cáo hằng tuần**.\n- Hành động phù hợp khi vấn đề xảy ra.\n\n**Dấu hiệu cảnh báo** theo loại: Technology (phần cứng/phần mềm hỗ trợ giao trễ, nhiều lỗi kỹ thuật) · People (**tinh thần thấp**, quan hệ kém) · Organizational (tin đồn, lãnh đạo không hành động) · Requirements (**nhiều change request**, khách phàn nàn) · Estimation (**không đạt lịch**, không xử lý kịp lỗi).","en":"**Risk monitoring:** reassess each risk **regularly**; some become less, some more probable.\n- Maintain a **top-10 risks** list; **review and revise regularly**.\n- High-priority risks: discussed at **management progress meetings** and **reported weekly**.\n- Take appropriate action when problems occur.\n\n**Indicators** by type: Technology (late hardware/support software, many technology problems) · People (**poor morale**, poor relationships) · Organizational (gossip, no action by senior management) · Requirements (**many change requests**, complaints) · Estimation (**missed schedule**, defects not cleared)."},{"src":"03#45","vi":"Trong project nhóm của môn, **risk register** chính là bảng top-10 risks: mỗi dòng có rủi ro, P, L, RE, chiến lược và người phụ trách. Nên cập nhật nó trong **weekly status report**.","en":"In the course project, a **risk register** is your top-10 list: one row per risk with P, L, RE, strategy and owner. Update it in the **weekly status report**.","real":true}]}],"4":[{"id":"4.1","t":{"vi":"Requirement, stakeholder, viewpoint","en":"Requirements, stakeholders, viewpoints"},"cards":[{"src":"04#4","vi":"**Requirement** mô tả **các dịch vụ (services)** hệ thống cung cấp và **các ràng buộc (constraints)** của hệ thống. Services và constraints chủ yếu đến từ **stakeholder**.\n\nRequirement có **chức năng kép**:\n- Làm **cơ sở cho đấu thầu hoặc hợp đồng**: ở **mức cao** (high level).\n- Làm **cơ sở cho team phát triển**: ở **mức chi tiết** (detailed level).","en":"**Requirements** specify the **services** a system provides and the **constraints** on the system. Services and constraints come mainly from **stakeholders**.\n\nRequirements serve a **dual function**:\n- The basis for a **bid or a contract**: **high level**.\n- The basis for the **development team**: **detailed level**."},{"src":"04#5-6","vi":"**Stakeholder** là **bất kỳ người hoặc tổ chức nào bị hệ thống ảnh hưởng**. Gồm 4 loại: **End users**, **System owners**, **System managers**, **External stakeholders**.\n\nVí dụ stakeholder của **ATM**: khách hàng ngân hàng, đại diện ngân hàng khác, quản lý ngân hàng, nhân viên quầy, quản trị database, quản lý bảo mật, phòng marketing, kỹ sư bảo trì phần cứng/phần mềm, **cơ quan quản lý ngân hàng**.","en":"A **stakeholder** is **any person or organization who is affected by the system**. Types: **end users**, **system owners**, **system managers**, **external stakeholders**.\n\n**ATM** stakeholders: bank customers, representatives of other banks, bank managers, counter staff, database administrators, security managers, marketing department, hardware and software maintenance engineers, **banking regulators**."},{"src":"04#7","vi":"**Viewpoint** là cách **tổ chức requirement** theo **góc nhìn của các stakeholder khác nhau**. Có 3 loại (ví dụ ATM rất hay ra đề):\n\n| Viewpoint | Định nghĩa | Ví dụ ATM |\n|---|---|---|\n| **Interactor** | Người hoặc **hệ thống khác** tương tác **trực tiếp** với hệ thống | **Khách hàng** và **account database** |\n| **Indirect** | **Không tự dùng** hệ thống nhưng **ảnh hưởng tới requirement** | **Ban quản lý** và **nhân viên bảo mật** |\n| **Domain** | **Đặc điểm và ràng buộc của lĩnh vực** ảnh hưởng tới requirement | **Chuẩn giao tiếp liên ngân hàng** |\n\nBẫy: account database là một **hệ thống**, nhưng vẫn là **Interactor** vì nó tương tác trực tiếp.","en":"**Viewpoints** structure requirements by **the perspectives of different stakeholders**. Three types (the ATM example is a favourite):\n\n| Viewpoint | Definition | ATM example |\n|---|---|---|\n| **Interactor** | People or **other systems** that interact **directly** with the system | **Customers** and the **account database** |\n| **Indirect** | Stakeholders who **do not use** the system but **influence the requirements** | **Management** and **security staff** |\n| **Domain** | **Domain characteristics and constraints** that influence requirements | **Standards for inter-bank communications** |\n\nTrap: the account database is a **system**, yet it is an **Interactor** because it interacts directly."}]},{"id":"4.2","t":{"vi":"User requirement vs system requirement","en":"User vs system requirements"},"cards":[{"src":"04#9-10","vi":"| | **User requirements** | **System requirements** |\n|---|---|---|\n| Mức | **Cao** (high-level) | **Thấp, chi tiết** (low-level) |\n| Hình thức | Câu **ngôn ngữ tự nhiên** về dịch vụ và ràng buộc vận hành | **Tài liệu có cấu trúc** mô tả chi tiết chức năng, dịch vụ, ràng buộc |\n| Góc nhìn | **Người dùng** | **Kỹ thuật** (designer, implementer, tester), định nghĩa **cái cần hiện thực** |\n\n**Ví dụ:**\n- User: *As a reader, I want to find books by author name and year of publication.*\n- System: Step 1 reader nhập tên tác giả, năm xuất bản; Step 2 gửi yêu cầu tìm; Step 3 hệ thống báo đang chờ; Step 4 hệ thống liệt kê kết quả theo tên sách.\n- User: *As a registered user, I do not want my login password to be easily guessed.*\n- System: mật khẩu **ít nhất 8 ký tự**, có **ít nhất một chữ số**, và được **mã hoá khi lưu** trong database.","en":"| | **User requirements** | **System requirements** |\n|---|---|---|\n| Level | **High-level** | **Low-level, detailed** |\n| Form | **Natural language** statements of services and operational constraints | A **structured document** detailing functions, services and constraints |\n| Viewpoint | **User** | **Technical** (designer, implementer, tester); defines **what should be implemented** |\n\n**Examples:**\n- User: *As a reader, I want to find books by author name and year of publication.*\n- System: Step 1 reader provides author and year; Step 2 submits the search; Step 3 system notifies waiting; Step 4 system lists results by book title.\n- User: *As a registered user, I do not want my login password to be easily guessed.*\n- System: passwords must be **at least 8 characters**, contain **at least one number**, and be **encrypted when stored** in the database."}]},{"id":"4.3","t":{"vi":"Functional, Non-functional, Domain","en":"Functional, non-functional, domain"},"cards":[{"src":"04#12-14","vi":"**3 loại requirement:**\n- **Functional (F)**: hệ thống **phản ứng thế nào** với input, **hành xử thế nào** trong tình huống cụ thể. Tức là hệ thống **làm gì**. Có 2 mức: functional **user** requirement (mức cao) và functional **system** requirement (chi tiết).\n- **Non-functional (NF)**: **ràng buộc** lên dịch vụ/chức năng, như **thời gian**, ràng buộc về **quy trình phát triển**, **chuẩn**…\n- **Domain (D)**: đến từ **lĩnh vực ứng dụng**, phản ánh đặc điểm lĩnh vực đó.\n\nVí dụ functional (library system): *The user shall be able to search either all of the initial set of databases or select a subset from it*; *The system shall provide appropriate viewers for the user to read documents*.","en":"**Three requirement types:**\n- **Functional (F)**: how the system **reacts to inputs** and **behaves in situations**, i.e. what it **does**. Two levels: functional **user** requirements (high level) and functional **system** requirements (detailed).\n- **Non-functional (NF)**: **constraints** on services or functions, e.g. **timing**, **development process** constraints, **standards**.\n- **Domain (D)**: come from the **application domain** and reflect its characteristics.\n\nFunctional examples (library system): *The user shall be able to search either all of the initial set of databases or select a subset from it*; *The system shall provide appropriate viewers for the user to read documents*."},{"src":"04#15","vi":"**Functional requirement tốt** cần:\n- **Precision** (chính xác): requirement **mơ hồ** sẽ bị developer và user **hiểu khác nhau**.\n- **Completeness** (đầy đủ): mô tả **mọi** chức năng cần có.\n- **Consistency** (nhất quán): **không mâu thuẫn**.\n\nThực tế: **không thể** viết requirement vừa đầy đủ vừa nhất quán tuyệt đối. Bẫy: **Portability** không thuộc danh sách này.","en":"**Good functional requirements** need:\n- **Precision**: **ambiguous** requirements are **interpreted differently** by developers and users.\n- **Completeness**: descriptions of **all** required facilities.\n- **Consistency**: **no conflicts or contradictions**.\n\nIn practice it is **impossible** to produce complete and consistent requirements. Trap: **Portability** is not on this list."},{"src":"04#16-18","vi":"**3 nhóm Non-functional requirement:**\n\n| Nhóm | Ví dụ |\n|---|---|\n| **Product** | **Performance** (tốc độ, khả năng mở rộng, phản hồi), **Security**, **Usability**, **Reliability**, **Maintainability**, **Portability**, **Compliance** |\n| **Organizational** | **Delivery**, **implementation**, **standards** |\n| **External** | **Ethical**, **privacy**, **safety** |\n\nNFR có thể **quan trọng hơn** functional requirement.","en":"**Three groups of non-functional requirements:**\n\n| Group | Examples |\n|---|---|\n| **Product** | **Performance** (speed, scalability, responsiveness), **Security**, **Usability**, **Reliability**, **Maintainability**, **Portability**, **Compliance** |\n| **Organizational** | **Delivery**, **implementation**, **standards** |\n| **External** | **Ethical**, **privacy**, **safety** |\n\nNFRs may be **more critical** than functional requirements."},{"src":"04#19","vi":"NFR thường được viết dưới dạng **mục tiêu** (goal), khó kiểm tra. **NFR kiểm chứng được (verifiable)** phải dùng **thước đo kiểm tra khách quan**.\n\n- **Goal** (chưa đạt): *The system should be easy to use by experienced controllers… so that user errors are minimized.*\n- **Verifiable** (đạt): *Experienced controllers shall be able to use all the system functions after a total of **two hours training**. After this training, the average number of errors… shall **not exceed two per day**.*","en":"NFRs are often stated as **goals**, which are hard to check. A **verifiable** NFR uses **some measure that can be objectively tested**.\n\n- **Goal** (not enough): *The system should be easy to use by experienced controllers… so that user errors are minimized.*\n- **Verifiable**: *Experienced controllers shall be able to use all the system functions after a total of **two hours training**. After this training, the average number of errors… shall **not exceed two per day**.*"},{"src":"04#20","vi":"**Thước đo cho NFR:**\n\n| Thuộc tính | Thước đo |\n|---|---|\n| **Speed** | Giao dịch/giây; thời gian phản hồi; thời gian làm mới màn hình |\n| **Size** | MB; số chip ROM |\n| **Ease of use** | **Thời gian đào tạo**; số khung help |\n| **Reliability** | **Mean time to failure** (MTTF); xác suất không sẵn sàng; tần suất lỗi; **availability** |\n| **Robustness** | Thời gian khởi động lại sau lỗi; % sự kiện gây lỗi; xác suất hỏng dữ liệu |\n| **Portability** | % câu lệnh phụ thuộc nền tảng; số hệ thống đích |","en":"**Measures for NFRs:**\n\n| Property | Measure |\n|---|---|\n| **Speed** | Transactions/second; response time; screen refresh time |\n| **Size** | MB; number of ROM chips |\n| **Ease of use** | **Training time**; number of help frames |\n| **Reliability** | **Mean time to failure** (MTTF); probability of unavailability; rate of failure; **availability** |\n| **Robustness** | Time to restart after failure; % of events causing failure; probability of data corruption |\n| **Portability** | % of target-dependent statements; number of target systems |"},{"src":"04#22-24","vi":"**Domain requirement** đến từ lĩnh vực ứng dụng: có thể tạo **functional requirement mới**, **ràng buộc** lên requirement có sẵn, hoặc định nghĩa **phép tính đặc thù**.\n\nVí dụ (library):\n- Giao diện chuẩn cho mọi database **theo chuẩn Z39.50**.\n- Vì **bản quyền**, một số tài liệu phải **bị xoá ngay khi tới**.\n\n**2 vấn đề của domain requirement:**\n- **Understandability**: viết bằng **ngôn ngữ của lĩnh vực**, kỹ sư phần mềm khó hiểu.\n- **Implicitness**: chuyên gia lĩnh vực hiểu quá rõ nên **không nghĩ tới việc viết ra** thành lời.","en":"**Domain requirements** come from the application domain: they may add **new functional requirements**, **constrain** existing ones or define **specific computations**.\n\nExamples (library):\n- A standard user interface to all databases **based on the Z39.50 standard**.\n- Because of **copyright**, some documents must be **deleted immediately on arrival**.\n\n**Two problems:**\n- **Understandability**: expressed in **the language of the application domain**, hard for software engineers.\n- **Implicitness**: domain specialists know the area so well they **do not think of making it explicit**."},{"src":"04#27-28","vi":"**Lưu ý về bài tập phân loại F / NF / D** ở slide 27–28 (ví dụ \"đăng nhập qua SSO\", \"sẵn sàng 99.9%\", \"tối đa 20 tín chỉ\"): một số câu có thể xếp **nhiều cách** tuỳ cách hiểu. Theo quy định của bản ôn, các câu này **không dùng để chấm điểm**. Hãy thảo luận với nhóm hoặc hỏi thầy để chốt.","en":"**About the F / NF / D classification exercise** on slides 27–28 (e.g. \"authenticate with SSO\", \"99.9% availability\", \"up to 20 credits\"): some items can be classified **in more than one way**. These are **not used for scoring** here; discuss them with your team or ask the lecturer."}]},{"id":"4.4","t":{"vi":"Quy trình RE & thu thập requirement","en":"RE process & requirements gathering"},"cards":[{"src":"04#25-26","vi":"**Requirements engineering process** là tập hoạt động để **tạo ra requirement** của phần mềm, **thay đổi nhiều** tuỳ tổ chức, lĩnh vực và phương pháp.\n\nTheo hình slide: **Feasibility study → Requirements gathering → Requirements specification → Requirements validation**, còn **Requirements management** diễn ra **xuyên suốt dự án** (04#57), không phải một bước trong chuỗi.","en":"The **requirements engineering process** is the set of activities that **create the software requirements**; it **varies widely** by organization, domain and methodology.\n\nIn the slide: **Feasibility study → Requirements gathering → Requirements specification → Requirements validation**, while **requirements management** runs **throughout the project** (04#57) rather than being one step in the chain.","fig":"re-process"},{"src":"04#32-33","vi":"**Requirements gathering** còn gọi là **requirements elicitation** hay **requirements discovery**. Kỹ sư làm việc với khách để tìm hiểu **lĩnh vực ứng dụng**, **dịch vụ** hệ thống cần có, và **ràng buộc vận hành**. Người tham gia: end-user, khách hàng, manager, kỹ sư, chuyên gia lĩnh vực…, tức các **stakeholder**.\n\n**Khó khăn:**\n- Stakeholder **không biết mình thật sự muốn gì**.\n- Họ diễn đạt bằng **ngôn ngữ riêng** của họ.\n- Các stakeholder có thể **mâu thuẫn** nhau.\n- Yếu tố **tổ chức và chính trị** chi phối.\n- Requirement **thay đổi** trong quá trình, có stakeholder mới, môi trường kinh doanh thay đổi.","en":"**Requirements gathering** is also called **requirements elicitation** or **requirements discovery**. Engineers work with customers to find out the **application domain**, the **services** the system should provide and its **operational constraints**. Participants are end-users, customers, managers, engineers, domain experts… the **stakeholders**.\n\n**Problems:**\n- Stakeholders **don't know what they really want**.\n- They express requirements **in their own terms**.\n- Different stakeholders may have **conflicting** requirements.\n- **Organizational and political** factors influence requirements.\n- Requirements **change** during the process: new stakeholders, changing business environment."},{"src":"04#34","vi":"**4 hoạt động của gathering:**\n1. **Requirements discovery**: tương tác với stakeholder để **khám phá** requirement.\n2. **Classification and organization**: **nhóm** requirement liên quan thành cụm.\n3. **Prioritization and negotiation**: **ưu tiên** và **giải quyết xung đột**.\n4. **Requirements documentation**: **ghi lại** thành tài liệu.","en":"**Four gathering activities:**\n1. **Requirements discovery**: interact with stakeholders to **discover** requirements.\n2. **Classification and organization**: **group** related requirements into clusters.\n3. **Prioritization and negotiation**: **prioritize** and **resolve conflicts**.\n4. **Requirements documentation**: **document** them."},{"src":"04#35","vi":"**MoSCoW** để ưu tiên requirement (ví dụ đăng ký học phần):\n\n| Mức | Ý nghĩa | Ví dụ |\n|---|---|---|\n| **Must have** | **Thiếu thì release thất bại** | Đăng ký học phần; chặn trùng lịch |\n| **Should have** | **Quan trọng nhưng không sống còn; có cách làm tạm** (workaround) | Danh sách chờ khi lớp đầy |\n| **Could have** | **Có thì tốt** nếu còn thời gian | Gợi ý môn theo kế hoạch học |\n| **Won't have (this time)** | **Thống nhất để lại, không làm ở bản release này** | Mobile app |\n\nKỹ thuật khác: ma trận value vs effort, **Kano model**, **\\$100 test**. Ưu tiên **cùng stakeholder** và **ghi lại lý do**.","en":"**MoSCoW** prioritization (course registration example):\n\n| Category | Meaning | Example |\n|---|---|---|\n| **Must have** | **Release fails without it** | Register for a course; prevent timetable conflicts |\n| **Should have** | **Important but not vital; a workaround exists** | Waiting list when a course is full |\n| **Could have** | **Nice to have** if time allows | Suggest courses from the study plan |\n| **Won't have (this time)** | **Agreed to leave out of this release** | Mobile app |\n\nOther techniques: value vs effort matrix, **Kano model**, **\\$100 test**. Prioritize **with stakeholders** and **record why**."},{"src":"04#36-37","vi":"**2 phương pháp chính:**\n\n| | **Interviewing** | **Observing** |\n|---|---|---|\n| Mục tiêu | Khám phá requirement **trực tiếp** | Khám phá **gián tiếp**; hiểu **quy trình nghiệp vụ** và vấn đề |\n| Hình thức | **Direct** (gặp mặt, điện thoại, hội nghị) / **Indirect** (phiếu hỏi, email). Câu hỏi **closed** (đáp án giới hạn) / **open** (không giới hạn) | Đến nơi làm việc, tham gia quy trình, thực tập |\n| Hạn chế | Tốn **thời gian của khách**; khó kiểm soát; khó lấy chi tiết | Tốn **thời gian của team phát triển**; có thể **làm phiền công việc của khách** |","en":"**Two main methods:**\n\n| | **Interviewing** | **Observing** |\n|---|---|---|\n| Goal | Discover requirements **directly** | Discover **indirectly**; learn the **business process** and problems |\n| Forms | **Direct** (in person, phone, conference) / **indirect** (question form, email). **Closed** (limited answers) / **open** (unlimited) questions | Visit business places, join a process, internship |\n| Limitations | Costs **the client's time**; hard to control; hard to get details | Costs **the development team's time**; may **interfere with the client's business** |"},{"src":"04#38","vi":"**Kỹ thuật khác:**\n- **Workshops (JAD)**: stakeholder và developer **làm việc chung** trong buổi có người điều phối.\n- **Questionnaires and surveys**: **tiếp cận nhiều người nhanh**, hợp với **dữ liệu định lượng**.\n- **Prototyping**: cho xem **mock-up sớm** để lấy phản hồi cụ thể.\n- **Document and system analysis**: nghiên cứu form, báo cáo, quy định, **hệ thống hiện có**.\n- **Scenarios and use cases**: đi qua ví dụ sử dụng cụ thể.\n\n**Kết hợp nhiều kỹ thuật**, không kỹ thuật nào đủ một mình.","en":"**Other techniques:**\n- **Workshops (JAD)**: stakeholders and developers **work together** in facilitated sessions.\n- **Questionnaires and surveys**: **reach many users quickly**; good for **quantitative data**.\n- **Prototyping**: show **mock-ups early** for concrete feedback.\n- **Document and system analysis**: study forms, reports, regulations, **the existing system**.\n- **Scenarios and use cases**: walk through concrete examples of use.\n\n**Combine several techniques**; no single one is enough."}]},{"id":"4.5","t":{"vi":"Đặc tả: SRS & user story","en":"Specification: SRS & user stories"},"cards":[{"src":"04#40-41","vi":"**Requirements specification**: viết user và system requirement vào **requirements document**. User requirement phải **dễ hiểu với người không có nền kỹ thuật**; system requirement chi tiết và kỹ thuật hơn.\n\n**4 cách đặc tả:**\n- **Natural language**: dễ viết nhưng **dài dòng và mơ hồ**.\n- **Structured natural language**: theo **một mẫu (form)**.\n- **Formal specification**: **phương trình toán, ngôn ngữ lập trình**.\n- **Modeling language**: **sơ đồ + form**.","en":"**Requirements specification**: writing user and system requirements into a **requirements document**. User requirements must be **understandable by non-technical** readers; system requirements are more detailed and technical.\n\n**Four methods:**\n- **Natural language**: easy to write but **wordy and ambiguous**.\n- **Structured natural language**: follows **a form**.\n- **Formal specification**: **mathematical equations and programming languages**.\n- **Modeling language**: **diagram + form**."},{"src":"04#42-44","vi":"**SRS (Software Requirements Specification)** là **tuyên bố chính thức** về những gì developer phải làm. Gồm cả user requirement và system requirement. SRS nói hệ thống **làm GÌ (WHAT)**, **không** nói **làm THẾ NÀO (HOW)**.\n\n**Chuẩn IEEE 830 (1998)**, nay **được thay bằng ISO/IEC/IEEE 29148:2018**. Cấu trúc chung: Introduction · General description · Specific requirements · Appendices · Index.\n\n**Cấu trúc tài liệu requirement** (Sommerville): Preface · Introduction · **Glossary** · User requirements definition · System architecture · System requirements specification · System models · System evolution · Appendices · Index.","en":"The **SRS (Software Requirements Specification)** is the **official statement** of what developers must build, covering user and system requirements. It states **WHAT** the system should do, **not HOW**.\n\n**IEEE 830 (1998)** is **now replaced by ISO/IEC/IEEE 29148:2018**. Generic structure: Introduction · General description · Specific requirements · Appendices · Index.\n\n**Requirements document structure** (Sommerville): Preface · Introduction · **Glossary** · User requirements definition · System architecture · System requirements specification · System models · System evolution · Appendices · Index."},{"src":"04#45-46","vi":"**Tài liệu requirement trong thực tế:**\n- **RUP**: **Vision document** + **Use-case specifications**.\n- **Agile (Scrum, XP)**: Vision/objectives document + **User stories**.\n\n**INVEST**, tiêu chí user story tốt: **I**ndependent · **N**egotiable · **V**aluable · **E**stimable · **S**mall · **T**estable.\n\n**Acceptance criteria** viết dạng **Given / When / Then**:\n- Story: *As a student, I want to register for a course, so that I can plan my semester.*\n- **Given** lớp còn chỗ và không trùng lịch, **When** tôi bấm \"Register\", **Then** tôi được ghi danh và số chỗ giảm 1.\n- **Given** lớp đã đầy, **When** bấm \"Register\", **Then** thấy \"Course is full\" và có thể vào danh sách chờ.\n\nAcceptance criteria **trở thành acceptance test case**.","en":"**Requirements documents in practice:**\n- **RUP**: **Vision document** + **use-case specifications**.\n- **Agile (Scrum, XP)**: vision/objectives document + **user stories**.\n\n**INVEST** criteria for good stories: **I**ndependent · **N**egotiable · **V**aluable · **E**stimable · **S**mall · **T**estable.\n\n**Acceptance criteria** in **Given / When / Then**:\n- Story: *As a student, I want to register for a course, so that I can plan my semester.*\n- **Given** the course has free seats and no conflict, **When** I click \"Register\", **Then** I am enrolled and the seat count drops by one.\n- **Given** the course is full, **When** I click \"Register\", **Then** I see \"Course is full\" and can join the waiting list.\n\nAcceptance criteria **become acceptance test cases**."},{"src":"04#47","vi":"**Requirements engineering có AI hỗ trợ:**\n- Hữu ích: soạn **câu hỏi phỏng vấn**, checklist; nháp **user story** và acceptance criteria từ biên bản họp; phát hiện requirement **mơ hồ, thiếu, mâu thuẫn**; tóm tắt tài liệu dài.\n- Cẩn thận: **AI không biết stakeholder của bạn**, nó có thể **bịa ra requirement nghe rất hợp lý**. Luôn **xác nhận với người dùng thật**, **con người quyết định ưu tiên**; **không dán dữ liệu mật hoặc cá nhân** vào AI công cộng.","en":"**AI-assisted requirements engineering:**\n- Useful for: **interview questions** and checklists; drafting **user stories** and acceptance criteria from notes; detecting **ambiguous, missing or conflicting** requirements; summarizing large documents.\n- Be careful: **AI does not know your stakeholders** and **can invent plausible requirements**. Always **validate with real users**, keep **humans deciding priorities**, and **never paste confidential or personal data** into public AI tools."}]},{"id":"4.6","t":{"vi":"Kiểm định requirement","en":"Requirements validation"},"cards":[{"src":"04#50","vi":"**Requirements validation**: xác nhận requirement **phản ánh đúng điều khách muốn**. Lỗi requirement gây lỗi ở design, code, test. **Sửa lỗi requirement sau khi bàn giao tốn hơn rất nhiều** so với sửa ở giai đoạn đầu.","en":"**Requirements validation** confirms requirements **reflect what the customer wants**. Requirement errors cause problems in design, code and test, and **fixing them after delivery costs much more** than early on."},{"src":"04#51","vi":"**5 tiêu chí kiểm tra requirement** (hay hỏi dạng \"câu hỏi này là tiêu chí nào\"):\n\n| Tiêu chí | Câu hỏi kiểm tra |\n|---|---|\n| **Validity** | Hệ thống có cung cấp chức năng **hỗ trợ tốt nhất nhu cầu khách** không? |\n| **Verifiability** | Requirement có **kiểm tra được** không? |\n| **Consistency** | Có requirement nào **mâu thuẫn** nhau không? |\n| **Completeness** | Đã có **đủ mọi chức năng** khách cần chưa? |\n| **Realism** | Có **hiện thực được** với **ngân sách và công nghệ** hiện có không? |\n\nMẹo nhớ: **V V C C R**.","en":"**Five requirements checks** (\"which check is this question\"):\n\n| Check | Question |\n|---|---|\n| **Validity** | Does the system provide the functions that **best support the customer's needs**? |\n| **Verifiability** | Can the requirements **be checked**? |\n| **Consistency** | Are there any requirements **conflicts**? |\n| **Completeness** | Are **all functions** required by the customer included? |\n| **Realism** | Can they be implemented with the **available budget and technology**? |\n\nMemory aid: **V V C C R**."},{"src":"04#52-53","vi":"**3 kỹ thuật validation:**\n- **Requirements reviews**: phân tích **thủ công có hệ thống**, là cách **phổ biến nhất**.\n- **Prototyping**: dùng **mô hình chạy được** để kiểm tra requirement.\n- **Test-case generation**: **viết test** cho requirement để kiểm tra **tính test được**.\n\n**Review**: tổ chức **thường xuyên** trong lúc định nghĩa requirement, có analyst, designer, developer, tester tham gia; có thể **formal hoặc informal**. Giao tiếp tốt giúp giải quyết vấn đề **sớm**.","en":"**Three validation techniques:**\n- **Requirements reviews**: **systematic manual analysis**, the **most common** approach.\n- **Prototyping**: an **executable model** to check requirements.\n- **Test-case generation**: **developing tests** for requirements to check **testability**.\n\n**Reviews** are held **regularly** while requirements are defined, with analysts, designers, developers and testers; they may be **formal or informal**. Good communication resolves problems **early**."}]},{"id":"4.7","t":{"vi":"Quản lý thay đổi & traceability","en":"Change management & traceability"},"cards":[{"src":"04#55-56","vi":"**Requirements management**: quá trình **quản lý requirement thay đổi** trong suốt dự án. Requirement **chắc chắn sẽ chưa đầy đủ và chưa nhất quán**, vì có requirement mới, nhu cầu kinh doanh đổi, hiểu hệ thống tốt hơn.\n\n**Vì sao requirement thay đổi:**\n- Nhu cầu kinh doanh **mới hoặc thay đổi**.\n- **Hiểu hệ thống rõ hơn**.\n- **Ưu tiên** từ các viewpoint khác nhau thay đổi.\n- **Môi trường kinh doanh và kỹ thuật** thay đổi trong dự án.","en":"**Requirements management** is managing **changing requirements** during the project. Requirements are **inevitably incomplete and inconsistent**: new requirements emerge, business needs change, understanding improves.\n\n**Why requirements change:**\n- **New and changed** business needs.\n- **Better understanding** of the system.\n- **Priorities** from different viewpoints change.\n- **Business and technical environments** change during the project."},{"src":"04#57","vi":"**Quản lý thay đổi requirement** diễn ra **xuyên suốt dự án**, gồm 3 bước:\n1. **Change request**: khách, người dùng, team đề xuất thay đổi.\n2. **Change analysis and costing**: đánh giá **ảnh hưởng** lên các requirement khác và **chi phí**.\n3. **Change implementation**: sửa requirement và tài liệu liên quan; sửa **design, code, test**.","en":"**Requirements change management** runs **throughout the project**, in three steps:\n1. **Change request**: from customers, users or the team.\n2. **Change analysis and costing**: assess **effects** on other requirements and the **cost**.\n3. **Change implementation**: modify requirements and affected docs; change **design, code and test**."},{"src":"04#58","vi":"**Traceability matrix**: liên kết mỗi requirement với **nguồn, design và test** của nó.\n\n| Req | Requirement | Use case | Design | Test |\n|---|---|---|---|---|\n| FR-01 | Sinh viên đăng ký học phần | UC-03 Register | RegistrationService | TC-11, TC-12 |\n| FR-02 | Chặn trùng lịch | UC-03 Register | ScheduleChecker | TC-13 |\n| NFR-01 | Tìm kiếm ≤ 1 s ở P95 | UC-02 Search | Course index | PT-01 |\n\nDùng cho **impact analysis** khi requirement đổi và để kiểm tra **test coverage**.","en":"A **traceability matrix** links each requirement to its **sources, design and tests**.\n\n| Req | Requirement | Use case | Design | Test |\n|---|---|---|---|---|\n| FR-01 | Student registers for a course | UC-03 Register | RegistrationService | TC-11, TC-12 |\n| FR-02 | Prevent timetable conflicts | UC-03 Register | ScheduleChecker | TC-13 |\n| NFR-01 | Search returns in ≤ 1 s at P95 | UC-02 Search | Course index | PT-01 |\n\nUsed for **impact analysis** when requirements change and for checking **test coverage**."},{"src":"04#35","vi":"Áp dụng cho project nhóm (ví dụ app đặt sân cầu lông): **Must** = đặt sân, chặn đặt trùng giờ; **Should** = danh sách chờ khi kín sân; **Could** = gợi ý giờ trống; **Won't (this time)** = thanh toán ví điện tử. Ghi lại **lý do** của từng mức để khi review SRS cả nhóm thống nhất.","en":"Applied to a team project (e.g. a badminton court booking app): **Must** = book a court, prevent double booking; **Should** = waiting list when full; **Could** = suggest free slots; **Won't (this time)** = e-wallet payment. Record **why** for each level so the team agrees during SRS review.","real":true}]}],"5":[{"id":"5.1","t":{"vi":"Mô hình hoá & UML","en":"Modeling & UML"},"cards":[{"src":"05#3-5","vi":"**Model** là **biểu diễn đơn giản hoá** của một thứ **từ một góc nhìn cụ thể**: giữ khía cạnh quan trọng, bỏ qua phần còn lại. Có nhiều loại: process model, use-case model, class model, object model… và nhiều dạng: **text, diagram, picture**.\n\n**System modeling**: xây các **mô hình trừu tượng** của hệ thống, mỗi mô hình là **một góc nhìn**, thường dùng ký hiệu **UML**. Mô hình giúp analyst hiểu chức năng và **giao tiếp với khách hàng**.\n\n**Vì sao cần mô hình:** giúp mọi thứ **chính xác, đơn giản, dễ hiểu, đầy đủ** hơn. Cụ thể là nắm requirement và tri thức lĩnh vực, **nối requirement với design**, ghi lại quyết định thiết kế, tổ chức hệ thống lớn, thử nhiều giải pháp.","en":"A **model** is a **simplified representation** of a thing **from a specific perspective**, capturing important aspects and ignoring others. Kinds: process, use-case, class, object models…; forms: **text, diagrams, pictures**.\n\n**System modeling** builds **abstract models** of a system, each giving **one view**, usually in **UML** notation. Models help analysts understand functionality and **communicate with customers**.\n\n**Why model:** it makes things **more precise, simpler, easier to understand, more complete**: capture requirements and domain knowledge, **link requirements and design**, capture design decisions, organize large systems, explore multiple solutions."},{"src":"05#6-7","vi":"**Modeling language** là ngôn ngữ hình thức để tạo mô hình. Ví dụ: **UML**, **C4 Model**, **BPMN** (Business Process Model and Notation), **SysML**.\n\n**UML (Unified Modeling Language)**: ngôn ngữ mô hình hoá **đa mục đích** cho phân tích và thiết kế phần mềm.\n- Hợp nhất công trình về phương pháp hướng đối tượng của **Grady Booch, James Rumbaugh, Ivar Jacobson** (Rational Software, nay thuộc IBM).\n- Được **OMG** (Object Management Group) **chuẩn hoá năm 1997**. OMG hiện phụ trách phát triển UML.","en":"A **modeling language** is a formal language for creating models: **UML**, **C4 Model**, **BPMN** (Business Process Model and Notation), **SysML**.\n\n**UML (Unified Modeling Language)** is a **general-purpose** modeling language for analysis and design.\n- It unified the OO methods of **Grady Booch, James Rumbaugh and Ivar Jacobson** (Rational Software, now IBM).\n- **Adopted by OMG** (Object Management Group) **as a standard in 1997**; OMG now develops UML."},{"src":"05#8","vi":"**2 nhóm sơ đồ UML:**\n\n| **Structural** (tĩnh, static) | **Behavioral** (động, dynamic) |\n|---|---|\n| Class diagram | **Use case diagram** |\n| Package diagram | Sequence diagram |\n| Object diagram | Communication diagram |\n| **Component** diagram | State machine diagram |\n| **Deployment** diagram | Activity diagram |\n\nBẫy: **use case diagram** là **behavioral**, không phải structural.","en":"**Two groups of UML diagrams:**\n\n| **Structural** (static) | **Behavioral** (dynamic) |\n|---|---|\n| Class diagram | **Use case diagram** |\n| Package diagram | Sequence diagram |\n| Object diagram | Communication diagram |\n| **Component** diagram | State machine diagram |\n| **Deployment** diagram | Activity diagram |\n\nTrap: the **use case diagram** is **behavioral**, not structural."}]},{"id":"5.2","t":{"vi":"Actor & use case","en":"Actors & use cases"},"cards":[{"src":"05#12-13","vi":"**Use case diagram** mô hình hoá **góc nhìn use case** của hệ thống, như end user, analyst, tester nhìn thấy. Thường là một phần của **requirement specification**, đi kèm **use case specification**.\n\n**3 thành phần chính:** **Actors · Use cases · Relationships**.\n\n**Lợi ích:** nắm và trực quan hoá chính xác **functional requirement**; nối requirement với design, implementation, testing; giúp giao tiếp giữa user và analyst, designer, tester; hỗ trợ validation/testing. Vì vậy được **dùng rộng rãi để truyền đạt functional requirement**.","en":"A **use case diagram** models the **use case view** of a system as seen by end users, analysts and testers. It is usually part of the **requirements specification**, accompanied by **use case specifications**.\n\n**Main elements:** **Actors · Use cases · Relationships**.\n\n**Benefits:** capture and visualize **functional requirements** precisely; connect requirements, design, implementation and testing; ease communication between users and analysts, designers, testers; support validation/testing. Hence **widely used to communicate functional requirements**."},{"src":"05#14","vi":"**Actor** đại diện cho **người, process hoặc bất cứ thứ gì bên ngoài** tương tác với hệ thống. Actor là **một vai trò (role)**, không phải một con người cụ thể:\n- **Một người dùng thật có thể đóng nhiều vai** → nhiều actor gắn với một người.\n- **Nhiều người cùng vai** → biểu diễn bằng **một actor**.\n- Giữa các actor có thể có **generalization**, ví dụ Doctor là một loại Employee (mũi tên từ Doctor tới Employee).","en":"An **actor** represents an **external person, process or thing** that interacts with the system. An actor is **a role**, not a specific person:\n- **One physical user can play multiple roles** → several actors bound to one user.\n- **Many users with the same role** → **one actor**.\n- Actors may have a **generalization**, e.g. Doctor is a kind of Employee (arrow from Doctor to Employee).","fig":"actors"},{"src":"05#15-16","vi":"**Use case** mô tả **một tập chuỗi hành động** do actor thực hiện để tạo ra **kết quả quan sát được, có giá trị với actor**.\n- Ở mức hệ thống, use case là **hành vi bên ngoài** mà người dùng nhìn thấy.\n- Use case nói hệ thống **làm GÌ (WHAT)**, **không** nói **làm THẾ NÀO (HOW)**.\n- Use case **che giấu cấu trúc bên trong**, thường là chức năng mức hệ thống.","en":"A **use case** describes **a set of sequences of actions** performed by an actor to produce an **observable result of value to the actor**.\n- At system level, use cases are **external behavior** visible to users.\n- A use case specifies **WHAT** the system does, **not HOW**.\n- It **hides internal structure** and usually represents system-level functions."}]},{"id":"5.3","t":{"vi":"Đặc tả use case & scenario","en":"Use case specification & scenarios"},"cards":[{"src":"05#17","vi":"Hành vi của use case được mô tả bằng **luồng sự kiện** (flow of events). Mỗi use case có **một luồng chính (basic flow)** và các **luồng thay thế**:\n- **Basic path**\n- **Alternative paths**\n- **Exceptional paths**","en":"A use case's behavior is described by a **flow of events**: **one main (basic) flow** plus **alternative flows**:\n- **Basic path**\n- **Alternative paths**\n- **Exceptional paths**"},{"src":"05#18","vi":"**Mẫu use case specification** (ví dụ PayVAT):\n- **Use case name** và **ID** (UC1)\n- **Actors** tham gia (Time, Government)\n- **Preconditions**: trạng thái hệ thống **trước khi** use case bắt đầu (cuối quý kinh doanh)\n- **Flow of events**: các bước thực tế\n- **Postconditions**: trạng thái **khi use case kết thúc** (Government nhận đúng số VAT)","en":"**Use case specification template** (PayVAT example):\n- **Use case name** and **ID** (UC1)\n- **Actors** involved (Time, Government)\n- **Preconditions**: system state **before** the use case can begin (end of a business quarter)\n- **Flow of events**: the actual steps\n- **Postconditions**: system state **when the use case is over** (Government receives the correct VAT)","fig":"uc-payvat"},{"src":"05#19","vi":"Ví dụ **DisplayBasket** (UC11) có luồng rẽ nhánh: nếu giỏ hàng trống thì hệ thống báo và use case kết thúc (bước 2.1–2.2). **Alternative flow 1, 2**: khách có thể rời màn hình giỏ hàng hoặc rời hệ thống bất cứ lúc nào.","en":"**DisplayBasket** (UC11) branches: if the basket is empty the system says so and the use case ends (steps 2.1–2.2). **Alternative flows 1 and 2**: the customer may leave the basket screen or the system at any time.","fig":"uc-basket"},{"src":"05#20","vi":"**Scenario** là **một chuỗi sự kiện cụ thể** xảy ra, tức **một instance của use case**. Use case mô tả **tập hợp** các luồng có thể; mỗi scenario là **một** luồng thật. Giống quan hệ **class và object**: use case như class, scenario như object.","en":"A **scenario** is **a specific sequence of events**, i.e. **an instance of a use case**. A use case describes a **set** of possible flows; each scenario is **one** concrete flow, like **class vs object**."}]},{"id":"5.4","t":{"vi":"Include vs Extend","en":"Include vs Extend"},"cards":[{"src":"05#21","vi":"**4 quan hệ trong use case diagram:**\n- **Association**: giữa **actor và use case**.\n- **Generalization**: giữa use case **tổng quát** và use case **cụ thể hơn**.\n- **Include**: giữa **các use case**.\n- **Extend**: giữa **các use case**.","en":"**Four use case relationships:**\n- **Association**: between **actors and use cases**.\n- **Generalization**: between **general** and **more specific** use cases.\n- **Include**: between **use cases**.\n- **Extend**: between **use cases**."},{"src":"05#22","vi":"| | **«include»** | **«extend»** |\n|---|---|---|\n| Base use case | **Biết** use case được include, gọi nó **tường minh** | **Không biết** use case extending |\n| Use case kia | **Không đứng một mình** được | **Có thể đứng một mình** |\n| Chiều mũi tên | Từ **base → included** | Từ **extending → base** |\n| Dùng khi | Hành vi **chung**, luôn xảy ra | Hành vi **biến thể**, tuỳ điều kiện |\n\nExtend: base \"ngầm\" nhận hành vi của extending use case tại **vị trí do extending use case chỉ định**.","en":"| | **«include»** | **«extend»** |\n|---|---|---|\n| Base use case | **Is aware** of the included use case and calls it **explicitly** | **Is not aware** of the extending use case |\n| The other use case | **Does not stand alone** | **May stand alone** |\n| Arrow | From **base → included** | From **extending → base** |\n| Use for | **Common** behavior that always happens | **Variations** that happen conditionally |\n\nExtend: the base implicitly incorporates the extending behavior **at a location specified by the extending use case**.","svg":"incext"},{"src":"05#23","vi":"**Ví dụ trên slide:**\n- **Online shopping**: **Checkout order** «include» **Payment** (thanh toán luôn xảy ra khi checkout). **Verify shipping address** «extend» **Checkout order**, mũi tên **từ Verify shipping address tới Checkout order**.\n- **Firefox**: **Load and Display web page** «include» **Show images**; **Read web page loud** «extend» **Load and Display web page**.","en":"**Slide examples:**\n- **Online shopping**: **Checkout order** «include» **Payment** (payment always happens on checkout). **Verify shipping address** «extend» **Checkout order**; the arrow goes **from Verify shipping address to Checkout order**.\n- **Firefox**: **Load and Display web page** «include» **Show images**; **Read web page loud** «extend» **Load and Display web page**.","fig":"uc-examples"},{"src":"05#24","vi":"**Ghi chú khi vẽ use case diagram:**\n- Use case tốt nên là hành vi **xác định được và tương đối nguyên tử**, đưa **hành vi chung vào use case được include**, và **tách biến thể ra use case extending**.\n- Chỉ đưa vào actor và use case **cần thiết** để hiểu một khía cạnh.\n- Bố cục quan trọng: **giảm đường cắt nhau**, **nhóm phần liên quan** lại gần.","en":"**Notes on use case diagrams:**\n- A well-defined use case is **identifiable and reasonably atomic**, **includes common behavior** from included use cases and **distributes variations into extending use cases**.\n- Only include actors and use cases **essential** to understanding an aspect.\n- Layout matters: **minimize line crossings**, **group related elements**."}]},{"id":"5.5","t":{"vi":"UI, UX & yếu tố con người","en":"UI, UX & human factors"},"cards":[{"src":"05#26-28","vi":"Phần mềm tương tác với **người dùng** và **hệ thống liên quan** qua **interface**. Có 2 loại: **User interface (UI)** cho con người và **Programming interface (API)** cho hệ thống.\n\n**UI** là **điểm người dùng tương tác** với ứng dụng.\n- UI phải hợp với **kỹ năng, kinh nghiệm và kỳ vọng** của người dùng.\n- Người dùng thường **đánh giá hệ thống qua giao diện** hơn là qua chức năng.\n- UI tệ có thể khiến người dùng mắc **lỗi nghiêm trọng**, và là lý do nhiều phần mềm **không bao giờ được dùng**.","en":"Software interacts with **users** and **related systems** through **interfaces**: the **user interface (UI)** for people and the **programming interface (API)** for systems.\n\nThe **UI** is the **point where users interact** with an application.\n- It should match users' **skills, experience and expectations**.\n- Users often **judge a system by its interface** rather than its functionality.\n- A poor UI can cause **catastrophic errors** and is why many systems are **never used**.","fig":"layers"},{"src":"05#29-30","vi":"| **UI** | **UX** |\n|---|---|\n| **Tính tương tác, vẻ ngoài và cảm giác** (look and feel) của **một màn hình** hay trang web | **Toàn bộ trải nghiệm** của người dùng với **sản phẩm** |\n\n**Yếu tố con người khi thiết kế:**\n- **Trí nhớ ngắn hạn có hạn**: giữ được khoảng **4 ± 1** chunk (ước lượng kinh điển của **Miller là 7 ± 2**).\n- **Con người mắc lỗi**: cảnh báo và thông báo không phù hợp làm **tăng căng thẳng**.\n- **Khả năng thể chất khác nhau**.\n- **Sở thích tương tác khác nhau**: người thích hình, người thích chữ.","en":"| **UI** | **UX** |\n|---|---|\n| The **interactivity, look and feel** of **a screen** or web page | The user's **overall experience** with **the product** |\n\n**Human factors:**\n- **Limited short-term memory**: about **4 ± 1** chunks (**Miller's** classic estimate: **7 ± 2**).\n- **People make mistakes**: inappropriate alarms and messages **increase stress**.\n- **Different physical capabilities**.\n- **Different interaction preferences**: some like pictures, some like text."}]},{"id":"5.6","t":{"vi":"Nguyên tắc UI & accessibility","en":"UI principles & accessibility"},"cards":[{"src":"05#31-33","vi":"**6 nguyên tắc thiết kế UI** (hay ra đề dạng \"câu mô tả này là nguyên tắc nào\"):\n\n| Nguyên tắc | Ý nghĩa |\n|---|---|\n| **User familiarity** | Dùng **thuật ngữ, khái niệm quen thuộc** với người dùng chính |\n| **Consistency** | **Thao tác giống nhau thì kích hoạt giống nhau** |\n| **Minimal surprise** | Người dùng **không bao giờ bị bất ngờ** bởi hành vi hệ thống |\n| **Recoverability** | Có cơ chế để **khôi phục khi gặp lỗi** (undo, xác nhận) |\n| **User guidance** | **Phản hồi có ý nghĩa** khi lỗi, **trợ giúp theo ngữ cảnh** |\n| **User diversity** | Cách tương tác phù hợp cho **nhiều kiểu người dùng** khác nhau |","en":"**Six UI design principles** (\"which principle is this\"):\n\n| Principle | Meaning |\n|---|---|\n| **User familiarity** | Use **terms and concepts drawn from the users' experience** |\n| **Consistency** | **Comparable operations are activated in the same way** |\n| **Minimal surprise** | Users are **never surprised** by system behavior |\n| **Recoverability** | Mechanisms to **recover from errors** (undo, confirmation) |\n| **User guidance** | **Meaningful feedback** on errors, **context-sensitive help** |\n| **User diversity** | Appropriate interaction for **different types of users** |"},{"src":"05#34","vi":"**Accessibility theo WCAG 2.2**: thiết kế cho **mọi người**, kể cả người khiếm khuyết thị giác, vận động, thính giác, nhận thức. **4 nguyên tắc POUR:**\n\n| Nguyên tắc | Ví dụ |\n|---|---|\n| **Perceivable** | **Text thay thế cho ảnh**, phụ đề, **độ tương phản ≥ 4.5:1** cho chữ |\n| **Operable** | **Mọi thứ dùng được bằng bàn phím**; vùng chạm **đủ lớn** |\n| **Understandable** | Nhãn rõ, điều hướng **dễ đoán**, thông báo lỗi có ích |\n| **Robust** | **HTML ngữ nghĩa**, chạy được với **screen reader** |\n\n- **Không bao giờ dùng chỉ màu sắc để truyền ý nghĩa.**\n- Thiết kế **mobile-first, responsive**: cùng một tác vụ phải làm được trên điện thoại và máy tính.\n- Kiểm tra bằng công cụ tự động (**Lighthouse, axe**) và **người dùng thật**.","en":"**Accessibility (WCAG 2.2)**: design for **everyone**, including users with visual, motor, hearing or cognitive impairments. **POUR principles:**\n\n| Principle | Examples |\n|---|---|\n| **Perceivable** | **Text alternatives for images**, captions, **contrast ratio 4.5:1** for text |\n| **Operable** | **Everything works with a keyboard**; targets **large enough** to tap |\n| **Understandable** | Clear labels, **predictable** navigation, helpful error messages |\n| **Robust** | **Semantic HTML**, works with **screen readers** |\n\n- **Never use color alone to convey meaning.**\n- Design **mobile-first and responsive**: the same task works on phone and desktop.\n- Check with automated tools (**Lighthouse, axe**) and with **real users**."},{"src":"05#34","vi":"Chính trang ôn này áp dụng POUR: đáp án đúng/sai có **chữ \"ĐÚNG/SAI\" và ký hiệu ✔/✘** chứ không chỉ đổi màu; mọi nút dùng được bằng **bàn phím**; chữ đủ tương phản ở cả chế độ Ngày và Đêm.","en":"This review page applies POUR itself: right/wrong answers show **the words CORRECT/WRONG and ✔/✘**, not just colour; every button works with the **keyboard**; text keeps enough contrast in both Day and Night modes.","real":true}]},{"id":"5.7","t":{"vi":"Kiểu tương tác & trình bày thông tin","en":"Interaction styles & presentation"},"cards":[{"src":"05#35-41","vi":"Hai câu hỏi thiết kế: người dùng **tương tác** với hệ thống thế nào, và thông tin **được trình bày** cho người dùng thế nào.\n\n**5 kiểu tương tác:**\n\n| Kiểu | Đặc điểm |\n|---|---|\n| **Direct manipulation** | Người dùng **thao tác trực tiếp và thấy kết quả ngay** |\n| **Menu selection** | Cấu trúc hoá quyết định: **đọc danh sách và chọn** mục phù hợp |\n| **Form fill-in** | Dùng khi cần **nhập dữ liệu** |\n| **Command language** | Phải **học cú pháp và tuỳ chọn** |\n| **Natural language** | Phản hồi **câu tuỳ ý**, có thể có hoặc không có nhận dạng giọng nói |","en":"Two design questions: how should the user **interact** with the system, and how should information **be presented**?\n\n**Five interaction styles:**\n\n| Style | Characteristics |\n|---|---|\n| **Direct manipulation** | Users **directly make changes and see results** |\n| **Menu selection** | Structured decisions: **read a list and select** the best item |\n| **Form fill-in** | Used when **data entry** is required |\n| **Command language** | Must **learn syntax and options** |\n| **Natural language** | Responds to **arbitrary sentences**, with or without speech recognition |"},{"src":"05#42-44","vi":"**Trình bày thông tin:**\n- **Static information**: khởi tạo đầu phiên. **Dynamic information**: thay đổi trong phiên.\n- **Digital presentation**: **giá trị chính xác**, **tốn ít chỗ** trên màn hình (bảng số Jan 2842, Feb 2851…).\n- **Analogue presentation**: cho thấy **giá trị tương đối** (biểu đồ cột, thấy ngay tháng May thấp bất thường).\n- **Data visualization**: hiển thị **lượng lớn thông tin**, giúp thấy **quan hệ giữa các thực thể** và **xu hướng** dữ liệu.","en":"**Information presentation:**\n- **Static information**: initialized at session start. **Dynamic information**: changes during the session.\n- **Digital presentation**: **precise values** using **little screen space** (the table Jan 2842, Feb 2851…).\n- **Analogue presentation**: shows **relative values** (the bar chart makes May's dip obvious).\n- **Data visualization**: displays **large amounts of information** and reveals **relationships between entities** and **trends**.","fig":"digital-analogue"}]},{"id":"5.8","t":{"vi":"Quy trình thiết kế UI & guideline","en":"UI process & guidelines"},"cards":[{"src":"05#45-46","vi":"**Quy trình thiết kế UI: User analysis → System prototyping → Interface evaluation.**\n- **User analysis**: hiểu người dùng **sẽ làm gì** với hệ thống. Mô tả bằng ngôn ngữ người dùng hiểu, dùng **scenario**. Kỹ thuật:\n  - **Task analysis**: mô hình các **bước** để hoàn thành một task.\n  - **Interviewing and questionnaires**: **hỏi** người dùng về công việc.\n  - **Ethnography**: **quan sát** người dùng lúc làm việc.","en":"**UI design process: User analysis → System prototyping → Interface evaluation.**\n- **User analysis**: understand **what users will do** with the system, in terms users understand, using **scenarios**. Techniques:\n  - **Task analysis**: models the **steps** to complete a task.\n  - **Interviewing and questionnaires**: **ask** users about their work.\n  - **Ethnography**: **observes** the user at work.","fig":"ui-process"},{"src":"05#47-48","vi":"**System prototyping** cho người dùng **trải nghiệm trực tiếp** giao diện và giúp đánh giá usability. Quy trình **2 giai đoạn**: **paper prototype → automated prototype**. Kỹ thuật: script-driven, visual programming, **công cụ thiết kế (Figma)** và web prototype tương tác.\n\n**Các bước:**\n1. **Identify screen list**: dựa trên **use case**.\n2. **Draw screen diagram**: thể hiện **quan hệ giữa các màn hình**.\n3. **Screen design**: bố trí control trên màn hình.\n4. **Screen specification**: giải thích control, mô tả luồng sự kiện.","en":"**System prototyping** gives users **direct experience** of the interface and helps judge usability. A **two-stage** process: **paper prototypes → automated prototypes**. Techniques: script-driven prototyping, visual programming, **design tools (Figma)** and interactive web prototypes.\n\n**Steps:**\n1. **Identify screen list**: based on **use cases**.\n2. **Draw screen diagram**: shows **screen relationships**.\n3. **Screen design**: organize controls on screen.\n4. **Screen specification**: explain controls, describe the flow of events."},{"src":"05#49-50","vi":"**Interface evaluation** đánh giá giao diện **theo usability specification**. **5 thuộc tính usability:**\n- **Learnability**: dễ học\n- **Speed of operation**: thao tác nhanh\n- **Robustness**: chịu lỗi tốt\n- **Recoverability**: khôi phục sau lỗi\n- **Adaptability**: thích nghi\n\nKỹ thuật đơn giản: **phiếu hỏi** lấy phản hồi; **ghi màn hình, ghi phiên** và **usage analytics** (heatmap); công cụ thu thập dữ liệu dùng tính năng và lỗi người dùng. Bẫy: **Profitability** không phải thuộc tính usability.","en":"**Interface evaluation** assesses the UI **against a usability specification**. **Five usability attributes:**\n- **Learnability**\n- **Speed of operation**\n- **Robustness**\n- **Recoverability**\n- **Adaptability**\n\nSimple techniques: **questionnaires**; **screen/session recording** and **usage analytics** (heatmaps); tools that collect facility use and user errors. Trap: **Profitability** is not a usability attribute."},{"src":"05#51-53","vi":"**3 nhóm UI guideline:** color use · error message design · data validation.\n\n**Dùng màu:** màu thêm một chiều thông tin và giúp **làm nổi bật sự kiện bất thường**.\n- **Lỗi thường gặp:** **dùng màu để truyền ý nghĩa** (người mù màu không thấy được) và **lạm dụng màu**.\n- Nên: **giới hạn số màu**; dùng **đổi màu để báo đổi trạng thái**; mã màu **hỗ trợ đúng tác vụ**, **nhất quán**; cẩn thận khi **phối cặp màu**.","en":"**Three UI guideline areas:** color use · error message design · data validation.\n\n**Color:** adds an extra dimension and can **highlight exceptional events**.\n- **Common mistakes:** **using color to communicate meaning** and **over-using color**.\n- Do: **limit the number of colors**; use **color change to show status change**; color-code to **support the task**, **consistently**; be careful with **color pairings**."},{"src":"05#54-56","vi":"**Thiết kế thông báo lỗi** rất quan trọng: thông báo tệ có thể khiến người dùng **từ chối** hệ thống. Thông báo phải **polite · concise · consistent · constructive** (lịch sự, ngắn gọn, nhất quán, mang tính xây dựng). **Nền tảng và kinh nghiệm của người dùng** quyết định cách viết thông báo.\n\nVí dụ: y tá gõ sai tên bệnh nhân \"MacDonald, R.\"\n- **Hướng hệ thống** (tệ): \"Error #27 · Invalid patient id\", chỉ có OK / Cancel.\n- **Hướng người dùng** (tốt): \"R. MacDonald is not a registered patient\", kèm hướng dẫn và các nút **Patients · Help · Retry · Cancel**.","en":"**Error message design** is critical: poor messages can make users **reject** a system. Messages should be **polite · concise · consistent · constructive**, and **users' background and experience** should drive their design.\n\nExample: a nurse misspells patient \"MacDonald, R.\"\n- **System-oriented** (bad): \"Error #27 · Invalid patient id\" with only OK / Cancel.\n- **User-oriented** (good): \"R. MacDonald is not a registered patient\" with guidance and **Patients · Help · Retry · Cancel** buttons.","fig":"error-msg"},{"src":"05#57","vi":"**Data validation: đừng tin người dùng**, hãy **kiểm tra mọi dữ liệu nhập vào**.\n- Ràng buộc kiểm tra: **natural constraints** (tự nhiên, ví dụ tuổi không âm) và **business constraints** (nghiệp vụ, ví dụ tối đa 20 tín chỉ).\n- Thời điểm kiểm tra: **early checking** (ngay khi nhập) và **late checking** (khi gửi/lưu).","en":"**Data validation: do not trust the users**; **check all user input data**.\n- Constraints: **natural constraints** (e.g. age cannot be negative) and **business constraints** (e.g. at most 20 credits).\n- Timing: **early checking** (as data is entered) and **late checking** (on submit/save)."}]}],"6":[{"id":"6.1","t":{"vi":"Thiết kế & kiến trúc phần mềm","en":"Software design & architecture"},"cards":[{"src":"06#3-4","vi":"Trong quy trình phát triển, thiết kế nằm ở bước **Analysis & Design**, sau Requirement definition và trước Implementation.\n\n**Software design** là quá trình **hình dung hệ thống sẽ hoạt động thế nào trước khi** cài đặt hoặc sửa nó. Thiết kế có 3 mức:\n\n| Mức | Trả lời câu hỏi |\n|---|---|\n| **Architectural design** | **Cấu trúc tổng thể** của hệ thống |\n| **High-level design** | Các **sub-system và module** |\n| **Detailed design** | **Cấu trúc dữ liệu và thuật toán** |","en":"In the development process, design sits in the **Analysis & Design** step, after requirement definition and before implementation.\n\n**Software design** is the process of **conceptualizing how a system will work before it is implemented** or modified. It has three levels:\n\n| Level | Answers |\n|---|---|\n| **Architectural design** | The **overall structure** of the system |\n| **High-level design** | **Sub-systems and modules** |\n| **Detailed design** | **Data structures and algorithms** |"},{"src":"06#6-7","vi":"Phân biệt hai khái niệm:\n- **Architectural design** là **quá trình**: xác định các **sub-system** tạo nên hệ thống và **cách chúng giao tiếp**.\n- **Software architecture** là **tài liệu**: **kết quả** (đầu ra) của quá trình đó.\n\nArchitectural design là **giai đoạn sớm** của thiết kế, là **cầu nối giữa requirements engineering và design**. Nó gồm: **chia hệ thống thành các phần**, xác định các component chính và cách chúng giao tiếp, đưa ra **quyết định thiết kế kèm lý do**.","en":"Two terms to keep apart:\n- **Architectural design** is the **process** of identifying the **sub-systems** that make up a system and **how they communicate**.\n- **Software architecture** is the **document**: the **output** of that process.\n\nArchitectural design is an **early stage** of design and **links requirements engineering with design**. It involves **decomposing the system into parts**, identifying major components and their communication, and making **design decisions with their rationale**."},{"src":"06#8-10","vi":"Hai định nghĩa trên slide:\n- **Shaw et al. (1995):** kiến trúc định nghĩa hệ thống qua các **computational components** và **tương tác giữa chúng**.\n- **Bass, Clements & Kazman (2021):** kiến trúc là **tập các cấu trúc** cần để suy luận về hệ thống, gồm **software elements, quan hệ** giữa chúng, và **thuộc tính** của cả hai.\n\nCách biểu diễn đơn giản nhất là **block diagram** (hộp và đường nối): dễ dùng để **trao đổi với stakeholder** và **lập kế hoạch dự án**. Sơ đồ trong thẻ này là một ví dụ kiểu MVC cho web bán hàng.","en":"Two definitions on the slides:\n- **Shaw et al. (1995):** architecture defines a system in terms of **computational components** and the **interactions among them**.\n- **Bass, Clements & Kazman (2021):** architecture is the **set of structures** needed to reason about the system: **software elements, relations** among them, and **properties** of both.\n\nThe simplest representation is a **block diagram** (boxes and lines). It is useful for **communicating with stakeholders** and for **project planning**. The diagram on this card is an MVC-style example for a shop website.","fig":"arch-example"},{"src":"06#11-12","vi":"**System architecture** cho thấy hệ thống được triển khai trên hạ tầng nào (slide ví dụ một hệ thống trên AWS: load balancer, API gateway, các microservice chạy trên máy CPU/GPU).\n\n**C4 model** (Simon Brown) mô tả kiến trúc bằng **4 mức phóng to như bản đồ**: **System Context → Containers → Components → Code**.\n- Ký hiệu đơn giản: **hộp và mũi tên có nhãn**, dễ hiểu cho cả sinh viên lẫn stakeholder.\n- Vẽ bằng **diagrams-as-code**: Structurizr, PlantUML, Mermaid.\n- Với đồ án: vẽ **ít nhất Context và Container diagram** (PA3).","en":"**System architecture** shows the infrastructure the system is deployed on (the slide shows a system on AWS: a load balancer, an API gateway, microservices on CPU and GPU machines).\n\nThe **C4 model** (Simon Brown) documents architecture at **four zoom levels, like maps**: **System Context → Containers → Components → Code**.\n- Simple notation: **boxes and labelled arrows**, easy for students and stakeholders.\n- Drawn as **diagrams-as-code** with Structurizr, PlantUML or Mermaid.\n- For the course project: draw **at least the Context and Container diagrams** (PA3).","fig":"c4"},{"src":"06#12","vi":"Context diagram cho BadminBookingHub có thể chỉ gồm: hệ thống ở giữa, các actor **Player, Staff, Admin**, và hệ thống bên ngoài như **cổng thanh toán** (đặt cọc) và **dịch vụ email** (xác nhận đặt sân). Container diagram mới tách tiếp thành web app, API và database.","en":"A context diagram for BadminBookingHub could hold just the system in the middle, the **Player, Staff and Admin** actors, and external systems such as a **payment gateway** (deposits) and an **email service** (booking confirmations). The container diagram then splits the system into web app, API and database.","real":true}]},{"id":"6.2","t":{"vi":"Sub-system, lợi ích & thuộc tính kiến trúc","en":"Sub-systems, benefits & quality attributes"},"cards":[{"src":"06#13","vi":"| | **Sub-system** | **Module (component)** |\n|---|---|---|\n| Bản chất | **Một hệ thống riêng** | Cung cấp dịch vụ cho component khác, **không** được xem là hệ thống riêng |\n| Hoạt động | **Độc lập** với dịch vụ của sub-system khác | Phụ thuộc vào hệ thống chứa nó |\n| Ví dụ | **Google Maps** nhúng trong một app | **Một component giao diện** trên website |","en":"| | **Sub-system** | **Module (component)** |\n|---|---|---|\n| What it is | **A system in its own right** | Provides services to other components but is **not** normally seen as a separate system |\n| Operation | **Independent** of the services of other sub-systems | Depends on the system that holds it |\n| Example | **Google Maps** embedded in an app | **A UI component** on your website |"},{"src":"06#15","vi":"**3 lợi ích của việc có kiến trúc rõ ràng:**\n1. **Stakeholder communication**: kiến trúc là tâm điểm để các stakeholder thảo luận.\n2. **System analysis**: phân tích xem hệ thống có đáp ứng được **non-functional requirements** không, và khả năng mở rộng sau này.\n3. **Large-scale reuse**: một kiến trúc có thể **dùng lại cho nhiều hệ thống**.","en":"**Three benefits of an explicit architecture:**\n1. **Stakeholder communication**: the architecture is a focus of discussion for stakeholders.\n2. **System analysis**: check whether the system can meet its **non-functional requirements**, and plan future extensions.\n3. **Large-scale reuse**: one architecture may be **reused across a range of systems**."},{"src":"06#16","vi":"Mỗi **thuộc tính chất lượng** dẫn tới một lựa chọn kiến trúc khác nhau:\n\n| Thuộc tính | Cách kiến trúc hỗ trợ |\n|---|---|\n| **Performance** | Gom các thao tác quan trọng vào một chỗ, giảm giao tiếp; dùng component **lớn** (large-grain) |\n| **Security** | **Layered architecture**, tài sản quan trọng ở **lớp trong cùng** |\n| **Safety** | Gom tính năng an toàn vào **ít sub-system** |\n| **Availability** | Thêm **component dự phòng** (redundant) và cơ chế chịu lỗi |\n| **Maintainability** | Dùng component **nhỏ, dễ thay thế** (fine-grain) |","en":"Each **quality attribute** pushes the architecture a different way:\n\n| Attribute | How the architecture supports it |\n|---|---|\n| **Performance** | Localize critical operations, minimize communication; use **large-grain** components |\n| **Security** | A **layered architecture** with critical assets in the **inner layers** |\n| **Safety** | Localize safety-critical features in a **small number of sub-systems** |\n| **Availability** | **Redundant components** and fault-tolerance mechanisms |\n| **Maintainability** | **Fine-grain, replaceable** components |"},{"src":"06#17","vi":"**Architectural conflicts**: các thuộc tính chất lượng thường **mâu thuẫn** nhau, nên phải đánh đổi.\n- Component **lớn** giúp **performance** nhưng làm giảm **maintainability**.\n- Thêm **dữ liệu dư thừa** giúp **availability** nhưng làm **security** khó hơn.\n- Gom tính năng **safety** vào một chỗ thường cần **giao tiếp nhiều hơn**, nên **performance giảm**.","en":"**Architectural conflicts**: quality attributes often **pull against each other**, so you trade them off.\n- **Large-grain** components improve **performance** but reduce **maintainability**.\n- **Redundant data** improves **availability** but makes **security** harder.\n- Localizing **safety** features usually means **more communication**, so **performance degrades**."},{"src":"06#18-19","vi":"**Architecturally Significant Requirements (ASR)**: các requirement **ảnh hưởng lớn tới kiến trúc**, chủ yếu là **non-functional** cùng vài **functional ưu tiên cao**.\n\nASR định hướng thiết kế bằng cách:\n- **Quyết định công nghệ**: database, framework, nền tảng triển khai.\n- **Đặt ràng buộc**: ví dụ luật về nơi lưu dữ liệu (data residency) ảnh hưởng kiến trúc cloud.\n- **Định hình đánh đổi** giữa các thuộc tính, ví dụ performance và maintainability.\n- Bảo đảm hệ thống đạt mục tiêu kinh doanh, vận hành và kỹ thuật.\n\nVí dụ NFR: xử lý **1.000 giao dịch/giây**; mở rộng tới **1 triệu người dùng** không phải thiết kế lại; tuân thủ **ISO/IEC 27001:2022**; uptime **99,99%**. Ví dụ FR ưu tiên cao: ứng dụng xử lý video thời gian thực cần **pipeline streaming độ trễ thấp**.","en":"**Architecturally Significant Requirements (ASRs)** are requirements with a **significant impact on the architecture**: mostly **non-functional**, plus some **high-priority functional** needs.\n\nASRs guide the design by:\n- **Influencing technology choices**: databases, frameworks, deployment platforms.\n- **Defining constraints**: e.g. data residency laws shaping a cloud architecture.\n- **Shaping trade-offs** between quality attributes, e.g. performance vs maintainability.\n- Making sure the system can meet business, operational and technical goals.\n\nNFR examples: **1,000 transactions per second**; growth to **1 million users** without major redesign; compliance with **ISO/IEC 27001:2022**; **99.99% uptime**. A high-priority FR example: real-time video processing needs a **low-latency streaming pipeline**."}]},{"id":"6.3","t":{"vi":"Quyết định thiết kế kiến trúc","en":"Architectural design decisions"},"cards":[{"src":"06#21-22","vi":"Kiến trúc là **kết quả của một chuỗi quyết định thiết kế**: bao nhiêu component, chúng giao tiếp thế nào, bảo mật ra sao, dùng ngôn ngữ gì…\n\nMột quyết định gồm: **issue, decision, assumptions, rationale (lý do), alternatives, implications**.\n\n**7 câu hỏi khi thiết kế kiến trúc:**\n1. Có **kiến trúc ứng dụng chung** nào dùng lại được không?\n2. Hệ thống sẽ được **phân tán** thế nào?\n3. **Architectural style** nào phù hợp?\n4. Chia hệ thống thành **module** thế nào?\n5. Dùng **chiến lược điều khiển** (control strategy) nào?\n6. **Đánh giá** thiết kế kiến trúc thế nào?\n7. **Viết tài liệu** kiến trúc thế nào?","en":"Architecture is the **result of a series of design decisions**: how many components, how they communicate, how they are secured, which languages to use…\n\nA decision has: **issue, decision, assumptions, rationale (reasons), alternatives, implications**.\n\n**Seven questions for architectural design:**\n1. Is there a **generic application architecture** to reuse?\n2. How will the system be **distributed**?\n3. Which **architectural styles** fit?\n4. How will the system be decomposed into **modules**?\n5. Which **control strategy** should be used?\n6. How will the architectural design be **evaluated**?\n7. How should the architecture be **documented**?"},{"src":"06#23-24","vi":"Ví dụ quyết định thiết kế: dùng **React** (hoặc Angular) cho web front end, **React Native** cho mobile, **MySQL** làm database, mô hình **MVC** phía server, **Java** cho back end, **sao lưu hằng ngày**.\n\nMột quyết định viết đầy đủ:\n- **Issue:** hệ thống phải **dễ bảo trì**.\n- **Decision:** kiến trúc **three-tier**, dùng ngôn ngữ **hướng đối tượng**.\n- **Rationale:** với three-tier, đổi một tầng (giao diện hay logic) **không ảnh hưởng tầng khác**; nhóm đã quen thiết kế OO, giúp ranh giới module rõ ràng.\n- **Alternatives:** MVC, service-oriented architecture, n-tier.","en":"Examples of design decisions: **React** (or Angular) for the web front end, **React Native** for mobile, **MySQL** as the database, **MVC** on the server side, **Java** for the back end, **daily backup**.\n\nA fully written decision:\n- **Issue:** the system has to be **maintainable**.\n- **Decision:** a **three-tier** architecture with an **object-oriented** language.\n- **Rationale:** with three tiers, one tier (interface or logic) can change **without affecting the others**; the team knows OO design, which supports clear module boundaries.\n- **Alternatives:** MVC, service-oriented architecture, n-tier."},{"src":"06#25","vi":"**Architecture Decision Record (ADR)**: tài liệu ngắn ghi lại **một** quyết định quan trọng, **lưu ngay trong repository** (`docs/adr/`).\n\n| Phần | Nội dung |\n|---|---|\n| **Title** | ADR-003: Use PostgreSQL as the main database |\n| **Status** | proposed · accepted · superseded by ADR-007 |\n| **Context** | Vấn đề, các lực tác động và ràng buộc |\n| **Decision** | Đã chọn gì |\n| **Consequences** | Lợi ích, hạn chế, việc cần làm tiếp |\n\n**Vì sao cần ADR:** thành viên mới hiểu **vì sao** hệ thống trông như vậy; quyết định được **review như code**.","en":"An **Architecture Decision Record (ADR)** is a short document recording **one** important decision, **kept in the repository** (`docs/adr/`).\n\n| Part | Content |\n|---|---|\n| **Title** | ADR-003: Use PostgreSQL as the main database |\n| **Status** | proposed · accepted · superseded by ADR-007 |\n| **Context** | The problem, forces and constraints |\n| **Decision** | What we chose |\n| **Consequences** | Benefits, drawbacks, follow-up work |\n\n**Why:** new members understand **why** the system looks the way it does; decisions are **reviewed like code**."},{"src":"06#25","vi":"Chính SE Quest cũng ghi quyết định theo tinh thần ADR: mỗi lựa chọn (Voxel 3D, Vercel, bỏ ảnh slide…) có **ngày, quyết định và lý do**. Khi đổi ý, quyết định cũ không bị xoá mà được ghi là đã thay thế, giống trạng thái **superseded**.","en":"SE Quest itself records decisions in the ADR spirit: each choice (voxel 3D, Vercel, dropping slide images…) has a **date, the decision and the reason**. When a choice changes, the old one is not deleted but marked as replaced, like the **superseded** status.","real":true}]},{"id":"6.4","t":{"vi":"Architectural style: Repository, Client-Server, P2P","en":"Architectural styles: Repository, Client-Server, P2P"},"cards":[{"src":"06#28-30","vi":"**Architectural style** mô tả một **cách sắp xếp các phần tử kiến trúc dùng lại được**, tức một **giải pháp chung cho một bài toán kiến trúc**. Ví dụ: MVC, n-tier, service-oriented.\n\n| | **Architectural style** | **Design pattern** |\n|---|---|---|\n| Mức | **High-level design**, cả hệ thống | **Micro-architecture**, low-level design |\n| Phạm vi | Cấu trúc của **toàn hệ thống** | Một bài toán thiết kế, **không** nói về cấu trúc cả hệ thống |\n\n**Lợi ích:** biết các style giúp định nghĩa kiến trúc dễ hơn, và **dùng lại** cách giải bài toán lặp lại. Một style được mô tả bằng **Problem · Context · Solution**.\n\n**10 style trên slide:** Repository, Client-Server, Peer-to-peer, Layered, MVC, Pipes and Filters, Interrupt-driven, Service-oriented, Microservice, Event-driven.","en":"An **architectural style** describes a **reusable arrangement of architectural elements**: a **common solution to a particular architectural problem**. Examples: MVC, n-tier, service-oriented.\n\n| | **Architectural style** | **Design pattern** |\n|---|---|---|\n| Level | **High-level design**, the whole system | **Micro-architecture**, low-level design |\n| Scope | Structure of the **complete system** | One design problem; does **not** address the whole structure |\n\n**Benefits:** knowing styles simplifies defining an architecture and lets you **reuse** solutions to repeated problems. A style is described as **Problem · Context · Solution**.\n\n**Ten styles on the slides:** Repository, Client-Server, Peer-to-peer, Layered, MVC, Pipes and Filters, Interrupt-driven, Service-oriented, Microservice, Event-driven."},{"src":"06#33-35","vi":"**Repository style**: các sub-system trao đổi dữ liệu qua **một kho trung tâm** (database/repository) mà **mọi sub-system đều truy cập được**. Hay dùng khi phải **chia sẻ lượng dữ liệu lớn**. Ví dụ: các công cụ CASE dùng chung project repository.\n\n| ✔ Ưu điểm | ✘ Nhược điểm |\n|---|---|\n| Chia sẻ dữ liệu lớn **hiệu quả** | Mọi sub-system phải **thống nhất một data model** (luôn là thoả hiệp) |\n| Sub-system không cần biết dữ liệu được tạo ra thế nào | **Thay đổi data model khó và tốn kém** |\n| **Quản lý tập trung**: backup, bảo mật… | Không có chính sách quản lý riêng cho từng phần |\n| | **Khó phân tán** hiệu quả |","en":"**Repository style**: sub-systems exchange data through **one central repository** (database) that **all sub-systems can access**. Used when **large amounts of data are shared**, e.g. CASE tools sharing a project repository.\n\n| ✔ Advantages | ✘ Disadvantages |\n|---|---|\n| **Efficient** sharing of large data | All sub-systems must **agree on one data model** (always a compromise) |\n| Sub-systems need not know how data is produced | **Data evolution is difficult and expensive** |\n| **Centralized management**: backup, security… | No scope for specific management policies |\n| | **Difficult to distribute** efficiently |","fig":"repository"},{"src":"06#36-38","vi":"**Client-Server style**: cho thấy **dữ liệu và xử lý được phân tán** trên nhiều component. Gồm 3 phần:\n1. Các **server độc lập** cung cấp dịch vụ cụ thể (in ấn, quản lý dữ liệu…).\n2. Các **client** gọi những dịch vụ đó.\n3. **Mạng** để client truy cập server.\n\n| ✔ Ưu điểm | ✘ Nhược điểm |\n|---|---|\n| **Phân tán dữ liệu** dễ dàng | **Không có data model chung**, mỗi server tổ chức dữ liệu một kiểu |\n| Tận dụng tốt hệ thống mạng | Trao đổi dữ liệu có thể kém hiệu quả |\n| Có thể cần **phần cứng rẻ hơn** | **Quản lý lặp lại** ở từng server |\n| **Dễ thêm hoặc nâng cấp server** | **Không có nơi đăng ký tên và dịch vụ** tập trung |","en":"**Client-Server style** shows how **data and processing are distributed** across components. Three parts:\n1. **Stand-alone servers** providing specific services (printing, data management…).\n2. **Clients** calling on those services.\n3. A **network** that lets clients reach servers.\n\n| ✔ Advantages | ✘ Disadvantages |\n|---|---|\n| **Distribution of data** is straightforward | **No shared data model**; servers organize data differently |\n| Effective use of networked systems | Data interchange may be inefficient |\n| May need **cheaper hardware** | **Redundant management** in each server |\n| **Easy to add or upgrade servers** | **No central register** of names and services |","fig":"client-server"},{"src":"06#39","vi":"**Peer-to-peer (P2P) style**: mỗi node vừa là **client vừa là server**; **không có server trung tâm**, các node giao tiếp trực tiếp với nhau.\n- ✔ **Mở rộng tốt**, **chịu lỗi tốt**, tính toán phân tán, **không có cơ quan trung tâm**.\n- ✘ **Khó bảo mật** và **khó giữ dữ liệu nhất quán**; việc tìm peer và chất lượng dịch vụ **không được bảo đảm**.\n- Ví dụ: **BitTorrent**, mạng **blockchain**, một số hệ thống giao tiếp thời gian thực.","en":"**Peer-to-peer (P2P) style**: every node acts as both **client and server**; th

ere is **no central server** and nodes talk directly.\n- ✔ **Scalability**, **resilience to failures**, distributed computing, **no central authority**.\n- ✘ **Harder to secure** and to **keep data consistent**; peer discovery and quality of service are **not guaranteed**.\n- Examples: **BitTorrent**, **blockchain** networks, some real-time communication systems."}]},{"id":"6.5","t":{"vi":"Layered, MVC, Pipes & Filters, Interrupt-driven","en":"Layered, MVC, Pipes & Filters, Interrupt-driven"},"cards":[{"src":"06#40-42","vi":"**Layered style**: tổ chức hệ thống thành **các lớp**, mỗi lớp cung cấp một tập dịch vụ. Hỗ trợ **phát triển tăng dần** từng lớp: khi interface của một lớp đổi, **chỉ lớp kề bên bị ảnh hưởng**. Ví dụ 4 lớp: Presentation, Business, Persistence, Database.\n\n| ✔ Ưu điểm | ✘ Nhược điểm |\n|---|---|\n| **Separation of concerns** | **Giao tiếp giữa các lớp cứng nhắc** |\n| **Reuse** | **Chậm** vì yêu cầu phải đi qua nhiều lớp |\n| Giảm ảnh hưởng khi đổi giao diện | |","en":"**Layered style**: organize the system into **layers**, each providing a set of services. It supports **incremental development** of layers: when a layer interface changes, **only the adjacent layer is affected**. Example with four layers: Presentation, Business, Persistence, Database.\n\n| ✔ Advantages | ✘ Disadvantages |\n|---|---|\n| **Separation of concerns** | **Inflexible communication** among layers |\n| **Reuse** | **Performance problems** from passing through many layers |\n| Less impact of changes on the user interface | |","fig":"layers-4"},{"src":"06#43","vi":"**Model-View-Controller (MVC)**: ban đầu dành cho **ứng dụng có giao diện**, nay phổ biến cho **web app**.\n\n| Thành phần | Vai trò |\n|---|---|\n| **Model** | **Dữ liệu và xử lý logic** |\n| **View** | **Trình bày** (presentation) |\n| **Controller** | **Nhận lệnh, input**; chuyển đổi và **chuyển lệnh** đi |","en":"**Model-View-Controller (MVC)**: first introduced for **UI applications**, now popular for **web apps**.\n\n| Component | Role |\n|---|---|\n| **Model** | **Data and logic processing** |\n| **View** | **Presentation** |\n| **Controller** | **Accepts commands and input**; converts and **passes commands** on |","fig":"mvc"},{"src":"06#47-49","vi":"**Pipes and Filters style**: hệ thống chia thành chuỗi **filter** (component tính toán). Mỗi filter **xử lý dữ liệu độc lập**; dữ liệu **đi qua các filter bằng pipe**. Ví dụ trong sơ đồ: hệ thống xử lý hoá đơn.\n\n| ✔ Ưu điểm | ✘ Nhược điểm |\n|---|---|\n| **Dùng lại các bước biến đổi** | Cần **định dạng dữ liệu chung** dọc pipeline |\n| Dễ hiểu, dễ trao đổi với stakeholder | **Khó hỗ trợ tương tác theo sự kiện** (event-based) |\n| **Dễ thêm bước biến đổi mới** | |\n| Dễ cài đặt dạng tuần tự hoặc song song | |","en":"**Pipes and Filters style**: the system is decomposed into a series of **filters** (computational components). Each filter **processes data independently**; data **travels through filters via pipes**. Example in the diagram: an invoice processing system.\n\n| ✔ Advantages | ✘ Disadvantages |\n|---|---|\n| **Supports transformation reuse** | Needs a **common data format** along the pipeline |\n| Intuitive for stakeholder communication | **Difficult to support event-based interaction** |\n| **Easy to add new transformations** | |\n| Simple to implement as a sequential or concurrent system | |","fig":"pipes-filters"},{"src":"06#50-51","vi":"**Interrupt-driven style**: dùng trong **hệ thống thời gian thực**, nơi **phản hồi nhanh với sự kiện** là bắt buộc.\n- Có nhiều **loại interrupt**, mỗi loại có **một handler** riêng.\n- Mỗi loại interrupt gắn với **một vị trí bộ nhớ** và **một công tắc phần cứng**; interrupt vector chuyển tới handler, handler khởi động process tương ứng.\n- ✘ **Phản hồi nhanh nhưng khó lập trình và khó kiểm chứng** (validate).","en":"**Interrupt-driven style**: used in **real-time systems** where a **fast response to an event** is essential.\n- There are several **interrupt types**, each with **its own handler**.\n- Each interrupt type is associated with **a memory location** and **a hardware switch**; the interrupt vector passes control to the handler, which starts the matching process.\n- ✘ **Fast response, but complex to program and difficult to validate.**"}]},{"id":"6.6","t":{"vi":"SOA, Microservices, Event-driven","en":"SOA, Microservices, Event-driven"},"cards":[{"src":"06#52","vi":"**Service-oriented architecture (SOA)**: các component (service) được tổ chức và **cung cấp qua mạng** dưới dạng **service có thể phối hợp với nhau**, dùng để đạt mục tiêu kinh doanh cụ thể.\n\n4 đặc điểm: **Modularity · Interoperability · Reusability · Loose coupling**.","en":"**Service-oriented architecture (SOA)**: software components (services) are organized and **exposed over a network** as **interoperable services** used to achieve specific business goals.\n\nFour traits: **Modularity · Interoperability · Reusability · Loose coupling**."},{"src":"06#53-54","vi":"**Microservice architecture**: chia một ứng dụng lớn thành nhiều **service nhỏ, độc lập**, mỗi service được **phát triển, triển khai và mở rộng riêng**.\n\n4 đặc điểm: **Autonomy · Resilience · Scalability · Flexibility**.","en":"**Microservice architecture**: a large application is broken into smaller, **independent services**, each **developed, deployed and scaled independently**.\n\nFour traits: **Autonomy · Resilience · Scalability · Flexibility**.","fig":"microservices"},{"src":"06#55","vi":"**Microservices có giá của nó:**\n- **Độ phức tạp của hệ phân tán**: độ trễ mạng, lỗi một phần, phải retry.\n- **Nhất quán dữ liệu** giữa các service (không có một transaction chung).\n- **Chi phí vận hành**: nhiều lần deploy, monitoring, tracing.\n- Đòi hỏi **DevOps trưởng thành**: CI/CD, container, tự động hoá.\n\n**Nguyên tắc:** với **nhóm nhỏ và sản phẩm mới**, hãy bắt đầu bằng một **modular monolith** có cấu trúc tốt. Chỉ tách thành service khi **có nhu cầu rõ ràng** (cần mở rộng riêng, các nhóm cần tự chủ).","en":"**Microservices have a price:**\n- **Distributed-system complexity**: network latency, partial failures, retries.\n- **Data consistency** across services (no single transaction).\n- **Operational overhead**: many deployments, monitoring, tracing.\n- Needs **DevOps maturity**: CI/CD, containers, automation.\n\n**Guideline:** for **small teams and new products**, start with a well-structured **modular monolith**. Split into services only when there is a **clear need** (independent scaling, team autonomy)."},{"src":"06#56","vi":"**Event-driven architecture**: các component giao tiếp bằng cách **phát (produce) và nhận (consume) event** qua một **broker**.\n- Producer → **event broker** (ví dụ **Kafka, RabbitMQ**) → một hoặc nhiều consumer.\n- Ví dụ: event **\"TicketBooked\"** được payment service, email service và analytics cùng nhận.\n\n| ✔ Ưu điểm | ✘ Nhược điểm |\n|---|---|\n| **Loose coupling**; dễ thêm consumer mới | **Khó lần theo và debug** luồng đầu-cuối; **eventual consistency** |\n| **Bất đồng bộ**, dễ mở rộng | Đổi schema của event phải **quản lý version cẩn thận** |","en":"**Event-driven architecture**: components communicate by **producing and consuming events** via a **broker**.\n- Producer → **event broker** (e.g. **Kafka, RabbitMQ**) → one or more consumers.\n- Example: a **\"TicketBooked\"** event consumed by the payment service, the email service and analytics.\n\n| ✔ Advantages | ✘ Disadvantages |\n|---|---|\n| **Loose coupling**; easy to add new consumers | **Harder to trace and debug** end-to-end flows; **eventual consistency** |\n| **Asynchronous** and scalable | Event schema changes need **careful versioning** |"},{"src":"06#55-56","vi":"Với một nhóm 4–5 sinh viên như đồ án BadminBookingHub, nguyên tắc trên gợi ý dùng **một monolith chia module rõ** (đặt sân, thanh toán, thông báo) thay vì microservices. Sau này nếu cần, việc gửi email xác nhận có thể tách ra nghe event kiểu **\"BookingConfirmed\"** mà không phải sửa module đặt sân.","en":"For a team of 4–5 students like the BadminBookingHub project, the guideline points to **one monolith with clear modules** (booking, payment, notifications) rather than microservices. Later, sending confirmation emails could move to a consumer of a **\"BookingConfirmed\"** event without touching the booking module.","real":true}]}],"7":[{"id":"7.1","t":{"vi":"Class, attribute, operation, interface","en":"Classes, attributes, operations, interfaces"},"cards":[{"src":"07#3-4","vi":"**Class diagram** là sơ đồ UML **được dùng nhiều nhất trong thực tế**. Thành phần chính: **classes, interfaces, relationships** và **common mechanisms**.\n\n**Class** định nghĩa **tập các object có chung attribute, operation, relationship và ngữ nghĩa**; một class **đại diện cho một \"thứ\"**. Ký hiệu là hình chữ nhật 3 ngăn: **tên**, **attributes**, **operations**. Tên class phải **duy nhất trong nhóm** của nó.","en":"The **class diagram** is **the most commonly used UML diagram in practice**. Main elements: **classes, interfaces, relationships** and **common mechanisms**.\n\nA **class** defines **the set of objects that share the same attributes, operations, relationships and semantics**; a class **represents a thing**. It is drawn as a three-compartment box: **name**, **attributes**, **operations**. A class name must be **unique within its group**."},{"src":"07#5-6","vi":"**Attribute**: dữ liệu **mô tả đặc điểm** của class, là một trừu tượng của loại dữ liệu hay object. Ví dụ `title` là attribute kiểu `String`. **Kiểu dữ liệu viết sau dấu hai chấm** `:`.\n\n**Operation**: một **dịch vụ có thể yêu cầu** từ các object của class, ví dụ `calcSalary(year: int): float`.\n\n**Visibility** của attribute và operation:\n\n| Ký hiệu | Visibility |\n|---|---|\n| **+** | **public** |\n| **-** | **private** |\n| **#** | **protected** |","en":"An **attribute** is data that **characterizes** a class: an abstraction of the kind of data or object. For example `title` is an attribute of kind `String`. The **data type follows a colon** `:`.\n\nAn **operation** specifies **a service that can be requested** from objects of the class, e.g. `calcSalary(year: int): float`.\n\n**Visibility** of attributes and operations:\n\n| Symbol | Visibility |\n|---|---|\n| **+** | **public** |\n| **-** | **private** |\n| **#** | **protected** |","fig":"uml-class"},{"src":"07#7","vi":"**Interface**: một phần tử có **tập các operation mô tả hành vi** của nó (không có dữ liệu riêng).\n\n**2 cách vẽ:**\n- **Một hình tròn kèm tên** (ký hiệu \"lollipop\").\n- **Một class có stereotype `<<interface>>`**, liệt kê các operation. Ví dụ `<<interface>> Diagnosis` với `+basicExamine()`, `+takeXray()`, `+takeMRI()`.","en":"An **interface** is an element with **a set of operations characterizing its behaviour** (no data of its own).\n\n**Two notations:**\n- **A circle with a name** (the \"lollipop\").\n- **A class with the stereotype `<<interface>>`** listing its operations, e.g. `<<interface>> Diagnosis` with `+basicExamine()`, `+takeXray()`, `+takeMRI()`."}]},{"id":"7.2","t":{"vi":"Quan hệ giữa các class","en":"Class relationships"},"cards":[{"src":"07#8-12","vi":"Hầu hết class đều liên quan tới class khác. **3 loại quan hệ chính:** **Dependency, Generalization, Association** (aggregation và composition là hai dạng đặc biệt của association).\n\n| Quan hệ | Ý nghĩa | Ký hiệu |\n|---|---|---|\n| **Dependency** | Class này **dùng** class kia: một operation gọi operation của class khác, hoặc class kia là **tham số**. Đổi class bị dùng có thể ảnh hưởng class dùng nó. **Lỏng nhất** | Nét **đứt**, mũi tên mở |\n| **Generalization** | Quan hệ giữa class **chung** (superclass) và class **cụ thể** (subclass) | Mũi tên **tam giác rỗng** chỉ vào superclass |\n| **Association** | Object của class này **được nối với** object của class kia; thường một object **giữ** các object khác. Có thể có **tên** và **role** ở hai đầu | Đường **liền** |","en":"Most classes relate to others. **Three main kinds:** **Dependency, Generalization, Association** (aggregation and composition are special kinds of association).\n\n| Relationship | Meaning | Notation |\n|---|---|---|\n| **Dependency** | One class **uses** another: an operation calls an operation of the other class, or the other class is a **parameter**. A change in the used class may affect the user. **Least restrictive** | **Dashed** line, open arrow |\n| **Generalization** | Between a **general** class (superclass) and a **more specific** class (subclass) | **Hollow triangle** pointing at the superclass |\n| **Association** | Objects of one class **are connected to** objects of another; typically one object **holds** others. Can have a **name** and **roles** at both ends | **Solid** line |","fig":"uml-relations"},{"src":"07#13","vi":"**Multiplicity**: **bao nhiêu object** có thể được nối qua một association. Trong ví dụ, association **works for** có role **+employee** và **+employer** ở hai đầu, cùng multiplicity **1..\\*** và **0..\\***.\n\nCách đọc theo chuẩn UML (slide chỉ đưa hình): số ghi ở một đầu cho biết **một object ở đầu bên kia** nối với bao nhiêu object ở đầu này. Vậy một Company có **1..\\*** Person, một Person làm cho **0..\\*** Company.\n\nCác giá trị hay gặp: `1` (đúng một), `0..1` (không hoặc một), `0..*` hay `*` (bao nhiêu cũng được), `1..*` (ít nhất một).","en":"**Multiplicity**: **how many objects** may be connected across an association. In the example, the association **works for** has the roles **+employee** and **+employer** at its ends, with multiplicities **1..\\*** and **0..\\***.\n\nReading it the standard UML way (the slide only shows the figure): the number at one end says how many objects at that end **one object at the other end** links to. So a Company has **1..\\*** Persons, and a Person works for **0..\\*** Companies.\n\nCommon values: `1` (exactly one), `0..1` (zero or one), `0..*` or `*` (any number), `1..*` (at least one).","fig":"multiplicity"},{"src":"07#14","vi":"Hai dạng association đặc biệt, phân biệt bằng **quyền sở hữu**:\n\n| | **Composition** | **Aggregation** |\n|---|---|---|\n| Độ mạnh | **Strong** association | **Weak** association |\n| Ý nghĩa | Class này **sở hữu** class kia và **chịu trách nhiệm vòng đời** của nó | Class này **dùng** class kia nhưng **không sở hữu** |\n| Ví dụ | **University ◆— Faculty**: xoá trường thì khoa mất theo | **Faculty ◇— Lecturer**: khoa đóng cửa, giảng viên vẫn còn |\n| Ký hiệu | Hình thoi **đặc** ở phía sở hữu | Hình thoi **rỗng** ở phía chứa |","en":"Two special associations, told apart by **ownership**:\n\n| | **Composition** | **Aggregation** |\n|---|---|---|\n| Strength | **Strong** association | **Weak** association |\n| Meaning | One class **owns** the other and **is responsible for its lifetime** | One class **uses** the other but **does not own it** |\n| Example | **University ◆— Faculty**: delete the university and its faculties go too | **Faculty ◇— Lecturer**: close the faculty and the lecturers remain |\n| Notation | **Filled** diamond at the owner | **Hollow** diamond at the whole |"},{"src":"07#15","vi":"Ví dụ **class diagram \"Online Shop\"** trên slide gom đủ các ký hiệu:\n- **Customer 1 — 0..\\* Order**: association có multiplicity.\n- **Order ◇— OrderDetail** (1 — 1..\\*, role name **line item**): aggregation.\n- **OrderDetail → Item** (0..\\* — 1): association có **navigability** (mũi tên chỉ chiều đi được).\n- **Payment** là **abstract class** (tên in nghiêng); **Credit, Cash, Check** là subclass qua **generalization**.\n- Order có attribute `date, status` và operation `calcTax, calcTotal, calcTotalWeight`.","en":"The slide's **\"Online Shop\" class diagram** uses every notation:\n- **Customer 1 — 0..\\* Order**: an association with multiplicity.\n- **Order ◇— OrderDetail** (1 — 1..\\*, role name **line item**): aggregation.\n- **OrderDetail → Item** (0..\\* — 1): an association with **navigability** (the arrow shows which way you can navigate).\n- **Payment** is an **abstract class** (italic name); **Credit, Cash, Check** are subclasses via **generalization**.\n- Order has attributes `date, status` and operations `calcTax, calcTotal, calcTotalWeight`."}]},{"id":"7.3","t":{"vi":"Từ requirement đến class: domain object & BCE","en":"From requirements to classes: domain objects & BCE"},"cards":[{"src":"07#17","vi":"**2 loại object:**\n\n| **Domain object** | **System object** |\n|---|---|\n| **Thực thể ngoài đời thật** | **Thực thể được tạo ra** cho phần mềm |\n| **Tham gia quy trình nghiệp vụ** | **Hỗ trợ xử lý và tính toán** |\n| **Có dữ liệu cần lưu** | |","en":"**Two types of object:**\n\n| **Domain object** | **System object** |\n|---|---|\n| **Real-world entity** | **Created entity** |\n| **Takes a role in the business process** | **Supports processing and calculations** |\n| **Has stored data** | |"},{"src":"07#18","vi":"**Boundary – Control – Entity (BCE)** phân object theo vai trò:\n- **«boundary»**: giao diện giữa **actor và hệ thống**: màn hình, form, **API endpoint**. Ví dụ `RegistrationUI`.\n- **«control»**: **điều phối các bước của một use case**. Ví dụ `RegistrationController` cho \"Register for a course\".\n- **«entity»**: **dữ liệu và luật nghiệp vụ sống lâu**, lấy từ domain model. Ví dụ `Course`, `Enrollment`.\n\n**Quy tắc:**\n- Boundary và control là **system object**; entity là **domain object**.\n- **Actor chỉ nói chuyện với boundary**; **entity không bao giờ gọi boundary**.\n- BCE khớp với **layered architecture**: presentation → business → data.","en":"**Boundary – Control – Entity (BCE)** groups objects by role:\n- **«boundary»**: the interface between **actors and the system**: screens, forms, **API endpoints**. E.g. `RegistrationUI`.\n- **«control»**: **coordinates the steps of one use case**. E.g. `RegistrationController` for \"Register for a course\".\n- **«entity»**: **long-lived business data and rules** from the domain model. E.g. `Course`, `Enrollment`.\n\n**Rules of thumb:**\n- Boundary and control are **system objects**; entities are **domain objects**.\n- **Actors talk only to boundaries**; **entities never call boundaries**.\n- BCE maps to a **layered architecture**: presentation → business → data.","fig":"bce"},{"src":"07#19-20","vi":"**Bước 1: Xác định domain class.** Nguồn là **domain model** của requirement.\n- **Ứng viên class = các danh từ** trong use case specification và user story. Nếu nhóm có **conceptual ERD** thì nó cho ra cùng các entity.\n- **Mỗi domain entity → một entity class**: thuộc tính → **attribute**, quan hệ → **association**.\n- **Chỉ giữ** class có **lưu dữ liệu** hoặc **có vai trò trong quy trình nghiệp vụ**. Bỏ class **trùng**, từ **mơ hồ**, và **attribute đội lốt class**.\n\nVí dụ **\"Shipping System\"**: ERD có CREW, CAPTAIN, VESSEL, SOTL, REGION, nên ra các domain class **Vessel, VesselType, Region, Crew, Captain**.","en":"**Step 1: identify domain classes.** The source is the requirements' **domain model**.\n- **Candidate classes = nouns** in use case specifications and user stories. A **conceptual ERD**, if the team has one, gives the same entities.\n- **Each domain entity → one entity class**: properties → **attributes**, relationships → **associations**.\n- **Keep only** classes that **store data** or **play a role in the business process**. Remove **duplicates**, **vague words** and **attributes disguised as classes**.\n\nExample **\"Shipping System\"**: the ERD has CREW, CAPTAIN, VESSEL, SOTL and REGION, giving the domain classes **Vessel, VesselType, Region, Crew, Captain**."},{"src":"07#19","vi":"Áp dụng cho BadminBookingHub: các danh từ trong use case đặt sân như **Player, Court, Booking, Deposit, Time slot** là ứng viên class. \"Booking status\" nghe như danh từ nhưng thực ra là **attribute** của Booking, nên không tách thành class riêng.","en":"Applied to BadminBookingHub: nouns from the booking use cases such as **Player, Court, Booking, Deposit, Time slot** are candidate classes. \"Booking status\" sounds like a noun but is really an **attribute** of Booking, so it does not become its own class.","real":true}]},{"id":"7.4","t":{"vi":"Sequence diagram & state machine","en":"Sequence diagrams & state machines"},"cards":[{"src":"07#21-22","vi":"**Bước 2: Xác định system object.** Nguồn là **use case specification** (flow of events).\n- **Mỗi bước trong \"kịch bản\" phải do một object thực hiện.** Khi không domain object nào làm được thì tạo **boundary** hoặc **control** object.\n- Vẽ **sequence diagram cho mỗi scenario quan trọng**: **lifeline** cho thấy các object, **message** cho thấy operation của chúng.\n\n**Sequence diagram** thể hiện object **tương tác theo thời gian** để thực hiện một scenario. Thành phần:\n\n| Thành phần | Ý nghĩa |\n|---|---|\n| **Lifeline** | Người tham gia: actor, boundary, controller, entity object |\n| **Message** | **Synchronous call**, **asynchronous message**, **return** |\n| **Activation bar** | Khoảng thời gian object **đang thực thi** |\n| **Combined fragment** | **alt** (if/else), **opt** (if), **loop**, **par** |\n\nCách vẽ: lấy **một luồng** từ use case spec, **một sơ đồ cho mỗi scenario quan trọng**; **mỗi message phải thành một operation** trong class diagram.","en":"**Step 2: identify system objects.** The source is the **use case specification** (flows of events).\n- **Every step in the \"screenplay\" must be performed by some object.** Create **boundary** and **control** objects when no domain object can do it.\n- Draw a **sequence diagram for each important scenario**: **lifelines** reveal the objects, **messages** reveal their operations.\n\nA **sequence diagram** shows how objects **interact over time** to realize one scenario. Main elements:\n\n| Element | Meaning |\n|---|---|\n| **Lifeline** | A participant: actor, boundary, controller, entity object |\n| **Message** | **Synchronous call**, **asynchronous message**, **return** |\n| **Activation bar** | When an object is **executing** |\n| **Combined fragment** | **alt** (if/else), **opt** (if), **loop**, **par** |\n\nHow to draw: take **one flow** from the use case spec, **one diagram per important scenario**; **every message should become an operation** in the class diagram."},{"src":"07#23","vi":"Ví dụ use case **\"Register for a course\"**, luồng chính và một luồng phụ:\n1. Student chọn môn, bấm Register trên **RegistrationUI**.\n2. UI gọi `register(studentId, courseId)` trên **RegistrationController**.\n3. Controller hỏi **Course** `hasFreeSeat()`, nhận về true/false.\n4. Khung **alt**: **[seat available]** → tạo **Enrollment** bằng `create(studentId, courseId)` và trả *success*; **[course full]** → trả `error(\"Course is full\")`.\n\nCông cụ: **PlantUML, Mermaid, draw.io, StarUML**. Sơ đồ dạng **diagrams-as-code** lưu được **trong Git**.","en":"Example use case **\"Register for a course\"**, basic flow and one alternative flow:\n1. The Student selects a course and clicks Register on **RegistrationUI**.\n2. The UI calls `register(studentId, courseId)` on **RegistrationController**.\n3. The controller asks **Course** `hasFreeSeat()` and gets true/false.\n4. **alt** frame: **[seat available]** → create an **Enrollment** with `create(studentId, courseId)` and return *success*; **[course full]** → return `error(\"Course is full\")`.\n\nTools: **PlantUML, Mermaid, draw.io, StarUML**. **Diagrams-as-code** can be versioned **in Git**.","fig":"sequence"},{"src":"07#24","vi":"Ví dụ **\"Student Management System\"**, use case **Login**, scenario **Login failed**: giáo viên nhập username/password, phần mềm **mã hoá thông tin** (bước 4) rồi **kiểm tra hợp lệ** (bước 5), cuối cùng báo sai username/password.\n\nHai bước này **không domain object nào làm**, nên sinh ra **system object**:\n\n| Bước | Object | Loại |\n|---|---|---|\n| 4 | **Encryptor** | System |\n| 5 | **LoginAccount** | System |","en":"Example **\"Student Management System\"**, use case **Login**, scenario **Login failed**: the teacher enters a username and password, the software **encrypts the data** (step 4) and **checks it** (step 5), then reports a wrong username/password.\n\n**No domain object** performs those two steps, so they produce **system objects**:\n\n| Step | Object | Type |\n|---|---|---|\n| 4 | **Encryptor** | System |\n| 5 | **LoginAccount** | System |"},{"src":"07#25","vi":"**Bước 3a: Tinh chỉnh class diagram.** Áp dụng luật hướng đối tượng:\n- **Encapsulation** (luật hộp đen): **giấu dữ liệu, chỉ lộ operation**.\n- Dữ liệu và hành vi dùng chung → **inheritance** (generalization).\n- Cùng operation nhưng dữ liệu hay cách xử lý khác → **polymorphism**.\n\nThêm nữa: **mỗi message trong sequence diagram → một operation** của class; điền đủ **multiplicity, navigability, visibility**; kiểm tra theo nguyên tắc **low coupling, high cohesion**.","en":"**Step 3a: refine the class diagram.** Apply object-oriented rules:\n- **Encapsulation** (black-box rule): **hide data, expose operations**.\n- Shared data and behaviour → **inheritance** (generalization).\n- Same operation, different data or processing → **polymorphism**.\n\nAlso: **every message in the sequence diagrams → an operation** of a class; complete **multiplicities, navigability and visibility**; check against **low coupling, high cohesion**."},{"src":"07#26","vi":"**Bước 3b: Mô hình hoá object có vòng đời.** Object có **trường trạng thái** (order, booking, account) thì vẽ **state machine diagram**.\n- Thành phần: **state**, **transition** dạng `event [guard] / action`, **trạng thái đầu** và **trạng thái cuối**.\n- Ví dụ **Order**: Created —pay→ Paid —ship→ Shipped —deliver→ Delivered; Created —cancel→ Cancelled; Paid —cancel [before shipping] / refund→ Cancelled.\n\n**Nó giúp class diagram thế nào:**\n- **Mỗi event → một operation** của class: `pay()`, `ship()`, `deliver()`, `cancel()`.\n- **Lộ ra transition còn thiếu và operation không hợp lệ**, ví dụ giao một đơn đã huỷ.","en":"**Step 3b: model objects with a life cycle.** Objects with a **status field** (order, booking, account) get a **state machine diagram**.\n- Elements: **states**, **transitions** written `event [guard] / action`, **initial and final states**.\n- Example **Order**: Created —pay→ Paid —ship→ Shipped —deliver→ Delivered; Created —cancel→ Cancelled; Paid —cancel [before shipping] / refund→ Cancelled.\n\n**What it refines in the class diagram:**\n- **Each event → an operation** of the class: `pay()`, `ship()`, `deliver()`, `cancel()`.\n- **Reveals missing transitions and invalid operations**, e.g. shipping a cancelled order.","fig":"order-state"}]},{"id":"7.5","t":{"vi":"Coupling, cohesion & SOLID","en":"Coupling, cohesion & SOLID"},"cards":[{"src":"07#28","vi":"| | Định nghĩa | Mục tiêu |\n|---|---|---|\n| **Coupling** | Một module **phụ thuộc mạnh tới mức nào** vào module khác | **Low coupling**: phụ thuộc vào **interface**, truyền dữ liệu **tường minh**, tránh **trạng thái toàn cục dùng chung** |\n| **Cohesion** | Các trách nhiệm **bên trong một module** gắn bó với nhau tới mức nào | **High cohesion**: **một module = một trách nhiệm rõ ràng** |\n\n**Nguyên tắc khác:**\n- **Encapsulation / information hiding**: giấu chi tiết bên trong sau một interface.\n- **DRY** (Don't Repeat Yourself) · **KISS** (Keep It Simple) · **YAGNI** (You Aren't Gonna Need It).\n\n**Low coupling + high cohesion → dễ sửa, dễ test, dễ dùng lại.**","en":"| | Definition | Aim |\n|---|---|---|\n| **Coupling** | **How strongly** one module depends on others | **Low coupling**: depend on **interfaces**, pass data **explicitly**, avoid **shared global state** |\n| **Cohesion** | How closely the responsibilities **inside one module** belong together | **High cohesion**: **one module = one clear responsibility** |\n\n**Other principles:**\n- **Encapsulation / information hiding**: hide internal details behind an interface.\n- **DRY** (Don't Repeat Yourself) · **KISS** (Keep It Simple) · **YAGNI** (You Aren't Gonna Need It).\n\n**Low coupling + high cohesion → easier to change, test and reuse.**"},{"src":"07#29","vi":"**SOLID**: 5 nguyên tắc thiết kế class.\n\n| Nguyên tắc | Ý nghĩa | Dấu hiệu khi vi phạm |\n|---|---|---|\n| **S · Single Responsibility** | Một class chỉ có **một lý do để thay đổi** | **\"God class\"** làm mọi thứ |\n| **O · Open/Closed** | **Mở để mở rộng, đóng để sửa đổi** | Thêm một loại mới là phải **sửa một switch lớn** |\n| **L · Liskov Substitution** | **Subtype thay được cho base type** | Subclass ném lỗi **\"not supported\"** |\n| **I · Interface Segregation** | **Nhiều interface nhỏ** tốt hơn một interface lớn | Class phải cài **method rỗng** |\n| **D · Dependency Inversion** | **Phụ thuộc vào abstraction**, không vào class cụ thể | Business logic **tự tạo object database** |","en":"**SOLID**: five class design principles.\n\n| Principle | Meaning | Symptom when violated |\n|---|---|---|\n| **S · Single Responsibility** | A class has **one reason to change** | A **\"God class\"** that does everything |\n| **O · Open/Closed** | **Open for extension, closed for modification** | Adding a type means **editing a big switch** |\n| **L · Liskov Substitution** | **Subtypes can replace their base type** | A subclass throws **\"not supported\"** |\n| **I · Interface Segregation** | **Many small interfaces** over one large one | Classes implement **empty methods** |\n| **D · Dependency Inversion** | **Depend on abstractions**, not concrete classes | Business logic **creates DB objects directly** |"}]},{"id":"7.6","t":{"vi":"Design pattern","en":"Design patterns"},"cards":[{"src":"07#30-31","vi":"**Design pattern** = **giải pháp đã được chứng minh** cho **một bài toán hay gặp**. Phân loại theo **mục đích** (Creational, Structural, Behavioral) và **phạm vi** (class hay object).\n\n**Danh mục GoF:**\n\n| Nhóm | Trả lời câu hỏi | Pattern |\n|---|---|---|\n| **Creational** | **Object được tạo ra thế nào?** | Factory Method, Abstract Factory, Builder, Prototype, Singleton (+ Object Pool) |\n| **Structural** | **Class và object được ghép lại thế nào?** | Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy |\n| **Behavioral** | **Object tương tác và chia trách nhiệm thế nào?** | Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method (+ Null Object) |\n\nLời khuyên trên slide: **nắm mục đích của từng nhóm**, học kỹ vài pattern thay vì thuộc hết tên.","en":"A **design pattern** = a **proven solution** to a **common problem**. Patterns are grouped by **purpose** (Creational, Structural, Behavioral) and by **scope** (classes or objects).\n\n**The GoF catalog:**\n\n| Purpose | Question it answers | Patterns |\n|---|---|---|\n| **Creational** | **How are objects created?** | Factory Method, Abstract Factory, Builder, Prototype, Singleton (+ Object Pool) |\n| **Structural** | **How are classes and objects composed?** | Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy |\n| **Behavioral** | **How do objects interact and share responsibilities?** | Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method (+ Null Object) |\n\nThe slide's advice: **know the purpose of each group** and learn a few patterns well rather than memorizing every name."},{"src":"07#32","vi":"**Pattern nào cho bài toán nào:**\n\n| Bài toán trong dự án | Pattern |\n|---|---|\n| Nhiều luật giá/giảm giá khác nhau cho vé | **Strategy** |\n| Tạo đúng object phương thức thanh toán (thẻ, ví điện tử, chuyển khoản) | **Factory Method** |\n| Báo email, SMS và app khi booking thay đổi | **Observer** |\n| Dùng API bên thứ ba có interface khác | **Adapter** |\n| Một lối vào đơn giản cho một subsystem phức tạp | **Facade** |\n| Một object cấu hình dùng chung | **Singleton** (cẩn thận: **khó test**) |\n\n**Pattern là từ vựng, không phải mục tiêu**: chỉ dùng khi bài toán thật sự xuất hiện.","en":"**Which pattern for which problem:**\n\n| Problem in a project | Pattern |\n|---|---|\n| Different pricing/discount rules for tickets | **Strategy** |\n| Create the right payment method object (card, e-wallet, bank transfer) | **Factory Method** |\n| Notify email, SMS and app when a booking changes | **Observer** |\n| Use a third-party API with a different interface | **Adapter** |\n| A simple entry point to a complex subsystem | **Facade** |\n| One shared configuration object | **Singleton** (use carefully: **hurts testability**) |\n\n**Patterns are a vocabulary, not a goal**: apply one only when the problem appears."},{"src":"07#33","vi":"**Ví dụ Strategy pattern**\n- **Bài toán:** giá vé phụ thuộc loại khách: sinh viên, người cao tuổi, thành viên… nên trong `Booking` có chuỗi **if/else ngày càng dài**.\n- **Giải pháp:** interface **`PricingStrategy`** có `calculate(basePrice)`; các class `StudentPricing`, `SeniorPricing`, `MemberPricing` cài interface đó; `Booking` **giữ một `PricingStrategy`** và gọi `calculate()`.\n- **Lợi ích:** luật mới = **class mới**, **không sửa `Booking`** (đúng **Open/Closed**); từng luật **unit test riêng** được.","en":"**Example: the Strategy pattern**\n- **Problem:** ticket price depends on the customer type: student, senior, member… giving a **growing if/else chain** inside `Booking`.\n- **Solution:** an interface **`PricingStrategy`** with `calculate(basePrice)`; `StudentPricing`, `SeniorPricing`, `MemberPricing` implement it; `Booking` **holds a `PricingStrategy`** and calls `calculate()`.\n- **Benefits:** a new rule = **a new class**, **`Booking` is not changed** (**Open/Closed**); each rule can be **unit-tested on its own**."},{"src":"07#32-33","vi":"BadminBookingHub có giá sân khác nhau theo **giờ cao điểm**, ngày thường hay cuối tuần: đúng chỗ dùng **Strategy**. Còn việc báo cho Player và Staff khi một booking bị huỷ là bài toán của **Observer**.","en":"BadminBookingHub prices courts differently for **peak hours**, weekdays and weekends: a natural fit for **Strategy**. Notifying the Player and Staff when a booking is cancelled is an **Observer** problem.","real":true}]},{"id":"7.7","t":{"vi":"Thiết kế dữ liệu","en":"Data design"},"cards":[{"src":"07#35","vi":"**Chọn nơi lưu dữ liệu:**\n\n| | **File system** | **Database system** |\n|---|---|---|\n| Cách lưu | Lưu trong **file**, **tự tổ chức** cấu trúc file | Lưu trong **bảng**, dùng **DBMS** |\n| ✔ | **Đơn giản, nhanh** | **Quản lý dữ liệu lớn hiệu quả** |\n| ✘ | **Khó quản lý dữ liệu lớn** | **Phức tạp hơn** để cài đặt và quản trị |\n\nLựa chọn khác: **NoSQL** (document, key-value, graph) cho **schema linh hoạt** hoặc **quy mô cực lớn**.","en":"**Choosing data storage:**\n\n| | **File system** | **Database system** |\n|---|---|---|\n| How | Data in **files**, **self-organized** file structures | Data in **tables**, managed by a **DBMS** |\n| ✔ | **Simple, fast** | **Manages large data efficiently** |\n| ✘ | **Hard to manage large data** | **More complex** to set up and administer |\n\nOther option: **NoSQL** (document, key-value, graph) for **flexible schemas** or **massive scale**."},{"src":"07#36-37","vi":"**Ánh xạ design class sang nơi lưu:** mỗi **persistent (entity) class → một đơn vị lưu**: **một file** (file system) hoặc **một bảng** (database). Attribute → **field/column**; **object identity → primary key**; association → **foreign key** hoặc **junction table**.\n\n| Phần tử class diagram | Thiết kế quan hệ | Ví dụ |\n|---|---|---|\n| **Entity class** | **Bảng**; attribute → cột; thêm **primary key** | Student → `student(id PK, name, dob)` |\n| **Association 1 – n** | **Foreign key ở phía \"n\"** | Class 1 – n Student → `student.class_id FK` |\n| **Association n – n** | **Junction table** có 2 foreign key | `enrollment(student_id, course_id)` |\n| **Attribute của liên kết** (association class) | **Cột thêm trong junction table** | `enrollment.grade`, `enrollment.date` |\n| **Composition** | **FK NOT NULL + ON DELETE CASCADE** | Order ◆— OrderLine |\n| **Generalization** | **Một bảng cho cả cây, mỗi class một bảng, hoặc mỗi class cụ thể một bảng** | Person → Student, Lecturer |","en":"**Mapping design classes to storage:** each **persistent (entity) class → one storage unit**: **one file** (file system) or **one table** (database). Attributes → **fields/columns**; **object identity → primary key**; associations → **foreign keys** or **junction tables**.\n\n| Class diagram element | Relational design | Example |\n|---|---|---|\n| **Entity class** | A **table**; attributes → columns; add a **primary key** | Student → `student(id PK, name, dob)` |\n| **1 – n association** | **Foreign key on the \"many\" side** | Class 1 – n Student → `student.class_id FK` |\n| **n – n association** | **Junction table** with two foreign keys | `enrollment(student_id, course_id)` |\n| **Attributes of a link** (association class) | **Extra columns in the junction table** | `enrollment.grade`, `enrollment.date` |\n| **Composition** | **FK NOT NULL + ON DELETE CASCADE** | Order ◆— OrderLine |\n| **Generalization** | **One table per hierarchy, per class, or per concrete class** | Person → Student, Lecturer |"},{"src":"07#38-39","vi":"**Data specification** mô tả dữ liệu: với **file system** thì mô tả **định dạng file**; với **database** thì mô tả **các trường của bảng**.\n\nVí dụ đặc tả **bảng Student** gồm các cột: **#, Fields, Constraints, Descriptions**.\n\n| # | Field | Constraint | Mô tả |\n|---|---|---|---|\n| 1 | ma_hocsinh | **Khoá chính**, định dạng YYCCCXX (năm học, lớp, số thứ tự) | Mã học sinh |\n| 2 | ho_hocsinh | Chuỗi(100) | Họ và tên lót |\n| 3 | ten_hocsinh | Chuỗi(10) | Tên |\n| 4 | ngay_sinh | Ngày, dd-MM-yyyy, > 01-01-1995 | Ngày sinh |\n| 5 | dia_chi | Chuỗi(500) | Địa chỉ thường trú |","en":"A **data specification** describes the data: the **file format** for a file system, or the **table fields** for a database.\n\nThe example spec of the **Student table** has the columns **#, Fields, Constraints, Descriptions**.\n\n| # | Field | Constraint | Description |\n|---|---|---|---|\n| 1 | ma_hocsinh | **Primary key**, format YYCCCXX (school year, class, number) | Student ID |\n| 2 | ho_hocsinh | String(100) | Family and middle name |\n| 3 | ten_hocsinh | String(10) | Given name |\n| 4 | ngay_sinh | Date, dd-MM-yyyy, > 01-01-1995 | Date of birth |\n| 5 | dia_chi | String(500) | Home address |"},{"src":"07#40","vi":"**Checklist thiết kế CSDL quan hệ:**\n- Mọi bảng có **primary key**; quan hệ dùng **foreign key**.\n- **Chuẩn hoá tới 3NF** để tránh dư thừa và **update anomaly**; chỉ **denormalize** khi **đã chứng minh** cần cho hiệu năng.\n- Chọn **đúng kiểu dữ liệu**; dùng ràng buộc **NOT NULL, UNIQUE, CHECK**.\n- Thêm **index** cho cột hay tìm kiếm và join.\n- **Đặt tên nhất quán**, ví dụ snake_case, tên bảng số ít.\n- **Lưu mật khẩu dạng hash**; thu thập ít và bảo vệ **dữ liệu cá nhân**.\n- Quản lý thay đổi schema bằng **migration script trong Git**.","en":"**Relational database design checklist:**\n- Every table has a **primary key**; relationships use **foreign keys**.\n- **Normalize to 3NF** to avoid redundancy and **update anomalies**; **denormalize** only for **proven** performance needs.\n- Choose **correct data types**; use **NOT NULL, UNIQUE and CHECK** constraints.\n- Add **indexes** for frequent search and join columns.\n- **Consistent naming**, e.g. snake_case, singular table names.\n- **Store passwords as hashes**; minimize and protect **personal data**.\n- Manage schema changes with **migration scripts in Git**."}]}]},"checks":{"1.1":[{"id":"c1.1-1","w":1,"lv":"1.1","q":"According to the lecture, software is:","o":["Computer programs and associated documentation","Only the executable code of a system","Only the source code and its test cases","The hardware together with its drivers"],"a":0,"vi":"Software = chương trình + tài liệu đi kèm (requirements, design models, user manuals).","en":"Software = programs + associated documentation (requirements, design models, user manuals).","src":"01#3"},{"id":"c1.1-2","w":1,"lv":"1.1","q":"A product built to be sold to a range of different customers is:","o":["Generic software","Custom software","Embedded software","Configured software"],"a":0,"vi":"Generic: bán cho nhiều khách. Custom: một khách, theo spec của họ.","en":"Generic: sold to many customers. Custom: one customer, to their spec.","src":"01#3"},{"id":"c1.1-3","w":1,"lv":"1.1","q":"Which is NOT one of the ways software can be created listed in the lecture?","o":["Buying more hardware","Developing new programs","Configuring generic software systems","Reusing existing software"],"a":0,"vi":"3 cách: viết mới, cấu hình hệ thống generic, tái sử dụng phần mềm có sẵn.","en":"Three ways: develop new programs, configure generic systems, reuse existing software.","src":"01#4"},{"id":"c1.1-4","w":1,"lv":"1.1","q":"Which attribute means software \"must be understandable, usable and compatible with other systems\"?","o":["Acceptability","Efficiency","Maintainability","Dependability"],"a":0,"vi":"Acceptability: được người dùng chấp nhận, dễ hiểu, dễ dùng, tương thích.","en":"Acceptability: accepted by users; understandable, usable, compatible.","src":"01#7"},{"id":"c1.1-5","w":1,"lv":"1.1","q":"\"Software should not make wasteful use of system resources\" describes:","o":["Efficiency","Reliability","Acceptability","Maintainability"],"a":0,"vi":"Efficiency: không lãng phí tài nguyên hệ thống.","en":"Efficiency: no wasteful use of system resources.","src":"01#7"}],"1.2":[{"id":"c1.2-1","w":1,"lv":"1.2","q":"Boehm's 1981 chart shows that over time:","o":["Software takes a growing share of total system cost","Hardware takes a growing share of total system cost","Software and hardware costs stay equal","Testing costs disappear"],"a":0,"vi":"Từ 1955 đến 1985, phần chi phí cho phần mềm tăng, phần cứng giảm.","en":"From 1955 to 1985 the software share grows and hardware shrinks.","src":"01#8"},{"id":"c1.2-2","w":1,"lv":"1.2","q":"For systems with a long life, maintenance costs:","o":["May be several times development costs","Are always lower than development costs","Are about 10% of development costs","Only apply to generic software"],"a":0,"vi":"Hệ thống sống lâu: chi phí bảo trì có thể gấp nhiều lần chi phí phát triển.","en":"Long-lived systems: maintenance may cost several times development.","src":"01#9"},{"id":"c1.2-3","w":1,"lv":"1.2","q":"Roughly what share of software engineering costs is testing?","o":["40%","60%","20%","10%"],"a":0,"vi":"Khoảng 60% development, 40% testing.","en":"Roughly 60% development, 40% testing.","src":"01#15"},{"id":"c1.2-4","w":1,"lv":"1.2","q":"For custom software, which costs often exceed development costs?","o":["Evolution costs","Hardware costs","Licensing costs","Training costs"],"a":0,"vi":"Với custom software, chi phí evolution thường vượt chi phí phát triển.","en":"For custom software, evolution costs often exceed development costs.","src":"01#15"}],"1.3":[{"id":"c1.3-1","w":1,"lv":"1.3","q":"In the CHAOS Report 2020, what share of IT projects failed?","o":["19%","35%","46%","60%"],"a":0,"vi":"CHAOS 2020: 35% successful, 46% challenged, 19% failed.","en":"CHAOS 2020: 35% successful, 46% challenged, 19% failed.","src":"01#11"},{"id":"c1.3-2","w":1,"lv":"1.3","q":"Which is one of the four goals of software engineering?","o":["On time","Using the newest framework","Writing the most lines of code","Avoiding all documentation"],"a":0,"vi":"4 mục tiêu: cost effective, on time, high quality, satisfying customer's needs.","en":"Goals: cost effective, on time, high quality, satisfying customer's needs.","src":"01#12"},{"id":"c1.3-3","w":1,"lv":"1.3","q":"Computer science is mainly concerned with:","o":["Theory and fundamentals","The practicalities of delivering useful software","Hardware, software and process engineering","Managing project budgets"],"a":0,"vi":"CS: lý thuyết và nền tảng. SE: thực tiễn làm và giao phần mềm.","en":"CS: theory and fundamentals. SE: practicalities of delivering software.","src":"01#13"},{"id":"c1.3-4","w":1,"lv":"1.3","q":"How does software engineering relate to system engineering?","o":["SE is the part of system engineering concerned with developing software","System engineering is a part of SE","They are two names for the same discipline","System engineering only covers hardware"],"a":0,"vi":"System engineering bao gồm hardware, software, process; SE là phần lo phần mềm.","en":"System engineering covers hardware, software and process; SE is its software part.","src":"01#14"}],"1.4":[{"id":"c1.4-1","w":1,"lv":"1.4","q":"\"Applying AI to SE methods, practices and tools\" is one direction of:","o":["Intelligent Software Engineering","Low-code development","DevOps","Continuous Delivery"],"a":0,"vi":"Intelligent SE có 2 chiều: AI cho SE và SE cho hệ thống có AI.","en":"Intelligent SE runs both ways: AI for SE, and SE for AI-enabled systems.","src":"01#19"},{"id":"c1.4-2","w":1,"lv":"1.4","q":"Wix, Shopify and Webflow are examples of:","o":["Low-code / no-code platforms","CI/CD servers","AI coding agents","Process models"],"a":0,"vi":"Low-code/no-code: tạo ứng dụng với rất ít code.","en":"Low-code/no-code: create apps with minimal coding.","src":"01#20"},{"id":"c1.4-3","w":1,"lv":"1.4","q":"Continuous Delivery/Deployment means code is:","o":["Automatically built, tested and prepared for release to production","Integrated by hand once per release","Written by AI agents only","Deployed without any testing"],"a":0,"vi":"CD: tự động build, test, chuẩn bị release. CI: tích hợp code tự động và thường xuyên.","en":"CD: automatically built, tested, prepared for release. CI: frequent automatic integration.","src":"01#21"},{"id":"c1.4-4","w":1,"lv":"1.4","q":"An AI agent, as opposed to an assistant:","o":["Receives a goal, plans steps, uses tools, observes results and iterates","Only completes the current line of code","Replaces the need for any testing","Is accountable for the system's ethics"],"a":0,"vi":"Agent tự lập kế hoạch và dùng công cụ; kỹ sư vẫn chịu trách nhiệm.","en":"Agents plan and use tools; engineers remain accountable.","src":"01#22"},{"id":"c1.4-5","w":1,"lv":"1.4","q":"Which is listed as a risk of using AI agents in software engineering?","o":["Plausible-but-wrong code","Faster typing","Clearer requirements","Better test oracles"],"a":0,"vi":"Rủi ro: code trông đúng nhưng sai, lỗ hổng bảo mật, licence/IP, lộ dữ liệu mật.","en":"Risks: plausible-but-wrong code, security flaws, licence/IP, data leaks.","src":"01#23"},{"id":"c1.4-6","w":1,"lv":"1.4","q":"In CI/CD, \"CI\" and \"CD\" stand for:","o":["Continuous Integration / Continuous Delivery or Deployment","Code Inspection / Code Deployment","Continuous Improvement / Continuous Design","Component Integration / Configuration Delivery"],"a":0,"vi":"CI = Continuous Integration (tích hợp code thay đổi tự động, thường xuyên) · CD = Continuous Delivery/Deployment.","en":"CI = Continuous Integration (automatically and frequently integrating code changes) · CD = Continuous Delivery/Deployment.","src":"01#21","ng":1},{"id":"c1.4-7","w":1,"lv":"1.4","q":"The word \"DevOps\" combines:","o":["Development + Operations","Developer + Optimization","Design + Operations","Deployment + Observability"],"a":0,"vi":"DevOps = Development + Operations: văn hoá, thực hành và công cụ giúp rút ngắn vòng đời phát triển.","en":"DevOps = Development + Operations: culture, practices and tools that shorten the development lifecycle.","src":"01#21","ng":1}],"1.5":[{"id":"c1.5-1","w":1,"lv":"1.5","q":"Which activity produces the software system itself?","o":["Development","Specification","Validation","Evolution"],"a":0,"vi":"Specification: làm gì · Development: sản xuất · Validation: đúng ý khách · Evolution: thay đổi.","en":"Specification: what · Development: produce · Validation: what customer wants · Evolution: change.","src":"01#26"},{"id":"c1.5-2","w":1,"lv":"1.5","q":"Changing the software in response to changing demands is:","o":["Evolution","Validation","Development","Specification"],"a":0,"vi":"Evolution: thay đổi phần mềm theo nhu cầu mới.","en":"Evolution: changing software for changing demands.","src":"01#26"},{"id":"c1.5-3","w":1,"lv":"1.5","q":"The data-flow perspective of a process model shows:","o":["Information flow","Sequence of activities","Who does what","Cost of each activity"],"a":0,"vi":"Workflow: trình tự · Data-flow: luồng thông tin · Role/action: ai làm gì.","en":"Workflow: sequence · Data-flow: information · Role/action: who does what.","src":"01#27"},{"id":"c1.5-4","w":1,"lv":"1.5","q":"Which is NOT a generic process model in lecture 01?","o":["Scrum","Waterfall","Iterative development","Component-based software engineering"],"a":0,"vi":"Generic process models: Waterfall, Iterative development, Component-based SE.","en":"Generic process models: Waterfall, Iterative development, Component-based SE.","src":"01#28"},{"id":"c1.5-5","w":1,"lv":"1.5","q":"SDLC stands for:","o":["Software Development Life Cycle","System Design and Lifecycle Control","Software Delivery and Launch Checklist","Structured Development Life Chart"],"a":0,"vi":"SDLC = Software Development Life Cycle, tên khác của software process.","en":"SDLC = Software Development Life Cycle, another name for the software process.","src":"01#25","ng":1}],"1.6":[{"id":"c1.6-1","w":1,"lv":"1.6","q":"Which statement about ethics matches the lecture?","o":["Ethical behavior is more than simply upholding the law","Ethics only means obeying the law","Ethics is the client's concern, not the engineer's","Technical skill is the only responsibility"],"a":0,"vi":"Hành vi đạo đức không chỉ là tuân thủ pháp luật.","en":"Ethical behavior is more than simply upholding the law.","src":"01#30"},{"id":"c1.6-2","w":1,"lv":"1.6","q":"Respecting the secrets of your employer or client is the issue of:","o":["Confidentiality","Competence","Computer misuse","Intellectual property rights"],"a":0,"vi":"Confidentiality: tôn trọng bí mật của chủ và khách.","en":"Confidentiality: respect employers' and clients' secrets.","src":"01#31"},{"id":"c1.6-3","w":1,"lv":"1.6","q":"Using your technical skills to break into other people's computers violates:","o":["Computer misuse","Competence","Confidentiality","Judgment"],"a":0,"vi":"Computer misuse: không dùng kỹ năng để lạm dụng máy tính người khác.","en":"Computer misuse: never misuse other people's computers.","src":"01#32"},{"id":"c1.6-4","w":1,"lv":"1.6","q":"\"Software engineers shall be fair to and supportive of their colleagues\" is the principle:","o":["COLLEAGUES","PROFESSION","MANAGEMENT","SELF"],"a":0,"vi":"COLLEAGUES: công bằng và hỗ trợ đồng nghiệp.","en":"COLLEAGUES: fair to and supportive of colleagues.","src":"01#36"},{"id":"c1.6-5","w":1,"lv":"1.6","q":"Which principle says engineers shall act consistently with the public interest?","o":["PUBLIC","CLIENT AND EMPLOYER","PRODUCT","JUDGMENT"],"a":0,"vi":"PUBLIC: hành động vì lợi ích cộng đồng.","en":"PUBLIC: act consistently with the public interest.","src":"01#34"}],"2.1":[{"id":"c2.1-1","w":2,"lv":"2.1","q":"Besides activities and their ordering, a process description may also include:","o":["Products, roles, and pre- and post-conditions","Only the source code","Only the project budget","Only the list of customers"],"a":0,"vi":"Process description: hoạt động, thứ tự; có thể thêm products, roles, pre/post-conditions.","en":"Process descriptions: activities, ordering; may add products, roles, pre/post-conditions.","src":"02#3"},{"id":"c2.1-2","w":2,"lv":"2.1","q":"Which is a CURRENT/FUTURE trend in software processes?","o":["Rapid requirements change","Stable requirements","Stand-alone systems","Control over evolution"],"a":0,"vi":"Xu hướng mới: mọi thứ kết nối, requirement đổi nhanh, adaptive process.","en":"Current trends: everything connected, rapid requirements change, adaptive processes.","src":"02#4"},{"id":"c2.1-3","w":2,"lv":"2.1","q":"Which characteristic belongs to agile approaches?","o":["Planning is incremental and relies on tacit knowledge","Progress is measured against a fixed plan","Document-based, heavy process","All activities are planned in advance"],"a":0,"vi":"Agile: kế hoạch dần dần, tacit knowledge, process nhẹ. Plan-driven: theo kế hoạch, tài liệu, process nặng.","en":"Agile: incremental planning, tacit knowledge, light. Plan-driven: plan, documents, heavy.","src":"02#6"},{"id":"c2.1-4","w":2,"lv":"2.1","q":"In the lecture, Spiral is classified as:","o":["Plan-driven","Agile","Neither plan-driven nor agile","A CMMI level"],"a":0,"vi":"Plan-driven: Waterfall, Incremental, Spiral, RUP. Agile: XP, Scrum, Kanban.","en":"Plan-driven: Waterfall, Incremental, Spiral, RUP. Agile: XP, Scrum, Kanban.","src":"02#7"},{"id":"c2.1-5","w":2,"lv":"2.1","q":"In which activity do customers and engineers define the software and its operational constraints?","o":["Software specification","Software development","Software validation","Software evolution"],"a":0,"vi":"Specification: định nghĩa phần mềm và ràng buộc vận hành.","en":"Specification: define the software and its operational constraints.","src":"02#8"}],"2.2":[{"id":"c2.2-1","w":2,"lv":"2.2","q":"Which is a key idea of software process improvement?","o":["Standardize good practices and measure performance","Change the whole process every sprint","Remove all documentation","Hire more testers only"],"a":0,"vi":"Đánh giá process, tìm điểm yếu, chuẩn hoá thực hành tốt, đo hiệu quả, dùng mô hình như CMMI.","en":"Evaluate, find weaknesses, standardize good practices, measure, apply models like CMMI.","src":"02#9"},{"id":"c2.2-2","w":2,"lv":"2.2","q":"Who maintains CMMI today?","o":["The CMMI Institute (ISACA)","Toyota","The Object Management Group","The Scrum Alliance"],"a":0,"vi":"SEI (CMU) phát triển; nay CMMI Institute (ISACA) duy trì, V3.0 (2023).","en":"Developed by SEI (CMU); now maintained by the CMMI Institute (ISACA), V3.0 (2023).","src":"02#10"},{"id":"c2.2-3","w":2,"lv":"2.2","q":"Which CMMI level is \"unpredictable and reactive; work is often delayed and over budget\"?","o":["Level 1 Initial","Level 2 Managed","Level 3 Defined","Level 4 Quantitatively Managed"],"a":0,"vi":"Level 1 Initial: bị động, khó dự đoán, hay trễ và vượt ngân sách.","en":"Level 1 Initial: reactive, unpredictable, often late and over budget.","src":"02#11"},{"id":"c2.2-4","w":2,"lv":"2.2","q":"At which CMMI level do organization-wide standards guide projects, programs and portfolios?","o":["Defined","Managed","Optimizing","Initial"],"a":0,"vi":"Level 3 Defined: chủ động, chuẩn toàn tổ chức.","en":"Level 3 Defined: proactive, organization-wide standards.","src":"02#11"},{"id":"c2.2-5","w":2,"lv":"2.2","q":"Which CMMI level focuses on continuous improvement?","o":["Optimizing","Quantitatively Managed","Defined","Managed"],"a":0,"vi":"Level 5 Optimizing: ổn định, linh hoạt, cải tiến liên tục.","en":"Level 5 Optimizing: stable, flexible, continuous improvement.","src":"02#11"},{"id":"c2.2-6","w":2,"lv":"2.2","q":"CMMI stands for:","o":["Capability Maturity Model Integration","Capability Management Model Improvement","Continuous Maturity Model Integration","Capability Maturity Measurement Index"],"a":0,"vi":"CMMI = Capability Maturity Model Integration.","en":"CMMI = Capability Maturity Model Integration.","src":"02#10","ng":1},{"id":"c2.2-7","w":2,"lv":"2.2","q":"CMMI was originally developed by CMU's SEI. SEI stands for:","o":["Software Engineering Institute","Software Excellence Initiative","Systems Evaluation Institute","Standard Engineering Index"],"a":0,"vi":"SEI = Software Engineering Institute (của CMU). Nay CMMI do CMMI Institute (ISACA) duy trì.","en":"SEI = (CMU's) Software Engineering Institute. CMMI is now maintained by the CMMI Institute (ISACA).","src":"02#10","ng":1}],"2.3":[{"id":"c2.3-1","w":2,"lv":"2.3","q":"Plan-driven methods are also called:","o":["Disciplined or traditional methods","Agile or lean methods","Experimental methods","Tacit methods"],"a":0,"vi":"Plan-driven còn gọi là disciplined hoặc traditional methods.","en":"Plan-driven methods are also called disciplined or traditional methods.","src":"02#13"},{"id":"c2.3-2","w":2,"lv":"2.3","q":"In the waterfall diagram, which stage comes LAST?","o":["Operation and Maintenance","Integration and System Testing","Implementation and Unit Testing","Requirements definition"],"a":0,"vi":"Requirements → Analysis & Design → Implementation & Unit Testing → Integration & System Testing → Operation & Maintenance.","en":"Requirements → Analysis & Design → Implementation & Unit Testing → Integration & System Testing → Operation & Maintenance.","src":"02#14"},{"id":"c2.3-3","w":2,"lv":"2.3","q":"In waterfall, how is a stage judged complete?","o":["A set of criteria is met, checked with checklists","The manager decides on intuition","The customer pays the invoice","The next stage has already started"],"a":0,"vi":"Stage xong khi đạt bộ tiêu chí, kiểm bằng checklist.","en":"A stage is complete when criteria are met, checked with checklists.","src":"02#15"},{"id":"c2.3-4","w":2,"lv":"2.3","q":"Which is a standard outcome of a waterfall stage?","o":["Software architecture document","Sprint Backlog","Kanban board","Burndown chart"],"a":0,"vi":"Đầu ra: requirements docs, architecture doc, code và test cases, test results, user manual, training doc.","en":"Outcomes: requirements docs, architecture doc, code and tests, test results, user manual, training doc.","src":"02#16"},{"id":"c2.3-5","w":2,"lv":"2.3","q":"Why is waterfall difficult to use for most business systems?","o":["Few business systems have stable requirements","It has no documentation","It cannot be used for large projects","It forbids testing"],"a":0,"vi":"Waterfall chỉ hợp khi requirement rõ và ổn định; ít hệ thống kinh doanh như vậy.","en":"Waterfall needs well-understood, stable requirements; few business systems have them.","src":"02#17"},{"id":"c2.3-6","w":2,"lv":"2.3","q":"In the revised waterfall model:","o":["Every later stage has feedback arrows to earlier stages","Stages run in parallel","There is no maintenance stage","Requirements come after design"],"a":0,"vi":"Waterfall revised: mọi stage đều có mũi tên quay lại stage trước.","en":"Revised waterfall: every stage has arrows back to earlier stages.","src":"02#18"}],"2.4":[{"id":"c2.4-1","w":2,"lv":"2.4","q":"Which statement about process iteration is correct?","o":["Iteration can be applied to any of the generic process models","Iteration is only possible in Scrum","Iteration forbids rework","Iteration means doing all stages at once"],"a":0,"vi":"Iteration áp dụng được cho mọi process model chung; làm lại ở vòng sau.","en":"Iteration can be applied to any generic process model; rework in later iterations.","src":"02#19"},{"id":"c2.4-2","w":2,"lv":"2.4","q":"In the incremental model diagram, each build contains:","o":["Analysis & Design → Implementation → Testing","Only implementation","Only testing","Only requirements gathering"],"a":0,"vi":"Mỗi build có Analysis & Design → Implementation → Testing.","en":"Each build has Analysis & Design → Implementation → Testing.","src":"02#20"},{"id":"c2.4-3","w":2,"lv":"2.4","q":"Which is a BENEFIT of the incremental model?","o":["Highest-priority requirements tend to receive the most testing","The process is very visible to managers","System structure never degrades","No prioritization is needed"],"a":0,"vi":"Lợi ích: chức năng sớm, increment đầu như prototype, requirement ưu tiên cao được test nhiều, giảm rủi ro.","en":"Benefits: early functionality, early increments as prototypes, top requirements tested most, lower risk.","src":"02#23"},{"id":"c2.4-4","w":2,"lv":"2.4","q":"Which statement about the spiral model is correct?","o":["Risks are assessed and resolved throughout the process","It has fixed phases like specification and design","It ignores risk until the end","Each spiral is one sprint of 2 weeks"],"a":0,"vi":"Spiral: mỗi vòng là một phase, không có phase cố định, rủi ro xử lý xuyên suốt.","en":"Spiral: each loop is a phase, no fixed phases, risks handled throughout.","src":"02#27"},{"id":"c2.4-5","w":2,"lv":"2.4","q":"Which is a BENEFIT of the spiral model?","o":["Users see the system early","It is cheap and simple","It needs no risk analysis","Time management is easy"],"a":0,"vi":"Lợi ích: nhấn mạnh rủi ro, tốt cho dự án lớn, requirement linh hoạt, người dùng thấy sớm. Nhược: phức tạp, đắt, khó quản lý thời gian.","en":"Benefits: risk focus, large projects, flexible requirements, users see it early. Problems: complex, expensive, hard time management.","src":"02#28-29"}],"2.5":[{"id":"c2.5-1","w":2,"lv":"2.5","q":"In RUP, the Construction phase covers:","o":["System design, programming and testing","Establishing the business case","Deploying to the operating environment","Understanding the problem domain only"],"a":0,"vi":"Inception: business case · Elaboration: domain + kiến trúc · Construction: thiết kế, code, test · Transition: triển khai.","en":"Inception: business case · Elaboration: domain + architecture · Construction: design, code, test · Transition: deploy.","src":"02#33"},{"id":"c2.5-2","w":2,"lv":"2.5","q":"Deploying the system in its operating environment happens in which RUP phase?","o":["Transition","Construction","Elaboration","Inception"],"a":0,"vi":"Transition: triển khai hệ thống vào môi trường vận hành.","en":"Transition: deploy into the operating environment.","src":"02#33"},{"id":"c2.5-3","w":2,"lv":"2.5","q":"In the RUP diagram, Business Modeling, Requirements and Test are examples of:","o":["Workflows (disciplines)","Phases","Iterations","CMMI levels"],"a":0,"vi":"Chiều dọc là workflows (disciplines); chiều ngang là 4 phase chia thành iteration.","en":"Vertical axis: workflows (disciplines); horizontal: four phases split into iterations.","src":"02#30"},{"id":"c2.5-4","w":2,"lv":"2.5","q":"What does each RUP iteration have to control when it starts and finishes?","o":["Entry and exit criteria (check points)","A Daily Scrum","A WIP limit","A burndown chart"],"a":0,"vi":"Mỗi iteration là một chu kỳ waterfall, có entry/exit criteria.","en":"Each iteration is a waterfall cycle with entry and exit criteria.","src":"02#34"},{"id":"c2.5-5","w":2,"lv":"2.5","q":"RUP stands for:","o":["Rational Unified Process","Rapid Unified Process","Rational Unit Planning","Reusable Unified Process"],"a":0,"vi":"RUP = Rational Unified Process: Inception → Elaboration → Construction → Transition.","en":"RUP = Rational Unified Process: Inception → Elaboration → Construction → Transition.","src":"02#30, 02#33","ng":1}],"2.6":[{"id":"c2.6-1","w":2,"lv":"2.6","q":"Complete the Agile value: \"Customer collaboration over ___\".","o":["Contract negotiation","Processes and tools","Comprehensive documentation","Following a plan"],"a":0,"vi":"Customer collaboration over contract negotiation.","en":"Customer collaboration over contract negotiation.","src":"02#37"},{"id":"c2.6-2","w":2,"lv":"2.6","q":"Complete the Agile value: \"Individuals and interactions over ___\".","o":["Processes and tools","Contract negotiation","Working software","Responding to change"],"a":0,"vi":"Individuals and interactions over processes and tools.","en":"Individuals and interactions over processes and tools.","src":"02#37"},{"id":"c2.6-3","w":2,"lv":"2.6","q":"Which is one of the 12 Agile principles?","o":["Working software is the primary measure of progress","Comprehensive documentation is the primary measure of progress","Requirements must be frozen before coding","Teams should work overtime to meet deadlines"],"a":0,"vi":"Nguyên tắc: phần mềm chạy được là thước đo tiến độ chính; nhịp độ bền vững.","en":"Principle: working software is the primary measure of progress; sustainable pace.","src":"02#38"},{"id":"c2.6-4","w":2,"lv":"2.6","q":"According to the Agile principles, the best architectures emerge from:","o":["Self-organizing teams","A separate architecture board","The customer's contract","The project manager alone"],"a":0,"vi":"Kiến trúc tốt nhất đến từ team tự tổ chức.","en":"The best architectures emerge from self-organizing teams.","src":"02#38"}],"2.7":[{"id":"c2.7-1","w":2,"lv":"2.7","q":"XP's answer to \"if integration testing is important\" is to:","o":["Integrate and test several times a day","Integrate once before release","Let only testers integrate","Skip unit tests"],"a":0,"vi":"XP đẩy thực hành tốt lên cực đoan: tích hợp và test nhiều lần mỗi ngày.","en":"XP pushes good practices to extremes: integrate and test several times a day.","src":"02#44"},{"id":"c2.7-2","w":2,"lv":"2.7","q":"In XP, how involved should the customer be?","o":["A full-time participant","Only at the final demo","Only when signing the contract","Not involved at all"],"a":0,"vi":"XP: khách là thành viên toàn thời gian (On-site Customer).","en":"XP: the customer is a full-time participant (On-site Customer).","src":"02#45"},{"id":"c2.7-3","w":2,"lv":"2.7","q":"Which IS one of the 12 XP practices?","o":["40-hour Week","Sprint Review","Limit WIP","Release Burndown"],"a":0,"vi":"12 practice XP gồm 40-hour Week, Pair Programming, Refactoring, Continuous Integration…","en":"XP practices include 40-hour Week, Pair Programming, Refactoring, Continuous Integration…","src":"02#46"},{"id":"c2.7-4","w":2,"lv":"2.7","q":"XP's view of design simplicity is to:","o":["Keep the simplest design that supports current functionality","Design every future feature up front","Avoid design entirely","Let only the architect design"],"a":0,"vi":"Luôn giữ thiết kế đơn giản nhất đủ cho chức năng hiện tại.","en":"Always keep the simplest design that supports current functionality.","src":"02#44"},{"id":"c2.7-5","w":2,"lv":"2.7","q":"XP stands for:","o":["Extreme Programming","Experience Programming","Expert Process","Extended Planning"],"a":0,"vi":"XP = Extreme Programming, một phương pháp Agile cùng với Scrum và Kanban.","en":"XP = Extreme Programming, an agile method alongside Scrum and Kanban.","src":"02#43, 02#46","ng":1}],"2.8":[{"id":"c2.8-1","w":2,"lv":"2.8","q":"Scrum was developed by:","o":["Ken Schwaber and Jeff Sutherland","Taiichi Ohno and David Anderson","Booch, Rumbaugh and Jacobson","Barry Boehm"],"a":0,"vi":"Scrum do Ken Schwaber và Jeff Sutherland phát triển; Scrum Guide mới nhất 11/2020.","en":"Scrum by Ken Schwaber and Jeff Sutherland; latest Scrum Guide Nov 2020.","src":"02#53-54"},{"id":"c2.8-2","w":2,"lv":"2.8","q":"The Sprint Goal is the commitment for:","o":["The Sprint Backlog","The Product Backlog","The Increment","The Daily Scrum"],"a":0,"vi":"Product Backlog ↔ Product Goal · Sprint Backlog ↔ Sprint Goal · Increment ↔ Definition of Done.","en":"Product Backlog ↔ Product Goal · Sprint Backlog ↔ Sprint Goal · Increment ↔ Definition of Done.","src":"02#54"},{"id":"c2.8-3","w":2,"lv":"2.8","q":"Which event contains all other Scrum events?","o":["The Sprint","Sprint Planning","Sprint Review","Daily Scrum"],"a":0,"vi":"Sprint: tối đa 1 tháng, chứa mọi event khác.","en":"The Sprint: one month or less, containing all other events.","src":"02#60"},{"id":"c2.8-4","w":2,"lv":"2.8","q":"Which accountability creates a usable Increment every Sprint?","o":["Developers","Product Owner","Scrum Master","Stakeholders"],"a":0,"vi":"Developers tạo Sprint Backlog và Increment dùng được mỗi Sprint.","en":"Developers create the Sprint Backlog and a usable Increment every Sprint.","src":"02#59"},{"id":"c2.8-5","w":2,"lv":"2.8","q":"Inspecting the Increment with stakeholders and adapting the Product Backlog happens in:","o":["Sprint Review","Sprint Retrospective","Daily Scrum","Sprint Planning"],"a":0,"vi":"Review xem sản phẩm cùng stakeholder; Retrospective xem cách làm việc.","en":"Review inspects the product with stakeholders; Retrospective inspects the way of working.","src":"02#60"},{"id":"c2.8-6","w":2,"lv":"2.8","q":"Sprint Planning produces:","o":["The Sprint Goal and the Sprint Backlog","The Definition of Done only","A release plan","The Product Goal"],"a":0,"vi":"Sprint Planning trả lời Why/What/How, tạo Sprint Goal và Sprint Backlog.","en":"Sprint Planning answers why/what/how and produces the Sprint Goal and Sprint Backlog.","src":"02#60"},{"id":"c2.8-7","w":2,"lv":"2.8","q":"Which is a good quality of user stories listed in the lecture?","o":["Small and testable","Long and detailed","Written from the developer's view","Independent of any user"],"a":0,"vi":"User story tốt: rõ ràng, nhỏ, test được, có giá trị; viết từ góc nhìn người dùng.","en":"Good stories: clear, small, testable, valuable; from the user's view.","src":"02#58"}],"2.9":[{"id":"c2.9-1","w":2,"lv":"2.9","q":"Kanban originally helped Toyota by:","o":["Avoiding bottlenecks in production","Removing all managers","Fixing sprint lengths","Writing user stories"],"a":0,"vi":"Taiichi Ohno (Toyota) dùng Kanban để tránh nút thắt, tăng năng suất.","en":"Taiichi Ohno (Toyota) used Kanban to avoid bottlenecks and raise productivity.","src":"02#62"},{"id":"c2.9-2","w":2,"lv":"2.9","q":"On a Kanban board, cards move:","o":["From left to right","From right to left","Only between teams, not columns","Once per sprint"],"a":0,"vi":"Mỗi thẻ là một work item, di chuyển từ trái sang phải; flow nên đều.","en":"Each card is one work item, moved left to right; flow should be even.","src":"02#65-66"},{"id":"c2.9-3","w":2,"lv":"2.9","q":"\"Start with what you are doing now\" is one of Kanban's:","o":["Four principles","Core practices","Scrum events","XP practices"],"a":0,"vi":"4 nguyên tắc: bắt đầu từ cái đang làm, đổi từng bước, tôn trọng vai trò hiện tại, lãnh đạo ở mọi cấp.","en":"Four principles: start with what you do now, incremental change, respect current roles, leadership at all levels.","src":"02#67"},{"id":"c2.9-4","w":2,"lv":"2.9","q":"In Kanban, limiting work in progress means:","o":["Current work must be completed before taking a new item","Each sprint has a fixed number of stories","Only the manager can add cards","Work is planned one year ahead"],"a":0,"vi":"Limit WIP: giới hạn số việc đang làm, phải xong việc hiện tại mới nhận việc mới.","en":"Limit WIP: cap current items; finish current work before taking new work.","src":"02#69"},{"id":"c2.9-5","w":2,"lv":"2.9","q":"Cycle time is:","o":["The time an item takes from start to finish","The length of a sprint","The number of items in progress","The time of the Daily Scrum"],"a":0,"vi":"Cycle time: thời gian một item từ lúc bắt đầu tới lúc xong.","en":"Cycle time: time an item takes from start to finish.","src":"02#71"},{"id":"c2.9-6","w":2,"lv":"2.9","q":"In Kanban, WIP stands for:","o":["Work in progress","Work item priority","Weekly iteration plan","Workflow improvement process"],"a":0,"vi":"WIP = Work in progress (việc đang làm). Kanban giới hạn WIP: làm xong việc hiện tại mới nhận việc mới.","en":"WIP = Work in progress. Kanban limits WIP: finish current work before taking new work.","src":"02#69","ng":1}],"3.1":[{"id":"c3.1-1","w":3,"lv":"3.1","q":"An investment project mainly produces:","o":["Benefit","Product","Knowledge","Documentation"],"a":0,"vi":"Production → product · Investment → benefit · Research → knowledge.","en":"Production → product · Investment → benefit · Research → knowledge.","src":"03#4"},{"id":"c3.1-2","w":3,"lv":"3.1","q":"Which is a defining feature of a project in the lecture?","o":["A well-defined goal with limited time and budget","An endless list of tasks","Unlimited budget","No deadline"],"a":0,"vi":"Project: chuỗi task, mục tiêu rõ, giới hạn time và budget.","en":"A project: tasks, a well-defined goal, limited time and budget.","src":"03#4"},{"id":"c3.1-3","w":3,"lv":"3.1","q":"Which is listed as a common reason why software projects fail?","o":["Lack of risk management","Too many stakeholders being happy","Using version control","Writing user manuals"],"a":0,"vi":"Lý do thất bại: requirement mơ hồ/đổi, ước lượng thấp, giao tiếp kém, thiếu risk mgmt, test kém, thiếu kỹ năng.","en":"Failure reasons: unclear requirements, underestimates, poor communication, no risk management, weak testing, missing skills.","src":"03#6"}],"3.2":[{"id":"c3.2-1","w":3,"lv":"3.2","q":"Which role is NOT listed as responsible for software project management?","o":["Product Owner","Program manager","Test manager","Team lead"],"a":0,"vi":"Trách nhiệm: Program manager, Project manager, Team lead, Test manager.","en":"Responsible roles: Program manager, Project manager, Team lead, Test manager.","src":"03#7"},{"id":"c3.2-2","w":3,"lv":"3.2","q":"Which role focuses on scope, schedule, cost, risks, communication and stakeholders?","o":["Project Manager","Engineering Manager","Team Lead","Test manager"],"a":0,"vi":"PM: scope, schedule, cost, risks, stakeholders. EM: chất lượng kỹ thuật. Team Lead: điều phối hằng ngày.","en":"PM: scope, schedule, cost, risks, stakeholders. EM: technical quality. Team Lead: daily coordination.","src":"03#9"},{"id":"c3.2-3","w":3,"lv":"3.2","q":"Scope, WBS, estimates, schedule and staffing plan are outputs of:","o":["Planning","Initiation","Executing","Tracking & Control"],"a":0,"vi":"Planning: what/who/when/how much → scope, WBS, estimates, schedule, staffing plan.","en":"Planning: what/who/when/how much → scope, WBS, estimates, schedule, staffing plan.","src":"03#10"},{"id":"c3.2-4","w":3,"lv":"3.2","q":"\"Are tasks being performed according to the plan?\" is the main question of:","o":["Executing","Initiation","Planning","Tracking & Control"],"a":0,"vi":"Executing: task có đúng plan → weekly plan, task đã giao, deliverable trung gian.","en":"Executing: are tasks on plan → weekly plan, assigned tasks, intermediate deliverables.","src":"03#10"}],"3.3":[{"id":"c3.3-1","w":3,"lv":"3.3","q":"Agile projects plan continuously in which smaller horizons?","o":["Release, sprint, day","Year, quarter, month","Phase, stage, gate","Only once at the start"],"a":0,"vi":"Agile lập kế hoạch liên tục theo release, sprint, day.","en":"Agile plans continuously per release, sprint and day.","src":"03#13"},{"id":"c3.3-2","w":3,"lv":"3.3","q":"Which is part of the Software Development Plan (SDP) activities?","o":["Identify and assess risks","Write all source code","Deploy to production","Run user acceptance tests"],"a":0,"vi":"Hoạt động SDP: ước lượng, lên phase, chọn process, giao vai trò, đào tạo, xác định và đánh giá rủi ro.","en":"SDP activities: estimate, plan phases, define process, assign roles, plan training, identify and assess risks.","src":"03#15"},{"id":"c3.3-3","w":3,"lv":"3.3","q":"Why does a clear scope matter?","o":["It helps estimate effort, schedule tasks, assign work and control changes","It removes the need for testing","It guarantees no requirement will change","It replaces the WBS"],"a":0,"vi":"Scope rõ giúp ước lượng, xếp lịch, giao việc, kiểm soát thay đổi.","en":"A clear scope helps estimate, schedule, assign work and control changes.","src":"03#16"},{"id":"c3.3-4","w":3,"lv":"3.3","q":"A WBS organizes the project into:","o":["Phases, deliverables and tasks","Sprints and story points only","Risks and strategies","Actors and use cases"],"a":0,"vi":"WBS: phase → deliverable → task; nền tảng cho lập lịch và nhận diện rủi ro.","en":"WBS: phases → deliverables → tasks; foundation for scheduling and risk identification.","src":"03#17"},{"id":"c3.3-5","w":3,"lv":"3.3","q":"WBS stands for:","o":["Work Breakdown Structure","Work Backlog Schedule","Workload Balance Sheet","Weekly Breakdown Schedule"],"a":0,"vi":"WBS = Work Breakdown Structure: chia scope dự án thành các phần việc nhỏ, quản lý được.","en":"WBS = Work Breakdown Structure: breaks the project scope into smaller, manageable work items.","src":"03#17","ng":1},{"id":"c3.3-6","w":3,"lv":"3.3","q":"The SDP, which contains the budget, schedule, staffing and risk management plans, stands for:","o":["Software Development Plan","Software Design Proposal","System Deployment Plan","Sprint Delivery Plan"],"a":0,"vi":"SDP = Software Development Plan: gồm budget & schedule, staffing, training, risk management, testing, deployment…","en":"SDP = Software Development Plan: budget & schedule, staffing, training, risk management, testing, deployment…","src":"03#14","ng":1}],"3.4":[{"id":"c3.4-1","w":3,"lv":"3.4","q":"An estimate based on the manager's experience of past projects is:","o":["Experience-based","Algorithmic cost modeling","Function point analysis","COCOMO"],"a":0,"vi":"Experience-based: kinh nghiệm. Algorithmic: công thức theo size và đặc điểm process.","en":"Experience-based: past experience. Algorithmic: a formula from size and process traits.","src":"03#20"},{"id":"c3.4-2","w":3,"lv":"3.4","q":"Which statement about LOC is correct?","o":["Simple but language-dependent","Independent of the programming language","Measured from the user's perspective","Counts comments and blank lines"],"a":0,"vi":"LOC: đếm dòng chạy được, bỏ comment/dòng trống, phụ thuộc ngôn ngữ. FP: độc lập ngôn ngữ.","en":"LOC: executable lines, no comments/blanks, language-dependent. FP: language-independent.","src":"03#21"},{"id":"c3.4-3","w":3,"lv":"3.4","q":"Which formula estimates project duration in the lecture?","o":["$\\text{Duration} = c \\times (\\text{Effort})^{d}$","$\\text{Duration} = a \\times (\\text{KLOC})^{b}$","$\\text{Duration} = \\text{Effort} \\times \\text{cost per man-month}$","$\\text{Duration} = \\text{Effort} + \\text{Cost}$"],"a":0,"vi":"$\\text{Duration} = c \\times (\\text{Effort})^{d}$; $\\text{Effort} = a \\times (\\text{KLOC})^{b}$.","en":"$\\text{Duration} = c \\times (\\text{Effort})^{d}$; $\\text{Effort} = a \\times (\\text{KLOC})^{b}$.","src":"03#22"},{"id":"c3.4-4","w":3,"lv":"3.4","q":"A task needs 24 person-hours. Two students each work 3 hours/day. About how long does it take?","o":["About 4 days","About 8 days","About 12 days","About 2 days"],"a":0,"vi":"$24 \\div (2 \\times 3) \\approx 4$ ngày, nhưng thêm người không giảm thời gian tuyến tính.","en":"$24 \\div (2 \\times 3) \\approx 4$ days, though adding people is not linear.","src":"03#23"},{"id":"c3.4-5","w":3,"lv":"3.4","q":"Story points measure:","o":["Relative size: effort + complexity + uncertainty","Exact hours of work","Lines of code","The number of developers"],"a":0,"vi":"Story points = effort + complexity + uncertainty, ước lượng bằng Planning Poker (Fibonacci).","en":"Story points = effort + complexity + uncertainty, estimated with Planning Poker (Fibonacci).","src":"03#24"},{"id":"c3.4-6","w":3,"lv":"3.4","q":"In size estimation, LOC and FP stand for:","o":["Lines of Code / Function Points","Level of Complexity / Feature Priority","Lines of Code / Feature Points","List of Components / Function Points"],"a":0,"vi":"LOC = Lines of Code (phụ thuộc ngôn ngữ) · FP = Function Points (đo chức năng từ góc nhìn người dùng, độc lập ngôn ngữ).","en":"LOC = Lines of Code (language-dependent) · FP = Function Points (functionality from the user's view, language-independent).","src":"03#21","ng":1},{"id":"c3.4-7","w":3,"lv":"3.4","q":"In the COCOMO formula $\\text{Effort} = a \\times (\\text{KLOC})^{b}$, KLOC means:","o":["Thousands of lines of code","Kilobytes of compiled code","Key lines of code","Known lines of code"],"a":0,"vi":"KLOC = kilo (nghìn) lines of code: kích thước phần mềm tính bằng nghìn dòng code (LOC ở 03#21; chữ K = kilo là quy ước đơn vị chung, slide không ghi).","en":"KLOC = kilo (thousands of) lines of code: software size in thousands of LOC (LOC is on 03#21; K = kilo is the standard unit prefix, not spelled out on the slide).","src":"03#21-22","ng":1}],"3.5":[{"id":"c3.5-1","w":3,"lv":"3.5","q":"The goal of project scheduling is to:","o":["Assign the right people to the right tasks at the right time","Maximize the number of task dependencies","Add people whenever a project is late","Remove all slack time by adding staff"],"a":0,"vi":"Scheduling: đúng người, đúng việc, đúng lúc; giảm phụ thuộc, cân bằng tải.","en":"Scheduling: right people, right tasks, right time; fewer dependencies, balanced load.","src":"03#25"},{"id":"c3.5-2","w":3,"lv":"3.5","q":"Milestones are:","o":["The end-points of a period","Results delivered to customers","Tasks with zero duration only","Risks that already happened"],"a":0,"vi":"Milesto

<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SE Quest Ôn Giữa Kỳ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: pixel overworld (W1–W7 + midterm boss) → world screen with an RPG command menu (Mindmap / Flashcard / Quiz) → quiz runner → reward overlay. Light = day, dark = night. Pixel faces only for headings and short Latin HUD labels. */
:root{
  --bg:#bfe3f2; --fg:#1b2236; --muted:#43526d;
  --panel:#22306e; --panel-2:#2e3e8a; --panel-fg:#f3f5ff; --panel-muted:#c3cbf0; --edge:#f3f5ff; --shadow:#0b1030;
  --gold:#ffc93c; --good:#36d39a; --bad:#ff6b7d; --rare:#7cc8ff; --legend:#ff9f43;
  --water:#3f93d9; --water-2:#6fb6ec; --sand:#efd48a; --grass:#5dbb47; --grass-2:#3c9338; --tree:#25692f; --path:#7a5b2e; --castle:#8c93a8; --castle-2:#5d6480;
  --f-display:"VT323", ui-monospace, monospace;
  --f-hud:"Silkscreen", ui-monospace, monospace;
  --f-body:"Be Vietnam Pro", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1330; --fg:#e7ebff; --muted:#a6b0d4;
  --panel:#1a2560; --panel-2:#26337e; --panel-fg:#f3f5ff; --panel-muted:#b9c2ec; --edge:#cfd6ff; --shadow:#000418;
  --gold:#ffd451; --good:#43e0a6; --bad:#ff7b8b; --rare:#8fd2ff; --legend:#ffb062;
  --water:#13306a; --water-2:#2a4f98; --sand:#9b8a5c; --grass:#2f7a4c; --grass-2:#22603b; --tree:#123f25; --path:#e0c98d; --castle:#6a7190; --castle-2:#454b68;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1330; --fg:#e7ebff; --muted:#a6b0d4;
  --panel:#1a2560; --panel-2:#26337e; --panel-fg:#f3f5ff; --panel-muted:#b9c2ec; --edge:#cfd6ff; --shadow:#000418;
  --gold:#ffd451; --good:#43e0a6; --bad:#ff7b8b; --rare:#8fd2ff; --legend:#ffb062;
  --water:#13306a; --water-2:#2a4f98; --sand:#9b8a5c; --grass:#2f7a4c; --grass-2:#22603b; --tree:#123f25; --path:#e0c98d; --castle:#6a7190; --castle-2:#454b68;
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px;display:grid;gap:20px}

.box{background:var(--panel);color:var(--panel-fg);box-shadow:inset 0 0 0 3px var(--edge),0 0 0 3px var(--shadow),6px 6px 0 3px var(--shadow);padding:18px 20px}
.hud-label{font-family:var(--f-hud);font-size:12px;letter-spacing:.06em}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:36px} h3{font-size:28px}
.muted{color:var(--muted)}
.kw{font-weight:800;color:var(--gold)}
.on-bg .kw{color:inherit;background:color-mix(in srgb,var(--gold) 45%,transparent);padding:0 3px}

html{scroll-padding-top:calc(var(--hud-h,72px) + 12px)}
/* HUD: sticks to the top so language, theme and home stay one tap away */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;position:sticky;top:0;z-index:10;background:var(--bg);
  margin:-14px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));transition:box-shadow .15s}
.hud.stuck{box-shadow:0 3px 0 var(--shadow)}
@media (max-width:560px){.hud{gap:8px 10px}.logo{font-size:28px!important}.rank{order:3;flex-basis:100%!important}.tools{margin-left:auto}}
.logo{font-family:var(--f-display);font-size:38px;line-height:1;margin:0;color:var(--fg);text-shadow:3px 3px 0 var(--gold);border:0;background:none;padding:0}
.rank{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.rank b{font-weight:800;font-size:14px;white-space:nowrap}
.xpbar{flex:1;height:14px;background:var(--shadow);box-shadow:0 0 0 3px var(--shadow);position:relative;min-width:60px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--good) 0 8px,color-mix(in srgb,var(--good) 72%,#000) 8px 10px);transition:width .8s steps(10)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{font-family:var(--f-body);font-weight:800;font-size:14px;background:var(--gold);color:#1b2236;border:0;padding:9px 14px;box-shadow:0 0 0 3px var(--shadow),inset -3px -3px 0 rgba(0,0,0,.25)}
.pbtn:active{transform:translate(2px,2px)}
.pbtn.ghost,.pbtn[aria-pressed="false"]{background:var(--panel-2);color:var(--panel-fg)}
.pbtn:disabled{opacity:.5;cursor:default}
.pbtn .kbd{font-weight:600;font-size:11px;margin-left:8px;padding:1px 5px;border:1px solid currentColor;border-radius:3px;opacity:.7}
@media (hover: none){.pbtn .kbd{display:none}}

/* Map */
.boss{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.boss .cd{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--gold)}
.map{position:relative;aspect-ratio:16/8;max-width:100%;box-shadow:0 0 0 3px var(--shadow),6px 6px 0 3px var(--shadow);overflow:hidden}
.map canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.wnode{position:absolute;transform:translate(-50%,-50%);border:0;font-family:var(--f-body);font-weight:800;font-size:13px;padding:4px 9px;background:var(--panel);color:var(--panel-fg);box-shadow:0 0 0 2px var(--shadow);white-space:nowrap;display:flex;gap:6px;align-items:center}
.wnode .st{color:var(--gold)}
.wnode.done{background:var(--good);color:#06281c}.wnode.done .st{color:#06281c}
.wnode.boss{background:var(--bad);color:#2a0710}
.here{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-display);font-size:30px;color:var(--gold);text-shadow:2px 2px 0 var(--shadow);animation:bob .7s steps(2) infinite;pointer-events:none}
@keyframes bob{50%{margin-top:-6px}}
@media (max-width:1100px){.wnode .nm{display:none}}

.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wcard{display:grid;gap:8px;text-align:left;border:0;padding:16px 18px;background:var(--panel);color:var(--panel-fg);box-shadow:inset 0 0 0 2px var(--panel-2),0 0 0 3px var(--shadow),5px 5px 0 3px var(--shadow)}
.wcard:hover{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 3px var(--shadow),5px 5px 0 3px var(--shadow)}
.wcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wcard h3{font-size:26px}
.wcard .vi{font-size:14px;color:var(--panel-muted)}
.meter{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--panel-muted)}
.pips{display:inline-flex;gap:5px}
.pips i{width:12px;height:12px;background:var(--panel-2);box-shadow:0 0 0 2px var(--edge)}
.pips i.on{background:var(--gold)}
.tag{font-family:var(--f-hud);font-size:11px;padding:2px 6px;background:var(--panel-2);color:var(--panel-fg);white-space:nowrap}
.tag.ok{background:var(--good);color:#06281c}.tag.gold{background:var(--gold);color:#1b2236}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.action{display:grid;gap:4px;text-align:left;border:0;padding:16px 18px;color:var(--panel-fg);box-shadow:0 0 0 3px var(--shadow),5px 5px 0 3px var(--shadow)}
.action h3{font-size:28px}
.action.exam{background:repeating-linear-gradient(45deg,var(--shadow) 0 10px,color-mix(in srgb,var(--bad) 40%,var(--shadow)) 10px 20px)}
.action.rev{background:var(--panel-2)}
.action small{font-size:14px;color:var(--panel-muted)}

/* World */
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.world{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.world{grid-template-columns:1fr}}
.menu{display:grid;gap:2px;padding:12px}
@media (min-width:761px){.menu{position:sticky;top:calc(var(--hud-h,72px) + 14px)}}
@media (max-width:760px){.menu{grid-template-columns:repeat(4,1fr)}}
@media (max-width:480px){.menu{grid-template-columns:repeat(2,1fr)}}
.menu button{border:0;background:none;color:var(--panel-fg);text-align:left;padding:8px 8px 8px 26px;position:relative;font-weight:800;font-size:15px}
.menu button::before{content:"▶";position:absolute;left:6px;visibility:hidden;color:var(--gold)}
.menu button:hover::before,.menu button:focus-visible::before,.menu button[aria-current="true"]::before{visibility:visible}
.menu button[aria-current="true"]{color:var(--gold)}
.menu small{display:block;font-weight:400;font-size:12px;color:var(--panel-muted)}

/* Mindmap */
.mm{font-size:15px}
.mm ul{list-style:none;margin:0;padding-left:16px;border-left:3px solid var(--panel-2)}
.mm > ul{border:0;padding:0;display:grid;gap:8px}
.mm li{padding:3px 0 3px 8px}
.mm summary{cursor:pointer;font-weight:800;color:var(--gold);list-style:none;display:flex;gap:6px}
.mm summary::-webkit-details-marker{display:none}
.mm summary::before{content:"▼";font-size:11px;line-height:2;color:var(--panel-muted)}
.mm details:not([open]) > summary::before{content:"▶"}
.mm details details summary{color:var(--panel-fg)}
.mm .root{font-family:var(--f-display);font-size:30px;color:var(--gold);margin-bottom:6px}
.mm.test .leaf > span{filter:blur(5px);background:var(--panel-2);cursor:pointer;user-select:none}
.mm.test .leaf > span.show{filter:none;background:none}
.mmbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}

/* Flashcards */
.fc{display:grid;gap:16px;justify-items:center}
.flip{width:min(460px,100%);min-height:280px;perspective:1000px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1.1);display:grid}
.flip.on .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;background:var(--panel);color:var(--panel-fg);box-shadow:inset 0 0 0 4px var(--edge),0 0 0 4px var(--shadow),8px 8px 0 4px var(--shadow);padding:24px;display:grid;align-content:center;gap:12px;text-align:left}
.face.front{text-align:center;justify-items:center}
.face.front p{font-weight:800;font-size:24px;line-height:1.3;margin:0}
.face.back{transform:rotateY(180deg);font-size:16px}
.face.back p{margin:0}
.fcnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.src{font-size:12px;font-weight:600;color:var(--panel-muted)}

/* Quiz */
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hp{display:flex;gap:4px;flex-wrap:wrap}
.hp i{width:14px;height:14px;background:var(--panel-2);box-shadow:0 0 0 2px var(--shadow)}
.hp i.ok{background:var(--good)}.hp i.no{background:var(--bad)}.hp i.cur{background:var(--gold)}.hp i.ans{background:var(--panel-muted)}
.q{font-weight:700;font-size:18px;line-height:1.5;margin:0 0 16px;max-width:66ch}
.opts{display:grid;gap:10px}
.opt{border:0;text-align:left;background:var(--panel-2);color:var(--panel-fg);padding:12px 14px 12px 44px;position:relative;box-shadow:0 0 0 2px var(--shadow);font-size:16px;line-height:1.45}
.opt .l{position:absolute;left:12px;top:11px;font-family:var(--f-hud);font-size:13px;color:var(--gold)}
.opt:hover:not(:disabled){box-shadow:0 0 0 2px var(--gold)}
.opt.pick{box-shadow:0 0 0 3px var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--panel-2))}
.opt.right{background:var(--good);color:#06281c}.opt.right .l{color:#06281c}
.opt.wrong{background:var(--bad);color:#2a0710}.opt.wrong .l{color:#2a0710}
.opt .mark{float:right;font-weight:800;font-size:12px;margin-left:10px;letter-spacing:.04em}
.opt:disabled{cursor:default}
.explain{margin-top:16px;border-top:2px dashed var(--panel-2);padding-top:12px;font-size:15px;color:var(--panel-fg)}
.explain b{color:var(--gold)}
.qfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
.timer{font-family:var(--f-display);font-size:30px;color:var(--gold)}
.timer.low{color:var(--bad)}

/* Quiz hub */
.qhub{display:grid;gap:18px}
.qstat{display:grid;gap:8px}
.cover{height:16px;background:var(--shadow);box-shadow:0 0 0 3px var(--shadow);position:relative}
.cover i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,color-mix(in srgb,var(--gold) 72%,#000) 8px 10px);transition:width .6s steps(8)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{display:grid;gap:4px;text-align:left;border:0;padding:14px 16px;background:var(--panel-2);color:var(--panel-fg);box-shadow:0 0 0 3px var(--shadow),4px 4px 0 3px var(--shadow)}
.mode:hover{box-shadow:0 0 0 3px var(--gold),4px 4px 0 3px var(--shadow)}
.mode:active{transform:translate(2px,2px)}
.mode h3{font-family:var(--f-body);font-weight:800;font-size:18px;line-height:1.3}
.mode small{font-size:13px;color:var(--panel-muted)}
.mode.primary{background:var(--gold);color:#1b2236}.mode.primary small{color:#3a3f55}
.note{margin:0;font-size:13px;color:var(--panel-muted)}

/* Result */
.result{display:grid;gap:18px}
.score{font-family:var(--f-display);font-size:clamp(64px,16vw,110px);line-height:.9;color:var(--gold);text-shadow:4px 4px 0 var(--shadow);margin:0}
.wrongs{display:grid;gap:12px}
.wrongs .box{padding:14px 16px;font-size:15px}
.wrongs p{margin:0 0 6px}

/* Reward overlay */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--shadow) 78%,transparent);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.stage{position:relative;display:grid;justify-items:center;gap:16px;text-align:center;max-width:440px;width:100%}
.clear-t{font-family:var(--f-display);font-size:clamp(50px,12vw,84px);line-height:.9;margin:0;color:var(--gold);text-shadow:4px 4px 0 var(--shadow)}
.card3d{width:220px;aspect-ratio:5/7;max-width:100%;perspective:900px}
.card-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1.2)}
.flipped .card-in{transform:rotateY(180deg)}
.cface{position:absolute;inset:0;backface-visibility:hidden;box-shadow:inset 0 0 0 4px var(--edge),0 0 0 4px var(--shadow),8px 8px 0 4px var(--shadow)}
.cback{background:repeating-conic-gradient(var(--panel) 0 25%,var(--panel-2) 0 50%) 0 0/24px 24px;display:grid;place-items:center}
.cback span{font-family:var(--f-display);font-size:56px;color:var(--gold);text-shadow:3px 3px 0 var(--shadow)}
.cfront{transform:rotateY(180deg);background:var(--panel);color:var(--panel-fg);display:grid;grid-template-rows:auto 1fr auto;padding:14px;text-align:left;gap:8px}
.rar{font-family:var(--f-hud);font-size:11px;display:flex;justify-content:space-between}
.rar b{color:var(--rare)}.rar b.leg{color:var(--legend)}
.emblem{display:grid;place-items:center;background:var(--panel-2);box-shadow:inset 0 0 0 3px var(--shadow);font-family:var(--f-display);font-size:46px;color:var(--gold);text-align:center;line-height:1}
.cfront h4{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1}
.cfront p{margin:0;font-size:12px;line-height:1.45;color:var(--panel-muted)}
.gain{font-weight:800;color:var(--panel-fg)}

/* Collection */
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mini{padding:12px;display:grid;gap:4px;font-size:12px}
.mini b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
.mini.locked{opacity:.55}

.foot{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;font-weight:800;font-size:14px;padding:10px 16px;background:var(--gold);color:#1b2236;box-shadow:0 0 0 3px var(--shadow)}

/* Lessons */
.learn{display:grid;gap:16px;min-width:0}
.lvls{display:flex;flex-wrap:wrap;gap:8px}
.lv{border:0;font-weight:800;font-size:14px;padding:6px 10px;background:var(--panel-2);color:var(--panel-fg);box-shadow:0 0 0 2px var(--shadow)}
.lv:hover{box-shadow:0 0 0 2px var(--gold)}
.lv.ok{box-shadow:0 0 0 2px var(--good)}
.lv[aria-current="true"]{background:var(--gold);color:#1b2236}
.lt{font-size:30px;margin-top:4px}
.lc{display:grid;gap:12px;padding-top:16px;border-top:2px dashed var(--panel-2);min-width:0}
.lc.real{padding:14px;border:2px dashed var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)}
.lc .tag{justify-self:start}
.prose{font-size:16px;line-height:1.65;max-width:74ch;min-width:0}
.prose p{margin:0 0 10px}.prose > :last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.prose li{margin:3px 0}
.prose li::marker{color:var(--gold)}
.prose ul ul{margin:2px 0 0}
.tbl{overflow-x:auto;margin:2px 0 10px;max-width:100%}
.tbl table{border-collapse:collapse;color:inherit;font-size:14.5px;line-height:1.45;width:100%}
.tbl th,.tbl td{border:2px solid var(--panel-2);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel-2);font-weight:800}
@media (max-width:480px){.tbl table{font-size:13.5px}.tbl th,.tbl td{padding:6px 7px}}
.mathd{overflow-x:auto;padding:4px 0 10px;font-size:1.12em}
math{font-size:1.06em}
/* Diagrams drawn for SE Quest. Colours are mapped once here, so another screen only has to change this block. */
.fig {
  --f-ink: var(--panel-fg); --f-mut: var(--panel-muted); --f-box: var(--panel-2); --f-line: var(--panel-muted);
  --f-acc: var(--gold); --f-blue: var(--rare); --f-good: var(--good); --f-bad: var(--bad); --f-dark: #15152b;
  margin: 0; display: grid; gap: 8px; max-width: 560px; color: var(--f-ink); font-size: 14px; line-height: 1.4;
}
.fig figcaption { font-size: 12px; color: var(--f-mut); }
.fig svg { display: block; width: 100%; height: auto; font-family: var(--f-body); }
.fig small { display: block; font-size: 12px; color: var(--f-mut); }
.fg-note { margin: 0; font-size: 12.5px; color: var(--f-mut); }
.fg-scroll { overflow-x: auto; }
.fg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.fg-h { display: block; margin-bottom: 4px; }

/* SVG parts */
.fig .t { fill: var(--f-ink); font-size: 11.5px; font-weight: 600; }
.fig .t.big { font-size: 13px; font-weight: 800; }
.fig .t.hi { fill: var(--f-acc); font-weight: 800; }
.fig .t.hi2 { fill: var(--f-acc); font-weight: 800; }
.fig .tm { fill: var(--f-mut); font-size: 11px; }
.fig .ts { fill: var(--f-ink); font-size: 10.5px; font-weight: 600; }
.fig .ts.mut { fill: var(--f-mut); font-weight: 400; }
.fig .ts.rel { fill: var(--f-blue); font-weight: 800; }
.fig .b { fill: var(--f-box); stroke: var(--f-line); stroke-width: 1.5; }
.fig .b.hi { stroke: var(--f-acc); stroke-width: 2.5; }
.fig .l { fill: none; stroke: var(--f-line); stroke-width: 1.8; }
.fig .l.dash { stroke-dasharray: 5 4; }
.fig .ah { fill: var(--f-line); }
.fig .hh { fill: var(--panel); stroke: var(--f-line); stroke-width: 1.8; }
.fig .l.back { stroke: var(--f-blue); stroke-dasharray: 4 3; }
.fig .ah.back { fill: var(--f-blue); }
.fig .l.rel { stroke: var(--f-blue); stroke-width: 2; }
.fig .ah.rel { fill: var(--f-blue); }
.fig .l.spiral { stroke: var(--f-ink); stroke-width: 2; }
.fig .ah.spiral { fill: var(--f-ink); }
.fig .grid { stroke: var(--f-line); stroke-opacity: .28; stroke-width: 1; }
.fig .base, .fig .tick { stroke: var(--f-line); stroke-width: 1; }
.fig .area1 { fill: var(--f-acc); fill-opacity: .8; }
.fig .area2 { fill: var(--f-box); }
.fig .edge { fill: none; stroke: var(--f-ink); stroke-width: 2; }
.fig .t.on { fill: var(--f-dark); font-weight: 800; }
.fig .q { fill: var(--f-box); stroke-width: 2; }
.fig .q1 { stroke: var(--f-blue); } .fig .q2 { stroke: var(--f-good); } .fig .q3 { stroke: var(--f-acc); } .fig .q4 { stroke: var(--f-bad); }
.fig .hump.h0 { fill: var(--f-acc); } .fig .hump.h1 { fill: var(--f-blue); } .fig .hump.h2 { fill: var(--f-good); }
.fig .actor circle { fill: var(--f-box); stroke: var(--f-ink); stroke-width: 2; }
.fig .actor line { stroke: var(--f-ink); stroke-width: 2; }
.fig .task { fill: var(--f-box); stroke: var(--f-ink); stroke-width: 1.3; }
.fig .slack { fill: var(--f-blue); fill-opacity: .55; }
.fig .dia { fill: var(--f-acc); stroke: var(--f-dark); stroke-width: 1; }
.fig .bar { fill: var(--f-blue); }
.fig .bar.lo { fill: var(--f-acc); }
.fig .cf1, .fg-legend i.cf1 { fill: var(--f-blue); background: var(--f-blue); }
.fig .cf2, .fg-legend i.cf2 { fill: var(--f-acc); background: var(--f-acc); }
.fig .cf3, .fg-legend i.cf3 { fill: var(--f-good); background: var(--f-good); }

/* Legend */
.fg-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
.fg-legend span { display: inline-flex; align-items: center; gap: 6px; }
.fg-legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.fg-legend .c-good { background: var(--f-good); } .fg-legend .c-gold { background: var(--f-acc); } .fg-legend .c-bad { background: var(--f-bad); }
.fg-legend .k-task { background: var(--f-box); box-shadow: inset 0 0 0 1.3px var(--f-ink); }
.fg-legend .k-slack { background: color-mix(in srgb, var(--f-blue) 55%, transparent); }
.fg-legend .k-dia { background: var(--f-acc); transform: rotate(45deg) scale(.8); border-radius: 0; }

/* CHAOS stacked bars */
.fg-stack { display: grid; gap: 6px; }
.fg-row { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.fg-row b { font-size: 13px; font-weight: 600; }
.fg-row.now b { font-weight: 800; color: var(--f-acc); }
.fg-bar { display: flex; gap: 2px; }
.fg-bar span { padding: 5px 4px; text-align: center; font-size: 12.5px; font-weight: 800; color: var(--f-dark); min-width: 0; }
.fg-bar span:first-child { border-radius: 4px 0 0 4px; }
.fg-bar span:last-child { border-radius: 0 4px 4px 0; }
.fg-row.now .fg-bar { outline: 2px solid var(--f-acc); outline-offset: 2px; border-radius: 4px; }
.fg-bar .c-good { background: var(--f-good); } .fg-bar .c-gold { background: var(--f-acc); } .fg-bar .c-bad { background: var(--f-bad); }

/* CMMI stairs */
.fg-stair { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.fg-stair li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 5px; background: var(--f-box); }
.fg-stair .n { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; background: var(--f-acc); color: var(--f-dark); font-weight: 800; }
.fg-stair span { min-width: 0; line-height: 1.25; }
.fg-stair small { color: var(--f-ink); }

/* Kanban */
.fg-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fg-board .col { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px 10px; min-height: 130px; background: var(--f-box); border-radius: 5px; }
.fg-board .head { text-align: center; line-height: 1.2; }
.fg-board .head b { font-size: 12.5px; }
.fg-board .head small { color: var(--f-acc); font-weight: 700; font-size: 11px; }
.sticky { display: grid; place-items: center; width: 38px; height: 34px; border-radius: 3px; background: var(--f-acc); color: var(--f-dark); font-weight: 800; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.fg-flow { padding: 5px 10px; text-align: center; font-size: 12.5px; font-weight: 700; border-radius: 4px; background: var(--f-box); }

/* Risk matrix */
.fg-risk { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; color: inherit; }
.fg-risk th { padding: 3px 2px; font-weight: 700; font-size: 10.5px; text-align: center; }
.fg-risk th small { color: var(--f-acc); font-size: 11px; font-weight: 800; }
.fg-risk tbody th { text-align: left; }
.fg-risk td { padding: 8px 2px; text-align: center; border-radius: 3px; color: var(--f-dark); font-weight: 600; }
.fg-risk .z0 { background: #fbe3cf; } .fg-risk .z1 { background: #f5b98c; }
.fg-risk .z2 { background: #cf5f22; color: #fff; } .fg-risk .z3 { background: #7c2f0b; color: #fff; }
.fg-risk .mk { font-weight: 800; outline: 2px solid var(--f-ink); outline-offset: -2px; }

/* Use case form */
.fg-uc { display: grid; border: 1.5px solid var(--f-line); border-radius: 5px; overflow: hidden; font-size: 13.5px; }
.uc-title { padding: 6px 10px; text-align: center; font-weight: 800; background: var(--f-box); }
.uc-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 10px; border-top: 1.5px solid var(--f-line); }
.uc-row small { text-align: right; line-height: 1.3; }
.uc-row ol { margin: 2px 0 0; padding-left: 18px; }
.uc-row ol.sub { padding-left: 20px; list-style: lower-alpha; }
@media (max-width: 480px) { .uc-row { grid-template-columns: 1fr; gap: 2px; } .uc-row small { text-align: left; } }

/* Software layers */
.fg-layers { display: grid; justify-items: center; gap: 4px; }
.fg-layers .ly { width: min(280px, 100%); display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--f-box); border-radius: 5px; border: 1.5px solid var(--f-line); }
.fg-layers .ly span { color: var(--f-mut); font-size: 13px; }
.fg-layers i { font-style: normal; font-size: 12px; color: var(--f-blue); font-weight: 700; }

/* Two-up comparisons */
.fg-duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fg-nums { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; color: inherit; }
.fg-nums th, .fg-nums td { padding: 4px 3px; text-align: center; border: 1px solid var(--f-line); }
.fg-nums th { font-weight: 700; background: var(--f-box); }

/* UI design process */
.fg-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; counter-reset: st; }
@media (max-width: 480px) { .fg-steps { grid-template-columns: 1fr; } }
.fg-steps li { counter-increment: st; padding: 10px; border-radius: 5px; background: var(--f-box); border-top: 3px solid var(--f-acc); }
.fg-steps b::before { content: counter(st) ". "; color: var(--f-acc); }
.fg-steps small { margin-top: 4px; color: var(--f-ink); }

/* Error messages */
.dlg { display: grid; gap: 8px; align-content: start; padding: 10px; border-radius: 6px; background: var(--f-box); border: 2px solid var(--f-line); }
.dlg.bad { border-color: var(--f-bad); }
.dlg.good { border-color: var(--f-good); }
.dlg .verdict { margin: 0; font-weight: 800; font-size: 13px; }
.dlg.bad .verdict { color: var(--f-bad); }
.dlg.good .verdict { color: var(--f-good); }
.dlg .win { padding: 8px 10px; border-radius: 4px; background: #fbfdff; color: var(--f-dark); font-size: 13px; }
.dlg .win p { margin: 4px 0 0; }
.dlg .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.dlg .btns span { padding: 3px 10px; border-radius: 999px; background: #fbfdff; color: var(--f-dark); font-size: 12px; font-weight: 700; }

/* World 6 and 7: architecture and UML */
.fg-steps.four { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 480px) { .fg-steps.four { grid-template-columns: 1fr; } }
.fg-code { font-family: ui-monospace, Consolas, monospace; color: var(--f-blue) !important; }
.fig .code { font-family: ui-monospace, Consolas, monospace; font-weight: 500; }
.fig .mod { fill: var(--f-blue); fill-opacity: .35; stroke: var(--f-blue); }
.fig .dmd { fill: var(--panel); stroke: var(--f-line); stroke-width: 1.8; }
.fig .dmd.full { fill: var(--f-ink); stroke: var(--f-ink); }
.fig .dot { fill: var(--f-ink); }
.fig .life { stroke: var(--f-line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.fig .act { fill: var(--f-box); stroke: var(--f-line); stroke-width: 1.2; }
.fig .frame { fill: none; stroke: var(--f-blue); stroke-width: 1.5; }
.fig .frame-tag { fill: var(--f-blue); }
.fig .ts.on { fill: var(--f-dark); font-weight: 800; }

.svgfig{overflow-x:auto}
.svgfig svg{display:block;width:100%;min-width:560px;max-width:680px;height:auto}
.chk{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:14px 16px;border:2px dashed var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent)}

.gl:hover,.gl[aria-expanded]{background:color-mix(in srgb,var(--rare) 22%,transparent)}

.gpop p{margin:0 0 6px}
.gpop .gt b{color:var(--gold);font-size:15px}.gpop .gt span{color:var(--rare);font-weight:700}

/* Mindmap modes */
.seg{display:inline-flex;gap:6px}
#mmtools{display:inline-flex;gap:10px;flex-wrap:wrap}
.mmg{position:relative;height:min(68vh,640px);background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--shadow);margin-bottom:8px}
.mmg svg{width:100%;height:100%;display:block;--markmap-text-color:var(--panel-fg);--markmap-font:500 14px/1.45 var(--f-body);--markmap-circle-open-bg:var(--panel);--markmap-code-bg:var(--panel)}
#mmmsg{position:absolute;left:0;right:0;top:45%;text-align:center}

<script>const DATA = {"examDate":"2026-11-05","quiz":[{"id":"w1-01","w":1,"q":"Which definition of software is used in the lecture?","o":["Computer programs only","Computer programs and associated documentation","Source code and the hardware it runs on","Executable files and their databases"],"a":1,"vi":"Software = chương trình + tài liệu đi kèm (requirements, design models, user manuals).","en":"Software = computer programs plus associated documentation such as requirements, design models and user manuals.","src":"01#3"},{"id":"w1-02","w":1,"q":"Software developed for a single customer according to their specification is called:","o":["Generic software","Custom software","Open-source software","Embedded software"],"a":1,"vi":"Custom: cho một khách theo spec của họ. Generic: bán cho nhiều khách.","en":"Custom software is built for one customer to their spec; generic software is sold to a range of customers.","src":"01#3"},{"id":"w1-03","w":1,"q":"Which of the following is NOT one of the four attributes of good software in the lecture?","o":["Maintainability","Dependability/Reliability","Scalability","Acceptability"],"a":2,"vi":"4 thuộc tính: Maintainability, Dependability/Reliability, Efficiency, Acceptability. Scalability không nằm trong danh sách.","en":"The four attributes are Maintainability, Dependability/Reliability, Efficiency and Acceptability. Scalability is not listed.","src":"01#7"},{"id":"w1-04","w":1,"q":"\"Software must evolve to meet changing needs\" describes which attribute?","o":["Efficiency","Maintainability","Acceptability","Dependability"],"a":1,"vi":"Maintainability: phần mềm phải tiến hoá được theo nhu cầu thay đổi.","en":"Maintainability: software must evolve to meet changing needs.","src":"01#7"},{"id":"w1-05","w":1,"q":"According to the lecture, Acceptability means software must be:","o":["Fast and cheap to run","Understandable, usable and compatible with other systems","Free of all defects","Written in a popular language"],"a":1,"vi":"Acceptability: được người dùng chấp nhận; dễ hiểu, dễ dùng, tương thích với hệ thống khác.","en":"Acceptability: accepted by its users; understandable, usable and compatible with other systems.","src":"01#7"},{"id":"w1-06","w":1,"q":"Roughly how are software engineering costs split between development and testing?","o":["40% development, 60% testing","60% development, 40% testing","80% development, 20% testing","50% development, 50% testing"],"a":1,"vi":"Khoảng 60% chi phí là development, 40% là testing.","en":"Roughly 60% of costs are development costs and 40% are testing costs.","src":"01#15"},{"id":"w1-07","w":1,"q":"For systems with a long life, which statement about costs is correct?","o":["Development always costs more than maintenance","Maintenance costs may be several times development costs","Hardware costs dominate software costs","Testing costs are negligible"],"a":1,"vi":"Với hệ thống sống lâu, chi phí bảo trì có thể gấp nhiều lần chi phí phát triển.","en":"For long-lived systems, maintenance costs may be several times development costs.","src":"01#9"},{"id":"w1-08","w":1,"q":"According to the CHAOS Report 2020 shown in the lecture, what percentage of IT projects were successful?","o":["19%","35%","46%","51%"],"a":1,"vi":"CHAOS 2020: 35% thành công, 46% challenged, 19% thất bại.","en":"CHAOS 2020: 35% successful, 46% challenged, 19% failed.","src":"01#11"},{"id":"w1-09","w":1,"q":"In the CHAOS Report 2020, the largest group of IT projects was:","o":["Successful","Failed","Challenged","Cancelled before start"],"a":2,"vi":"Challenged chiếm 46%, lớn nhất.","en":"Challenged projects were the largest group at 46%.","src":"01#11"},{"id":"w1-10","w":1,"q":"Which statement best contrasts software engineering with computer science?","o":["SE is concerned with theory and fundamentals","SE is concerned with the practicalities of developing and delivering useful software","SE covers hardware, software and process engineering","SE and CS are the same discipline"],"a":1,"vi":"CS: lý thuyết, nền tảng. SE: thực tiễn phát triển và bàn giao phần mềm hữu ích.","en":"CS is about theory and fundamentals; SE is about the practicalities of developing and delivering useful software.","src":"01#13"},{"id":"w1-11","w":1,"q":"Which discipline is concerned with all aspects of computer-based systems development, including hardware, software and process engineering?","o":["Software engineering","Computer science","System engineering","DevOps"],"a":2,"vi":"System engineering bao trùm HW + SW + process; SE là một phần trong đó.","en":"System engineering covers hardware, software and process engineering; SE is the part concerned with software.","src":"01#14"},{"id":"w1-12","w":1,"q":"Which of the following is NOT one of the goals of software engineering listed in the lecture?","o":["Cost effective (within budget)","On time","High quality","Using the latest technology"],"a":3,"vi":"Mục tiêu: cost effective, on time, high quality, đáp ứng nhu cầu khách hàng. \"Công nghệ mới nhất\" không có.","en":"Goals: cost effective, on time, high quality, satisfying customer's needs. Latest technology is not one of them.","src":"01#12"},{"id":"w1-13","w":1,"q":"Which is NOT one of the four generic activities in software processes?","o":["Specification","Development","Deployment","Evolution"],"a":2,"vi":"4 hoạt động: Specification, Development, Validation, Evolution. Deployment là bẫy.","en":"The four activities are Specification, Development, Validation and Evolution. Deployment is the trap.","src":"01#23"},{"id":"w1-14","w":1,"q":"The process activity \"checking that the software is what the customer wants\" is:","o":["Specification","Validation","Evolution","Development"],"a":1,"vi":"Validation: kiểm tra phần mềm có đúng là thứ khách hàng muốn.","en":"Validation checks that the software is what the customer wants.","src":"01#23"},{"id":"w1-15","w":1,"q":"Which process model perspective shows \"who does what\"?","o":["Workflow perspective","Data-flow perspective","Role/action perspective","Component perspective"],"a":2,"vi":"Workflow: trình tự hoạt động. Data-flow: luồng thông tin. Role/action: ai làm gì.","en":"Workflow = sequence of activities; data-flow = information flow; role/action = who does what.","src":"01#24"},{"id":"w1-16","w":1,"q":"Which of the following is listed in lecture 01 as a generic process model?","o":["Scrum","Component-based software engineering","Kanban","DevOps"],"a":1,"vi":"Generic process models: Waterfall, Iterative development, Component-based SE.","en":"Generic process models: Waterfall, Iterative development, Component-based software engineering.","src":"01#25"},{"id":"w1-17","w":1,"q":"Continuous Integration (CI) means:","o":["Automatically and frequently integrating code changes","Deploying to production once per release","Integrating hardware and software components","Merging all branches at the end of the project"],"a":0,"vi":"CI: tích hợp thay đổi code tự động và thường xuyên. CD: tự động build, test, sẵn sàng release.","en":"CI = automatically and frequently integrating code changes. CD = automatically built, tested and prepared for release.","src":"01#21"},{"id":"w1-18","w":1,"q":"According to the lecture, DevOps is:","o":["A programming language for operations","Cultural philosophies, practices and tools that shorten the software development lifecycle","A replacement for testing","A CMMI maturity level"],"a":1,"vi":"DevOps = Development + Operations: văn hoá, practices, công cụ để rút ngắn SDLC.","en":"DevOps = Development + Operations: cultural philosophies, practices and tools to shorten the SDLC.","src":"01#21"},{"id":"w1-19","w":1,"q":"With agentic AI in software engineering, which statement matches the lecture?","o":["Engineers are no longer accountable for code written by agents","Clear requirements and good tests matter less","Engineers remain accountable for quality, security and ethics","Agents remove the need for code review"],"a":2,"vi":"Kỹ sư gõ ít hơn, đặc tả/review/kiểm chứng nhiều hơn, và vẫn chịu trách nhiệm về chất lượng, bảo mật, đạo đức.","en":"Less typing, more specifying, reviewing and verifying; engineers remain accountable for quality, security and ethics.","src":"01#22"},{"id":"w1-20","w":1,"q":"\"Engineers should not knowingly accept work which is beyond their competence\" belongs to which professional responsibility issue?","o":["Confidentiality","Competence","Intellectual property rights","Computer misuse"],"a":1,"vi":"Competence: không nói quá năng lực, không nhận việc vượt năng lực.","en":"Competence: do not misrepresent your competence or knowingly accept work beyond it.","src":"01#31"},{"id":"w1-21","w":1,"q":"Which ACM/IEEE Code of Ethics principle requires lifelong learning about the practice of the profession?","o":["PROFESSION","SELF","COLLEAGUES","JUDGMENT"],"a":1,"vi":"SELF: học tập suốt đời và thúc đẩy cách hành nghề có đạo đức.","en":"SELF: participate in lifelong learning and promote an ethical approach to practice.","src":"01#36"},{"id":"w1-22","w":1,"q":"\"Software engineers shall maintain integrity and independence in their professional judgment\" is the principle:","o":["PRODUCT","MANAGEMENT","JUDGMENT","PUBLIC"],"a":2,"vi":"JUDGMENT: giữ sự chính trực và độc lập trong phán đoán chuyên môn.","en":"JUDGMENT: maintain integrity and independence in professional judgment.","src":"01#35"},{"id":"w1-23","w":1,"q":"How many principles does the ACM/IEEE Software Engineering Code of Ethics have?","o":["4","6","8","12"],"a":2,"vi":"8 nguyên tắc: Public, Client & Employer, Product, Judgment, Management, Profession, Colleagues, Self.","en":"Eight: Public, Client and Employer, Product, Judgment, Management, Profession, Colleagues, Self.","src":"01#34-36"},{"id":"w1-24","w":1,"q":"Which statement about ethical behavior matches the lecture?","o":["Ethical behavior means simply upholding the law","Ethical behavior is more than simply upholding the law","Ethics only applies to managers","Ethics is replaced by technical skill"],"a":1,"vi":"Hành xử đạo đức là hơn cả việc tuân thủ pháp luật.","en":"Ethical behavior is more than simply upholding the law.","src":"01#30"},{"id":"w1-25","w":1,"q":"Which abbreviation is expanded CORRECTLY?","o":["SDLC = Software Development Life Cycle","CI = Code Integration","CD = Continuous Design","DevOps = Development + Optimization"],"a":0,"vi":"SDLC = Software Development Life Cycle · CI = Continuous Integration · CD = Continuous Delivery/Deployment · DevOps = Development + Operations.","en":"SDLC = Software Development Life Cycle · CI = Continuous Integration · CD = Continuous Delivery/Deployment · DevOps = Development + Operations.","src":"01#21, 01#25","ng":1},{"id":"w2-01","w":2,"q":"Which characteristic belongs to plan-driven approaches?","o":["Tacit knowledge","Incremental planning","Document-based, heavy process","Light process"],"a":2,"vi":"Plan-driven: lập kế hoạch trước, đo theo kế hoạch, dựa vào tài liệu, process nặng. Agile: tacit knowledge, process nhẹ.","en":"Plan-driven: planned activities, progress measured against the plan, document-based, heavy. Agile: tacit knowledge, light.","src":"02#6"},{"id":"w2-02","w":2,"q":"According to the lecture, the Incremental model is classified as:","o":["An agile method","A plan-driven method","A CMMI level","A Kanban practice"],"a":1,"vi":"Plan-driven: Waterfall, Incremental, Spiral, RUP. Agile: XP, Scrum, Kanban.","en":"Plan-driven: Waterfall, Incremental, Spiral, RUP. Agile: XP, Scrum, Kanban.","src":"02#7"},{"id":"w2-03","w":2,"q":"Which of the following is listed as an agile method in the lecture?","o":["Spiral","Rational Unified Process","Kanban","Waterfall"],"a":2,"vi":"Agile methods: Extreme Programming, Scrum, Kanban.","en":"Agile methods: Extreme Programming, Scrum, Kanban.","src":"02#7"},{"id":"w2-04","w":2,"q":"Which CMMI maturity level is \"Defined\"?","o":["Level 2","Level 3","Level 4","Level 5"],"a":1,"vi":"1 Initial → 2 Managed → 3 Defined → 4 Quantitatively Managed → 5 Optimizing.","en":"1 Initial → 2 Managed → 3 Defined → 4 Quantitatively Managed → 5 Optimizing.","src":"02#11"},{"id":"w2-05","w":2,"q":"At CMMI maturity level 2 (Managed), processes are managed at the:","o":["Organization level","Project level","Industry level","Individual level"],"a":1,"vi":"Level 2 Managed: quản lý ở mức project (planned, performed, measured, controlled). Level 3 mới chuẩn hoá toàn tổ chức.","en":"Level 2 Managed: managed on the project level. Organization-wide standards come at Level 3.","src":"02#11"},{"id":"w2-06","w":2,"q":"\"The organization is data-driven with quantitative performance improvement objectives\" describes CMMI level:","o":["Defined","Quantitatively Managed","Optimizing","Managed"],"a":1,"vi":"Level 4 Quantitatively Managed: đo lường và kiểm soát, data-driven.","en":"Level 4 Quantitatively Managed: measured and controlled, data-driven.","src":"02#11"},{"id":"w2-07","w":2,"q":"Which statement about CMMI is correct according to the lecture?","o":["It is maintained by the Scrum Alliance","It was developed by SEI at CMU and is now maintained by the CMMI Institute (ISACA); current version V3.0 (2023)","It has three maturity levels","It applies only to hardware projects"],"a":1,"vi":"CMMI: SEI (CMU) phát triển, nay do CMMI Institute (ISACA) duy trì, phiên bản V3.0 (2023).","en":"CMMI was developed by CMU's SEI and is now maintained by the CMMI Institute (ISACA); current version V3.0 (2023).","src":"02#10"},{"id":"w2-08","w":2,"q":"In the waterfall model, development is not started until:","o":["The first prototype is accepted","Requirements are baselined","The test plan is written","The customer signs the invoice"],"a":1,"vi":"Waterfall: chưa baseline requirements thì chưa bắt đầu development.","en":"Waterfall: development is not started when requirements are not baselined.","src":"02#15"},{"id":"w2-09","w":2,"q":"Which statement about the waterfall model in the lecture is FALSE?","o":["Two stages cannot be performed at the same time","Each stage must be completed before doing the next stage","Going back to a previous stage is impossible","A stage is completed if a set of criteria is met"],"a":2,"vi":"Slide ghi rõ: có thể quay lại stage trước (going back is possible).","en":"The slide states that going back to the previous stage is possible.","src":"02#15"},{"id":"w2-10","w":2,"q":"The waterfall model is only appropriate when:","o":["Requirements are well-understood","The team is small","The customer is on-site","Iterations are very short"],"a":0,"vi":"Waterfall chỉ hợp khi requirements đã hiểu rõ và ít thay đổi.","en":"Waterfall is only appropriate when the requirements are well-understood and changes are limited.","src":"02#17"},{"id":"w2-11","w":2,"q":"In the waterfall diagram, which stage comes right after \"Analysis and Design\"?","o":["Requirements definition","Implementation and Unit Testing","Integration and System Testing","Operation and Maintenance"],"a":1,"vi":"Requirements definition → Analysis and Design → Implementation and Unit Testing → Integration and System Testing → Operation and Maintenance.","en":"Requirements definition → Analysis and Design → Implementation and Unit Testing → Integration and System Testing → Operation and Maintenance.","src":"02#14"},{"id":"w2-12","w":2,"q":"In the incremental model, which requirements are developed in early increments?","o":["The cheapest ones","The highest priority ones","The least understood ones","Non-functional ones only"],"a":1,"vi":"Requirements được ưu tiên; ưu tiên cao nhất làm ở increment đầu.","en":"Requirements are prioritized; the highest priority ones are developed in early increments.","src":"02#22"},{"id":"w2-13","w":2,"q":"Which is a PROBLEM of the incremental model?","o":["System functionality is available earlier","Lower risk of overall project failure","The process is not visible","Highest priority requirements receive most testing"],"a":2,"vi":"Nhược điểm: process không visible, cấu trúc hệ thống dễ xuống cấp. Ba lựa chọn còn lại là ưu điểm.","en":"Problems: the process is not visible and system structure tends to degrade. The other options are benefits.","src":"02#24"},{"id":"w2-14","w":2,"q":"In the spiral model, each spiral (loop) represents:","o":["A sprint","A phase in the process","A release to production","A CMMI level"],"a":1,"vi":"Mỗi vòng xoắn là một phase; không có phase cố định như specification hay design.","en":"Each spiral represents a phase in the process; there are no fixed phases such as specification or design.","src":"02#27"},{"id":"w2-15","w":2,"q":"In the spiral model diagram, \"Risk Reduction / Prototyping\" belongs to which quadrant?","o":["Plan","Risk Analysis","Engineering","Evaluate"],"a":1,"vi":"Plan: requirements gathering. Risk Analysis: risk reduction, prototyping. Engineering: coding, testing. Evaluate: customer evolution.","en":"Plan: requirements gathering. Risk Analysis: risk reduction, prototyping. Engineering: coding, testing. Evaluate: customer evolution.","src":"02#25"},{"id":"w2-16","w":2,"q":"Which is a PROBLEM of the spiral model?","o":["Emphasis on risk management","Users see the system early","Complex and expensive","Flexibility in requirements"],"a":2,"vi":"Nhược điểm: phức tạp, đắt, phụ thuộc nhiều vào risk analysis, khó quản lý thời gian.","en":"Problems: complex and expensive, too dependent on risk analysis, difficult time management.","src":"02#29"},{"id":"w2-17","w":2,"q":"Which RUP phase establishes the business case for the system?","o":["Inception","Elaboration","Construction","Transition"],"a":0,"vi":"Inception: business case. Elaboration: hiểu domain và kiến trúc. Construction: design, code, test. Transition: deploy.","en":"Inception: business case. Elaboration: problem domain and architecture. Construction: design, programming, testing. Transition: deploy.","src":"02#33"},{"id":"w2-18","w":2,"q":"In RUP, developing an understanding of the problem domain and the system architecture happens in:","o":["Inception","Elaboration","Construction","Transition"],"a":1,"vi":"Elaboration: hiểu problem domain và xây kiến trúc hệ thống.","en":"Elaboration: develop an understanding of the problem domain and the system architecture.","src":"02#33"},{"id":"w2-19","w":2,"q":"Which is the correct order of RUP phases?","o":["Inception → Construction → Elaboration → Transition","Elaboration → Inception → Construction → Transition","Inception → Elaboration → Construction → Transition","Inception → Elaboration → Transition → Construction"],"a":2,"vi":"Inception → Elaboration → Construction → Transition.","en":"Inception → Elaboration → Construction → Transition.","src":"02#32"},{"id":"w2-20","w":2,"q":"In RUP, each iteration is considered:","o":["A spiral loop","A waterfall cycle","A Kanban card","A sprint review"],"a":1,"vi":"Mỗi iteration là một chu kỳ waterfall, có entry/exit criteria.","en":"Each iteration is considered a waterfall cycle with entry and exit criteria.","src":"02#34"},{"id":"w2-21","w":2,"q":"Complete the Agile value: \"Working software over ___\".","o":["Processes and tools","Comprehensive documentation","Contract negotiation","Following a plan"],"a":1,"vi":"Working software over comprehensive documentation.","en":"Working software over comprehensive documentation.","src":"02#37"},{"id":"w2-22","w":2,"q":"Which of the following is NOT one of the four Agile values?","o":["Individuals and interactions over processes and tools","Customer collaboration over contract negotiation","Following a plan over responding to change","Working software over comprehensive documentation"],"a":2,"vi":"Đúng phải là \"Responding to change over following a plan\". Lựa chọn này bị đảo ngược.","en":"The real value is \"Responding to change over following a plan\"; this option reverses it.","src":"02#37"},{"id":"w2-23","w":2,"q":"The Agile Manifesto consists of:","o":["4 values and 12 principles","5 values and 10 principles","3 values and 12 practices","12 values and 4 principles"],"a":0,"vi":"4 giá trị nền tảng + 12 nguyên tắc.","en":"4 foundational values and 12 supporting principles.","src":"02#36"},{"id":"w2-24","w":2,"q":"The philosophy of Extreme Programming (XP) is to:","o":["Document everything before coding","Take known good practices and push them to extremes","Avoid customer involvement","Use long iterations of several months"],"a":1,"vi":"XP: lấy các good practice đã biết và đẩy đến mức cực đoan.","en":"XP takes known good practices and pushes them to extremes.","src":"02#43"},{"id":"w2-25","w":2,"q":"Which of the following is NOT one of the 12 XP practices?","o":["Pair Programming","40-hour Week","Daily Scrum","On-site Customer"],"a":2,"vi":"Daily Scrum là event của Scrum, không phải XP practice.","en":"Daily Scrum is a Scrum event, not an XP practice.","src":"02#46"},{"id":"w2-26","w":2,"q":"According to the Scrum Guide 2020, a Sprint lasts:","o":["Exactly 2 weeks","One month or less","Between 1 and 3 months","As long as the Product Owner decides"],"a":1,"vi":"Sprint ≤ 1 tháng (thường 2 tuần), chứa mọi event khác. \"Đúng 2 tuần\" là bẫy.","en":"A Sprint is one month or less (commonly 2 weeks) and contains all other events.","src":"02#54"},{"id":"w2-27","w":2,"q":"The Daily Scrum is a 15-minute event for:","o":["The Product Owner to report to stakeholders","The Developers to inspect progress toward the Sprint Goal","The Scrum Master to assign tasks","Managers to review performance"],"a":1,"vi":"Daily Scrum: 15 phút, cho Developers kiểm tra tiến độ hướng tới Sprint Goal.","en":"Daily Scrum: 15 minutes for the Developers to inspect progress toward the Sprint Goal.","src":"02#54"},{"id":"w2-28","w":2,"q":"In the Scrum Guide 2020, the commitment for the Increment is:","o":["The Product Goal","The Sprint Goal","The Definition of Done","The burndown chart"],"a":2,"vi":"Product Backlog ↔ Product Goal; Sprint Backlog ↔ Sprint Goal; Increment ↔ Definition of Done.","en":"Product Backlog ↔ Product Goal; Sprint Backlog ↔ Sprint Goal; Increment ↔ Definition of Done.","src":"02#54"},{"id":"w2-29","w":2,"q":"The Product Goal is the commitment for which artifact?","o":["Product Backlog","Sprint Backlog","Increment","Definition of Done"],"a":0,"vi":"Product Goal là commitment của Product Backlog.","en":"The Product Goal is the commitment for the Product Backlog.","src":"02#54"},{"id":"w2-30","w":2,"q":"Which statement about burndown charts is TRUE according to the lecture?","o":["They are a required Scrum artifact","They are a common practice but not required by the Scrum Guide","They replace the Sprint Backlog","They are only used in Kanban"],"a":1,"vi":"Burndown chart là thói quen phổ biến, không bắt buộc theo Scrum Guide.","en":"A burndown chart is a common practice, not required by the Scrum Guide.","src":"02#54"},{"id":"w2-31","w":2,"q":"According to the Scrum Guide 2020, which of the following is NOT an accountability in a Scrum Team?","o":["Product Owner","Scrum Master","Developers","Project Manager"],"a":3,"vi":"Chỉ có 3 trách nhiệm: PO, SM, Developers. Không có manager hay team lead trong Scrum.","en":"Only three accountabilities: Product Owner, Scrum Master, Developers. No manager or team lead inside Scrum.","src":"02#59"},{"id":"w2-32","w":2,"q":"In Scrum, who orders the Product Backlog and defines the Product Goal?","o":["Scrum Master","Developers","Product Owner","Stakeholders"],"a":2,"vi":"Product Owner: tối đa hoá giá trị, định nghĩa Product Goal, sắp thứ tự Product Backlog.","en":"Product Owner: maximizes value, defines the Product Goal, orders the Product Backlog.","src":"02#59"},{"id":"w2-33","w":2,"q":"In Scrum, who coaches the team and organization and removes impediments?","o":["Product Owner","Scrum Master","Developers","Project Manager"],"a":1,"vi":"Scrum Master: thiết lập Scrum, coach team và tổ chức, gỡ impediments.","en":"Scrum Master: establishes Scrum, coaches the team and organization, removes impediments.","src":"02#59"},{"id":"w2-34","w":2,"q":"Which of the following is NOT a Scrum event according to the lecture?","o":["Sprint Review","Sprint Retrospective","Daily Scrum","Release Planning"],"a":3,"vi":"Release planning là thói quen phổ biến nhưng không phải Scrum event.","en":"Release planning is a common practice but not a Scrum event.","src":"02#60"},{"id":"w2-35","w":2,"q":"Which Scrum event is used to inspect how the team worked and plan improvements?","o":["Sprint Planning","Sprint Review","Sprint Retrospective","Daily Scrum"],"a":2,"vi":"Retrospective: xem lại cách team làm việc. Review: xem Increment cùng stakeholders.","en":"Retrospective: inspect how the team worked. Review: inspect the Increment with stakeholders.","src":"02#60"},{"id":"w2-36","w":2,"q":"A Scrum Team is typically:","o":["10 or fewer people","Exactly 7 people","At least 15 people","Led by a team lead"],"a":0,"vi":"Một Scrum Team thường 10 người trở xuống, tự quản.","en":"One Scrum Team, typically 10 or fewer people, self-managing.","src":"02#59"},{"id":"w2-37","w":2,"q":"Kanban was introduced by whom for material production?","o":["David J. Anderson at Microsoft","Taiichi Ohno at Toyota","Ken Schwaber at Toyota","Kent Beck at Chrysler"],"a":1,"vi":"Taiichi Ohno (Toyota) giới thiệu Kanban; David J. Anderson áp dụng cho phần mềm khoảng 2004.","en":"Taiichi Ohno introduced Kanban at Toyota; David J. Anderson applied it to software around 2004.","src":"02#62"},{"id":"w2-38","w":2,"q":"Who applied Kanban to software development around 2004?","o":["Taiichi Ohno","Jeff Sutherland","David J. Anderson","Grady Booch"],"a":2,"vi":"David J. Anderson, khoảng năm 2004.","en":"David J. Anderson, around 2004.","src":"02#63"},{"id":"w2-39","w":2,"q":"Which is a core practice of Kanban?","o":["Fixed-length sprints","Limit work in progress (WIP)","Daily Scrum","Pair programming"],"a":1,"vi":"Core practices: visualize the flow, limit WIP, dùng reports/charts (cumulative flow diagram).","en":"Core practices: visualize the flow of work, limit WIP, use reports and charts (cumulative flow diagram).","src":"02#69"},{"id":"w2-40","w":2,"q":"Which chart does Kanban use to visualize progress?","o":["Gantt chart","Cumulative flow diagram","Burndown chart","Pareto chart"],"a":1,"vi":"Kanban dùng cumulative flow diagram.","en":"Kanban uses the cumulative flow diagram.","src":"02#70"},{"id":"w2-41","w":2,"q":"Which statement about Kanban is TRUE?","o":["It uses fixed-length iterations like Scrum","It has no iteration like Scrum","It requires changing roles immediately","It is a plan-driven method"],"a":1,"vi":"Kanban không có iteration như Scrum: xong một item thì thêm item mới.","en":"Kanban has no iteration like Scrum: when an item is completed, a new item is added.","src":"02#71"},{"id":"w2-42","w":2,"q":"Which is one of Kanban's four principles?","o":["Replace all current processes on day one","Respect current roles, responsibilities and job titles","Only senior managers may lead","Always work in two-week cycles"],"a":1,"vi":"4 principles: start with what you do now; incremental, evolutionary change; respect current roles; leadership at all levels.","en":"Four principles: start with what you do now; incremental, evolutionary change; respect current roles; leadership at all levels.","src":"02#67"},{"id":"w2-43","w":2,"q":"Which format is used for a user story in the lecture?","o":["Given [context], When [action], Then [result]","As a [user], I want [goal], so that [benefit]","If [condition] then [system shall]","[Actor] <<include>> [use case]"],"a":1,"vi":"User story: As a [user], I want [goal], so that [benefit]. Given/When/Then là acceptance criteria.","en":"User story: As a [user], I want [goal], so that [benefit]. Given/When/Then is for acceptance criteria.","src":"02#58"},{"id":"w2-44","w":2,"q":"Which abbreviation is expanded INCORRECTLY?","o":["CMMI = Capability Maturity Model Integration","RUP = Rapid Unified Process","XP = Extreme Programming","WIP = Work in progress"],"a":1,"vi":"RUP = Rational Unified Process, không phải \"Rapid\". Các cách viết còn lại đều đúng.","en":"RUP = Rational Unified Process, not \"Rapid\". The other expansions are correct.","src":"02#10, 02#30, 02#43, 02#69","ng":1},{"id":"w2-45","w":2,"q":"In \"CMMI\", the final \"I\" stands for:","o":["Improvement","Institute","Integration","Index"],"a":2,"vi":"CMMI = Capability Maturity Model Integration. Bẫy: CMMI dùng để process improvement và do SEI (Institute) phát triển, nhưng chữ I cuối là Integration.","en":"CMMI = Capability Maturity Model Integration. Trap: CMMI is about process improvement and came from SEI (an Institute), but the final I is Integration.","src":"02#10","ng":1},{"id":"w3-01","w":3,"q":"A research project produces mainly:","o":["A product","A benefit","Knowledge","A contract"],"a":2,"vi":"Production → product; Investment → benefit; Research → knowledge.","en":"Production → product; Investment → benefit; Research → knowledge.","src":"03#4"},{"id":"w3-02","w":3,"q":"Which three project factors are shown in the lecture?","o":["Scope, Time, Budget","People, Tools, Process","Quality, Risk, Cost","Plan, Do, Check"],"a":0,"vi":"Ba yếu tố dự án: Scope, Time, Budget.","en":"The project factors are Scope, Time and Budget.","src":"03#4"},{"id":"w3-03","w":3,"q":"Which is a reason why software projects are different and hard to manage?","o":["Software is intangible","Software never changes","Software processes are fixed","Software does not depend on people"],"a":0,"vi":"Software vô hình, linh hoạt, process linh hoạt, phụ thuộc yếu tố con người.","en":"Software is intangible and flexible, processes are flexible, and projects depend on human factors.","src":"03#5"},{"id":"w3-04","w":3,"q":"Which role mainly focuses on technical quality, team capability, architecture and engineering process?","o":["Project Manager","Engineering Manager","Team Lead","Product Owner"],"a":1,"vi":"Project Manager: scope, schedule, cost, risk. Engineering Manager: chất lượng kỹ thuật, năng lực team. Team Lead: điều phối kỹ thuật hằng ngày.","en":"PM: scope, schedule, cost, risks. Engineering Manager: technical quality, team capability. Team Lead: daily technical coordination.","src":"03#9"},{"id":"w3-05","w":3,"q":"Which role handles daily technical coordination, task assignment and code/design support?","o":["Project Manager","Engineering Manager","Team Lead","Program Manager"],"a":2,"vi":"Team Lead: điều phối kỹ thuật hằng ngày, giao task, hỗ trợ code/design.","en":"Team Lead: daily technical coordination, task assignment, code/design support.","src":"03#9"},{"id":"w3-06","w":3,"q":"A feasibility report and project proposal are key outputs of which management activity?","o":["Initiation","Planning","Executing","Tracking & Control"],"a":0,"vi":"Initiation: vì sao làm dự án, có khả thi không → feasibility report, proposal.","en":"Initiation: why do this project, is it feasible → feasibility report, project proposal.","src":"03#10"},{"id":"w3-07","w":3,"q":"Progress reports, issue logs and change requests are outputs of which activity?","o":["Initiation","Planning","Executing","Tracking & Control"],"a":3,"vi":"Tracking & Control: đang ở đâu, có vấn đề gì, cần đổi gì.","en":"Tracking & Control: where are we, what problems occur, what should change.","src":"03#10"},{"id":"w3-08","w":3,"q":"Which statement about project planning is correct?","o":["Planning is done once at the start","Planning is a continuous activity and plans are revised to reflect reality","Agile projects do not plan","Plans must never change"],"a":1,"vi":"Planning liên tục từ đầu đến cuối dự án, kế hoạch được sửa theo thực tế. Agile plan theo release, sprint, ngày.","en":"Planning is continuous until the project ends and plans are revised. Agile plans in release, sprint and day horizons.","src":"03#13"},{"id":"w3-09","w":3,"q":"Scope definition determines:","o":["Only the features that will be delivered","What the project will and will not deliver","The team's salary","The programming language"],"a":1,"vi":"Scope: dự án sẽ giao gì và không giao gì.","en":"Scope definition determines what the project will and will not deliver.","src":"03#16"},{"id":"w3-10","w":3,"q":"According to the WBS rule of thumb, each work item should be clear enough to be:","o":["Coded in one day","Assigned, estimated and tracked","Approved by the customer","Tested automatically"],"a":1,"vi":"Mỗi work item trong WBS phải đủ rõ để giao, ước lượng và theo dõi.","en":"Each WBS item should be clear enough to be assigned, estimated and tracked.","src":"03#17"},{"id":"w3-11","w":3,"q":"An estimation approach that uses a formula based on product size and process characteristics is:","o":["Experience-based estimation","Algorithmic cost modeling","Planning Poker","Expert guessing"],"a":1,"vi":"Algorithmic cost modeling: dùng công thức theo size và đặc điểm process.","en":"Algorithmic cost modeling uses a formula based on product attributes like size and process characteristics.","src":"03#20"},{"id":"w3-12","w":3,"q":"Which size measure is independent of the programming language?","o":["Lines of Code (LOC)","Function Points (FP)","KLOC","Number of files"],"a":1,"vi":"FP đo chức năng từ góc nhìn user, độc lập ngôn ngữ. LOC phụ thuộc ngôn ngữ.","en":"Function Points measure functionality from the user's perspective and are language-independent; LOC is language-dependent.","src":"03#21"},{"id":"w3-13","w":3,"q":"In the COCOMO model shown in the lecture, effort is estimated as:","o":["$\\text{Effort} = a \\times (\\text{KLOC})^{b}$","$\\text{Effort} = c \\times (\\text{Duration})^{d}$","$\\text{Effort} = \\text{Cost} \\times \\text{rate}$","$\\text{Effort} = \\text{KLOC} / \\text{velocity}$"],"a":0,"vi":"$\\text{Effort} = a \\times \\text{KLOC}^{b}$; $\\text{Duration} = c \\times \\text{Effort}^{d}$; $\\text{Cost} = \\text{Effort} \\times$ giá/man-month.","en":"$\\text{Effort} = a \\times \\text{KLOC}^{b}$; $\\text{Duration} = c \\times \\text{Effort}^{d}$; $\\text{Cost} = \\text{Effort} \\times \\text{cost per man-month}$.","src":"03#22"},{"id":"w3-14","w":3,"q":"How is cost estimated in the lecture?","o":["$\\text{Cost} = \\text{Duration} \\times \\text{number of tasks}$","$\\text{Cost} = \\text{Effort} \\times (\\text{cost per man-month})$","$\\text{Cost} = \\text{KLOC} \\times \\text{velocity}$","$\\text{Cost} = \\text{Risk exposure} \\times \\text{loss}$"],"a":1,"vi":"$\\text{Cost} = \\text{Effort} \\times$ chi phí mỗi man-month.","en":"$\\text{Cost} = \\text{Effort} \\times \\text{cost per man-month}$.","src":"03#22"},{"id":"w3-15","w":3,"q":"A task needs 24 person-hours. One student works 3 hours/day on it. How many days does it take?","o":["3 days","6 days","8 days","24 days"],"a":2,"vi":"24 / 3 = 8 ngày. Effort khác duration.","en":"24 / 3 = 8 days. Effort is not the same as duration.","src":"03#23"},{"id":"w3-16","w":3,"q":"The remaining backlog is 120 story points and the average velocity is 20 points per sprint. About how many sprints are needed?","o":["4 sprints","6 sprints","12 sprints","20 sprints"],"a":1,"vi":"Số sprint $\\approx 120 / 20 = 6$ sprint (12 tuần nếu sprint 2 tuần).","en":"$\\text{Sprints} \\approx 120 / 20 = 6$ sprints (12 weeks with 2-week sprints).","src":"03#24"},{"id":"w3-17","w":3,"q":"Which statement about story points and velocity is correct?","o":["Velocity should be used to compare different teams","Story points compare items within one team; do not compare teams by velocity","Story points measure hours exactly","Velocity is set by the manager"],"a":1,"vi":"Story points chỉ so sánh trong một team; không so velocity giữa các team.","en":"Story points compare items within one team; do not compare teams by velocity.","src":"03#24"},{"id":"w3-18","w":3,"q":"According to the lecture, adding people to a late project:","o":["Always finishes it earlier","Makes it later because of communication overhead and extra training","Has no effect","Reduces risk"],"a":1,"vi":"Thêm người vào dự án đang trễ làm nó trễ hơn (overhead giao tiếp, đào tạo thêm).","en":"Adding people to a late project makes it later: communication overheads and extra training.","src":"03#26"},{"id":"w3-19","w":3,"q":"Results delivered to customers or users are called:","o":["Milestones","Deliverables","Work packages","Slack"],"a":1,"vi":"Deliverable: kết quả giao cho khách/người dùng. Milestone: điểm kết thúc một giai đoạn.","en":"Deliverables are results delivered to customers or users; milestones are end-points of a period.","src":"03#27"},{"id":"w3-20","w":3,"q":"The critical path is:","o":["The shortest chain of tasks","The longest chain of dependent tasks from start to finish","The path with the most people","The path with the highest cost"],"a":1,"vi":"Critical path là chuỗi task phụ thuộc DÀI NHẤT, quyết định thời gian tối thiểu của dự án.","en":"The critical path is the LONGEST chain of dependent tasks; it determines the minimum project duration.","src":"03#31"},{"id":"w3-21","w":3,"q":"Tasks on the critical path have:","o":["Maximum slack","Zero slack","Negative cost","No dependencies"],"a":1,"vi":"$\\text{Slack} = \\text{latest start} - \\text{earliest start}$; task găng có slack = 0.","en":"$\\text{Slack} = \\text{latest start} - \\text{earliest start}$; critical tasks have zero slack.","src":"03#31"},{"id":"w3-22","w":3,"q":"Tasks: T1 3d (none), T2 2d (T1), T3 2d (T1), T4 5d (T2, T3), T5 3d (T4), T6 1d (T5). What is the minimum project duration?","o":["11 days","14 days","16 days","10 days"],"a":1,"vi":"T1→T2→T4→T5→T6 = 3+2+5+3+1 = 14; đường qua T3 cũng 14. Cả hai đều găng.","en":"T1→T2→T4→T5→T6 = 3+2+5+3+1 = 14; the path via T3 is also 14. Both are critical.","src":"03#31"},{"id":"w3-23","w":3,"q":"In the same example (minimum 14 days), if T4 is delayed by 2 days, the project duration becomes:","o":["14 days","15 days","16 days","19 days"],"a":2,"vi":"T4 nằm trên critical path nên trễ 2 ngày thì cả dự án trễ 2 ngày: 16.","en":"T4 is on the critical path, so a 2-day delay delays the project: 16 days.","src":"03#31"},{"id":"w3-24","w":3,"q":"In the same example, if T2 is delayed by 1 day, the project duration becomes:","o":["14 days, because T3 runs in parallel","15 days, because T2 is on a critical path","13 days","17 days"],"a":1,"vi":"Cả hai đường đều găng (slack = 0), nên T2 trễ 1 ngày thì dự án thành 15 ngày.","en":"Both paths are critical (zero slack), so a 1-day delay on T2 makes it 15 days.","src":"03#31"},{"id":"w3-25","w":3,"q":"What is the correct order of risk management activities?","o":["Identification → Analysis → Planning → Monitoring","Analysis → Identification → Monitoring → Planning","Planning → Identification → Analysis → Monitoring","Monitoring → Planning → Analysis → Identification"],"a":0,"vi":"Identify → Analyze → Plan → Monitor.","en":"Identification → Analysis → Planning → Monitoring.","src":"03#35"},{"id":"w3-26","w":3,"q":"Risk exposure (RE) is calculated as:","o":["Probability + Loss","Probability × Loss","Loss / Probability","Probability × Duration"],"a":1,"vi":"$\\text{RE} = \\text{Probability} \\times \\text{Loss}$.","en":"$\\text{RE} = \\text{Probability} \\times \\text{Loss}$.","src":"03#38"},{"id":"w3-27","w":3,"q":"Using the lecture's scale (Unlikely 10, Seldom 25, Occasional 50, Likely 75, Frequently 90; Catastrophic 90), what is the RE of a Likely × Catastrophic risk?","o":["165","2,250","6,750","8,100"],"a":2,"vi":"75 × 90 = 6,750.","en":"75 × 90 = 6,750.","src":"03#41"},{"id":"w3-28","w":3,"q":"Using the lecture's scale (Occasional = 50, Serious = 75), what is the RE of an Occasional × Serious risk?","o":["125","2,250","3,750","5,625"],"a":2,"vi":"50 × 75 = 3,750.","en":"50 × 75 = 3,750.","src":"03#41"},{"id":"w3-29","w":3,"q":"\"Key staff are ill and unavailable at critical times\" is which type of risk?","o":["Technology","People","Organizational","Estimation"],"a":1,"vi":"People risk: nhân sự ốm, không tuyển được người đủ kỹ năng, thiếu đào tạo.","en":"People risk: key staff ill, cannot recruit skilled staff, training unavailable.","src":"03#37"},{"id":"w3-30","w":3,"q":"\"The database cannot process as many transactions per second as expected\" is which type of risk?","o":["Technology","People","Requirements","Estimation"],"a":0,"vi":"Technology risk.","en":"Technology risk.","src":"03#37"},{"id":"w3-31","w":3,"q":"\"The size of the software is underestimated\" is which type of risk?","o":["Organizational","Requirements","Estimation","Technology"],"a":2,"vi":"Estimation risk: ước lượng thiếu thời gian hoặc kích thước.","en":"Estimation risk: time or size underestimated.","src":"03#37"},{"id":"w3-32","w":3,"q":"In risk planning, which plans are followed when a risk actually arises?","o":["Avoidance strategies","Minimization strategies","Contingency plans","Buying information"],"a":2,"vi":"Contingency plans: kế hoạch dự phòng, dùng khi rủi ro xảy ra.","en":"Contingency plans are followed if risks arise.","src":"03#42"},{"id":"w3-33","w":3,"q":"In the software risks table, \"Product competition\" mainly affects the:","o":["Project","Product","Business","Process"],"a":2,"vi":"Product competition và Technology change ảnh hưởng tới Business.","en":"Product competition and technology change affect the Business.","src":"03#34"},{"id":"w3-34","w":3,"q":"Which practice is recommended for risk monitoring?","o":["Assess risks only at project start","Maintain a list of top-10 risks and review it regularly","Hide risks from management","Monitor only technology risks"],"a":1,"vi":"Đánh giá rủi ro định kỳ, giữ danh sách top-10, rủi ro ưu tiên cao báo cáo hằng tuần.","en":"Assess risks regularly, maintain a top-10 list, and report high-priority risks weekly.","src":"03#45"},{"id":"w3-35","w":3,"q":"In the lecture, a risk is defined as:","o":["A defect in the code","A probability that some adverse circumstance will occur","A missing requirement","A delayed task"],"a":1,"vi":"Risk là xác suất một sự cố bất lợi xảy ra.","en":"A risk is a probability that some adverse circumstance will occur.","src":"03#33"},{"id":"w3-36","w":3,"q":"Which pair of abbreviations is expanded correctly?","o":["WBS = Work Budget Sheet · CPM = Critical Path Method","WBS = Work Breakdown Structure · CPM = Cost Performance Metric","WBS = Weekly Build Schedule · CPM = Change Planning Model","WBS = Work Breakdown Structure · CPM = Critical Path Method"],"a":3,"vi":"WBS = Work Breakdown Structure (03#17) · CPM = Critical Path Method (03#31).","en":"WBS = Work Breakdown Structure (03#17) · CPM = Critical Path Method (03#31).","src":"03#17, 03#31","ng":1},{"id":"w3-37","w":3,"q":"In $\\text{RE} = \\text{Probability} \\times \\text{Loss}$, RE means:","o":["Risk exposure","Requirements engineering","Risk elimination","Return on effort"],"a":0,"vi":"RE = Risk exposure, dùng để xếp ưu tiên rủi ro. Requirements engineering là chủ đề bài 04, không liên quan công thức này.","en":"RE = Risk exposure, used to prioritize risks. Requirements engineering is lecture 04 and unrelated to this formula.","src":"03#38","ng":1},{"id":"w3-38","w":3,"q":"Which statement about LOC and FP is correct?","o":["LOC = Lines of Code, language-independent; FP = Function Points, language-dependent","LOC = Lines of Code, language-dependent; FP = Function Points, language-independent","LOC = Level of Complexity, language-dependent; FP = Function Points, language-independent","LOC = Lines of Code, language-dependent; FP = Feature Priority, language-independent"],"a":1,"vi":"LOC = Lines of Code: đơn giản nhưng phụ thuộc ngôn ngữ. FP = Function Points: đo chức năng từ góc nhìn người dùng, độc lập ngôn ngữ.","en":"LOC = Lines of Code: simple but language-dependent. FP = Function Points: functionality from the user's view, language-independent.","src":"03#21","ng":1},{"id":"w4-01","w":4,"q":"Requirements specify:","o":["Only the user interface","The services that a system provides and the constraints for the system","The project budget","The programming language"],"a":1,"vi":"Requirements = services hệ thống cung cấp + constraints.","en":"Requirements specify the services a system provides and its constraints.","src":"04#4"},{"id":"w4-02","w":4,"q":"A system stakeholder is:","o":["Only the paying customer","Any person or organization who is affected by the system","Only the development team","Only end users"],"a":1,"vi":"Stakeholder: bất kỳ người hay tổ chức nào bị hệ thống ảnh hưởng.","en":"Any person or organization who is affected by the system.","src":"04#5"},{"id":"w4-03","w":4,"q":"In an ATM system, the account database is an example of which viewpoint?","o":["Interactor viewpoint","Indirect viewpoint","Domain viewpoint","Business viewpoint"],"a":0,"vi":"Interactor: người hoặc hệ thống tương tác trực tiếp, gồm khách hàng VÀ account database.","en":"Interactor viewpoints are people or systems interacting directly: customers AND the account database.","src":"04#7"},{"id":"w4-04","w":4,"q":"In an ATM system, management and security staff are which viewpoint?","o":["Interactor viewpoint","Indirect viewpoint","Domain viewpoint","External viewpoint"],"a":1,"vi":"Indirect: không trực tiếp dùng hệ thống nhưng ảnh hưởng requirements.","en":"Indirect viewpoints don't use the system themselves but influence the requirements.","src":"04#7"},{"id":"w4-05","w":4,"q":"Standards for inter-bank communications are an example of which viewpoint?","o":["Interactor","Indirect","Domain","Organizational"],"a":2,"vi":"Domain viewpoint: đặc điểm và ràng buộc của lĩnh vực.","en":"Domain viewpoints are domain characteristics and constraints.","src":"04#7"},{"id":"w4-06","w":4,"q":"Which statement describes system requirements?","o":["Natural-language statements from the user's point of view","A structured document detailing the system's functions, services and operational constraints","A marketing brochure","A list of stakeholders"],"a":1,"vi":"User requirements: ngôn ngữ tự nhiên, góc nhìn user. System requirements: tài liệu có cấu trúc, chi tiết, góc nhìn kỹ thuật.","en":"User requirements: natural language, user's view. System requirements: structured, detailed, technical view.","src":"04#9"},{"id":"w4-07","w":4,"q":"\"The user shall be able to search either all of the initial set of databases or select a subset from it\" is a:","o":["Functional requirement","Non-functional requirement","Domain requirement","Organizational requirement"],"a":0,"vi":"Đây là ví dụ functional requirement của library system trên slide.","en":"This is the lecture's functional requirement example for the library system.","src":"04#14"},{"id":"w4-08","w":4,"q":"\"There shall be a standard user interface to all databases which shall be based on the Z39.50 standard\" is a:","o":["Functional requirement","Non-functional product requirement","Domain requirement","User story"],"a":2,"vi":"Ví dụ domain requirement của library system trên slide.","en":"The lecture's domain requirement example for the library system.","src":"04#23"},{"id":"w4-09","w":4,"q":"Ethical, privacy and safety requirements belong to which non-functional requirement type?","o":["Product requirements","Organizational requirements","External requirements","Domain requirements"],"a":2,"vi":"Product: usability, security, performance… Organizational: delivery, implementation, standards. External: ethical, privacy, safety.","en":"Product: usability, security, performance. Organizational: delivery, implementation, standards. External: ethical, privacy, safety.","src":"04#16"},{"id":"w4-10","w":4,"q":"Delivery, implementation and standards requirements are which NFR type?","o":["Product","Organizational","External","Functional"],"a":1,"vi":"Organizational requirements: delivery, implementation, standards.","en":"Organizational requirements: delivery, implementation, standards.","src":"04#16"},{"id":"w4-11","w":4,"q":"Which is a VERIFIABLE non-functional requirement?","o":["The system should be easy to use","The system should minimize user errors","Experienced controllers shall be able to use all the system functions after a total of two hours training","The system should be user-friendly"],"a":2,"vi":"Verifiable NFR phải có thước đo kiểm tra khách quan (2 giờ đào tạo). Các câu còn lại chỉ là goal.","en":"A verifiable NFR uses a measure that can be objectively tested (two hours of training); the others are goals.","src":"04#19"},{"id":"w4-12","w":4,"q":"Which is NOT listed as a property of good functional requirements?","o":["Precision","Completeness","Consistency","Portability"],"a":3,"vi":"FR tốt: precision, completeness, consistency. Portability là NFR.","en":"Good FRs: precision, completeness, consistency. Portability is an NFR.","src":"04#15"},{"id":"w4-13","w":4,"q":"Which are the problems of domain requirements?","o":["Understandability and implicitness","Cost and speed","Security and privacy","Portability and compliance"],"a":0,"vi":"Understandability: dùng ngôn ngữ của domain. Implicitness: chuyên gia domain quên nói rõ.","en":"Understandability (domain language) and implicitness (experts don't make them explicit).","src":"04#24"},{"id":"w4-14","w":4,"q":"In the lecture's RE process (Feasibility study → Gathering → Specification → Validation), which activity is performed throughout the project rather than as one step in that sequence?","o":["Feasibility study","Requirements gathering","Requirements specification","Requirements management"],"a":3,"vi":"Sơ đồ vẽ Requirements management tách riêng, vì quản lý thay đổi requirement được thực hiện xuyên suốt dự án.","en":"Requirements management is drawn separately because requirements change management is performed throughout the project.","src":"04#26, 04#57"},{"id":"w4-15","w":4,"q":"Requirements gathering is also called:","o":["Requirements validation","Requirements elicitation or discovery","Requirements traceability","Requirements baselining"],"a":1,"vi":"Requirements gathering = elicitation = discovery.","en":"Requirements gathering is also called elicitation or discovery.","src":"04#32"},{"id":"w4-16","w":4,"q":"In MoSCoW, \"important but not vital; a workaround exists\" describes:","o":["Must have","Should have","Could have","Won't have
